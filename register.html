<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>മേസ്തിരി പ്രോ - പുതിയ രജിസ്ട്രേഷൻ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Changa+One&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- language.js ഫയൽ ഇവിടെ ഹെഡറിൽ നൽകുന്നു -->
    <script src="language.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- ലോഗോ ഹെഡർ -->
    <div class="w-full max-w-sm mx-auto mb-6">
        <div id="appHeader" class="w-full"></div>
    </div>

    <!-- രജിസ്ട്രേഷൻ കാർഡ് -->
    <div class="w-full max-w-sm bg-slate-900/80 border border-slate-700/60 rounded-2xl p-6 shadow-xl backdrop-blur-md">
        
        <h2 class="lang text-xl font-bold text-white mb-1" data-key="regTitle">പുതിയ രജിസ്ട്രേഷൻ</h2>
        <p class="lang text-xs text-slate-400 mb-5" data-key="regSubtitle">വിവരങ്ങൾ നൽകി പുതിയ അക്കൗണ്ട് ഉണ്ടാക്കാം</p>

        <div class="space-y-4">
            <!-- പേര് -->
            <div>
                <label class="lang block text-xs font-semibold text-amber-300/90 mb-1.5" data-key="mesthriNameLabel">മേസ്തിരിയുടെ പേര്</label>
                <input type="text" id="username" class="lang-placeholder w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-400" data-key-placeholder="usernamePlaceholder" placeholder="നിങ്ങളുടെ പേര് നൽകുക">
            </div>

            <!-- ഫോൺ നമ്പർ -->
            <div>
                <label class="lang block text-xs font-semibold text-amber-300/90 mb-1.5" data-key="phoneLabel">ഫോൺ നമ്പർ</label>
                <input type="tel" id="phone" class="lang-placeholder w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-400" data-key-placeholder="phonePlaceholder" placeholder="10 അക്ക ഫോൺ നമ്പർ">
            </div>

            <!-- പാസ്‌വേർഡ് -->
            <div>
                <label class="lang block text-xs font-semibold text-amber-300/90 mb-1.5" data-key="passwordLabel">പാസ്‌വേർഡ് (Password)</label>
                <div class="relative">
                    <input type="password" id="password" class="lang-placeholder w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 pr-12 text-white text-sm focus:outline-none focus:border-amber-400" data-key-placeholder="passwordPlaceholder" placeholder="പാസ്‌വേർഡ് നൽകുക">
                    <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-amber-400 p-2">
                        <i class="fa-solid fa-eye text-base" id="eyeIcon"></i>
                    </button>
                </div>
                <p class="lang text-[11px] text-slate-400 mt-1.5" data-key="passwordNote">ശ്രദ്ധിക്കുക: പാസ്‌വേർഡിൽ കുറഞ്ഞത് 6 അക്കങ്ങളോ അക്ഷരങ്ങളോ ഉണ്ടായിരിക്കണം.</p>
            </div>

            <!-- സബ്‌മിറ്റ് ബട്ടൺ -->
            <button id="btnRegister" class="lang w-full mt-2 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg hover:from-amber-400 hover:to-orange-400 transition duration-200 text-sm" data-key="registerSubmitBtn">
                അക്കൗണ്ട് രജിസ്റ്റർ ചെയ്യാം
            </button>
        </div>
    </div>

    <!-- ലോഗിൻ ലിങ്ക് -->
    <div class="mt-6 text-center text-xs text-slate-400">
        <span class="lang" data-key="hasAccountText">അക്കൗണ്ട് ഉണ്ടോ?</span> 
        <a href="login.html" class="lang text-amber-400 font-bold hover:underline ml-1" data-key="loginLinkText">ഇവിടെ ലോഗിൻ ചെയ്യാം</a>
    </div>

    <!-- ഫൂട്ടർ -->
    <div class="lang mt-8 text-center text-[11px] text-slate-500" data-key="footerCredit">
        മേസ്തിരിമാർക്കായി നിർമ്മിച്ചത് ❤️ കേരളം
    </div>

    <!-- ഫയർബേസ് സ്ക്രിപ്റ്റുകൾ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
        
        import { setupModal } from './modal.js';
        import { setupHeader } from './header.js';

        setupModal();
        setupHeader('appHeader');
        // 1. പേജ് ലോഡ് ചെയ്യുമ്പോഴും ഭാഷ സെറ്റ് ചെയ്യാൻ
        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('selectedLang') || 'ml';
            if (typeof window.switchLanguage === 'function') {
                window.switchLanguage(savedLang);
            }
        });

        // 2. മുകളിൽ നിന്ന് ഭാഷ മാറ്റുമ്പോൾ തത്സമയം മാറാൻ (languageChanged event)
        window.addEventListener('languageChanged', (e) => {
            const newLang = (e && e.detail) ? e.detail : (localStorage.getItem('selectedLang') || 'ml');
            if (typeof window.switchLanguage === 'function') {
                window.switchLanguage(newLang);
            }
        });

        // 3. മറ്റ് ടാബുകളിലോ സെറ്റിങ്സിലോ ഭാഷ മാറുമ്പോൾ (storage event)
        window.addEventListener('storage', (e) => {
            if (e.key === 'selectedLang') {
                const newLang = e.newValue || 'ml';
                if (typeof window.switchLanguage === 'function') {
                    window.switchLanguage(newLang);
                }
            }
        });

function getAlertText(key) {
    const lang = localStorage.getItem('selectedLang') || 'ml';
    if (typeof words !== 'undefined' && words[key] && words[key][lang]) {
        return words[key][lang];
    }
    return words[key] ? words[key]['ml'] : '';
}

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            databaseURL: "https://mesthri-app-default-rtdb.firebaseio.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d",
            measurementId: "G-J9Y5TW9D7T"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const usernameInput = document.getElementById("username");
        const phoneInput = document.getElementById("phone");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const eyeIcon = document.getElementById("eyeIcon");
        const btnRegister = document.getElementById("btnRegister");

        if (togglePassword && passwordInput && eyeIcon) {
            togglePassword.addEventListener("click", () => {
                const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
                passwordInput.setAttribute("type", type);
                
                if (type === "text") {
                    eyeIcon.classList.remove("fa-eye");
                    eyeIcon.classList.add("fa-eye-slash");
                    togglePassword.style.color = "#fbbf24";
                } else {
                    eyeIcon.classList.remove("fa-eye-slash");
                    eyeIcon.classList.add("fa-eye");
                    togglePassword.style.color = "#94a3b8";
                }
            });
        }

        if (btnRegister) {
            btnRegister.addEventListener("click", async () => {
                const user = usernameInput.value.trim().toLowerCase();
                const phone = phoneInput.value.trim();
                const pass = passwordInput.value.trim();

                if (!user || !phone || !pass) {
                    return showModal(getAlertText('alertFillAll'), getAlertText('alertWarningTitle'), "⚠️");
                }

                if (pass.length < 6) {
                    return showModal(getAlertText('alertPassLength'), getAlertText('alertWarningTitle'), "⚠️");
                }

                try {
                    await set(ref(db, 'users/' + user), {
                        username: user,
                        phone: phone,
                        password: pass
                    });

                    showModal(getAlertText('alertRegSuccess'), getAlertText('successTitle'), "✅");
                    localStorage.setItem('userName', user);
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1500);

                } catch (error) {
                    console.error(error);
                    showModal(getAlertText('alertError'), getAlertText('alertErrorTitle'), "⚠️");
                }
            });
        }
    </script>
</body>
</html>
