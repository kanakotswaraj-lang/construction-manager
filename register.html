<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>നിർമ്മാണ മാനേജർ - പുതിയ അക്കൗണ്ട്</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Manjari', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-blue-950 to-slate-900 min-h-screen text-white flex flex-col justify-between p-6">

    <!-- ടോപ്പ് ഹെഡർ ഭാഗം -->
    <div class="text-center pt-6">
        <div class="inline-flex items-center gap-2.5 bg-amber-500/20 text-amber-400 text-base font-bold px-4 py-2 rounded-full border border-amber-500/50 shadow-lg">
            <img src="icon.png" alt="Mesthiri" class="w-7 h-7 rounded-full object-cover border-2 border-amber-400">
            <span class="text-base font-black text-amber-300 tracking-wide">മേസ്തിരി പ്രോ</span>
        </div>
        <h1 class="text-4xl font-black mt-4 tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-white via-blue-100 to-amber-400">
            പുതിയ രജിസ്ട്രേഷൻ
        </h1>
        <p class="text-sm text-blue-200 mt-1 font-bold">വിവരങ്ങൾ നൽകി പുതിയ അക്കൗണ്ട് ഉണ്ടാക്കാം</p>
    </div>

    <!-- രജിസ്ട്രേഷൻ ഫോം കാർഡ് -->
    <div class="bg-white/5 backdrop-blur-md p-6 rounded-3xl border border-blue-500/30 max-w-sm mx-auto w-full my-4 space-y-4 shadow-xl">
        <div>
            <label class="block text-sm font-bold text-blue-200 mb-1">മേസ്തിരിയുടെ പേര്</label>
            <input type="text" placeholder="പേര് ഇവിടെ എഴുതുക" class="w-full bg-slate-900/80 border border-blue-500/40 rounded-xl p-3.5 text-white text-sm font-bold focus:outline-none focus:border-amber-400">
        </div>

        <div>
            <label class="block text-sm font-bold text-blue-200 mb-1">ഫോൺ നമ്പർ</label>
            <input type="tel" placeholder="10 അക്ക മൊബൈൽ നമ്പർ" class="w-full bg-slate-900/80 border border-blue-500/40 rounded-xl p-3.5 text-white text-sm font-bold focus:outline-none focus:border-amber-400">
        </div>

        <div>
            <label class="block text-sm font-bold text-blue-200 mb-1">പാസ്‌വേർഡ് (Password)</label>
            <input type="password" placeholder="പുതിയ പാസ്‌വേർഡ് നൽകുക" class="w-full bg-slate-900/80 border border-blue-500/40 rounded-xl p-3.5 text-white text-sm font-bold focus:outline-none focus:border-amber-400">
        </div>

        <button onclick="alert('രജിസ്ട്രേഷൻ വിജയകരമായി പൂർത്തിയായി!')" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 text-center p-4 rounded-xl font-black text-base shadow-lg shadow-amber-950/40 transition mt-2">
            അക്കൗണ്ട് രജിസ്റ്റർ ചെയ്യാം
        </button>
    </div>

    <!-- ലോഗിൻ പേജിലേക്ക് തിരിച്ചു പോകാൻ -->
    <div class="max-w-sm mx-auto w-full text-center pb-4 space-y-3">
        <p class="text-sm text-blue-200 font-bold">
            അക്കൗണ്ട് ഉണ്ടോ? 
            <a href="login.html" class="text-amber-400 font-black underline ml-1">ഇവിടെ ലോഗിൻ ചെയ്യാം</a>
        </p>
        <p class="text-xs text-slate-400 font-bold pt-2">
            മേസ്തിരിമാർക്കായി നിർമ്മിച്ചത് ❤️ കേരളം
        </p>
    </div>

</body>
</html>
