<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>മേസ്തിരി പ്രോ - പുതിയ രജിസ്ട്രേഷൻ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Changa+One&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- ലോഗോ ഹെഡർ (header.js വഴി ഇവിടെ വരും) -->
    <div class="w-full max-w-sm mx-auto mb-6">
        <div id="appHeader" class="w-full"></div>
    </div>

    <!-- രജിസ്ട്രേഷൻ കാർഡ് -->
    <div class="w-full max-w-sm bg-slate-900/80 border border-slate-700/60 rounded-2xl p-6 shadow-xl backdrop-blur-md">
        
        <h2 class="text-xl font-bold text-white mb-1">പുതിയ രജിസ്ട്രേഷൻ</h2>
        <p class="text-xs text-slate-400 mb-5">വിവരങ്ങൾ നൽകി പുതിയ അക്കൗണ്ട് ഉണ്ടാക്കാം</p>

        <div class="space-y-4">
            <!-- പേര് -->
            <div>
                <label class="block text-xs font-semibold text-amber-300/90 mb-1.5">മേസ്തിരിയുടെ പേര്</label>
                <input type="text" id="username" placeholder="നിങ്ങളുടെ പേര് നൽകുക" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-400">
            </div>

            <!-- ഫോൺ നമ്പർ -->
            <div>
                <label class="block text-xs font-semibold text-amber-300/90 mb-1.5">ഫോൺ നമ്പർ</label>
                <input type="tel" id="phone" placeholder="10 അക്ക ഫോൺ നമ്പർ" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-400">
            </div>

            <!-- പാസ്‌വേർഡ് -->
            <div>
                <label class="block text-xs font-semibold text-amber-300/90 mb-1.5">പാസ്‌വേർഡ് (Password)</label>
                <div class="relative">
                    <input type="password" id="password" placeholder="പാസ്‌വേർഡ് നൽകുക" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 pr-12 text-white text-sm focus:outline-none focus:border-amber-400">
                    <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-amber-400 p-2">
                        <i class="fa-solid fa-eye text-base" id="eyeIcon"></i>
                    </button>
                </div>
                <p class="text-[11px] text-slate-400 mt-1.5">ശ്രദ്ധിക്കുക: പാസ്‌വേർഡിൽ കുറഞ്ഞത് 6 അക്കങ്ങളോ അക്ഷരങ്ങളോ ഉണ്ടായിരിക്കണം.</p>
            </div>

            <!-- സബ്‌മിറ്റ് ബട്ടൺ -->
            <button id="btnRegister" class="w-full mt-2 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg hover:from-amber-400 hover:to-orange-400 transition duration-200 text-sm">
                അക്കൗണ്ട് രജിസ്റ്റർ ചെയ്യാം
            </button>
        </div>
    </div>

    <!-- ലോഗിൻ ലിങ്ക് -->
    <div class="mt-6 text-center text-xs text-slate-400">
        അക്കൗണ്ട് ഉണ്ടോ? <a href="login.html" class="text-amber-400 font-bold hover:underline ml-1">ഇവിടെ ലോഗിൻ ചെയ്യാം</a>
    </div>

    <!-- ഫൂട്ടർ -->
    <div class="mt-8 text-center text-[11px] text-slate-500">
        മേസ്തിരിമാർക്കായി നിർമ്മിച്ചത് ❤️ കേരളം
    </div>

    <!-- ഫയർബേസ് സ്ക്രിപ്റ്റുകൾ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
        
        // മോഡലും ഹെഡറും ഇമ്പോർട്ട് ചെയ്യുന്നു
        import { setupModal } from './modal.js';
        import { setupHeader } from './header.js';

        // ആക്ടിവേറ്റ് ചെയ്യുന്നു
        setupModal();
        setupHeader('appHeader');

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            databaseURL: "https://mesthri-app-default-rtdb.firebaseio.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d",
            measurementId: "G-J9Y5TW9D7T"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const usernameInput = document.getElementById("username");
        const phoneInput = document.getElementById("phone");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const eyeIcon = document.getElementById("eyeIcon");
        const btnRegister = document.getElementById("btnRegister");

        if (togglePassword && passwordInput && eyeIcon) {
            togglePassword.addEventListener("click", () => {
                const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
                passwordInput.setAttribute("type", type);
                
                if (type === "text") {
                    eyeIcon.classList.remove("fa-eye");
                    eyeIcon.classList.add("fa-eye-slash");
                    togglePassword.style.color = "#fbbf24";
                } else {
                    eyeIcon.classList.remove("fa-eye-slash");
                    eyeIcon.classList.add("fa-eye");
                    togglePassword.style.color = "#94a3b8";
                }
            });
        }

        if (btnRegister) {
            btnRegister.addEventListener("click", async () => {
                const user = usernameInput.value.trim().toLowerCase();
                const phone = phoneInput.value.trim();
                const pass = passwordInput.value.trim();

                if (!user || !phone || !pass) {
                    return showModal("ദയവായി എല്ലാ വിവരങ്ങളും നൽകുക!", "ശ്രദ്ധിക്കുക", "⚠️");
                }

                if (pass.length < 6) {
                    return showModal("പാസ്‌വേർഡിന് കുറഞ്ഞത് 6 അക്കങ്ങളോ അക്ഷരങ്ങളോ ഉണ്ടായിരിക്കണം!", "ശ്രദ്ധിക്കുക", "⚠️");
                }

                try {
                    await set(ref(db, 'users/' + user), {
                        username: user,
                        phone: phone,
                        password: pass
                    });

                    showModal("വിജയകരമായി രജിസ്റ്റർ ചെയ്തു!", "വിജയം", "✅");
                    localStorage.setItem('userName', user);
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 1500);

                } catch (error) {
                    console.error(error);
                    showModal("രജിസ്ട്രേഷൻ പരാജയപ്പെട്ടു! ഇന്റർനെറ്റ് കണക്ഷൻ പരിശോധിക്കുക.", "തടസ്സം", "⚠️");
                }
            });
        }
    </script>
</body>
</html>
