<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>നിർമ്മാണ മാനേജർ - പുതിയ അക്കൗണ്ട്</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Manjari', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 min-h-screen text-white flex flex-col justify-between p-6">

    <!-- ടോപ്പ് ഹെഡർ ഭാഗം -->
    <div class="text-center pt-6">
        <span class="bg-emerald-500/20 text-emerald-400 text-sm font-bold px-4 py-1.5 rounded-full border border-emerald-500/30">🏗️ മേസ്തിരി അക്കൗണ്ട്</span>
        <h1 class="text-3xl font-black mt-4 tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-white via-slate-200 to-emerald-400">
            പുതിയ രജിസ്ട്രേഷൻ
        </h1>
        <p class="text-xs text-slate-300 mt-1 font-bold">വിവരങ്ങൾ നൽകി പുതിയ അക്കൗണ്ട് ഉണ്ടാക്കാം</p>
    </div>

    <!-- രജിസ്ട്രേഷൻ ഫോം കാർഡ് -->
    <div class="bg-white/10 backdrop-blur-md p-6 rounded-3xl border border-white/10 max-w-sm mx-auto w-full my-4 space-y-4 shadow-xl">
        <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">മേസ്തിരിയുടെ പേര്</label>
            <input type="text" placeholder="പേര് ഇവിടെ എഴുതുക" class="w-full bg-slate-900/60 border border-slate-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-emerald-500">
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">ഫോൺ നമ്പർ</label>
            <input type="tel" placeholder="10 അക്ക മൊബൈൽ നമ്പർ" class="w-full bg-slate-900/60 border border-slate-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-emerald-500">
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-300 mb-1">പാസ്‌വേർഡ് (Password)</label>
            <input type="password" placeholder="പുതിയ പാസ്‌വേർഡ് നൽകുക" class="w-full bg-slate-900/60 border border-slate-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-emerald-500">
        </div>

        <button onclick="alert('രജിസ്ട്രേഷൻ വിജയകരമായി പൂർത്തിയായി!')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-center p-3.5 rounded-xl font-black text-sm shadow-lg shadow-emerald-900/50 transition mt-2">
            അക്കൗണ്ട് രജിസ്റ്റർ ചെയ്യാം
        </button>
    </div>

    <!-- ലോഗിൻ പേജിലേക്ക് തിരിച്ചു പോകാൻ -->
    <div class="max-w-sm mx-auto w-full text-center pb-4 space-y-3">
        <p class="text-xs text-slate-300">
            이미 അക്കൗണ്ട് ഉണ്ടോ? 
            <a href="login.html" class="text-emerald-400 font-bold underline ml-1">ഇവിടെ ലോഗിൻ ചെയ്യാം</a>
        </p>
        <p class="text-[11px] text-slate-400 font-bold pt-2">
            മേസ്തിരിമാർക്കായി നിർമ്മിച്ചത് ❤️ കേരളം
        </p>
    </div>

</body>
</html>
