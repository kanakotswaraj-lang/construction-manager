<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&display=swap" rel="stylesheet">
    <script src="language.js"></script>
    <style>
    body { font-family: 'Manjari', sans-serif; background-color: #050B18; color: white; }
    
    input, select {
        border: 2px solid rgba(51, 65, 85, 1);
        transition: all 0.3s ease;
        background-color: #1e293b !important;
        color: white !important;
    }

    input:focus, select:focus {
        border-color: #06b6d4 !important; 
        outline: none;
        box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.2); 
    }

    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus {
        -webkit-box-shadow: 0 0 0 1000px #1e293b inset !important;
        -webkit-text-fill-color: white !important;
    }
    #langSelectDropdown {
        background: linear-gradient(to right, #fbbf24, #fde047, #facc15) !important;
        color: #030712 !important;
    }
    #langSelectDropdown option {
        background-color: #ffffff !important;
        color: #030712 !important;
        font-weight: 900 !important;
    }
    </style>
    <title class="lang" data-key="report_title">ഹാജർ & പണി റിപ്പോർട്ട്</title>
</head>
<body class="bg-[#050B18] text-white font-sans min-h-screen p-4">
    <div class="max-w-md mx-auto space-y-4 p-4 rounded-3xl border-2 border-cyan-500/60 shadow-[0_0_25px_rgba(6,182,212,0.25)] bg-[#050B18]/95">
        
        <!-- ഹെഡർ ഭാഗം -->
        <div id="appHeader" class="w-full flex justify-center"></div>

        <!-- ടൈറ്റിലും ഹോം ബട്ടണും -->
        <div class="bg-slate-900 border-2 border-cyan-500 p-4 rounded-2xl flex justify-between items-center shadow-xl shadow-cyan-950/50">
            <h1 class="text-sm font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-teal-300 to-sky-400 tracking-wide lang" data-key="report_title">ഹാജർ & പണി റിപ്പോർട്ട്</h1>

            <a href="dashboard.html" class="px-4 py-2 bg-gradient-to-r from-cyan-600 to-teal-600 text-white rounded-xl text-xs font-black shadow-lg flex items-center gap-2 border border-white/40 lang" data-key="home">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                Home
            </a>
        </div>

        <!-- സ്റ്റാറ്റിസ്റ്റിക്സ് കാർഡുകൾ -->
        <div class="bg-slate-900/90 p-4 rounded-3xl shadow-xl border border-slate-800 space-y-3">
            <div class="grid grid-cols-2 gap-3 text-center">
                <div class="bg-slate-800/80 p-3 rounded-2xl border border-slate-700">
                    <p class="text-[11px] text-slate-400 font-bold lang" data-key="total_days">ആകെ പണി സമയം</p>
                    <p id="statTotalDays" class="text-xs font-black text-cyan-300">0 ദിവസം (0 മണീക്കൂർ)</p>
                </div>
                <div class="bg-slate-800/80 p-3 rounded-2xl border border-slate-700">
                    <p class="text-[11px] text-slate-400 font-bold lang" data-key="total_wage">ആകെ നൽകിയ കൂലി</p>
                    <p id="statTotalWage" class="text-base font-black text-emerald-400">₹0</p>
                </div>
            </div>

            <!-- സെർച്ച് & ഫിൽട്ടറുകൾ -->
            <input type="text" id="searchInput" placeholder="🔍 പേരോ സൈറ്റോ തിരയുക..." class="w-full p-3 bg-slate-800 rounded-2xl border border-slate-700 text-xs lang-placeholder text-white" data-key-placeholder="search_placeholder" oninput="loadAttendanceData()">

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[10px] text-slate-400 font-bold block mb-1 lang" data-key="worker">തൊഴിലാളി</label>
                    <select id="filterWorker" onchange="loadAttendanceData()" class="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs font-bold text-cyan-400 focus:outline-none">
                        <option value="" class="lang" data-key="all_workers">എല്ലാ തൊഴിലാളികളും</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 font-bold block mb-1 lang" data-key="site">സൈറ്റ്</label>
                    <select id="filterSite" onchange="loadAttendanceData()" class="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs font-bold text-cyan-400 focus:outline-none">
                        <option value="" class="lang" data-key="all_sites">എല്ലാ സൈറ്റുകളും</option>
                    </select>
                </div>
            </div>

            <!-- ഡേറ്റ് റേഞ്ച് ഫിൽട്ടർ -->
            <div class="grid grid-cols-2 gap-2 mt-2">
                <div>
                    <label class="text-[10px] text-slate-400 font-bold block mb-1">ഏതു തീയതി മുതൽ (From)</label>
                    <input type="date" id="filterFromDate" onchange="loadAttendanceData()" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:border-cyan-400">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 font-bold block mb-1">ഏതു തീയതി വരെ (To)</label>
                    <input type="date" id="filterToDate" onchange="loadAttendanceData()" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:border-cyan-400">
                </div>
            </div>

            <!-- വാട്സാപ്പ് ഷെയർ ബട്ടൺ കണ്ടെയ്നർ -->
            <div id="waBtnContainer" class="hidden pt-1 space-y-2"></div>
        </div>

        <!-- ഹാജർ വിവരങ്ങൾ ലിസ്റ്റ് ചെയ്യുവാൻ -->
        <div class="space-y-2.5">
            <h3 class="text-xs font-black text-slate-400 uppercase px-1 lang" data-key="attendance_info">ഹാജർ വിവരങ്ങൾ</h3>
            <div id="reportList" class="space-y-3"></div>
        </div>
    </div>

    <!-- മോഡലുകൾ (ടോസ്റ്റ്) -->
    <div id="customToast" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-900 border-2 border-cyan-400 text-cyan-300 px-8 py-4 rounded-3xl shadow-2xl font-black text-base z-50 transition-all duration-300 opacity-0 pointer-events-none text-center scale-100">ഫലം...</div>

    <!-- ജാവാസ്ക്രിപ്റ്റ് ഭാഷാ മാറ്റത്തിനുള്ള കോഡ് -->
    <script>
        window.switchLanguage = function(lang) {
            if (!lang) lang = localStorage.getItem('selectedLang') || 'ml';
            localStorage.setItem('selectedLang', lang);

            document.querySelectorAll('.lang').forEach(element => {
                let key = element.getAttribute('data-key');
                if (typeof words !== 'undefined' && words[key] && words[key][lang]) {
                    element.innerText = words[key][lang];
                }
            });

            document.querySelectorAll('.lang-placeholder').forEach(element => {
                let key = element.getAttribute('data-key-placeholder');
                if (typeof words !== 'undefined' && words[key] && words[key][lang]) {
                    element.placeholder = words[key][lang];
                }
            });

            if (typeof window.loadAttendanceData === 'function') {
                window.loadAttendanceData();
            }
        };

        document.addEventListener("DOMContentLoaded", () => {
            const savedLang = localStorage.getItem('selectedLang') || 'ml';
            setTimeout(() => {
                if (typeof window.switchLanguage === 'function') {
                    window.switchLanguage(savedLang);
                }
            }, 100);
        });
    </script>

    <!-- ഫയർബേസും ഡാറ്റ ലോഡിംഗും -->
    <script type="module">
        import { setupHeader } from './header.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        
        const currentMeshtri = localStorage.getItem('userName') || "പൊതുമേസ്തിരി";

        document.addEventListener("DOMContentLoaded", () => {
            try {
                if (typeof setupHeader === 'function') {
                    setupHeader('appHeader', true, currentMeshtri);
                } else {
                    document.getElementById('appHeader').innerHTML = `<h2 class="text-cyan-400 font-black text-sm">${currentMeshtri}</h2>`;
                }
            } catch (e) {
                document.getElementById('appHeader').innerHTML = `<h2 class="text-cyan-400 font-black text-sm">${currentMeshtri}</h2>`;
            }
            loadAttendanceData();
        });

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            databaseURL: "https://mesthri-app-default-rtdb.firebaseio.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d",
            measurementId: "G-J9Y5TW9D7T"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allLogs = [];
        let allWorkers = new Map();
        let allSites = new Set();
        let isDataLoaded = false;

        window.loadAttendanceData = async function() {
            const list = document.getElementById('reportList');
            const currentLang = localStorage.getItem('selectedLang') || 'ml';
            const getTxt = (key, defaultTxt) => (typeof words !== 'undefined' && words[key] && words[key][currentLang]) ? words[key][currentLang] : defaultTxt;

            if (!isDataLoaded) {
                list.innerHTML = `<p class="text-center text-xs text-slate-400 font-bold py-8">${getTxt('checking_data', 'ഡാറ്റ പരിശോധിക്കുന്നു...')}</p>`;
            }

            try {
                if (!isDataLoaded) {
                    const staffQuery = query(collection(db, "staffs"), where("meshtriOwner", "==", currentMeshtri));
                    const staffSnapshot = await getDocs(staffQuery);
                    staffSnapshot.forEach(docSnap => {
                        const s = docSnap.data();
                        if (s.name) {
                            const cleanPhone = s.phone ? s.phone.replace(/\D/g, '') : '';
                            allWorkers.set(s.name.trim(), { phone: cleanPhone, wage: s.wage || 1200 });
                        }
                    });

                    const q = query(collection(db, "accounts"), where("meshtriOwner", "==", currentMeshtri), where("type", "==", "wage"));
                    const querySnapshot = await getDocs(q);

                    allLogs = [];
                    allSites.clear();

                    querySnapshot.forEach(docSnap => {
                        const data = docSnap.data();
                        let workerName = data.name ? data.name.split('(')[0].trim() : "തൊഴിലാളി";
                        let siteName = data.site || "പ്രധാന സൈറ്റ്";

                        if (!allWorkers.has(workerName)) {
                            allWorkers.set(workerName, { phone: '', wage: 1200 });
                        }
                        allSites.add(siteName);

                        allLogs.push({
                            id: docSnap.id,
                            workerName: workerName,
                            site: siteName,
                            amount: parseFloat(data.amount) || 0,
                            date: data.date || ""
                        });
                    });

                    allLogs.sort((a, b) => new Date(b.date) - new Date(a.date));
                    isDataLoaded = true;
                    populateDropdowns();
                }

                renderReportList();

            } catch (err) {
                console.error(err);
                list.innerHTML = `<p class="text-center text-xs text-rose-400 font-bold py-4">${getTxt('load_error', 'ഡാറ്റ ലോഡ് ചെയ്യാൻ കഴിഞ്ഞില്ല.')}</p>`;
            }
        };

        function populateDropdowns() {
            const workerSelect = document.getElementById('filterWorker');
            const siteSelect = document.getElementById('filterSite');
            const currentLang = localStorage.getItem('selectedLang') || 'ml';
            const getTxt = (key, defaultTxt) => (typeof words !== 'undefined' && words[key] && words[key][currentLang]) ? words[key][currentLang] : defaultTxt;

            const allWorkersText = getTxt('all_workers', 'എല്ലാ തൊഴിലാളികളും');
            const allSitesText = getTxt('all_sites', 'എല്ലാ സൈറ്റുകളും');

            const selectedWorkerVal = workerSelect.value;
            const selectedSiteVal = siteSelect.value;

            workerSelect.innerHTML = `<option value="">${allWorkersText}</option>`;
            siteSelect.innerHTML = `<option value="">${allSitesText}</option>`;

            allWorkers.forEach((val, worker) => {
                workerSelect.innerHTML += `<option value="${worker}">${worker}</option>`;
            });

            allSites.forEach(site => {
                siteSelect.innerHTML += `<option value="${site}">${site}</option>`;
            });

            workerSelect.value = selectedWorkerVal;
            siteSelect.value = selectedSiteVal;
        }

        function renderReportList() {
            const selectedWorker = document.getElementById('filterWorker').value;
            const selectedSite = document.getElementById('filterSite').value;
            const fromDate = document.getElementById('filterFromDate').value;
            const toDate = document.getElementById('filterToDate').value;
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const currentLang = localStorage.getItem('selectedLang') || 'ml';
            const getTxt = (key, defaultTxt) => (typeof words !== 'undefined' && words[key] && words[key][currentLang]) ? words[key][currentLang] : defaultTxt;

            const filtered = allLogs.filter(log => {
                const matchWorker = !selectedWorker || log.workerName === selectedWorker;
                const matchSite = !selectedSite || log.site === selectedSite;
                const matchSearch = !searchVal || log.workerName.toLowerCase().includes(searchVal) || log.site.toLowerCase().includes(searchVal);
                
                let matchDate = true;
                if (log.date) {
                    if (fromDate && log.date < fromDate) matchDate = false;
                    if (toDate && log.date > toDate) matchDate = false;
                }

                return matchWorker && matchSite && matchDate && matchSearch;
            });

            let totalTotalHours = 0;
            let totalWage = 0;

            const processedFiltered = filtered.map(item => {
                const workerInfo = allWorkers.get(item.workerName) || { wage: 1200 };
                const standardWage = workerInfo.wage || 1200;
                const hourlyRate = standardWage / 8;

                let computedHours = Math.round(item.amount / hourlyRate);
                if (computedHours > 8) computedHours = 8;
                if (computedHours < 1 && item.amount > 0) computedHours = 1;

                totalTotalHours += computedHours;
                totalWage += item.amount;

                let hoursText = `${computedHours} മണിക്കൂർ`;
                if (computedHours === 8) {
                    hoursText = "8 മണിക്കൂർ (മുഴുവൻ പണി)";
                } else if (computedHours === 5) {
                    hoursText = "5 മണിക്കൂർ (ഉച്ചപ്പണി)";
                }

                return { ...item, computedHours, hoursText };
            });

            let totalDaysDecimal = parseFloat((totalTotalHours / 8).toFixed(1));
            document.getElementById('statTotalDays').innerText = `${totalDaysDaysText = totalDaysDecimal} ദിവസം (${totalTotalHours} മണിക്കൂർ)`;
            document.getElementById('statTotalWage').innerText = "₹" + totalWage;

            const waContainer = document.getElementById('waBtnContainer');
            waContainer.innerHTML = '';
            let hasBtn = false;

            if (selectedWorker) {
                const workerInfo = allWorkers.get(selectedWorker) || { phone: '' };
                const phone = workerInfo.phone || '';
                const msgPrefix = getTxt('wa_msg_prefix', 'നമസ്കാരം');
                const waAtt = getTxt('wa_attendance', 'ഹാജർ വിവരങ്ങൾ');
                const waTDays = getTxt('wa_total_days', 'ആകെ പണി സമയം');
                const waTWage = getTxt('wa_total_wage', 'ആകെ കൂലി');
                const waBtnTitle = getTxt('wa_btn_text', 'WhatsApp മെസ്സേജ് അയക്കുക');

                const msg = `${msgPrefix} ${selectedWorker},%0A${waAtt}:%0A- ${waTDays}: ${totalDaysDecimal} ദിവസം (${totalTotalHours} മണിക്കൂർ)%0A- ${waTWage}: ₹${totalWage}`;
                
                waContainer.innerHTML += `
                    <a href="https://wa.me/${phone}?text=${msg}" target="_blank" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white p-3 text-center rounded-2xl text-xs font-black shadow-lg transition flex items-center justify-center gap-2">
                        💬 ${selectedWorker} - ${waBtnTitle}
                    </a>
                `;
                hasBtn = true;
            }

            if (fromDate || toDate) {
                let rangeText = `🏗️ *മേസ്തിരി പ്രോ - ഹാജർ & പണി റിപ്പോർട്ട്*%0A📅 തീയതി: ${fromDate || 'തുടക്കം'} മുതൽ ${toDate || 'ഇന്ന്'} വരെ%0A----------------------------------%0A`;
                
                processedFiltered.forEach((item, index) => {
                    rangeText += `${index + 1}. *${item.workerName}* - ${item.site} (${item.hoursText}) - ₹${item.amount}%0A`;
                });

                rangeText += `----------------------------------%0A💰 *ആകെ സമയം:* ${totalDaysDecimal} ദിവസം (${totalTotalHours} മണിക്കൂർ)%0A💸 *ആകെ കൂലി:* ₹${totalWage}`;

                waContainer.innerHTML += `
                    <a href="https://wa.me/?text=${rangeText}" target="_blank" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:opacity-95 text-white p-3 text-center rounded-2xl text-xs font-black shadow-lg transition flex items-center justify-center gap-2">
                        💬 തിരഞ്ഞെടുത്ത തീയതികളിലെ മുഴുവൻ റിപ്പോർട്ടും WhatsApp ചെയ്യുക
                    </a>
                `;
                hasBtn = true;
            }

            if (hasBtn) {
                waContainer.classList.remove('hidden');
            } else {
                waContainer.classList.add('hidden');
            }

            const list = document.getElementById('reportList');
            list.innerHTML = '';

            if (processedFiltered.length === 0) {
                list.innerHTML = `<p class="text-center text-slate-400 font-bold text-xs py-8">${getTxt('no_data', 'വിവരങ്ങൾ ഒന്നും ലഭ്യമല്ല')}</p>`;
                return;
            }

            processedFiltered.forEach(item => {
                list.innerHTML += `
                    <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 flex justify-between items-center shadow-lg backdrop-blur-sm">
                        <div class="space-y-1">
                            <h4 class="font-black text-sm text-white">${item.workerName}</h4>
                            <p class="text-xs text-slate-400 font-bold">📅 ${item.date} | 📍 <span class="text-cyan-300">${item.site}</span></p>
                        </div>
                        <div class="text-right">
                            <span class="px-2.5 py-1 bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 rounded-xl text-xs font-black">${item.hoursText}</span>
                            <p class="font-black text-sm text-emerald-400 mt-1 shadow-sm">₹${item.amount}</p>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
