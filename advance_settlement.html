<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>മേസ്തിരി പ്രോ - അഡ്വാൻസ് സെറ്റിൽമെന്റ്</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="language.js"></script>

    <style>
        body { font-family: 'Manjari', sans-serif; }
    </style>
</head>
<body class="bg-[#050B18] text-white min-h-screen pb-12 p-4 font-sans">

    <div class="max-w-md mx-auto space-y-4">
        
        <!-- ഹെഡർ (Header) -->
        <div id="appHeader" class="w-full flex justify-center"></div>

        <!-- സ്വാഗതം കാർഡ് -->
        <div id="welcomeUser" class="bg-gradient-to-r from-blue-950 via-blue-900 to-blue-950 border border-blue-500/50 rounded-2xl p-3 text-center text-blue-200 text-sm font-semibold shadow-lg">
            സ്വാഗതം, swaraj
        </div>
        
        <!-- ടോപ്പ് ബാറും ഹോം ബട്ടണും -->
        <div class="bg-slate-900/90 border-2 border-amber-500/50 p-4 rounded-2xl flex justify-between items-center shadow-xl backdrop-blur-sm">
            <h1 data-key="advance_settlement_title" class="text-base font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-yellow-300 to-orange-400 tracking-wide">
                മേസ്തിരി അഡ്വാൻസ് സെറ്റിൽമെന്റ്
            </h1>
            <a href="dashboard.html" class="px-4 py-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 rounded-xl text-xs font-black shadow-lg shadow-amber-900/40 transition flex items-center gap-2 border border-white/30">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span data-key="home">Home</span>
            </a>
        </div>

        <!-- അഡ്വാൻസ് സെറ്റിൽമെന്റ് കാർഡ് -->
        <div class="bg-slate-900/90 border border-amber-500/40 rounded-2xl p-4 space-y-4 shadow-xl backdrop-blur-sm">
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label data-key="meshtri_advance" class="block text-xs text-slate-400 font-bold mb-1">മേസ്തിരി തന്നത് (Advance)</label>
                    <input type="number" id="settleAdvance" value="0" oninput="calculateAdvance()" class="w-full bg-[#1a2234] border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label data-key="self_spent" class="block text-xs text-slate-400 font-bold mb-1">കയ്യിൽ നിന്ന് മുടക്കിയത്</label>
                    <input type="number" id="settleSelfSpent" value="0" oninput="calculateAdvance()" class="w-full bg-[#1a2234] border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-amber-500">
                </div>
            </div>

            <div class="flex justify-between items-center bg-[#1a2234] p-3.5 rounded-xl border border-slate-700">
                <span data-key="remaining_balance" class="text-xs font-bold text-slate-300">ബാക്കി തുക:</span>
                <span id="settleBalanceText" class="text-emerald-400 font-black text-sm">₹ 0</span>
            </div>

            <!-- ആക്ഷൻ ബട്ടണുകൾ -->
            <div class="space-y-2 pt-2">
                <button class="w-full bg-red-600 hover:bg-red-500 text-white p-3 rounded-xl text-xs font-black transition shadow-lg shadow-red-900/30 flex items-center justify-center gap-2">
                    🔄 <span data-key="close_cycle_btn">അഡ്വാൻസ് ക്ലോസ് ചെയ്ത് പുതിയ സൈക്കിൾ തുടങ്ങുക</span>
                </button>
                <button class="w-full bg-emerald-600 hover:bg-emerald-500 text-white p-3 rounded-xl text-xs font-black transition shadow-lg shadow-emerald-900/30 flex items-center justify-center gap-2">
                    📱 <span data-key="whatsapp_btn">അഡ്വാൻസ് സെറ്റിൽമെന്റ് കണക്ക് WhatsApp അയക്കുക</span>
                </button>
            </div>
        </div>

    </div>

    <script>
        function calculateAdvance() {
            let advance = parseFloat(document.getElementById('settleAdvance').value) || 0;
            let selfSpent = parseFloat(document.getElementById('settleSelfSpent').value) || 0;
            let balance = advance - selfSpent;
            
            let balanceText = document.getElementById('settleBalanceText');
            if (balanceText) {
                balanceText.innerText = `₹ ${balance}`;
                balanceText.className = balance < 0 ? "text-red-400 font-black text-sm" : "text-emerald-400 font-black text-sm";
            }
        }
    </script>
</body>
</html>
