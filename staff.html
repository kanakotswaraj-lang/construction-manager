<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>മേസ്തിരി പ്രോ - തൊഴിലാളികളുടെ കണക്കുകൾ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Manjari', sans-serif; }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast-animate { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-[#050B18] text-white min-h-screen pb-12 p-4 font-sans">

    <!-- Toast Alert Container -->
    <div id="customAlert" class="hidden fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-[9999] p-5 rounded-2xl border font-bold text-center shadow-2xl max-w-xs w-full backdrop-blur-md"></div>

    <div class="max-w-md mx-auto space-y-4">
        
        <!-- ഹെഡർ -->
        <div id="appHeader" class="w-full flex justify-center"></div>

        <div class="text-center w-full">
        
        <!-- ടോപ്പ് ബാർ -->
        <div class="bg-slate-900/90 border-2 border-indigo-500/50 p-4 rounded-2xl flex justify-between items-center shadow-xl backdrop-blur-sm mb-4">
            <h1 class="text-base font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-blue-300 to-purple-400 tracking-wide">തൊഴിലാളികളുടെ കണക്കുകൾ</h1>
            <a href="dashboard.html" class="px-4 py-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 rounded-xl text-xs font-black shadow-lg shadow-amber-900/40 transition flex items-center gap-2 border border-white/30">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>Home</span>
            </a>
        </div>

        <div class="mb-4">
            <input type="text" id="searchInput" placeholder="🔍 തൊഴിലാളിയെ തിരയുക..." class="w-full p-4 bg-slate-800/80 rounded-2xl border border-blue-500 text-sm font-bold text-white placeholder-slate-500 focus:outline-none">
        </div>

        <button onclick="document.getElementById('addStaffModal').classList.remove('hidden')" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 p-4 rounded-2xl text-sm font-black shadow-lg shadow-amber-500/20 transition mb-4">
            ➕ പുതിയ തൊഴിലാളിയെ ചേർക്കുക
        </button>

        <div id="staffList" class="space-y-4">
            <p class="text-center text-xs text-slate-400 font-bold py-4">കണക്കുകൾ ലോഡ് ചെയ്യുന്നു...</p>
        </div>
    </div>

    <!-- മോഡലുകൾ -->
    <div id="addStaffModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl w-full max-w-sm space-y-3.5 shadow-2xl">
            <h3 class="font-black text-amber-400 text-base mb-2">പുതിയ തൊഴിലാളി</h3>
            <input type="text" id="staffName" placeholder="പേര്" class="w-full p-3.5 bg-slate-800 border border-blue-500/60 rounded-2xl text-xs font-bold text-white focus:outline-none">
            <input type="text" id="siteName" placeholder="സൈറ്റിന്റെ പേര്" class="w-full p-3.5 bg-slate-800 border border-blue-500/60 rounded-2xl text-xs font-bold text-white focus:outline-none">
            <input type="number" id="dailyWage" placeholder="ഒരു ദിവസത്തെ കൂലി (₹)" class="w-full p-3.5 bg-slate-800 border border-blue-500/60 rounded-2xl text-xs font-bold text-white focus:outline-none">
            <input type="text" id="phoneNumber" placeholder="ഫോൺ നമ്പർ" class="w-full p-3.5 bg-slate-800 border border-blue-500/60 rounded-2xl text-xs font-bold text-white focus:outline-none">
            <input type="text" id="jobType" placeholder="ജോലി (ഉദാ: മേസ്തിരി, പണിക്കാരൻ)" class="w-full p-3.5 bg-slate-800 border border-blue-500/60 rounded-2xl text-xs font-bold text-white focus:outline-none">
            <input type="text" id="bankDetails" placeholder="GPay / ബാങ്ക് വിവരങ്ങൾ" class="w-full p-3.5 bg-slate-800 border border-blue-500/60 rounded-2xl text-xs font-bold text-white focus:outline-none">
            <div class="flex gap-2 pt-2">
                <button id="saveStaffBtn" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 p-3 rounded-2xl text-xs font-black transition">സേവ് ചെയ്യുക</button>
                <button onclick="document.getElementById('addStaffModal').classList.add('hidden')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 p-3 rounded-2xl text-xs font-bold transition">ക്യാൻസൽ</button>
            </div>
        </div>
    </div>

    <div id="wageModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-55">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl w-full max-w-sm space-y-3.5 shadow-2xl">
            <h3 id="modalWorkerTitle" class="font-black text-amber-400 text-base">ഇന്നത്തെ കൂലി ചേർക്കുക</h3>
            <input type="hidden" id="modalStaffId">
            <input type="hidden" id="modalStaffName">
            <input type="hidden" id="modalDefaultWage">
            
            <div>
                <label class="text-[10px] text-slate-400 font-bold uppercase mb-1 block">തീയതി</label>
                <input type="date" id="modalDate" class="w-full p-3.5 bg-slate-800 border border-blue-500/60 rounded-2xl text-xs font-bold text-white focus:outline-none">
            </div>
            <div>
                <label class="text-[10px] text-slate-400 font-bold uppercase mb-1 block">സൈറ്റ് പേര്</label>
                <input type="text" id="modalSiteName" class="w-full p-3.5 bg-slate-800 border border-blue-500/60 rounded-2xl text-xs font-bold text-white focus:outline-none">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[10px] text-slate-400 font-bold uppercase mb-1 block">പണി ദിവസം</label>
                    <input type="number" id="modalDayAmount" step="0.5" value="1" oninput="updateModalWage()" class="w-full p-3.5 bg-slate-800 border border-blue-500/60 rounded-2xl text-xs font-bold text-white text-center focus:outline-none">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 font-bold uppercase mb-1 block">ആകെ കൂലി (₹)</label>
                    <input type="number" id="modalWageAmount" class="w-full p-3.5 bg-slate-800 border border-blue-500/60 rounded-2xl text-xs font-black text-amber-400 text-center focus:outline-none">
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button id="confirmWageBtn" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 p-3 rounded-2xl text-xs font-black transition">കണക്ക് ചേർക്കുക</button>
                <button onclick="closeWageModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 p-3 rounded-2xl text-xs font-bold transition">ക്യാൻസൽ</button>
            </div>
        </div>
    </div>

    <!-- ജാവാസ്ക്രിപ്റ്റ് ഭാഗം -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        import { setupHeader } from './header.js';

        document.addEventListener("DOMContentLoaded", async () => {
            try {
                if (typeof setupHeader === 'function') { 
                    setupHeader('appHeader'); 
                } else { 
                    document.getElementById('appHeader').innerHTML = `<h2 class="text-amber-400 font-black text-sm">മേസ്തിരി പ്രോ</h2>`; 
                }
            } catch (e) { 
                console.error("Initialization error:", e);
            }
            loadStaffAndAccounts();
        });

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            databaseURL: "https://mesthri-app-default-rtdb.firebaseio.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d",
            measurementId: "G-J9Y5TW9D7T"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let currentMeshtri = localStorage.getItem('userName') || localStorage.getItem('meshtriName') || localStorage.getItem('name') || "മേസ്തിരി";

        window.showAlert = function(message, type = 'success') {
            const alertBox = document.getElementById('customAlert');
            if (!alertBox) return alert(message);
            alertBox.innerText = message;
            alertBox.classList.remove('hidden');
            const baseClass = "toast-animate fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 px-6 py-4 rounded-2xl z-50 font-bold text-center shadow-2xl border-2 backdrop-blur-md ";
            alertBox.className = baseClass + (type === 'success' ? "bg-emerald-900/95 border-emerald-500 text-emerald-200" : "bg-red-900/95 border-red-500 text-red-200");
            setTimeout(() => alertBox.classList.add('hidden'), 2500);
        };

        const getTodayDate = () => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        function getMalayalamDay(dateString) {
            if (!dateString) return "";
            const days = ["ഞായർ", "തിങ്കൾ", "ചൊവ്വ", "ബുധൻ", "വ്യാഴം", "വെള്ളി", "ശനി"];
            return days[new Date(dateString).getDay()] || "";
        }

        document.getElementById('saveStaffBtn').addEventListener('click', async () => {
            const name = document.getElementById('staffName').value.trim();
            const site = document.getElementById('siteName').value.trim();
            if (!name) return showAlert("പേര് നൽകുക!", "error");
            if (!site) return showAlert("സൈറ്റിന്റെ പേര് നൽകുക!", "error");
            
            try {
                await addDoc(collection(db, "staffs"), {
                    meshtriOwner: currentMeshtri,
                    name, site,
                    wage: parseFloat(document.getElementById('dailyWage').value) || 0,
                    phone: document.getElementById('phoneNumber').value.trim(),
                    job: document.getElementById('jobType').value.trim(),
                    bank: document.getElementById('bankDetails').value.trim(),
                    lastSettledDate: ""
                });
                showAlert("വിജയകരമായി സേവ് ആയി! ✅", "success");
                document.getElementById('addStaffModal').classList.add('hidden');
                loadStaffAndAccounts();
            } catch (err) {
                showAlert("തടസ്സം നേരിട്ടു!", "error");
            }
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            document.querySelectorAll('#staffList > div').forEach(div => {
                div.style.display = div.innerText.toLowerCase().includes(val) ? '' : 'none';
            });
        });

        async function loadStaffAndAccounts() {
            const list = document.getElementById('staffList');
            list.innerHTML = `<p class="text-center text-xs text-slate-400 font-bold py-4">കണക്കുകൾ ലോഡ് ചെയ്യുന്നു...</p>`;

            try {
                const accountsSnapshot = await getDocs(query(collection(db, "accounts"), where("meshtriOwner", "==", currentMeshtri)));
                const allAccounts = accountsSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                allAccounts.sort((a, b) => new Date(b.date) - new Date(a.date));

                const staffsSnapshot = await getDocs(query(collection(db, "staffs"), where("meshtriOwner", "==", currentMeshtri)));
                list.innerHTML = '';

                if (staffsSnapshot.empty) {
                    list.innerHTML = `<p class="text-center text-xs text-slate-400 font-bold py-4">തൊഴിലാളികൾ ആരും ഇല്ല.</p>`;
                    return;
                }

                staffsSnapshot.forEach((d) => {
                    const s = d.data();
                    const staffId = d.id;
                    const div = document.createElement('div');
                    div.className = "bg-slate-900/90 text-white p-5 rounded-3xl border border-slate-800 shadow-xl backdrop-blur-sm mb-4 space-y-3";
                    
                    const staffLogs = allAccounts.filter(acc => acc.staffId === staffId || (!acc.staffId && acc.name && acc.name.split('(')[0].trim().toLowerCase() === s.name.trim().toLowerCase()));
                    
                    let totalEarned = 0, totalWorkedDays = 0, totalAdvance = 0, totalExtra = 0;
                    let workedSitesSet = new Set(), logsHtml = '';

                    staffLogs.forEach(log => {
                        const displayDateStr = `${log.date} (${getMalayalamDay(log.date)})`;
                        if (log.type === "wage") {
                            totalEarned += parseFloat(log.amount) || 0;
                            totalWorkedDays += parseFloat(log.days) || 1;
                            if (log.site) workedSitesSet.add(log.site);
                            logsHtml += `<div class="flex justify-between items-center text-xs bg-slate-800/80 p-3 rounded-2xl border border-blue-500/20 mb-1.5"><span>📅 ${displayDateStr} | 📍 ${log.site || ''} | <span class="text-amber-400 font-black">₹${log.amount}</span></span><button onclick="deleteLog('${log.id}')" class="text-red-400 font-bold">Del</button></div>`;
                        } else if (log.type === "advance") {
                            totalAdvance += parseFloat(log.amount) || 0;
                            logsHtml += `<div class="flex justify-between items-center text-xs bg-slate-800/80 p-3 rounded-2xl border border-purple-500/20 mb-1.5"><span>📅 ${displayDateStr} (Advance) | <span class="text-purple-300 font-black">₹${log.amount}</span></span><button onclick="deleteLog('${log.id}')" class="text-red-400 font-bold">Del</button></div>`;
                        } else if (log.type === "extra") {
                            totalExtra += parseFloat(log.amount) || 0;
                            logsHtml += `<div class="flex justify-between items-center text-xs bg-slate-800/80 p-3 rounded-2xl border border-rose-500/20 mb-1.5"><span>📅 ${displayDateStr} (Extra) | <span class="text-rose-300 font-black">₹${log.amount}</span></span><button onclick="deleteLog('${log.id}')" class="text-red-400 font-bold">Del</button></div>`;
                        }
                    });

                    let rawBalance = Math.max(0, (totalEarned + totalExtra) - totalAdvance);

                    div.innerHTML = `
                        <div class="flex justify-between items-center mb-3">
                            <div>
                                <h3 class="font-black text-base text-amber-400">${s.name} <span class="text-xs font-normal text-slate-400">(${s.job || ''})</span></h3>
                                <p class="text-xs text-slate-400 font-bold mt-1">സൈറ്റ്: <span class="text-cyan-300">${s.site}</span> | <span class="text-amber-400 text-sm font-black">₹${s.wage || 0}</span></p>
                            </div>
                            <button id="del-${staffId}" class="text-red-400 text-xs font-bold px-3 py-2 bg-red-950/60 border border-red-800/50 rounded-xl">Delete</button>
                        </div>
                        <button id="openModalBtn-${staffId}" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 p-3 rounded-2xl text-xs font-black shadow-lg transition mb-3">➕ ഇന്നത്തെ കൂലി ചേർക്കുക</button>
                        <div class="bg-slate-800/50 border border-blue-500/30 p-3.5 rounded-2xl mb-3 space-y-1 max-h-32 overflow-y-auto">${logsHtml || '<p class="text-xs text-slate-400 text-center">കണക്കുകൾ ഒന്നും ചേർത്തിട്ടില്ല</p>'}</div>
                        <div class="p-4 bg-slate-800/60 rounded-2xl mb-3 flex justify-between items-center border border-slate-700/60">
                            <div class="text-white font-black text-xs">ആകെ കൂലി:<br><span class="text-amber-400 text-base">₹${totalEarned + totalExtra}</span></div>
                            <div class="text-white font-black text-xs text-right">നൽകാനുള്ള ബാക്കി:<br><span class="text-emerald-400 text-lg font-black">₹${rawBalance}</span></div>
                        </div>
                    `;
                    list.appendChild(div);

                    document.getElementById(`openModalBtn-${staffId}`).onclick = () => {
                        document.getElementById('modalStaffId').value = staffId;
                        document.getElementById('modalStaffName').value = s.name;
                        document.getElementById('modalDefaultWage').value = s.wage || 0;
                        document.getElementById('modalSiteName').value = s.site || "";
                        document.getElementById('modalDate').value = getTodayDate();
                        document.getElementById('wageModal').classList.remove('hidden');
                    };

                    document.getElementById(`del-${staffId}`).onclick = async () => {
                        if(confirm("ഡിലീറ്റ് ചെയ്യണമെന്ന് ഉറപ്പാണോ?")) {
                            await deleteDoc(doc(db, 'staffs', staffId));
                            loadStaffAndAccounts();
                        }
                    };
                });
            } catch (err) {
                console.error(err);
                list.innerHTML = `<p class="text-center text-xs text-red-400 font-bold py-4">ഡാറ്റ ലോഡ് ചെയ്യുന്നതിൽ തടസ്സം നേരിട്ടു!</p>`;
            }
        }

        window.closeWageModal = () => document.getElementById('wageModal').classList.add('hidden');
        window.updateModalWage = () => {
            const baseWage = parseFloat(document.getElementById('modalDefaultWage').value) || 0;
            const multiplier = parseFloat(document.getElementById('modalDayAmount').value) || 1;
            document.getElementById('modalWageAmount').value = baseWage * multiplier;
        };

        window.deleteLog = async function(logId) {
            if (confirm("ഈ എൻട്രി ഡിലീറ്റ് ചെയ്യണോ?")) {
                await deleteDoc(doc(db, 'accounts', logId));
                loadStaffAndAccounts();
            }
        };

        document.getElementById('confirmWageBtn').onclick = async () => {
            const staffId = document.getElementById('modalStaffId').value;
            const staffName = document.getElementById('modalStaffName').value;
            await addDoc(collection(db, "accounts"), {
                meshtriOwner: currentMeshtri,
                staffId,
                name: staffName,
                site: document.getElementById('modalSiteName').value.trim() || "സൈറ്റ്",
                type: "wage",
                days: parseFloat(document.getElementById('modalDayAmount').value) || 1,
                amount: parseFloat(document.getElementById('modalWageAmount').value) || 0,
                date: document.getElementById('modalDate').value || getTodayDate()
            });
            closeWageModal();
            loadStaffAndAccounts();
        };
    </script>
</body>
</html>
