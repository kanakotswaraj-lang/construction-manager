<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>നിർമ്മാണ മാനേജർ - ജീവനക്കാരുടെ ശമ്പളം</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-[#0b1329] text-white font-sans min-h-screen p-4">
    <div class="max-w-md mx-auto space-y-4">
        
        <!-- ഹെഡർ ലോഗോ ഭാഗം -->
        <div class="flex flex-col items-center pt-2 pb-2">
            <div class="inline-flex items-center gap-3 px-6 py-2 rounded-full bg-slate-900/90 border border-amber-400/40 shadow-lg shadow-amber-500/10 backdrop-blur-md">
                <img src="Icon.png" alt="Logo" class="w-full h-full object-cover">

                <div class="w-9 h-9 rounded-full overflow-hidden border border-amber-400 flex-shrink-0 bg-amber-400/10 flex items-center justify-center">
                    <span class="text-amber-400 font-bold text-xs">പ്രോ</span>
                </div>
                <div class="flex flex-col text-left">
                    <span class="text-amber-400 font-black text-base tracking-wide leading-tight">മേസ്തിരി പ്രോ</span>
                    <span class="text-[11px] font-bold text-blue-200 tracking-wider uppercase">SMART SITE MANAGER</span>
                </div>
            </div>
        </div>

        <!-- പേജ് തലക്കെട്ടും ഡാഷ്‌ബോർഡ് ബട്ടണും -->
        <div class="bg-slate-900/60 border border-slate-800 p-4 rounded-2xl flex justify-between items-center shadow-xl backdrop-blur-sm">
<div>
                <h1 class="text-lg font-black text-white">ജീവനക്കാരുടെ ശമ്പളം</h1>
                <p class="text-xs text-blue-300">സ്വാഗതം, Swaraj</p>
            </div>
            <a href="dashboard.html" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 border border-amber-400/40 text-amber-400 rounded-xl text-xs font-bold shadow-md transition flex items-center gap-1">
                <span>←</span> ഡാഷ്‌ബോർഡ്
            </a>
        </div>

        
        <div class="bg-white p-6 rounded-3xl shadow-sm border mb-6">
            <h2 class="font-bold text-slate-700 mb-3 text-sm">പുതിയ തൊഴിലാളിയെ ചേർക്കുക</h2>
            <input type="text" id="staffName" placeholder="പേര്" class="w-full p-3 bg-slate-50 rounded-xl border mb-2 text-sm font-bold">
            <input type="text" id="siteName" placeholder="സൈറ്റ് പേര് (കൃത്യമായി നൽകുക)" class="w-full p-3 bg-slate-50 rounded-xl border mb-2 text-sm font-bold">
            <input type="number" id="dailyWage" placeholder="ഒരു ദിവസത്തെ സാധാരണ കൂലി (₹)" class="w-full p-3 bg-slate-50 rounded-xl border mb-2 text-sm font-bold">
            <input type="tel" id="phoneNumber" placeholder="WhatsApp നമ്പർ (91...)" class="w-full p-3 bg-slate-50 rounded-xl border mb-2 text-sm font-bold">
            <input type="text" id="jobType" placeholder="ജോലി (ഉദാ: മേസ്തിരി / പണിക്കാരൻ)" class="w-full p-3 bg-slate-50 rounded-xl border mb-2 text-sm font-bold">
            <input type="text" id="bankDetails" placeholder="ബാങ്ക് / GPay നമ്പർ" class="w-full p-3 bg-slate-50 rounded-xl border mb-3 text-sm font-bold">
            <button id="saveStaffBtn" class="w-full bg-emerald-700 text-white p-3.5 rounded-xl font-black shadow-md text-sm hover:bg-emerald-800 transition">വിവരങ്ങൾ സേവ് ചെയ്യുക</button>
        </div>

        <div class="bg-white p-4 rounded-2xl border shadow-sm mb-4">
            <h3 class="text-xs font-bold text-slate-700 mb-2">📅 കണക്ക് പരിശോധിക്കേണ്ട തീയതി പരിധി (Date Filter):</h3>
            <div class="grid grid-cols-2 gap-2 mb-2">
                <div>
                    <label class="text-[10px] text-slate-500 font-bold">മുതൽ (From):</label>
                    <input type="date" id="filterFromDate" class="w-full p-1.5 border rounded text-xs font-bold bg-slate-50">
                </div>
                <div>
                    <label class="text-[10px] text-slate-500 font-bold">വരെ (To):</label>
                    <input type="date" id="filterToDate" class="w-full p-1.5 border rounded text-xs font-bold bg-slate-50">
                </div>
            </div>
            <button id="applyDateFilter" class="w-full bg-slate-800 text-white p-2 rounded-xl text-xs font-bold shadow-sm">ഈ തീയതിയിലെ കണക്കുകൾ മാത്രം കാണുക</button>
        </div>

        <input type="text" id="searchInput" placeholder="പേര് സെർച്ച് ചെയ്യുക..." class="w-full p-3 bg-white rounded-xl border mb-4 shadow-sm text-sm font-bold">

        <div id="staffList" class="space-y-4 pb-12"></div>
    </div>

    <div id="wageModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex justify-center items-center p-4">
        <div class="bg-white w-full max-w-sm p-6 rounded-3xl shadow-xl border">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalWorkerTitle" class="font-black text-slate-800 text-base">കണക്ക് ചേർക്കുക</h3>
                <button onclick="closeWageModal()" class="text-slate-400 hover:text-slate-700 font-bold text-xl">&times;</button>
            </div>
            
            <input type="hidden" id="modalStaffId">
            <input type="hidden" id="modalStaffName">
            <input type="hidden" id="modalDefaultWage">

            <div class="space-y-3">
                <div>
                    <label class="text-xs font-bold text-slate-600 block mb-1">തീയതി തിരഞ്ഞെടുക്കുക:</label>
                    <input type="date" id="modalDate" class="w-full p-2.5 border rounded-xl text-xs font-bold bg-slate-50 text-slate-800 outline-none">
                </div>

                <div>
                    <label class="text-xs font-bold text-slate-600 block mb-1">ജോലി ചെയ്ത സൈറ്റ്:</label>
                    <input type="text" id="modalSiteName" placeholder="സൈറ്റിന്റെ പേര്" class="w-full p-2.5 border rounded-xl text-xs font-bold bg-slate-50 text-slate-800 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs font-bold text-slate-600 block mb-1">ദിവസത്തിന്റെ അളവ്</label>
                        <select id="modalDayAmount" onchange="updateModalWage()" class="w-full p-2.5 border rounded-xl text-xs font-bold bg-slate-50 text-slate-700 outline-none">
                            <option value="1">ഫുൾ ഡേ (1)</option>
                            <option value="0.5">ഹാഫ് ഡേ (0.5)</option>
                            <option value="1.5">ഓവർടൈം (1.5)</option>
                            <option value="2">ഡബിൾ (2)</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-600 block mb-1">അന്നത്തെ കൂലി (₹)</label>
                        <input type="number" id="modalWageAmount" placeholder="തുക" class="w-full p-2.5 border rounded-xl text-xs font-bold bg-slate-50 text-emerald-700 font-black outline-none">
                    </div>
                </div>

                <button id="confirmWageBtn" class="w-full bg-emerald-600 text-white p-3 rounded-xl text-xs font-black shadow-md hover:bg-emerald-700 transition mt-2">കണക്ക് സേവ് ചെയ്യുക</button>
            </div>
        </div>
    </div>

    <div id="editLogModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex justify-center items-center p-4">
        <div class="bg-white w-full max-w-sm p-6 rounded-3xl shadow-xl border">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-black text-slate-800 text-base">കണക്ക് എഡിറ്റ് ചെയ്യുക</h3>
                <button onclick="closeEditLogModal()" class="text-slate-400 hover:text-slate-700 font-bold text-xl">&times;</button>
            </div>
            
            <input type="hidden" id="editLogId">

            <div class="space-y-3">
                <div>
                    <label class="text-xs font-bold text-slate-600 block mb-1">തീയതി:</label>
                    <input type="date" id="editLogDate" class="w-full p-2.5 border rounded-xl text-xs font-bold bg-slate-50 text-slate-800 outline-none">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-600 block mb-1">സൈറ്റ്:</label>
                    <input type="text" id="editLogSite" class="w-full p-2.5 border rounded-xl text-xs font-bold bg-slate-50 text-slate-800 outline-none">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-600 block mb-1">തുക (₹):</label>
                    <input type="number" id="editLogAmount" class="w-full p-2.5 border rounded-xl text-xs font-bold bg-slate-50 text-emerald-700 font-black outline-none">
                </div>

                <button id="saveEditLogBtn" class="w-full bg-slate-900 text-white p-3 rounded-xl text-xs font-black shadow-md hover:bg-slate-800 transition mt-2">മാറ്റങ്ങൾ സേവ് ചെയ്യുക</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.appspot.com",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d352218"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const currentMeshtri = localStorage.getItem('userName') || "പൊതുമേസ്തിരി";
        document.getElementById('loggedInMeshtri').innerText = "സ്വാഗതം, " + currentMeshtri;

        const getTodayDate = () => new Date().toISOString().split('T')[0];

        document.getElementById('filterFromDate').value = "";
        document.getElementById('filterToDate').value = getTodayDate();

        // പുതിയ തൊഴിലാളിയെ സേവ് ചെയ്യാൻ
        document.getElementById('saveStaffBtn').addEventListener('click', async () => {
            const name = document.getElementById('staffName').value.trim();
            const site = document.getElementById('siteName').value.trim();
            if (!name) return alert("പേര് നൽകുക!");
            if (!site) return alert("സൈറ്റിന്റെ പേര് നൽകുക!");
            
            await addDoc(collection(db, "staffs"), {
                meshtriOwner: currentMeshtri,
                name: name,
                site: site,
                wage: parseFloat(document.getElementById('dailyWage').value) || 0,
                phone: document.getElementById('phoneNumber').value.trim(),
                job: document.getElementById('jobType').value.trim(),
                bank: document.getElementById('bankDetails').value.trim(),
                advance: 0,
                extraPaid: 0,
                lastSettledDate: ""
            });
            alert("വിവരങ്ങൾ വിജയകരമായി സേവ് ആയി!");
            
            document.getElementById('staffName').value = '';
            document.getElementById('siteName').value = '';
            document.getElementById('dailyWage').value = '';
            document.getElementById('phoneNumber').value = '';
            document.getElementById('jobType').value = '';
            document.getElementById('bankDetails').value = '';
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            document.querySelectorAll('#staffList > div').forEach(div => {
                div.style.display = div.innerText.toLowerCase().includes(val) ? '' : 'none';
            });
        });

        // പ്രധാന റെണ്ടറിംഗ് ഫംഗ്ഷൻ
        async function loadStaffAndAccounts() {
            const list = document.getElementById('staffList');
            list.innerHTML = '<p class="text-center text-xs text-slate-500 font-bold">കണക്കുകൾ ലോഡ് ചെയ്യുന്നു...</p>';

            const fromDate = document.getElementById('filterFromDate').value;
            const toDate = document.getElementById('filterToDate').value;

            const accountsQuery = query(collection(db, "accounts"), where("meshtriOwner", "==", currentMeshtri));
            const accountsSnapshot = await getDocs(accountsQuery);
            const allAccounts = [];
            accountsSnapshot.forEach(docSnap => {
                allAccounts.push({ id: docSnap.id, ...docSnap.data() });
            });

            const staffsQuery = query(collection(db, "staffs"), where("meshtriOwner", "==", currentMeshtri));
            const staffsSnapshot = await getDocs(staffsQuery);

            list.innerHTML = '';

            staffsSnapshot.forEach((d) => {
                const s = d.data();
                const div = document.createElement('div');
                div.className = "bg-white p-4 rounded-2xl border shadow-sm mb-4";
                const cleanPhone = s.phone ? s.phone.replace(/\D/g, '') : '';
                const today = getTodayDate();

                const staffLogs = allAccounts.filter(acc => acc.name && acc.name.startsWith(s.name + " ("));
                
                let totalEarned = 0;
                let totalWorkedDays = 0;
                let workedSitesSet = new Set();
                let logsHtml = '';

                staffLogs.forEach(log => {
                    if (log.type === "wage") {
                        if (s.lastSettledDate && log.date <= s.lastSettledDate) {
                            return;
                        }

                        let passDateFilter = true;
                        if (fromDate && log.date < fromDate) passDateFilter = false;
                        if (toDate && log.date > toDate) passDateFilter = false;

                        if (passDateFilter) {
                            totalEarned += parseFloat(log.amount) || 0;
                            const match = log.name.match(/\((?:കൂലി|wage)\s*-\s*([\d.]+)\s*ദിവസം\)/i);
                            if (match) {
                                totalWorkedDays += parseFloat(match[1]) || 0;
                            }
                            if (log.site) {
                                workedSitesSet.add(log.site);
                            }

                            // 🌟 ഇവിടെ ഫോണ്ട് സൈസ് ചെറുതിൽ നിന്ന് വലുതാക്കി (text-xs / font-black ആക്കി) മാറ്റിയിരിക്കുന്നു
                            logsHtml += `
                                <div class="flex justify-between items-center text-xs bg-white p-2.5 rounded-lg border border-slate-200 mb-1.5 shadow-sm">
                                    <span class="font-bold text-slate-800">📅 ${log.date} | 📍 ${log.site || 'സൈറ്റ്'} | <span class="text-emerald-700 font-black">₹${log.amount}</span></span>
                                    <div class="flex gap-1.5">
                                        <button onclick="openEditLog('${log.id}', '${log.date}', '${log.site || ''}', '${log.amount}')" class="text-blue-600 bg-blue-50 px-2 py-1 rounded font-bold hover:bg-blue-100">Edit</button>
                                        <button onclick="deleteLog('${log.id}')" class="text-red-600 bg-red-50 px-2 py-1 rounded font-bold hover:bg-red-100">Del</button>
                                    </div>
                                </div>
                            `;
                        }
                    }
                });

                const workedSitesList = workedSitesSet.size > 0 ? Array.from(workedSitesSet).join(', ') : (s.site || 'പ്രധാന സൈറ്റ്');

                const advance = parseFloat(s.advance) || 0;
                const extraPaid = parseFloat(s.extraPaid) || 0;
                const balanceDue = totalEarned - advance + extraPaid;

                div.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <div>
                            <h3 class="font-black text-base text-slate-800">${s.name} <span class="text-xs font-normal text-slate-500">(${s.job || 'പണിക്കാരൻ'})</span></h3>
                            <p class="text-xs text-slate-500 font-bold">പ്രാഥമിക സൈറ്റ്: <span class="text-blue-600">${s.site || 'പ്രധാന സൈറ്റ്'}</span> | <span class="text-emerald-700 text-sm font-black">കൂലി: ₹${s.wage || 0}</span></p>
                            <p class="text-[11px] text-amber-700 font-bold mt-0.5">📍 പണിയെടുത്ത സൈറ്റുകൾ: ${workedSitesList}</p>
                            ${s.bank ? `<p class="text-[11px] text-slate-500 mt-0.5">GPay/Bank: ${s.bank}</p>` : ''}
                        </div>
                        <button id="del-${d.id}" class="text-red-500 text-xs font-bold px-2 py-1 bg-red-50 rounded">Delete</button>
                    </div>

                    <button id="openModalBtn-${d.id}" class="w-full bg-emerald-600 text-white p-2.5 rounded-xl text-xs font-black shadow-sm hover:bg-emerald-700 transition mb-3">
                        ➕ ദിവസവേദനവും സൈറ്റും ചേർക്കുക (Popup)
                    </button>

                    <div class="bg-slate-100 p-3 rounded-xl mb-3 border">
                        <p class="text-xs font-black text-slate-700 mb-2">📋 ഈ കാലയളവിലെ പണി ദിവസങ്ങൾ:</p>
                        <div class="max-h-40 overflow-y-auto space-y-1">
                            ${logsHtml || '<p class="text-xs text-slate-500 text-center py-2">കണക്കുകൾ ഒന്നും ചേർത്തിട്ടില്ല</p>'}
                        </div>
                    </div>

                    <div class="p-3 bg-slate-50 rounded-xl mb-3 space-y-2 border border-slate-100">
                        <div class="grid grid-cols-3 gap-2">
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 block">പണി ദിവസം</label>
                                <input type="text" readonly value="${totalWorkedDays}" class="w-full p-2 border rounded text-xs font-bold bg-slate-200 text-slate-700 text-center">
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 block">അഡ്വാൻസ് (₹)</label>
                                <input type="number" id="adv-${d.id}" value="${s.advance || 0}" class="w-full p-2 border rounded text-xs font-bold bg-white">
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 block">അധിക തുക (₹)</label>
                                <input type="number" id="extra-${d.id}" value="${s.extraPaid || 0}" placeholder="കൂടുതൽ കൊടുത്തത്" class="w-full p-2 border rounded text-xs font-bold bg-slate-50 text-amber-700">
                            </div>
                        </div>
                        
                        <div class="bg-gradient-to-r from-blue-950 via-slate-900 to-blue-950 border-2 border-amber-400/60 p-4 rounded-2xl flex justify-between items-center shadow-xl">
    <div class="text-white font-black text-sm">
        ആകെ കൂലി:<br>
        <span class="text-amber-400 text-lg">₹2200</span>
    </div>
    <div class="h-10 w-[1px] bg-blue-500/30"></div>
    <div class="text-white font-black text-sm text-right">
        ബാക്കി കൊടുക്കാനുള്ളത്:<br>
        <span class="text-emerald-400 text-lg">₹1700</span>
    </div>
</div>



                       <button class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-black p-4 rounded-2xl shadow-lg border border-blue-400/30 transition">
    അഡ്വാൻസ് / അധിക തുക മാറ്റങ്ങൾ സേവ് ചെയ്യുക
</button>
 
                        <button id="settleBtn-${d.id}" class="w-full bg-purple-600 text-white mt-2 p-2.5 rounded-xl text-xs font-black shadow-sm hover:bg-purple-700 transition">
                            💸 പണം കൊടുത്തു തീർത്തു (Reset / പുതിയ സൈക്കിൾ തുടങ്ങുക)
                        </button>
                    </div>

                    <div class="flex gap-2">
                        <button id="edit-${d.id}" class="flex-1 bg-amber-100 p-2.5 rounded-xl text-xs font-bold text-amber-800 hover:bg-amber-200">Edit Details</button>
                        <a href="https://wa.me/${cleanPhone}?text=നമസ്കാരം ${s.name},%0Aകണക്ക് വിവരങ്ങൾ:%0A- പണിയെടുത്ത ദിവസം: ${totalWorkedDays}%0A- ആകെ കൂലി: ₹${totalEarned}%0A- അഡ്വാൻസ്: ₹${advance}%0A- അധികം കൊടുത്തത്: ₹${extraPaid}%0A- ഇനി കിട്ടാനുള്ള ബാക്കി തുക: ₹${balanceDue}%0A- ജോലി ചെയ്ത സൈറ്റുകൾ: ${workedSitesList}" target="_blank" class="flex-1 bg-emerald-600 text-white p-2.5 text-center rounded-xl text-xs font-black shadow-sm hover:bg-emerald-700">WhatsApp അയക്കുക</a>
                    </div>
                `;
                list.appendChild(div);

                document.getElementById(`openModalBtn-${d.id}`).onclick = () => {
                    document.getElementById('modalStaffId').value = d.id;
                    document.getElementById('modalStaffName').value = s.name;
                    document.getElementById('modalDefaultWage').value = s.wage || 0;
                    document.getElementById('modalWorkerTitle').innerText = `${s.name} - കണക്ക് ചേർക്കുക`;
                    document.getElementById('modalDate').value = today;
                    document.getElementById('modalSiteName').value = s.site || "";
                    document.getElementById('modalDayAmount').value = "1";
                    document.getElementById('modalWageAmount').value = s.wage || 0;

                    document.getElementById('wageModal').classList.remove('hidden');
                };

                document.getElementById(`settleBtn-${d.id}`).onclick = async () => {
                    if (confirm(`തീർച്ചയായും ${s.name}-നുള്ള മുഴുവൻ പണവും കൊടുത്തുതീർത്തു എന്ന് ഉറപ്പാണോ?\n(ഇത് ചെയ്യുമ്പോൾ ഇന്നുവരെയുള്ള കണക്കുകൾ ക്ലിയർ ആയി പണിദിവസങ്ങൾ പൂജ്യത്തിൽ നിന്ന് വീണ്ടും തുടങ്ങും)`)) {
                        await updateDoc(doc(db, 'staffs', d.id), {
                            lastSettledDate: today,
                            advance: 0,
                            extraPaid: 0
                        });
                        alert("സെറ്റിൽമെന്റ് വിജയകരമായി പൂർത്തിയായി! പുതിയ പണിദിവസങ്ങൾ ഇനിമുതൽ ആദ്യ മുതൽ തുടങ്ങും.");
                        loadStaffAndAccounts();
                    }
                };

                document.getElementById(`saveAdv-${d.id}`).onclick = async () => {
                    const newAdv = parseFloat(document.getElementById(`adv-${d.id}`).value) || 0;
                    const newExtra = parseFloat(document.getElementById(`extra-${d.id}`).value) || 0;
                    await updateDoc(doc(db, 'staffs', d.id), {
                        advance: newAdv,
                        extraPaid: newExtra
                    });
                    alert("മാറ്റങ്ങൾ വിജയകരമായി സേവ് ചെയ്തു!");
                    loadStaffAndAccounts();
                };

                document.getElementById(`del-${d.id}`).onclick = () => {
                    if(confirm("ഈ തൊഴിലാളിയെ ഡിലീറ്റ് ചെയ്യണമെന്ന് ഉറപ്പാണോ?")) {
                        deleteDoc(doc(db, 'staffs', d.id));
                        loadStaffAndAccounts();
                    }
                };
                
                document.getElementById(`edit-${d.id}`).onclick = () => {
                    const newName = prompt("പേര് മാറ്റുക:", s.name);
                    if(newName === null) return;
                    const newWage = prompt("സാധാരണ കൂലി:", s.wage);
                    if(newWage === null) return;
                    const newSite = prompt("സൈറ്റ് മാറ്റുക:", s.site);
                    if(newSite === null) return;
                    const newBank = prompt("ബാങ്ക് / GPay നമ്പർ:", s.bank);
                    if(newBank === null) return;

                    updateDoc(doc(db, 'staffs', d.id), { 
                        name: newName, 
                        wage: parseFloat(newWage) || 0,
                        site: newSite,
                        bank: newBank
                    });
                    loadStaffAndAccounts();
                };
            });
        }

        window.openEditLog = function(logId, date, site, amount) {
            document.getElementById('editLogId').value = logId;
            document.getElementById('editLogDate').value = date;
            document.getElementById('editLogSite').value = site;
            document.getElementById('editLogAmount').value = amount;
            document.getElementById('editLogModal').classList.remove('hidden');
        }

        window.closeEditLogModal = function() {
            document.getElementById('editLogModal').classList.add('hidden');
        }

        window.deleteLog = async function(logId) {
            if (confirm("ഈ ദിവസത്തെ കണക്ക് ഡിലീറ്റ് ചെയ്യണമെന്ന് ഉറപ്പാണോ?")) {
                await deleteDoc(doc(db, 'accounts', logId));
                alert("കണക്ക് ഡിലീറ്റ് ചെയ്തു!");
                loadStaffAndAccounts();
            }
        }

        document.getElementById('saveEditLogBtn').onclick = async () => {
            const logId = document.getElementById('editLogId.value') || document.getElementById('editLogId').value;
            const newDate = document.getElementById('editLogDate').value;
            const newSite = document.getElementById('editLogSite').value.trim();
            const newAmount = parseFloat(document.getElementById('editLogAmount').value) || 0;

            if (!newDate || newAmount <= 0) {
                return alert("ശരിയായ തീയതിയും തുകയും നൽകുക!");
            }

            await updateDoc(doc(db, 'accounts', logId), {
                date: newDate,
                site: newSite,
                amount: newAmount
            });

            alert("കണക്ക് വിജയകരമായി എഡിറ്റ് ചെയ്ത് സേവ് ചെയ്തു!");
            closeEditLogModal();
            loadStaffAndAccounts();
        };

        window.updateModalWage = function() {
            const baseWage = parseFloat(document.getElementById('modalDefaultWage').value) || 0;
            const multiplier = parseFloat(document.getElementById('modalDayAmount').value) || 1;
            document.getElementById('modalWageAmount').value = baseWage * multiplier;
        }

        window.closeWageModal = function() {
            document.getElementById('wageModal').classList.add('hidden');
        }

        document.getElementById('confirmWageBtn').onclick = async () => {
            const staffName = document.getElementById('modalStaffName').value;
            const selectedDate = document.getElementById('modalDate').value || getTodayDate();
            const siteName = document.getElementById('modalSiteName').value.trim() || "പ്രധാന സൈറ്റ്";
            const addedDays = parseFloat(document.getElementById('modalDayAmount').value) || 1;
            const addedMoney = parseFloat(document.getElementById('modalWageAmount').value) || 0;

            if (addedMoney <= 0) return alert("ദയവായി ശരിയായ തുക നൽകുക!");
            if (!siteName) return alert("ദയവായി സൈറ്റിന്റെ പേര് നൽകുക!");

            await addDoc(collection(db, "accounts"), {
                meshtriOwner: currentMeshtri,
                name: staffName + ` (കൂലി - ${addedDays} ദിവസം)`,
                site: siteName,
                type: "wage",
                payment: "cash",
                amount: addedMoney,
                date: selectedDate
            });

            alert(`${selectedDate} തീയതിയിലെ (${siteName}) ₹${addedMoney} കൂലി കണക്ക് വിജയകരമായി ചേർത്തു!`);
            closeWageModal();
            loadStaffAndAccounts();
        };

        document.getElementById('applyDateFilter').addEventListener('click', () => {
            loadStaffAndAccounts();
        });

        loadStaffAndAccounts();
    </script>
</body>
</html>
