<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>നിർമ്മാണ മാനേജർ - ജീവനക്കാരുടെ ശമ്പളം</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Manjari', sans-serif; }
    </style>
</head>
<body class="p-4 bg-slate-100 font-sans">
    <div class="max-w-md mx-auto">
        
        <!-- ഹെഡർ -->
        <div class="bg-slate-900 p-4 rounded-2xl text-white mb-6 flex justify-between items-center shadow-lg">
            <div>
                <h1 class="text-xl font-black">ജീവനക്കാരുടെ ശമ്പളം</h1>
                <p id="loggedInMeshtri" class="text-xs text-blue-400 font-bold mt-1">മേസ്തിരി: ലോഡിങ്...</p>
            </div>
            <a href="dashboard.html" class="bg-slate-800 text-xs px-3 py-2 rounded-xl text-slate-300 font-bold hover:bg-slate-700">ഡാഷ്‌ബോർഡ്</a>
        </div>
        
        <!-- പുതിയ തൊഴിലാളിയെ ചേർക്കാനുള്ള ഫോം -->
        <div class="bg-white p-6 rounded-3xl shadow-sm border mb-6">
            <h2 class="font-bold text-slate-700 mb-3 text-sm">പുതിയ തൊഴിലാളിയെ ചേർക്കുക</h2>
            <input type="text" id="staffName" placeholder="പേര്" class="w-full p-3 bg-slate-50 rounded-xl border mb-2 text-sm font-bold">
            <input type="text" id="siteName" placeholder="സൈറ്റ് പേര് (കൃത്യമായി നൽകുക)" class="w-full p-3 bg-slate-50 rounded-xl border mb-2 text-sm font-bold">
            <input type="number" id="dailyWage" placeholder="ഒരു ദിവസത്തെ സാധാരണ കൂലി (₹)" class="w-full p-3 bg-slate-50 rounded-xl border mb-2 text-sm font-bold">
            <input type="tel" id="phoneNumber" placeholder="WhatsApp നമ്പർ (91...)" class="w-full p-3 bg-slate-50 rounded-xl border mb-2 text-sm font-bold">
            <input type="text" id="jobType" placeholder="ജോലി (ഉദാ: മേസ്തിരി / പണിക്കാരൻ)" class="w-full p-3 bg-slate-50 rounded-xl border mb-2 text-sm font-bold">
            <input type="text" id="bankDetails" placeholder="ബാങ്ക് / GPay നമ്പർ" class="w-full p-3 bg-slate-50 rounded-xl border mb-3 text-sm font-bold">
            <button id="saveStaffBtn" class="w-full bg-emerald-700 text-white p-3.5 rounded-xl font-black shadow-md text-sm hover:bg-emerald-800 transition">വിവരങ്ങൾ സേവ് ചെയ്യുക</button>
        </div>

        <!-- തീയതി പരിശോധനയ്ക്കുള്ള (Date Range Filter) ഗ്ലോബൽ ബോക്സ് -->
        <div class="bg-white p-4 rounded-2xl border shadow-sm mb-4">
            <h3 class="text-xs font-bold text-slate-700 mb-2">📅 കണക്ക് പരിശോധിക്കേണ്ട തീയതി പരിധി (Date Filter):</h3>
            <div class="grid grid-cols-2 gap-2 mb-2">
                <div>
                    <label class="text-[10px] text-slate-500 font-bold">മുതൽ (From):</label>
                    <input type="date" id="filterFromDate" class="w-full p-1.5 border rounded text-xs font-bold bg-slate-50">
                </div>
                <div>
                    <label class="text-[10px] text-slate-500 font-bold">വരെ (To):</label>
                    <input type="date" id="filterToDate" class="w-full p-1.5 border rounded text-xs font-bold bg-slate-50">
                </div>
            </div>
            <button id="applyDateFilter" class="w-full bg-slate-800 text-white p-2 rounded-xl text-xs font-bold shadow-sm">ഈ തീയതിയിലെ കണക്കുകൾ മാത്രം കാണുക</button>
        </div>

        <!-- സെർച്ച് ബാർ -->
        <input type="text" id="searchInput" placeholder="പേര് സെർച്ച് ചെയ്യുക..." class="w-full p-3 bg-white rounded-xl border mb-4 shadow-sm text-sm font-bold">

        <div id="staffList" class="space-y-4 pb-12"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.appspot.com",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d352218"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const currentMeshtri = localStorage.getItem('userName') || "പൊതുമേസ്തിരി";
        document.getElementById('loggedInMeshtri').innerText = "സ്വാഗതം, " + currentMeshtri;

        const getTodayDate = () => new Date().toISOString().split('T')[0];

        // ഡിഫോൾട്ട് ആയി ഇന്നത്തെ തീയതി ഫിൽട്ടറിൽ സെറ്റ് ചെയ്യാം (ആവശ്യമെങ്കിൽ മാറ്റാം)
        document.getElementById('filterFromDate').value = "";
        document.getElementById('filterToDate').value = getTodayDate();

        // പുതിയ തൊഴിലാളിയെ സേവ് ചെയ്യാൻ
        document.getElementById('saveStaffBtn').addEventListener('click', async () => {
            const name = document.getElementById('staffName').value.trim();
            const site = document.getElementById('siteName').value.trim();
            if (!name) return alert("പേര് നൽകുക!");
            if (!site) return alert("സൈറ്റിന്റെ പേര് നൽകുക!");
            
            await addDoc(collection(db, "staffs"), {
                meshtriOwner: currentMeshtri,
                name: name,
                site: site,
                wage: parseFloat(document.getElementById('dailyWage').value) || 0,
                phone: document.getElementById('phoneNumber').value.trim(),
                job: document.getElementById('jobType').value.trim(),
                bank: document.getElementById('bankDetails').value.trim(),
                advance: 0
            });
            alert("വിവരങ്ങൾ വിജയകരമായി സേവ് ആയി!");
            
            document.getElementById('staffName').value = '';
            document.getElementById('siteName').value = '';
            document.getElementById('dailyWage').value = '';
            document.getElementById('phoneNumber').value = '';
            document.getElementById('jobType').value = '';
            document.getElementById('bankDetails').value = '';
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            document.querySelectorAll('#staffList > div').forEach(div => {
                div.style.display = div.innerText.toLowerCase().includes(val) ? '' : 'none';
            });
        });

        // പ്രധാന റെണ്ടറിംഗ് ഫംഗ്ഷൻ (തീയതി ഫിൽട്ടർ സപ്പോർട്ട് ചെയ്യുന്ന രീതിയിൽ)
        async function loadStaffAndAccounts() {
            const list = document.getElementById('staffList');
            list.innerHTML = '<p class="text-center text-xs text-slate-500 font-bold">കണക്കുകൾ ലോഡ് ചെയ്യുന്നു...</p>';

            const fromDate = document.getElementById('filterFromDate').value;
            const toDate = document.getElementById('filterToDate').value;

            // ഫയർസ്റ്റോറിൽ നിന്ന് അക്കൗണ്ട്സ് എടുക്കുന്നു
            const accountsQuery = query(collection(db, "accounts"), where("meshtriOwner", "==", currentMeshtri));
            const accountsSnapshot = await getDocs(accountsQuery);
            const allAccounts = [];
            accountsSnapshot.forEach(docSnap => {
                allAccounts.push({ id: docSnap.id, ...docSnap.data() });
            });

            // ഫയർസ്റ്റോറിൽ നിന്ന് സ്റ്റാഫ് ലിസ്റ്റ് എടുക്കുന്നു
            const staffsQuery = query(collection(db, "staffs"), where("meshtriOwner", "==", currentMeshtri));
            const staffsSnapshot = await getDocs(staffsQuery);

            list.innerHTML = '';

            staffsSnapshot.forEach((d) => {
                const s = d.data();
                const div = document.createElement('div');
                div.className = "bg-white p-4 rounded-2xl border shadow-sm mb-4";
                const cleanPhone = s.phone ? s.phone.replace(/\D/g, '') : '';
                const today = getTodayDate();

                // ഈ തൊഴിലാളിയുടെ ലോഗുകൾ മാത്രം എടുക്കുന്നു
                const staffLogs = allAccounts.filter(acc => acc.name && acc.name.startsWith(s.name + " ("));
                
                let totalEarned = 0;
                let totalWorkedDays = 0;

                staffLogs.forEach(log => {
                    if (log.type === "wage") {
                        // ഫിൽട്ടർ പരിശോധന: തീയതി പരിധിക്കുള്ളിൽ ഉള്ളതാണോ എന്ന് നോക്കുന്നു
                        let passDateFilter = true;
                        if (fromDate && log.date < fromDate) passDateFilter = false;
                        if (toDate && log.date > toDate) passDateFilter = false;

                        if (passDateFilter) {
                            totalEarned += parseFloat(log.amount) || 0;
                            const match = log.name.match(/\((?:കൂലി|wage)\s*-\s*([\d.]+)\s*ദിവസം\)/i);
                            if (match) {
                                totalWorkedDays += parseFloat(match[1]) || 0;
                            }
                        }
                    }
                });

                const advance = parseFloat(s.advance) || 0;
                const balanceDue = totalEarned - advance;

                div.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <div>
                            <h3 class="font-black text-base text-slate-800">${s.name} <span class="text-xs font-normal text-slate-500">(${s.job || 'പണിക്കാരൻ'})</span></h3>
                            <p class="text-xs text-slate-500 font-bold">സൈറ്റ്: <span class="text-blue-600">${s.site || 'പ്രധാന സൈറ്റ്'}</span> | <span class="text-emerald-700 text-sm font-black">സാധാരണ കൂലി: ₹${s.wage || 0}</span></p>
                            ${s.bank ? `<p class="text-[11px] text-slate-500 mt-0.5">GPay/Bank: ${s.bank}</p>` : ''}
                        </div>
                        <button id="del-${d.id}" class="text-red-500 text-xs font-bold px-2 py-1 bg-red-50 rounded">Delete</button>
                    </div>

                    <!-- തീയതിയും ഹാജറും കസ്റ്റം കൂലിയും ചേർക്കുന്ന ബോക്സ് (പഴയ തീയതി ഉൾപ്പെടുത്താൻ കഴിയും) -->
                    <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-100 mb-3 space-y-2">
                        <div class="flex justify-between items-center">
                            <label class="text-xs font-bold text-emerald-900">ഹാജർ/പണി ചെയ്ത തീയതി:</label>
                            <input type="date" id="date-${d.id}" value="${today}" class="p-1.5 border rounded text-xs font-bold bg-white text-emerald-900 outline-none">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 block mb-1">ദിവസത്തിന്റെ അളവ്</label>
                                <select id="dayAmount-${d.id}" class="w-full p-2 border rounded text-xs font-bold bg-white text-slate-700 outline-none">
                                    <option value="1">ഫുൾ ഡേ (1)</option>
                                    <option value="0.5">ഹാഫ് ഡേ (0.5)</option>
                                    <option value="1.5">ഓവർടൈം (1.5)</option>
                                    <option value="2">ഡബിൾ (2)</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 block mb-1">അന്നത്തെ തുക നേരിട്ട് (₹)</label>
                                <input type="number" id="customWage-${d.id}" value="${s.wage || 0}" placeholder="തുക" class="w-full p-2 border rounded text-xs font-bold bg-white text-emerald-700 font-black outline-none">
                            </div>
                        </div>
                        <button id="addDayBtn-${d.id}" class="w-full bg-emerald-600 text-white p-2.5 rounded-xl text-xs font-black shadow-sm hover:bg-emerald-700 transition">ഈ ദിവസത്തെ കൂലി ചേർക്കുക</button>
                    </div>

                    <!-- തിരഞ്ഞെടുത്ത തീയതിയിലെ കണക്കുകളുടെ സംഗ്രഹം -->
                    <div class="p-3 bg-slate-50 rounded-xl mb-3 space-y-2 border border-slate-100">
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 block">പണിയെടുത്ത ദിവസം (Filter പ്രകാരം)</label>
                                <input type="text" readonly value="${totalWorkedDays} ദിവസം" class="w-full p-2 border rounded text-sm font-bold bg-slate-200 text-slate-700">
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 block">വാങ്ങിയ അഡ്വാൻസ് (₹)</label>
                                <input type="number" id="adv-${d.id}" value="${s.advance || 0}" class="w-full p-2 border rounded text-sm font-bold bg-white">
                            </div>
                        </div>
                        
                        <div class="text-xs font-bold text-slate-700 pt-1 flex justify-between bg-blue-50 p-2 rounded-lg">
                            <span>ആകെ കൂലി: ₹${totalEarned}</span>
                            <span class="text-emerald-700 font-black">ബാക്കി കൊടുക്കാനുള്ളത്: ₹${balanceDue}</span>
                        </div>

                        <button id="saveAdv-${d.id}" class="w-full bg-slate-900 text-white mt-1 p-2.5 rounded-xl text-xs font-bold shadow-sm hover:bg-slate-800 transition">അഡ്വാൻസ് മാറ്റങ്ങൾ സേവ് ചെയ്യുക</button>
                    </div>

                    <div class="flex gap-2">
                        <button id="edit-${d.id}" class="flex-1 bg-amber-100 p-2.5 rounded-xl text-xs font-bold text-amber-800 hover:bg-amber-200">Edit Details</button>
                        <a href="https://wa.me/${cleanPhone}?text=നമസ്കാരം ${s.name},%0Aകണക്ക് വിവരങ്ങൾ:%0A- ആകെ പണിയെടുത്ത ദിവസം: ${totalWorkedDays}%0A- ആകെ കൂലി: ₹${totalEarned}%0A- അഡ്വാൻസ്: ₹${advance}%0A- ഇനി കിട്ടാനുള്ള ബാക്കി തുക: ₹${balanceDue}%0A- ബാങ്ക്/GPay: ${s.bank || 'ഇല്ല'}" target="_blank" class="flex-1 bg-emerald-600 text-white p-2.5 text-center rounded-xl text-xs font-black shadow-sm hover:bg-emerald-700">WhatsApp അയക്കുക</a>
                    </div>
                `;
                list.appendChild(div);

                // ഡേറ്റ് വെച്ച് കൂലി ചേർക്കുമ്പോൾ
                document.getElementById(`addDayBtn-${d.id}`).onclick = async () => {
                    const selectedDate = document.getElementById(`date-${d.id}`).value || today;
                    const addedDays = parseFloat(document.getElementById(`dayAmount-${d.id}`).value) || 1;
                    const addedMoney = parseFloat(document.getElementById(`customWage-${d.id}`).value) || 0;

                    if (addedMoney <= 0) {
                        return alert("ദയവായി ശരിയായ തുക നൽകുക!");
                    }

                    const siteName = s.site || "പ്രധാന സൈറ്റ്";

                    await addDoc(collection(db, "accounts"), {
                        meshtriOwner: currentMeshtri,
                        name: s.name + ` (കൂലി - ${addedDays} ദിവസം)`,
                        site: siteName,
                        type: "wage",
                        payment: "cash",
                        amount: addedMoney,
                        date: selectedDate
                    });

                    alert(`${selectedDate} തീയതിയിലെ ₹${addedMoney} കൂലി കണക്ക് വിജയകരമായി ചേർത്തു!`);
                    loadStaffAndAccounts(); // ലിസ്റ്റ് റിഫ്രഷ് ചെയ്യുന്നു
                };

                document.getElementById(`saveAdv-${d.id}`).onclick = async () => {
                    const newAdv = parseFloat(document.getElementById(`adv-${d.id}`).value) || 0;
                    await updateDoc(doc(db, 'staffs', d.id), {
                        advance: newAdv
                    });
                    alert("അഡ്വാൻസ് വിവരങ്ങൾ സേവ് ചെയ്തു!");
                    loadStaffAndAccounts();
                };

                document.getElementById(`del-${d.id}`).onclick = () => {
                    if(confirm("ഈ തൊഴിലാളിയെ ഡിലീറ്റ് ചെയ്യണമെന്ന് ഉറപ്പാണോ?")) {
                        deleteDoc(doc(db, 'staffs', d.id));
                        loadStaffAndAccounts();
                    }
                };
                
                document.getElementById(`edit-${d.id}`).onclick = () => {
                    const newName = prompt("പേര് മാറ്റുക:", s.name);
                    if(newName === null) return;
                    const newWage = prompt("സാധാരണ കൂലി:", s.wage);
                    if(newWage === null) return;
                    const newSite = prompt("സൈറ്റ് മാറ്റുക:", s.site);
                    if(newSite === null) return;
                    const newBank = prompt("ബാങ്ക് / GPay നമ്പർ:", s.bank);
                    if(newBank === null) return;

                    updateDoc(doc(db, 'staffs', d.id), { 
                        name: newName, 
                        wage: parseFloat(newWage) || 0,
                        site: newSite,
                        bank: newBank
                    });
                    loadStaffAndAccounts();
                };
            });
        }

        // ഫിൽട്ടർ ബട്ടൺ അമർത്തുമ്പോൾ കണക്കുകൾ അപ്ഡേറ്റ് ആവാൻ
        document.getElementById('applyDateFilter').addEventListener('click', () => {
            loadStaffAndAccounts();
        });

        // പേജ് ലോഡ് ചെയ്യുമ്പോൾ ഡാറ്റ വിളിക്കുന്നു
        loadStaffAndAccounts();
    </script>
</body>
</html>
