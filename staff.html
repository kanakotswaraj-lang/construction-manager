<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Manjari', sans-serif; }
    </style>
    <title>തൊഴിലാളികളുടെ കണക്കുകൾ</title>
</head>
<body class="bg-[#050B18] text-white font-sans min-h-screen p-4">
    <div class="max-w-md mx-auto space-y-4">
        
        <!-- ലോഗോയും ഹെഡറും -->
        <div class="flex flex-col items-center pt-2 pb-2">
            <div class="inline-flex items-center gap-3 px-5 py-2.5 rounded-full bg-slate-900/90 border border-amber-400/50 shadow-lg shadow-amber-500/20 backdrop-blur-md">
                <div class="w-9 h-9 rounded-full overflow-hidden border border-amber-400 flex-shrink-0 bg-amber-400/10 flex items-center justify-center">
                    <img src="icon.png" alt="Logo" class="w-full h-full object-cover">
                </div>
                <div class="flex flex-col text-left">
                    <span class="text-amber-400 font-black text-sm tracking-wide leading-tight">മേസ്തിരി പ്രോ</span>
                    <span class="text-[10px] font-bold text-blue-200 tracking-wider uppercase">SMART SITE MANAGER</span>
                </div>
            </div>
            <div class="mt-3 text-center">
                <span id="loggedInMeshtri" class="text-sm font-black tracking-wide text-cyan-300 bg-cyan-500/15 px-4 py-1.5 rounded-full border border-cyan-400/40 shadow-lg">
                    സ്വാഗതം, ലോഡിങ്...
                </span>
            </div>
        </div>

        <!-- ഹെഡർ & ഡാഷ്‌ബോർഡ് ബട്ടൺ -->
        <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl flex justify-between items-center shadow-xl backdrop-blur-sm mb-4">
            <div>
                <h1 class="text-lg font-black text-white">തൊഴിലാളികളുടെ കണക്കുകൾ</h1>
            </div>
            <a href="dashboard.html" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 border border-amber-400/40 text-amber-400 rounded-xl text-xs font-bold shadow-md transition flex items-center gap-1">
                <span>←</span> ഡാഷ്‌ബോർഡ്
            </a>
        </div>

        <!-- സെർച്ച് & പുതിയ തൊഴിലാളി ചേർക്കൽ ബട്ടൺ -->
        <div class="space-y-3 mb-6">
            <input type="text" id="searchInput" placeholder="🔍 തൊഴിലാളിയെ തിരയുക..." class="w-full p-3.5 bg-slate-900/90 text-white placeholder-slate-400 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400 shadow-lg text-xs">
            <button onclick="document.getElementById('addStaffModal').classList.remove('hidden')" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 p-3.5 rounded-2xl font-black shadow-lg transition text-xs flex items-center justify-center gap-2">
                <span>➕</span> പുതിയ തൊഴിലാളിയെ ചേർക്കുക
            </button>
        </div>

        <!-- തൊഴിലാളികളുടെ ലിസ്റ്റ് കാണുന്ന സെക്ഷൻ -->
        <section id="staffList" class="space-y-4 pb-12">
            <!-- ഡാറ്റ ഇവിടെ ലോഡ് ചെയ്യപ്പെടും -->
        </section>
    </div>

    <!-- പുതിയ തൊഴിലാളിയെ ചേർക്കാനുള്ള മോഡൽ -->
    <div id="addStaffModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl w-full max-w-sm space-y-4 shadow-2xl">
            <h2 class="font-black text-amber-400 text-sm">പുതിയ തൊഴിലാളിയെ ചേർക്കുക</h2>
            <input type="text" id="staffName" placeholder="തൊഴിലാളിയുടെ പേര്" class="w-full p-3 bg-slate-800 text-white placeholder-slate-400 rounded-2xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400">
            <input type="text" id="siteName" placeholder="പ്രാഥമിക സൈറ്റിന്റെ പേര്" class="w-full p-3 bg-slate-800 text-white placeholder-slate-400 rounded-2xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400">
            <input type="number" id="dailyWage" placeholder="ദിവസക്കൂലി (₹)" class="w-full p-3 bg-slate-800 text-white placeholder-slate-400 rounded-2xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400">
            <input type="tel" id="phoneNumber" placeholder="ഫോൺ നമ്പർ" class="w-full p-3 bg-slate-800 text-white placeholder-slate-400 rounded-2xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400">
            <input type="text" id="jobType" placeholder="ജോലിയുടെ തരം (ഉദാ: Mason, Helper)" class="w-full p-3 bg-slate-800 text-white placeholder-slate-400 rounded-2xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400">
            <input type="text" id="bankDetails" placeholder="GPay / ബാങ്ക് നമ്പർ" class="w-full p-3 bg-slate-800 text-white placeholder-slate-400 rounded-2xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400">
            
            <div class="flex gap-2 pt-2">
                <button id="saveStaffBtn" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 p-3 rounded-2xl font-black text-xs">സേവ് ചെയ്യുക</button>
                <button onclick="document.getElementById('addStaffModal').classList.add('hidden')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 p-3 rounded-2xl font-black text-xs border border-slate-700">ക്യാൻസൽ</button>
            </div>
        </div>
    </div>

    <!-- ഇന്നത്തെ കൂലി ചേർക്കാനുള്ള മോഡൽ -->
    <div id="wageModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl w-full max-w-sm space-y-4 shadow-2xl">
            <h2 id="modalWorkerTitle" class="font-black text-amber-400 text-sm">ഇന്നത്തെ കൂലി ചേർക്കുക</h2>
            <input type="hidden" id="modalStaffId">
            <input type="hidden" id="modalStaffName">
            <input type="hidden" id="modalDefaultWage">
            
            <div class="space-y-1">
                <label class="text-[10px] font-bold text-slate-400">തീയതി</label>
                <p id="displayTodayText" class="p-3 bg-slate-800 text-cyan-300 rounded-2xl border border-slate-700 text-xs font-bold"></p>
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold text-slate-400">സൈറ്റിന്റെ പേര്</label>
                <input type="text" id="modalSiteName" placeholder="സൈറ്റ് പേര്" class="w-full p-3 bg-slate-800 text-white rounded-2xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400">
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold text-slate-400">പണി ദിവസം (ഉദാ: 1 അല്ലെങ്കിൽ 0.5)</label>
                <input type="number" step="0.5" id="modalDayAmount" value="1" oninput="updateModalWage()" class="w-full p-3 bg-slate-800 text-white rounded-2xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400">
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold text-slate-400">ആകെ തുക (₹)</label>
                <input type="number" id="modalWageAmount" class="w-full p-3 bg-slate-800 text-amber-400 rounded-2xl border border-slate-700 text-xs font-black focus:outline-none focus:border-amber-400">
            </div>

            <div class="flex gap-2 pt-2">
                <button id="confirmWageBtn" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 p-3 rounded-2xl font-black text-xs">കണക്ക് ചേർക്കുക</button>
                <button onclick="closeWageModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 p-3 rounded-2xl font-black text-xs border border-slate-700">ക്യാൻസൽ</button>
            </div>
        </div>
    </div>

    <!-- അഡ്വാൻസ് / പണം നൽകിയ വിവരങ്ങൾ ചേർക്കാനുള്ള മോഡൽ -->
    <div id="advanceModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl w-full max-w-sm space-y-4 shadow-2xl">
            <h2 id="advModalTitle" class="font-black text-amber-400 text-sm">അഡ്വാൻസ് പണം നൽകിയത് ചേർക്കുക</h2>
            <input type="hidden" id="advModalStaffId">
            
            <div class="space-y-1">
                <label class="text-[10px] font-bold text-slate-400">തീയതി</label>
                <input type="date" id="advDate" class="w-full p-3 bg-slate-800 text-white rounded-2xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400">
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold text-slate-400">നൽകിയ തുക (₹)</label>
                <input type="number" id="advAmount" placeholder="തുക നൽകുക" class="w-full p-3 bg-slate-800 text-white rounded-2xl border border-slate-700 text-xs font-black focus:outline-none focus:border-amber-400">
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold text-slate-400">കുറിപ്പ് (ആവശ്യമെങ്കിൽ)</label>
                <input type="text" id="advNote" placeholder="ഉദാ: GPay / നേരിട്ട് കൊടുത്തത്" class="w-full p-3 bg-slate-800 text-white rounded-2xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400">
            </div>

            <div class="flex gap-2 pt-2">
                <button id="confirmAdvBtn" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 p-3 rounded-2xl font-black text-xs">സേവ് ചെയ്യുക</button>
                <button onclick="closeAdvModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 p-3 rounded-2xl font-black text-xs border border-slate-700">ക്യാൻസൽ</button>
            </div>
        </div>
    </div>

    <!-- അധികത്തുക (Extra Payment) ചേർക്കാനുള്ള മോഡൽ -->
    <div id="extraModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl w-full max-w-sm space-y-4 shadow-2xl">
            <h2 id="extraModalTitle" class="font-black text-rose-400 text-sm">അധികത്തുക (Extra) ചേർക്കുക</h2>
            <input type="hidden" id="extraModalStaffId">
            
            <div class="space-y-1">
                <label class="text-[10px] font-bold text-slate-400">തീയതി</label>
                <input type="date" id="extraDate" class="w-full p-3 bg-slate-800 text-white rounded-2xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400">
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold text-slate-400">അധിക തുക (₹)</label>
                <input type="number" id="extraAmount" placeholder="തുക നൽകുക" class="w-full p-3 bg-slate-800 text-white rounded-2xl border border-slate-700 text-xs font-black focus:outline-none focus:border-amber-400">
            </div>

            <div class="space-y-1">
                <label class="text-[10px] font-bold text-slate-400">കുറിപ്പ് (കാരിഓവർ ആവുന്നത്)</label>
                <input type="text" id="extraNote" placeholder="ഉദാ: കൂടുതൽ കൊടുത്തത്" class="w-full p-3 bg-slate-800 text-white rounded-2xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400">
            </div>

            <div class="flex gap-2 pt-2">
                <button id="confirmExtraBtn" class="flex-1 bg-rose-500 hover:bg-rose-600 text-slate-950 p-3 rounded-2xl font-black text-xs">സേവ് ചെയ്യുക</button>
                <button onclick="closeExtraModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 p-3 rounded-2xl font-black text-xs border border-slate-700">ക്യാൻസൽ</button>
            </div>
        </div>
    </div>

    <!-- ലോഗ് / കൂലി എഡിറ്റ് ചെയ്യാനുള്ള മോഡൽ -->
    <div id="editLogModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl w-full max-w-sm space-y-4 shadow-2xl">
            <h2 class="font-black text-amber-400 text-sm">കണക്ക് എഡിറ്റ് ചെയ്യുക</h2>
            <input type="hidden" id="editLogId">
            <div class="space-y-1">
                <label class="text-[10px] font-bold text-slate-400">സൈറ്റ് പേര് / കുറിപ്പ്</label>
                <input type="text" id="editLogSite" class="w-full p-3 bg-slate-800 text-white rounded-2xl border border-slate-700 text-xs font-bold">
            </div>
            <div class="space-y-1">
                <label class="text-[10px] font-bold text-slate-400">തുക (₹)</label>
                <input type="number" id="editLogAmount" class="w-full p-3 bg-slate-800 text-white rounded-2xl border border-slate-700 text-xs font-bold">
            </div>
            <div class="flex gap-2 pt-2">
                <button id="saveEditLogBtn" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 p-3 rounded-2xl font-black text-xs">അപ്ഡേറ്റ് ചെയ്യുക</button>
                <button onclick="closeEditLogModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 p-3 rounded-2xl font-black text-xs border border-slate-700">ക്യാൻസൽ</button>
            </div>
        </div>
    </div>

    <!-- അഡ്വാൻസ് / അധികത്തുക എഡിറ്റ് ചെയ്യാനുള്ള മോഡൽ -->
    <div id="editAdvanceModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl w-full max-w-sm space-y-4 shadow-2xl">
            <h2 id="editAdvModalTitle" class="font-black text-amber-400 text-sm">എൻട്രി എഡിറ്റ് ചെയ്യുക</h2>
            <input type="hidden" id="editAdvId">
            <div class="space-y-1">
                <label class="text-[10px] font-bold text-slate-400">തുക (₹)</label>
                <input type="number" id="editAdvAmount" class="w-full p-3 bg-slate-800 text-white rounded-2xl border border-slate-700 text-xs font-bold">
            </div>
            <div class="space-y-1">
                <label class="text-[10px] font-bold text-slate-400">കുറിപ്പ് (Note)</label>
                <input type="text" id="editAdvNote" class="w-full p-3 bg-slate-800 text-white rounded-2xl border border-slate-700 text-xs font-bold">
            </div>
            <div class="flex gap-2 pt-2">
                <button id="saveEditAdvBtn" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 p-3 rounded-2xl font-black text-xs">അപ്ഡേറ്റ് ചെയ്യുക</button>
                <button onclick="closeEditAdvModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 p-3 rounded-2xl font-black text-xs border border-slate-700">ക്യാൻസൽ</button>
            </div>
        </div>
    </div>

    <!-- തൊഴിലാളിയുടെ വിവരങ്ങൾ എഡിറ്റ് ചെയ്യാനുള്ള മോഡൽ -->
    <div id="editStaffModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl w-full max-w-sm space-y-4 shadow-2xl">
            <h2 class="font-black text-amber-400 text-sm">തൊഴിലാളിയുടെ വിവരങ്ങൾ മാറ്റുക</h2>
            <input type="hidden" id="editStaffId">
            <input type="text" id="editStaffName" placeholder="പേര്" class="w-full p-3 bg-slate-800 text-white rounded-2xl border border-slate-700 text-xs font-bold">
            <input type="text" id="editStaffJob" placeholder="ജോലി" class="w-full p-3 bg-slate-800 text-white rounded-2xl border border-slate-700 text-xs font-bold">
            <input type="number" id="editStaffWage" placeholder="ദിവസക്കൂലി" class="w-full p-3 bg-slate-800 text-white rounded-2xl border border-slate-700 text-xs font-bold">
            <input type="text" id="editStaffSite" placeholder="സൈറ്റ്" class="w-full p-3 bg-slate-800 text-white rounded-2xl border border-slate-700 text-xs font-bold">
            <input type="tel" id="editStaffPhone" placeholder="ഫോൺ" class="w-full p-3 bg-slate-800 text-white rounded-2xl border border-slate-700 text-xs font-bold">
            <input type="text" id="editStaffBank" placeholder="GPay/Bank" class="w-full p-3 bg-slate-800 text-white rounded-2xl border border-slate-700 text-xs font-bold">
            <div class="flex gap-2 pt-2">
                <button id="saveEditStaffBtn" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 p-3 rounded-2xl font-black text-xs">സേവ് ചെയ്യുക</button>
                <button onclick="closeEditStaffModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 p-3 rounded-2xl font-black text-xs border border-slate-700">ക്യാൻസൽ</button>
            </div>
        </div>
    </div>

    <!-- ജാവസ്ക്രിപ്റ്റ് ഫയർബേസ് കണക്ഷൻ & ലോജിക് -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.appspot.com",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d352218"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const currentMeshtri = localStorage.getItem('userName') || "പൊതുമേസ്തിരി";
        document.getElementById('loggedInMeshtri').innerText = "സ്വാഗതം, " + currentMeshtri;

        const getTodayDate = () => {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        function getMalayalamDay(dateString) {
            if (!dateString) return "";
            const days = ["ഞായർ", "തിങ്കൾ", "ചൊവ്വ", "ബുധൻ", "വ്യാഴം", "വെള്ളി", "ശനി"];
            const d = new Date(dateString);
            return days[d.getDay()] || "";
        }

        document.getElementById('saveStaffBtn').addEventListener('click', async () => {
            const name = document.getElementById('staffName').value.trim();
            const site = document.getElementById('siteName').value.trim();
            if (!name) return alert("പേര് നൽകുക!");
            if (!site) return alert("സൈറ്റിന്റെ പേര് നൽകുക!");
            
            await addDoc(collection(db, "staffs"), {
                meshtriOwner: currentMeshtri,
                name: name,
                site: site,
                wage: parseFloat(document.getElementById('dailyWage').value) || 0,
                phone: document.getElementById('phoneNumber').value.trim(),

            const newName = document.getElementById('editStaffName').value.trim();
            const newJob = document.getElementById('editStaffJob').value.trim();
            const newWage = parseFloat(document.getElementById('editStaffWage').value) || 0;
            const newSite = document.getElementById('editStaffSite').value.trim();
            const newPhone = document.getElementById('editStaffPhone').value.trim();
            const newBank = document.getElementById('editStaffBank').value.trim();

            if (!newName) return alert("പേര് നൽകുക!");
            if (!newSite) return alert("സൈറ്റിന്റെ പേര് നൽകുക!");

            await updateDoc(doc(db, 'staffs', staffId), {
                name: newName,
                job: newJob,
                wage: newWage,
                site: newSite,
                phone: newPhone,
                bank: newBank
            });

            alert("വിവരങ്ങൾ വിജയകരമായി അപ്ഡേറ്റ് ചെയ്തു!");
            closeEditStaffModal();
            loadStaffAndAccounts();
        };

        window.updateModalWage = function() {
            const baseWage = parseFloat(document.getElementById('modalDefaultWage').value) || 0;
            const multiplier = parseFloat(document.getElementById('modalDayAmount').value) || 1;
            document.getElementById('modalWageAmount').value = baseWage * multiplier;
        }

        window.closeWageModal = function() {
            document.getElementById('wageModal').classList.add('hidden');
        }

        window.closeAdvModal = function() {
            document.getElementById('advanceModal').classList.add('hidden');
        }

        window.closeExtraModal = function() {
            document.getElementById('extraModal').classList.add('hidden');
        }

                document.getElementById('confirmWageBtn').onclick = async () => {
            const staffId = document.getElementById('modalStaffId').value;
            const staffName = document.getElementById('modalStaffName').value;
            const selectedDate = getTodayDate();
            const siteName = document.getElementById('modalSiteName').value.trim() || "പ്രധാന സൈറ്റ്";
            const addedDays = parseFloat(document.getElementById('modalDayAmount').value) || 1;
            const addedMoney = parseFloat(document.getElementById('modalWageAmount').value) || 0;

            if (addedMoney <= 0) return alert("ദയവായി ശരിയായ തുക നൽകുക!");

            await addDoc(collection(db, "accounts"), {
                meshtriOwner: currentMeshtri,
                staffId: staffId,
                name: staffName + ` (കൂലി - ${addedDays} ദിവസം)`,
                site: siteName,
                type: "wage",
                days: addedDays, // ദിവസങ്ങൾ കൃത്യമായി സേവ് ചെയ്യാൻ ഇത് സഹായിക്കും
                payment: "cash",
                amount: addedMoney,
                date: selectedDate
            });

            alert(`ഇന്നത്തെ (${siteName}) ₹${addedMoney} കൂലി കണക്ക് ചേർത്തു!`);
            closeWageModal();
            loadStaffAndAccounts();
        };


        document.getElementById('confirmExtraBtn').onclick = async () => {
            const staffId = document.getElementById('extraModalStaffId').value;
            const extraDate = document.getElementById('extraDate').value;
            const extraAmount = parseFloat(document.getElementById('extraAmount').value) || 0;
            const extraNote = document.getElementById('extraNote').value.trim();

            if (extraAmount <= 0) return alert("ശരിയായ തുക നൽകുക!");
            if (!extraDate) return alert("തീയതി തിരഞ്ഞെടുക്കുക!");

            await addDoc(collection(db, "accounts"), {
                meshtriOwner: currentMeshtri,
                staffId: staffId,
                type: "extra",
                amount: extraAmount,
                date: extraDate,
                note: extraNote
            });

            alert("അധികത്തുക വിജയകരമായി ചേർത്തു!");
            closeExtraModal();
            loadStaffAndAccounts();
        };

        loadStaffAndAccounts();
    </script>
</body>
</html>
