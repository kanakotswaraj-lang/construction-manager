<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>സ്റ്റാഫ് മാനേജ്മെന്റ് - മേസ്തിരി പ്രോ</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Manjari', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-blue-950 to-slate-900 min-h-screen text-white flex flex-col justify-between p-5">

    <!-- ടോപ്പ് ഹെഡർ: ലോഗോയും Smart Site Manager ടാഗും -->
    <div>
        <div class="flex justify-between items-center mb-6 border-b border-blue-500/30 pb-4">
            <a href="dashboard.html" class="bg-slate-900/80 text-blue-300 px-4 py-2 rounded-xl text-sm border border-blue-500/30 font-bold hover:bg-slate-800 transition">
                ← ഡാഷ്‌ബോർഡ്
            </a>
            <div class="inline-flex items-center gap-3 bg-amber-500/20 text-amber-300 px-4 py-2 rounded-full border border-amber-300/50 shadow-md">
                <span class="text-xl">🛠️</span>
                <span class="text-base font-black text-amber-300 tracking-wide">മേസ്തിരി പ്രോ</span>
            </div>
        </div>

        <div class="text-center pt-2">
            <h1 class="text-3xl font-black tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-white via-blue-100 to-amber-400">
                സ്റ്റാഫ് മാനേജ്മെന്റ്
            </h1>
            <p class="text-sm text-blue-200 mt-1 font-bold">പുതിയ തൊഴിലാളികളുടെ വിവരങ്ങൾ ചേർക്കാം</p>
        </div>
    </div>

    <!-- സ്റ്റാഫ് എൻട്രി ഫോം കാർഡ് -->
    <div class="bg-white/5 backdrop-blur-md p-6 rounded-3xl border border-blue-500/30 max-w-md mx-auto w-full my-4 space-y-4 shadow-xl">
        <form id="staffForm" onsubmit="saveStaffData(event)">
            <div class="mb-3">
                <label class="block text-sm font-black text-amber-300 mb-1">തൊഴിലാളിയുടെ പേര്</label>
                <input type="text" id="staffName" required placeholder="പേര് ഇവിടെ എഴുതുക" 
                       class="w-full bg-slate-900/90 border-2 border-blue-500/50 rounded-xl p-3 text-white text-base font-bold focus:outline-none focus:border-amber-400 placeholder:text-slate-400">
            </div>

            <div class="mb-3">
                <label class="block text-sm font-black text-amber-300 mb-1">ഫോൺ നമ്പർ</label>
                <input type="tel" id="staffPhone" placeholder="മൊബൈൽ നമ്പർ" 
                       class="w-full bg-slate-900/90 border-2 border-blue-500/50 rounded-xl p-3 text-white text-base font-bold focus:outline-none focus:border-amber-400 placeholder:text-slate-400">
            </div>

            <div class="mb-4">
                <label class="block text-sm font-black text-amber-300 mb-1">തൊഴിൽ / പണി</label>
                <input type="text" id="staffRole" placeholder="ഉദാ: മേസ്തിരി / ഹെൽപ്പർ" 
                       class="w-full bg-slate-900/90 border-2 border-blue-500/50 rounded-xl p-3 text-white text-base font-bold focus:outline-none focus:border-amber-400 placeholder:text-slate-400">
            </div>

            <button type="submit" id="btnSaveStaff" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 text-center p-3.5 rounded-xl font-black text-base shadow-lg shadow-amber-950/50 transition">
                സ്റ്റാഫിനെ സേവ് ചെയ്യുക
            </button>
        </form>
    </div>

    <!-- നിലവിലെ സ്റ്റാഫ് ലിസ്റ്റ് ബോക്സ് -->
    <div class="bg-white/5 backdrop-blur-md p-5 rounded-3xl border border-blue-500/30 max-w-md mx-auto w-full my-2 shadow-xl">
        <h2 class="text-amber-300 font-black text-base mb-3 border-b border-blue-500/30 pb-2">നിലവിലെ സ്റ്റാഫ് ലിസ്റ്റ്</h2>
        <div id="staffContainer" class="space-y-2 max-h-48 overflow-y-auto text-sm">
            <p class="text-slate-400 text-center py-2 font-bold">ലോഡ് ചെയ്യുന്നു...</p>
        </div>
    </div>

    <!-- ഫൂട്ടർ -->
    <div class="max-w-md mx-auto w-full text-center pb-2">
        <p class="text-xs text-slate-400 font-bold">
            മേസ്തിരിമാർക്കായി നിർമ്മിച്ചത് ❤️ കേരളം
        </p>
    </div>

    <!-- ഫയർബേസ് സ്ക്രിപ്റ്റുകൾ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // സ്റ്റാഫ് ഡാറ്റ ഫയർബേസിലേക്ക് സേവ് ചെയ്യൽ
        window.saveStaffData = async function(event) {
            event.preventDefault();

            const name = document.getElementById('staffName').value.trim();
            const phone = document.getElementById('staffPhone').value.trim();
            const role = document.getElementById('staffRole').value.trim();

            if (!name) {
                return alert("ദയവായി തൊഴിലാളിയുടെ പേര് നൽകുക!");
            }

            try {
                await addDoc(collection(db, "staff"), {
                    name: name,
                    phone: phone,
                    role: role,
                    createdAt: new Date()
                });

                alert("സ്റ്റാഫ് വിവരങ്ങൾ വിജയകരമായി സേവ് ചെയ്തു!");
                document.getElementById('staffForm').reset();
                loadStaffList();

            } catch (error) {
                console.error("പിഴവ്: ", error);
                alert("സേവ് ചെയ്യാൻ കഴിഞ്ഞില്ല. വീണ്ടും ശ്രമിക്കുക!");
            }
        };

        // ഫയർബേസിൽ നിന്ന് സ്റ്റാഫ് ലിസ്റ്റ് എടുത്ത് കാണിക്കൽ
        window.loadStaffList = async function() {
            const container = document.getElementById('staffContainer');
            try {
                const querySnapshot = await getDocs(collection(db, "staff"));
                let html = "";
                querySnapshot.forEach((doc) => {
                    let data = doc.data();
                    html += `
                        <div class="bg-slate-900/80 p-3 rounded-xl border border-blue-500/30 flex justify-between items-center">
                            <div>
                                <span class="text-amber-300 font-black text-base block">${data.name}</span>
                                <span class="text-blue-200 text-xs font-bold">${data.role || 'തൊഴിൽ ഇല്ല'} | ${data.phone || 'നമ്പർ ഇല്ല'}</span>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html || '<p class="text-slate-400 text-center py-2 font-bold">സ്റ്റാഫുകൾ ആരും ലഭ്യമല്ല.</p>';
            } catch (e) {
                console.error(e);
                container.innerHTML = '<p class="text-red-400 text-center py-2 font-bold">ലിസ്റ്റ് ലോഡ് ചെയ്യുന്നതിൽ തടസ്സം നേരിട്ടു.</p>';
            }
        };

        // പേജ് ലോഡ് ആകുമ്പോൾ ലിസ്റ്റ് വിളിക്കുക
        loadStaffList();
    </script>
</body>
</html>
