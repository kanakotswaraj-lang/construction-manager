<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>സൈറ്റ് മാനേജ്മെന്റ് - മേസ്തിരി പ്രോ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #111827;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid #1f2937;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn {
            background: #1e293b;
            color: #38bdf8;
            padding: 8px 15px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid #334155;
        }

        h2, h3 {
            color: #fbbf24;
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: 500;
            color: #94a3b8;
            font-size: 13px;
        }

        .input-group-flex {
            display: flex;
            gap: 6px;
        }

        input[type="text"], input[type="number"], input[type="date"], select {
            width: 100%;
            padding: 10px;
            background: #1f2937;
            border: 1px solid #374151;
            color: #ffffff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        input:focus, select:focus {
            border-color: #fbbf24;
            outline: none;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .expense-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            align-items: center;
        }

        .worker-section, .other-expense-section {
            background: #1f2937;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            border: 1px solid #374151;
        }

        .worker-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            align-items: center;
        }

        .btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000000;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            text-align: center;
        }

        .btn-success {
            background: #059669;
            color: #ffffff;
            width: auto;
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
            padding: 8px 10px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .btn-edit {
            background: #2563eb;
            color: white;
            padding: 8px 10px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .summary-box {
            background: #1f2937;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            border: 1px solid #374151;
            font-size: 14px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .summary-row.total {
            font-weight: bold;
            font-size: 16px;
            border-top: 1px solid #374151;
            padding-top: 6px;
            color: #4ade80;
        }

        .save-btn-container {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <a href="dashboard.html" class="back-btn">← ഡാഷ്‌ബോർഡ്</a>
        <span style="font-size: 14px; color: #94a3b8;">സൈറ്റ് മാനേജ്മെന്റ്</span>
    </div>

    <h2>സൈറ്റ് കണക്ക് എൻട്രി</h2>
    
    <div class="form-group" style="margin-bottom: 15px;">
        <input type="text" id="searchBox" placeholder="🔍 തൊഴിലാളിയുടെ പേരിലോ പണിയിലോ സെർച്ച് ചെയ്യുക..." oninput="filterWorkers()">
    </div>

    <form id="siteForm" onsubmit="saveSiteData(event)">
        <div class="grid-2">
            <div class="form-group">
                <label for="siteName">സൈറ്റിന്റെ പേര്:</label>
                <div class="input-group-flex">
                    <input type="text" id="siteName" required placeholder="സൈറ്റ് പേര്">
                    <button type="button" class="btn-edit" onclick="enableEdit('siteName')" title="എഡിറ്റ്">✏️</button>
                    <button type="button" class="btn-danger" onclick="clearField('siteName')" title="ക്ലിയർ/ഡിലീറ്റ്">X</button>
                </div>
            </div>
            <div class="form-group">
                <label for="payerName">പണം തരുന്നയാൾ (Client):</label>
                <div class="input-group-flex">
                    <input type="text" id="payerName" required placeholder="പേര് നൽകുക">
                    <button type="button" class="btn-edit" onclick="enableEdit('payerName')" title="എഡിറ്റ്">✏️</button>
                    <button type="button" class="btn-danger" onclick="clearField('payerName')" title="ക്ലിയർ/ഡിലീറ്റ്">X</button>
                </div>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="entryDate">തീയതി:</label>
                <input type="date" id="entryDate" required>
            </div>
            <div class="form-group">
                <label for="siteIncome">ലഭിച്ച വരവ് (₹):</label>
                <div class="input-group-flex">
                    <input type="number" id="siteIncome" placeholder="തുക നൽകുക" value="0" oninput="calculateTotal()">
                    <button type="button" class="btn-danger" onclick="clearField('siteIncome'); calculateTotal();" title="ഡിലീറ്റ്">X</button>
                </div>
            </div>
        </div>

        <div class="other-expense-section">
            <h3 style="text-align: left; font-size: 15px; margin-bottom: 10px;">മറ്റു ചെലവുകൾ (വാഹനം, ഭക്ഷണം, മെറ്റീരിയൽ മുതലായവ)</h3>
            <div id="expenseListContainer"></div>
            <button type="button" class="btn-success" onclick="addExpenseRow()">+ ചെലവ് ചേർക്കുക</button>
        </div>

        <div class="worker-section">
            <h3 style="text-align: left; font-size: 15px; margin-bottom: 10px;">തൊഴിലാളികളുടെ വിവരങ്ങൾ</h3>
            <div id="workerListContainer"></div>
            
            <div style="display: flex; gap: 8px; margin-top: 10px;">
                <button type="button" class="btn-success" onclick="addWorkerRow()">+ തൊഴിലാളിയെ ചേർക്കുക</button>
                <a href="staff.html" class="btn-success" style="background: #2563eb; text-decoration: none; text-align: center; display: inline-block; line-height: normal;">+ പുതിയ ആളെ ചേർക്കുക</a>
            </div>
        </div>

        <div class="summary-box">
            <div class="summary-row">
                <span>ആകെ വരവ്:</span>
                <span id="displayIncome" style="color: #38bdf8;">₹ 0</span>
            </div>
            <div class="summary-row">
                <span>ആകെ ചെലവ്:</span>
                <span id="displayExpense" style="color: #f87171;">₹ 0</span>
            </div>
            <div class="summary-row total">
                <span>ബാക്കി തുക / ബാലൻസ്:</span>
                <span id="grandTotal">₹ 0</span>
            </div>
        </div>

        <div class="save-btn-container">
            <button type="submit" class="btn">കണക്ക് സേവ് ചെയ്യുക</button>
        </div>
    </form>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
        authDomain: "mesthri-app.firebaseapp.com",
        projectId: "mesthri-app",
        storageBucket: "mesthri-app.appspot.com",
        messagingSenderId: "1060617901864",
        appId: "1:1060617901864:web:5ffb9378cf36bd6d352218"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const currentMeshtri = localStorage.getItem('userName') || "പൊതുമേസ്തിരി";

    let registeredWorkers = [];

    document.getElementById('entryDate').valueAsDate = new Date();

    async function fetchRegisteredWorkers() {
        try {
            const q = query(collection(db, "staffs"), where("meshtriOwner", "==", currentMeshtri));
            const querySnapshot = await getDocs(q);
            registeredWorkers = [];
            querySnapshot.forEach((docSnap) => {
                registeredWorkers.push({ id: docSnap.id, ...docSnap.data() });
            });
            updateAllDropdowns();
        } catch (e) {
            console.error("സ്റ്റാഫുകളെ എടുക്കുന്നതിൽ പിഴവ്:", e);
        }
    }

    function updateAllDropdowns() {
        const selects = document.querySelectorAll('.worker-select');
        selects.forEach(select => {
            let currentValue = select.value;
            select.innerHTML = `<option value="">തൊഴിലാളി</option>` + 
                registeredWorkers.map(w => `<option value="${w.id}" data-name="${w.name}">${w.name} (${w.job || 'പണിക്കാരൻ'})</option>`).join('');
            select.value = currentValue;
        });
    }

    window.enableEdit = function(fieldId) {
        document.getElementById(fieldId).focus();
    }

    window.clearField = function(fieldId) {
        let field = document.getElementById(fieldId);
        field.value = field.type === 'number' ? '0' : '';
        calculateTotal();
    }

    window.addExpenseRow = function() {
        const container = document.getElementById('expenseListContainer');
        const expId = Date.now();
        const rowHTML = `
            <div class="expense-row" id="exp-${expId}">
                <input type="text" style="flex: 2;" placeholder="ചെലവിന്റെ വിവരം (ഉദാ: വാഹനം, മെറ്റീരിയൽ)" class="expense-desc" required>
                <input type="number" style="flex: 1;" placeholder="തുക" class="expense-amount" value="0" oninput="calculateTotal()" required>
                <button type="button" class="btn-danger" onclick="removeExpenseRow('exp-${expId}')" title="ഡിലീറ്റ്">X</button>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', rowHTML);
    }

    window.removeExpenseRow = function(expId) {
        document.getElementById(expId).remove();
        calculateTotal();
    }

    window.addWorkerRow = function() {
        const container = document.getElementById('workerListContainer');
        const rowId = Date.now();

        const optionsHTML = registeredWorkers.map(w => `<option value="${w.id}" data-name="${w.name}">${w.name} (${w.job || 'പണിക്കാരൻ'})</option>`).join('');

        const rowHTML = `
            <div class="worker-row" id="row-${rowId}" data-worker="">
                <select style="flex: 2;" class="worker-select" onchange="updateRowData(this, '${rowId}')" required>
                    <option value="">തൊഴിലാളി</option>
                    ${optionsHTML}
                </select>
                <input type="text" style="flex: 2;" class="worker-job" placeholder="പണി" oninput="updateRowData(this, '${rowId}')" required>
                <input type="number" style="flex: 1;" placeholder="കൂലി" class="worker-wage" value="0" oninput="calculateTotal()" required>
                <button type="button" class="btn-danger" onclick="removeWorkerRow('row-${rowId}')" title="ഡിലീറ്റ്">X</button>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', rowHTML);
    }

    window.updateRowData = function(element, rowId) {
        let row = document.getElementById(`row-${rowId}`);
        let selectVal = row.querySelector('.worker-select');
        let selectedOption = selectVal.options[selectVal.selectedIndex];
        let workerName = selectedOption ? selectedOption.getAttribute('data-name') : '';
        let jobVal = row.querySelector('.worker-job').value;
        row.setAttribute('data-worker', (workerName + ' ' + jobVal).toLowerCase());
    }

    window.removeWorkerRow = function(rowId) {
        document.getElementById(rowId).remove();
        calculateTotal();
    }

    window.filterWorkers = function() {
        let queryVal = document.getElementById('searchBox').value.toLowerCase();
        let rows = document.querySelectorAll('.worker-row');
        rows.forEach(row => {
            let data = row.getAttribute('data-worker') || '';
            if (data.includes(queryVal)) {
                row.style.display = '';
            } else {
                row.style.display = 'none';
            }
        });
    }

    window.calculateTotal = function() {
        let income = parseFloat(document.getElementById('siteIncome').value) || 0;
        
        let totalOtherExpenses = 0;
        document.querySelectorAll('.expense-amount').forEach(input => {
            totalOtherExpenses += parseFloat(input.value) || 0;
        });

        let totalWages = 0;
        document.querySelectorAll('.worker-wage').forEach(input => {
            totalWages += parseFloat(input.value) || 0;
        });

        let totalExpense = totalOtherExpenses + totalWages;
        let balance = income - totalExpense;

        document.getElementById('displayIncome').innerText = `₹ ${income}`;
        document.getElementById('displayExpense').innerText = `₹ ${totalExpense}`;
        
        let balanceText = document.getElementById('grandTotal');
        balanceText.innerText = `₹ ${balance}`;
        if(balance < 0) {
            balanceText.style.color = '#f87171';
        } else {
            balanceText.style.color = '#4ade80';
        }
    }

    window.saveSiteData = async function(event) {
        event.preventDefault();
        
        const siteName = document.getElementById('siteName').value.trim();
        const entryDate = document.getElementById('entryDate').value;

        try {
            // തൊഴിലാളികളുടെ കൂലി കണക്കുകൾ accounts കളക്ഷനിലേക്ക് സേവ് ചെയ്യുന്നു (സ്റ്റാഫ് പേജിൽ കിട്ടാൻ വേണ്ടി)
            const workerRows = document.querySelectorAll('.worker-row');
            for (let row of workerRows) {
                const select = row.querySelector('.worker-select');
                const staffId = select.value;
                const selectedOption = select.options[select.selectedIndex];
                const workerName = selectedOption ? selectedOption.getAttribute('data-name') : 'തൊഴിലാളി';
                const wageAmount = parseFloat(row.querySelector('.worker-wage').value) || 0;

                if (staffId && wageAmount > 0) {
                    await addDoc(collection(db, "accounts"), {
                        meshtriOwner: currentMeshtri,
                        staffId: staffId,
                        name: workerName + ` (കൂലി - സൈറ്റ് പണി)`,
                        site: siteName,
                        type: "wage",
                        payment: "cash",
                        amount: wageAmount,
                        date: entryDate
                    });
                }
            }

            alert("സൈറ്റ് കണക്ക് വിജയകരമായി സേവ് ചെയ്തു!");
            document.getElementById('siteForm').reset();
            document.getElementById('workerListContainer').innerHTML = '';
            document.getElementById('expenseListContainer').innerHTML = '';
            calculateTotal();
            document.getElementById('entryDate').valueAsDate = new Date();
        } catch (error) {
            console.error("സേവ് ചെയ്യുന്നതിൽ പിഴവ്:", error);
            alert("കണക്ക് സേവ് ചെയ്യാൻ കഴിഞ്ഞില്ല!");
        }
    }

    fetchRegisteredWorkers();
</script>

</body>
</html>
