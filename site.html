<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>മേസ്തിരി പ്രോ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Malayalam', sans-serif; background-color: #2e1065; } /* വയലറ്റ് ബാക്ക്ഗ്രൗണ്ട് */
        .glass-card { background: rgba(124, 58, 237, 0.2); backdrop-filter: blur(10px); border: 2px solid #fbbf24; } /* ഗോൾഡൻ ബോർഡർ */
        .text-gold { color: #fbbf24; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-md mx-auto">
        <!-- ഹെഡർ ലോഗോയും സ്വാഗതവും -->
        <div class="glass-card p-5 rounded-3xl mb-6 shadow-[0_0_20px_rgba(251,191,36,0.3)]">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-amber-400 rounded-full flex items-center justify-center font-black text-slate-900 text-xl">MP</div>
                <div>
                    <h1 class="text-gold font-black text-xl">മേസ്തിരി പ്രോ</h1>
                    <p id="loggedInMeshtri" class="text-white text-xs font-bold">സ്വാഗതം...</p>
                </div>
            </div>
        </div>

        <div class="mb-4">
            <input type="text" id="searchSiteInput" placeholder="🔍 സൈറ്റ് തിരയുക..." onkeyup="filterSites()" class="w-full p-4 glass-card rounded-2xl text-white placeholder-slate-300 focus:outline-none">
        </div>

        <button onclick="openAddModal()" class="w-full bg-amber-500 text-slate-950 p-4 rounded-2xl text-sm font-black shadow-lg mb-6">
            ➕ പുതിയ സൈറ്റ് കണക്ക് ചേർക്കുക
        </button>

        <div id="siteEntriesList" class="space-y-4">
            <p class="text-center text-white font-bold">ലോഡ് ചെയ്യുന്നു...</p>
        </div>
    </div>

    <!-- മോഡൽ കോഡ് പഴയതുപോലെ തന്നെ (ഡിസൈൻ മാത്രം മാറ്റി) -->
    <div id="addSiteModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50">
        <div class="glass-card p-6 rounded-3xl w-full max-w-sm text-white">
            <h3 class="font-black text-gold text-lg mb-4">പുതിയ സൈറ്റ് കണക്ക്</h3>
            <input type="text" id="siteNameInput" placeholder="സൈറ്റ് പേര്" class="w-full p-3 bg-violet-950 rounded-xl mb-3 border border-slate-600">
            <div class="grid grid-cols-2 gap-2 mb-3">
                <input type="date" id="siteDateInput" class="p-3 bg-violet-950 rounded-xl border border-slate-600">
                <input type="number" id="siteIncomeInput" placeholder="വരവ് (₹)" class="p-3 bg-violet-950 rounded-xl border border-slate-600">
            </div>
            
            <div id="expensesContainer" class="space-y-2 mb-2"></div>
            <button onclick="addExpenseRow()" class="w-full bg-green-700 text-white p-2 rounded-xl text-xs font-bold mb-2">+ ചെലവ്</button>
            
            <div id="workersContainer" class="space-y-2 mb-4"></div>
            <button onclick="addWorkerRow()" class="w-full bg-blue-700 text-white p-2 rounded-xl text-xs font-bold mb-4">+ തൊഴിലാളി</button>

            <div class="flex gap-2">
                <button id="saveSiteEntryBtn" class="flex-1 bg-amber-500 text-slate-950 p-3 rounded-xl font-black">സേവ്</button>
                <button onclick="document.getElementById('addSiteModal').classList.add('hidden')" class="flex-1 bg-slate-700 p-3 rounded-xl">ക്യാൻസൽ</button>
            </div>
        </div>
    </div>

    <script type="module">
        // മുൻപ് നൽകിയ അതേ ലോജിക് തന്നെയാണ് ഇവിടെയും ഉപയോഗിച്ചിരിക്കുന്നത്.
        // ഫയർബേസ് കണക്ഷൻ സെറ്റ് ചെയ്യുക.
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { firebaseConfig } from "./firebase-config.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const currentMeshtri = localStorage.getItem('userName') || "മേസ്തിരി";
        document.getElementById('loggedInMeshtri').innerText = "സ്വാഗതം, " + currentMeshtri;

        // ബാക്കി ഫങ്ക്ഷനുകൾ (loadSiteEntries, addExpenseRow, etc) ഇവിടെ പേസ്റ്റ് ചെയ്യുക.
        // എല്ലാം മുൻപ് നൽകിയതുപോലെ കൃത്യമായി പ്രവർത്തിക്കും.
    </script>
</body>
</html>
