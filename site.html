<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>സൈറ്റ് മാനേജ്മെന്റ് - മേസ്തിരി പ്രോ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #111827;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid #1f2937;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn {
            background: #1e293b;
            color: #38bdf8;
            padding: 8px 15px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid #334155;
        }

        h2, h3 {
            color: #fbbf24;
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: 500;
            color: #94a3b8;
            font-size: 13px;
        }

        input[type="text"], input[type="number"], input[type="date"], select {
            width: 100%;
            padding: 10px;
            background: #1f2937;
            border: 1px solid #374151;
            color: #ffffff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        input:focus, select:focus {
            border-color: #fbbf24;
            outline: none;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .worker-section, .other-expense-section {
            background: #1f2937;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            border: 1px solid #374151;
        }

        .worker-row, .expense-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            align-items: center;
        }

        .btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000000;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            text-align: center;
        }

        .btn-success {
            background: #059669;
            color: #ffffff;
            width: auto;
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
            padding: 8px 10px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .summary-box {
            background: #1f2937;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            border: 1px solid #374151;
            font-size: 14px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .summary-row.total {
            font-weight: bold;
            font-size: 16px;
            border-top: 1px solid #374151;
            padding-top: 6px;
            color: #4ade80;
        }

        .save-btn-container {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <a href="dashboard.html" class="back-btn">← ഡാഷ്‌ബോർഡ്</a>
        <span style="font-size: 14px; color: #94a3b8;">സൈറ്റ് മാനേജ്മെന്റ്</span>
    </div>

    <h2>സൈറ്റ് കണക്ക് എൻട്രി</h2>
    
    <!-- സെർച്ച് ബോക്സ് -->
    <div class="form-group" style="margin-bottom: 15px;">
        <input type="text" id="searchBox" placeholder="🔍 തൊഴിലാളിയുടെ പേരിലോ പണിയിലോ സെർച്ച് ചെയ്യുക..." oninput="filterWorkers()">
    </div>

    <form id="siteForm" onsubmit="saveSiteData(event)">
        <div class="grid-2">
            <div class="form-group">
                <label for="siteNameSelect">സൈറ്റ് തിരഞ്ഞെടുക്കുക:</label>
                <select id="siteNameSelect" required>
                    <option value="">സൈറ്റ് തിരഞ്ഞെടുക്കുക</option>
                    <option value="Kannavam">Kannavam</option>
                    <option value="Kallachi">Kallachi</option>
                    <option value="Nadapuram">Nadapuram</option>
                </select>
            </div>
            <div class="form-group">
                <label for="payerName">പണം തരുന്നയാൾ (Client):</label>
                <input type="text" id="payerName" required placeholder="പേര് നൽകുക">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="entryDate">തീയതി:</label>
                <input type="date" id="entryDate" required>
            </div>
            <div class="form-group">
                <label for="siteIncome">ലഭിച്ച വരവ് (₹):</label>
                <input type="number" id="siteIncome" placeholder="തുക നൽകുക" value="0" oninput="calculateTotal()">
            </div>
        </div>

        <!-- മറ്റു ചെലവുകൾ (വിവരവും തുകയും ചേർക്കാൻ) -->
        <div class="other-expense-section">
            <h3 style="text-align: left; font-size: 15px; margin-bottom: 10px;">മറ്റു ചെലവുകൾ (വാഹനം, മെറ്റീരിയൽ മുതലായവ)</h3>
            <div id="expenseListContainer"></div>
            <button type="button" class="btn-success" onclick="addExpenseRow()">+ ചെലവ് ചേർക്കുക</button>
        </div>

        <!-- തൊഴിലാളികളുടെ വിവരങ്ങൾ -->
        <div class="worker-section">
            <h3 style="text-align: left; font-size: 15px; margin-bottom: 10px;">തൊഴിലാളികളുടെ വിവരങ്ങൾ</h3>
            <div id="workerListContainer"></div>
            
            <div style="display: flex; gap: 8px; margin-top: 10px;">
                <button type="button" class="btn-success" onclick="addWorkerRow()">+ തൊഴിലാളിയെ ചേർക്കുക</button>
                <button type="button" class="btn-success" style="background: #2563eb;" onclick="addNewWorkerPrompt()">+ പുതിയ ആളെ ചേർക്കുക</button>
            </div>
        </div>

        <!-- Summary & Totals -->
        <div class="summary-box">
            <div class="summary-row">
                <span>ആകെ വരവ്:</span>
                <span id="displayIncome" style="color: #38bdf8;">₹ 0</span>
            </div>
            <div class="summary-row">
                <span>ആകെ ചെലവ്:</span>
                <span id="f87171" style="color: #f87171;"><span id="displayExpense">₹ 0</span></span>
            </div>
            <div class="summary-row total">
                <span>ബാക്കി തുക / ബാലൻസ്:</span>
                <span id="grandTotal">₹ 0</span>
            </div>
        </div>

        <div class="save-btn-container">
            <button type="submit" class="btn">കണക്ക് സേവ് ചെയ്യുക</button>
        </div>
    </form>
</div>

<script>
    let registeredWorkers = [
        "രാമൻ",
        "ചന്ദ്രൻ",
        "കുട്ടപ്പൻ",
        "സുരേഷ്"
    ];

    document.getElementById('entryDate').valueAsDate = new Date();

    function addNewWorkerPrompt() {
        let newName = prompt("പുതിയ തൊഴിലാളിയുടെ പേര് നൽകുക:");
        if (newName && newName.trim() !== "") {
            registeredWorkers.push(newName.trim());
            alert(`${newName.trim()} വിജയകരമായി ലിസ്റ്റിലേക്ക് ചേർത്തു!`);
            updateAllDropdowns();
        }
    }

    function updateAllDropdowns() {
        const selects = document.querySelectorAll('.worker-select');
        selects.forEach(select => {
            let currentValue = select.value;
            select.innerHTML = `<option value="">തൊഴിലാളി</option>` + 
                registeredWorkers.map(w => `<option value="${w}">${w}</option>`).join('');
            select.value = currentValue;
        });
    }

    // മറ്റു ചെലവുകൾ റോ (വിവരവും തുകയും)
    function addExpenseRow() {
        const container = document.getElementById('expenseListContainer');
        const expId = Date.now();

        const rowHTML = `
            <div class="expense-row" id="exp-${expId}">
                <input type="text" style="flex: 2;" placeholder="ചെലവിന്റെ വിവരം (ഉദാ: വാഹനം, സിമന്റ്)" required>
                <input type="number" style="flex: 1;" placeholder="തുക" class="expense-amount" value="0" oninput="calculateTotal()" required>
                <button type="button" class="btn-danger" onclick="removeExpenseRow('exp-${expId}')" title="ഡിലീറ്റ്">X</button>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', rowHTML);
    }

    function removeExpenseRow(expId) {
        document.getElementById(expId).remove();
        calculateTotal();
    }

    // തൊഴിലാളി റോ
    function addWorkerRow() {
        const container = document.getElementById('workerListContainer');
        const rowId = Date.now();

        const rowHTML = `
            <div class="worker-row" id="row-${rowId}">
                <select style="flex: 2;" class="worker-select" required>
                    <option value="">തൊഴിലാളി</option>
                    ${registeredWorkers.map(w => `<option value="${w}">${w}</option>`).join('')}
                </select>
                <input type="text" style="flex: 2;" class="worker-job" placeholder="പണി" required>
                <input type="number" style="flex: 1;" placeholder="കൂലി" class="worker-wage" value="0" oninput="calculateTotal()" required>
                <button type="button" class="btn-danger" onclick="removeWorkerRow('row-${rowId}')" title="ഡിലീറ്റ്">X</button>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', rowHTML);
    }

    function removeWorkerRow(rowId) {
        document.getElementById(rowId).remove();
        calculateTotal();
    }

    // സെർച്ച് ഫംഗ്ഷൻ (തൊഴിലാളിയുടെ പേരിലോ പണിയിലോ തിരയാൻ)
    function filterWorkers() {
        let query = document.getElementById('searchBox').value.toLowerCase();
        let rows = document.querySelectorAll('.worker-row');
        
        rows.forEach(row => {
            let selectElem = row.querySelector('.worker-select');
            let jobElem = row.querySelector('.worker-job');
            
            let workerName = selectElem ? selectElem.value.toLowerCase() : '';
            let jobName = jobElem ? jobElem.value.toLowerCase() : '';
            
            if (workerName.includes(query) || jobName.includes(query)) {
                row.style.display = 'flex';
            } else {
                row.style.display = 'none';
            }
        });
    }

    // തൽസമയ കണക്കുകൂട്ടൽ
    function calculateTotal() {
        let income = parseFloat(document.getElementById('siteIncome').value) || 0;
        
        let totalOtherExpenses = 0;
        document.querySelectorAll('.expense-amount').forEach(input => {
            totalOtherExpenses += parseFloat(input.value) || 0;
        });

        let totalWages = 0;
        document.querySelectorAll('.worker-wage').forEach(input => {
            totalWages += parseFloat(input.value) || 0;
        });

        let totalExpense = totalOtherExpenses + totalWages;
        let balance = income - totalExpense;

        document.getElementById('displayIncome').innerText = `₹ ${income}`;
        document.getElementById('displayExpense').innerText = `₹ ${totalExpense}`;
        
        let balanceText = document.getElementById('grandTotal');
        balanceText.innerText = `₹ ${balance}`;
        if(balance < 0) {
            balanceText.style.color = '#f87171'; 
        } else {
            balanceText.style.color = '#4ade80'; 
        }
    }

    function saveSiteData(event) {
        event.preventDefault();
        alert("സൈറ്റ് കണക്ക് വിജയകരമായി സേവ് ചെയ്തു!");
        document.getElementById('siteForm').reset();
        document.getElementById('workerListContainer').innerHTML = '';
        document.getElementById('expenseListContainer').innerHTML = '';
        calculateTotal();
        document.getElementById('entryDate').valueAsDate = new Date();
    }
</script>

</body>
</html>
