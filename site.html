<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>സൈറ്റ് മാനേജ്മെന്റ് - മേസ്തിരി പ്രോ</title>
    
    <!-- ഫയർബേസ് (Firebase SDK v10) CDN ലിങ്കുകൾ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;

        // പേജ് ലോഡ് ആകുമ്പോൾ ഫയർബേസിൽ നിന്ന് സ്റ്റാഫുകളുടെ പേരുകൾ എടുക്കാൻ
        window.loadStaffFromFirebase();
    </script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: linear-gradient(145deg, #111827, #0f172a);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            border: 1px solid #1f2937;
        }

        /* ആധുനിക ഹെഡറും മേസ്തിരി പ്രോ ലോഗോയും */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 15px;
        }

        .back-btn {
            background: #1e293b;
            color: #38bdf8;
            padding: 8px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            border: 1px solid #334155;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: #334155;
        }

        .brand-logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 20px;
            box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);
        }

        .brand-title {
            font-size: 18px;
            font-weight: bold;
            color: #fbbf24;
            letter-spacing: 0.5px;
        }

        h2 {
            color: #ffffff;
            text-align: center;
            font-size: 18px;
            margin: 0 0 15px 0;
            background: #1f2937;
            padding: 10px;
            border-radius: 10px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: 500;
            color: #94a3b8;
            font-size: 13px;
        }

        input[type="text"], input[type="number"], input[type="date"], select {
            width: 100%;
            padding: 11px;
            background: #1a2234;
            border: 1px solid #374151;
            color: #ffffff;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 15px;
        }

        input:focus, select:focus {
            border-color: #fbbf24;
            outline: none;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .worker-section, .other-expense-section {
            background: #161e2e;
            padding: 14px;
            border-radius: 12px;
            margin-top: 15px;
            border: 1px solid #2d3748;
        }

        .worker-row, .expense-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            align-items: center;
        }

        .btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000000;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            text-align: center;
        }

        .btn-success {
            background: #059669;
            color: #ffffff;
            width: auto;
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
            padding: 8px 10px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .summary-box {
            background: #161e2e;
            padding: 14px;
            border-radius: 12px;
            margin-top: 15px;
            border: 1px solid #2d3748;
            font-size: 14px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .summary-row.total {
            font-weight: bold;
            font-size: 16px;
            border-top: 1px solid #2d3748;
            padding-top: 8px;
            color: #4ade80;
        }

        .save-btn-container {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- മേസ്തിരി പ്രോ ലോഗോയും പേരും അടങ്ങിയ ആധുനിക ഹെഡർ -->
    <div class="app-header">
        <a href="dashboard.html" class="back-btn">← ഡാഷ്‌ബോർഡ്</a>
        <div class="brand-logo-container">
            <div class="brand-icon">🛠️</div>
            <div class="brand-title">മേസ്തിരി പ്രോ</div>
        </div>
    </div>

    <h2>സൈറ്റ് കണക്ക് എൻട്രി</h2>
    
    <div class="form-group" style="margin-bottom: 15px;">
        <input type="text" id="searchBox" placeholder="🔍 തൊഴിലാളിയുടെ പേരിലോ പണിയിലോ സെർച്ച് ചെയ്യുക..." oninput="filterWorkers()">
    </div>

    <form id="siteForm" onsubmit="saveSiteData(event)">
        <div class="grid-2">
            <div class="form-group">
                <label for="siteNameSelect">സൈറ്റ് തിരഞ്ഞെടുക്കുക / ചേർക്കുക:</label>
                <div style="display: flex; gap: 5px;">
                    <select id="siteNameSelect" required style="flex: 3;">
                        <option value="">സൈറ്റ് തിരഞ്ഞെടുക്കുക</option>
                        <option value="Kannavam">Kannavam</option>
                        <option value="Kallachi">Kallachi</option>
                        <option value="Nadapuram">Nadapuram</option>
                    </select>
                    <button type="button" class="btn-success" style="flex: 1; padding: 0; font-size: 12px;" onclick="addNewSitePrompt()">+ പുതിയത്</button>
                </div>
            </div>
            <div class="form-group">
                <label for="payerName">പണം തരുന്നയാൾ (Client):</label>
                <input type="text" id="payerName" required placeholder="പേര് നൽകുക">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="entryDate">തീയതി:</label>
                <input type="date" id="entryDate" required>
            </div>
            <div class="form-group">
                <label for="siteIncome">ലഭിച്ച വരവ് (₹):</label>
                <input type="number" id="siteIncome" placeholder="തുക നൽകുക" value="0" oninput="calculateTotal()">
            </div>
        </div>

        <!-- മറ്റു ചെലവുകൾ -->
        <div class="other-expense-section">
            <h3 style="text-align: left; font-size: 15px; margin-bottom: 10px; color: #fbbf24;">മറ്റു ചെലവുകൾ</h3>
            <div id="expenseListContainer"></div>
            <button type="button" class="btn-success" onclick="addExpenseRow()">+ ചെലവ് ചേർക്കുക</button>
        </div>

        <!-- തൊഴിലാളികളുടെ വിവരങ്ങൾ -->
        <div class="worker-section">
            <h3 style="text-align: left; font-size: 15px; margin-bottom: 10px; color: #fbbf24;">തൊഴിലാളികളുടെ വിവരങ്ങൾ</h3>
            <div id="workerListContainer"></div>
            
            <div style="display: flex; gap: 8px; margin-top: 10px;">
                <button type="button" class="btn-success" onclick="addWorkerRow()">+ തൊഴിലാളിയെ ചേർക്കുക</button>
            </div>
        </div>

        <!-- തൽസമയ സംഗ്രഹം -->
        <div class="summary-box">
            <div class="summary-row">
                <span>ആകെ വരവ്:</span>
                <span id="displayIncome" style="color: #38bdf8;">₹ 0</span>
            </div>
            <div class="summary-row">
                <span>ആകെ ചെലവ്:</span>
                <span id="displayExpense" style="color: #f87171;">₹ 0</span>
            </div>
            <div class="summary-row total">
                <span>ബാക്കി തുക / ബാലൻസ്:</span>
                <span id="grandTotal">₹ 0</span>
            </div>
        </div>

        <div class="save-btn-container">
            <button type="submit" class="btn">കണക്ക് സേവ് ചെയ്യുക</button>
        </div>
    </form>
</div>

<script>
    // സ്റ്റാഫ് പേജിൽ നിന്ന് ഫെച്ച് ചെയ്തെടുക്കുന്ന പേരുകൾ വരാനുള്ള അറേ
    let registeredWorkers = ["രാമൻ", "ചന്ദ്രൻ", "കുട്ടപ്പൻ", "സുരേഷ്"];

    document.getElementById('entryDate').valueAsDate = new Date();

    // ഫയർബേസിലെ 'staff' കളക്ഷനിൽ നിന്ന് തൊഴിലാളികളുടെ പേരുകൾ എടുക്കുന്ന ഫംഗ്ഷൻ
    window.loadStaffFromFirebase = async function() {
        try {
            if (!window.db) return;
            const querySnapshot = await window.getDocs(window.collection(window.db, "staff"));
            let firebaseStaff = [];
            querySnapshot.forEach((doc) => {
                let data = doc.data();
                if (data.name) {
                    firebaseStaff.push(data.name);
                }
            });
            if (firebaseStaff.length > 0) {
                registeredWorkers = firebaseStaff;
                updateAllDropdowns();
            }
        } catch (e) {
            console.log("സ്റ്റാഫ് ഡാറ്റ എടുക്കുന്നതിൽ ചെറിയ തടസ്സം:", e);
        }
    };

    // പുതിയ സൈറ്റ് ചേർക്കാനുള്ള പ്രോംപ്റ്റ്
    function addNewSitePrompt() {
        let newSite = prompt("പുതിയ സൈറ്റിന്റെ പേര് നൽകുക:");
        if (newSite && newSite.trim() !== "") {
            let select = document.getElementById('siteNameSelect');
            let option = document.createElement('option');
            option.value = newSite.trim();
            option.text = newSite.trim();
            select.appendChild(option);
            select.value = newSite.trim();
            alert(`${newSite.trim()} വിജയകരമായി ചേർത്തു!`);
        }
    }

    function updateAllDropdowns() {
        const selects = document.querySelectorAll('.worker-select');
        selects.forEach(select => {
            let currentValue = select.value;
            select.innerHTML = `<option value="">തൊഴിലാളി</option>` + 
                registeredWorkers.map(w => `<option value="${w}">${w}</option>`).join('');
            select.value = currentValue;
        });
    }

    function addExpenseRow() {
        const container = document.getElementById('expenseListContainer');
        const expId = Date.now();

        const rowHTML = `
            <div class="expense-row" id="exp-${expId}">
                <input type="text" style="flex: 2;" class="exp-desc" placeholder="ചെലവിന്റെ വിവരം (ഉദാ: വാഹനം)" required>
                <input type="number" style="flex: 1;" placeholder="തുക" class="expense-amount" value="0" oninput="calculateTotal()" required>
                <button type="button" class="btn-danger" onclick="removeExpenseRow('exp-${expId}')" title="ഡിലീറ്റ്">X</button>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', rowHTML);
    }

    function removeExpenseRow(expId) {
        document.getElementById(expId).remove();
        calculateTotal();
    }

    function addWorkerRow() {
        const container = document.getElementById('workerListContainer');
        const rowId = Date.now();

        const rowHTML = `
            <div class="worker-row" id="row-${rowId}" data-worker="">
                <select style="flex: 2;" class="worker-select" onchange="updateRowData(this, '${rowId}')" required>
                    <option value="">തൊഴിലാളി</option>
                    ${registeredWorkers.map(w => `<option value="${w}">${w}</option>`).join('')}
                </select>
                <input type="text" style="flex: 2;" class="worker-job" placeholder="പണി" oninput="updateRowData(this, '${rowId}')" required>
                <input type="number" style="flex: 1;" placeholder="കൂലി" class="worker-wage" value="0" oninput="calculateTotal()" required>
                <button type="button" class="btn-danger" onclick="removeWorkerRow('row-${rowId}')" title="ഡിലീറ്റ്">X</button>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', rowHTML);
    }

    function updateRowData(element, rowId) {
        let row = document.getElementById(`row-${rowId}`);
        let selectVal = row.querySelector('.worker-select').value;
        let jobVal = row.querySelector('.worker-job').value;
        row.setAttribute('data-worker', selectVal.toLowerCase() + ' ' + jobVal.toLowerCase());
    }

    function removeWorkerRow(rowId) {
        document.getElementById(rowId).remove();
        calculateTotal();
    }

    function filterWorkers() {
        let query = document.getElementById('searchBox').value.toLowerCase();
        let rows = document.querySelectorAll('.worker-row');
        
        rows.forEach(row => {
            let data = row.getAttribute('data-worker') || '';
            if (data.includes(query)) {
                row.style.display = 'flex';
            } else {
                row.style.display = 'none';
            }
        });
    }

    function calculateTotal() {
        let income = parseFloat(document.getElementById('siteIncome').value) || 0;
        
        let totalOtherExpenses = 0;
        document.querySelectorAll('.expense-amount').forEach(input => {
            totalOtherExpenses += parseFloat(input.value) || 0;
        });

        let totalWages = 0;
        document.querySelectorAll('.worker-wage').forEach(input => {
            totalWages += parseFloat(input.value) || 0;
        });

        let totalExpense = totalOtherExpenses + totalWages;
        let balance = income - totalExpense;

        document.getElementById('displayIncome').innerText = `₹ ${income}`;
        document.getElementById('displayExpense').innerText = `₹ ${totalExpense}`;
        
        let balanceText = document.getElementById('grandTotal');
        balanceText.innerText = `₹ ${balance}`;
        balanceText.style.color = balance < 0 ? '#f87171' : '#4ade80';
    }

    async function saveSiteData(event) {
        event.preventDefault();

        const siteName = document.getElementById('siteNameSelect').value;
        const payerName = document.getElementById('payerName').value;
        const entryDate = document.getElementById('entryDate').value;
        const siteIncome = parseFloat(document.getElementById('siteIncome').value) || 0;

        const expenses = [];
        document.querySelectorAll('.expense-row').forEach(row => {
            const desc = row.querySelector('.exp-desc').value;
            const amount = parseFloat(row.querySelector('.expense-amount').value) || 0;
            expenses.push({ description: desc, amount: amount });
        });

        const workers = [];
        document.querySelectorAll('.worker-row').forEach(row => {
            const name = row.querySelector('.worker-select').value;
            const job = row.querySelector('.worker-job').value;
            const wage = parseFloat(row.querySelector('.worker-wage').value) || 0;
            workers.push({ name: name, job: job, wage: wage });
        });

        let totalExpensesVal = expenses.reduce((sum, item) => sum + item.amount, 0) + 
                               workers.reduce((sum, item) => sum + item.wage, 0);
        let balanceVal = siteIncome - totalExpensesVal;

        const siteDataRecord = {
            siteName: siteName,
            clientName: payerName,
            date: entryDate,
            income: siteIncome,
            expenses: expenses,
            workers: workers,
            totalExpense: totalExpensesVal,
            balance: balanceVal,
            createdAt: new Date()
        };

        try {
            await window.addDoc(window.collection(window.db, "site_entries"), siteDataRecord);
            alert("സൈറ്റ് കണക്ക് ഫയർബേസിൽ വിജയകരമായി സേവ് ചെയ്തു!");
            
            document.getElementById('siteForm').reset();
            document.getElementById('workerListContainer').innerHTML = '';
            document.getElementById('expenseListContainer').innerHTML = '';
            calculateTotal();
            document.getElementById('entryDate').valueAsDate = new Date();

        } catch (error) {
            console.error("പിഴവ്: ", error);
            alert("കണക്ക് സേവ് ചെയ്യാൻ കഴിഞ്ഞില്ല. വീണ്ടും ശ്രമിക്കുക!");
        }
    }
</script>

</body>
</html>
