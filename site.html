<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>മേസ്തിരി പ്രോ - സൈറ്റുകൾ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Malayalam', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4">

    <div class="max-w-md mx-auto p-2">
        <!-- ഹെഡർ -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-3xl mb-4 flex justify-between items-center shadow-xl">
            <div>
                <h1 class="text-amber-400 font-black text-lg">മേസ്തിരി പ്രോ</h1>
                <p id="loggedInMeshtri" class="text-xs text-slate-400 font-bold">സ്വാഗതം, മേസ്തിരി</p>
            </div>
            <a href="dashboard.html" class="bg-slate-800 border border-slate-700 text-slate-200 px-3 py-1.5 rounded-xl text-xs font-bold">← ഡാഷ്‌ബോർഡ്</a>
        </div>

        <div class="mb-4">
            <h2 class="text-base font-black text-white mb-2">സൈറ്റുകളുടെ വിവരങ്ങൾ</h2>
            <input type="text" id="searchSiteInput" placeholder="🔍 സൈറ്റ് തിരയുക..." class="w-full p-3 bg-slate-900 border border-slate-800 rounded-2xl text-xs text-white focus:outline-none focus:border-amber-500">
        </div>

        <button onclick="document.getElementById('addSiteModal').classList.remove('hidden')" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 p-3.5 rounded-2xl text-xs font-black shadow-lg mb-4">
            ➕ പുതിയ സൈറ്റ് ചേർക്കുക
        </button>

        <!-- സൈറ്റുകളുടെ ലിസ്റ്റ് വരുന്ന സ്ഥലം -->
        <div id="siteList">
            <p class="text-center text-xs text-slate-400 font-bold py-6">സൈറ്റുകൾ ലോഡ് ചെയ്യുന്നു...</p>
        </div>
    </div>

    <!-- പുതിയ സൈറ്റ് ചേർക്കാനുള്ള മോഡൽ -->
    <div id="addSiteModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-3xl w-full max-w-sm space-y-3">
            <h3 class="font-black text-amber-400 text-sm">പുതിയ സൈറ്റ് ചേർക്കുക</h3>
            <input type="text" id="newSiteName" placeholder="സൈറ്റിന്റെ പേര്" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white">
            <input type="text" id="newSiteLocation" placeholder="സ്ഥലം / ലൊക്കേഷൻ" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white">
            <input type="text" id="newSiteClient" placeholder="ഉടമസ്ഥന്റെ പേര് / ഫോൺ" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white">
            <div class="flex gap-2 pt-2">
                <button id="saveSiteBtn" class="flex-1 bg-amber-500 text-slate-950 p-2.5 rounded-xl text-xs font-black">സേവ് ചെയ്യുക</button>
                <button onclick="document.getElementById('addSiteModal').classList.add('hidden')" class="flex-1 bg-slate-800 text-slate-300 p-2.5 rounded-xl text-xs font-bold">ക്യാൻസൽ</button>
            </div>
        </div>
    </div>

    <!-- ഫയർബേസ് സ്ക്രിപ്റ്റുകൾ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            databaseURL: "https://mesthri-app-default-rtdb.firebaseio.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d",
            measurementId: "G-J9Y5TW9D7T"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentMeshtri = localStorage.getItem('userName') || localStorage.getItem('meshtriName') || localStorage.getItem('name') || "മേസ്തിരി";
        const loggedElement = document.getElementById('loggedInMeshtri');
        if (loggedElement) {
            loggedElement.innerText = "സ്വാഗതം, " + currentMeshtri;
        }

        // സൈറ്റ് സേവ് ചെയ്യാൻ
        document.getElementById('saveSiteBtn').addEventListener('click', async () => {
            const siteName = document.getElementById('newSiteName').value.trim();
            const siteLocation = document.getElementById('newSiteLocation').value.trim();
            const siteClient = document.getElementById('newSiteClient').value.trim();

            if (!siteName) return alert("സൈറ്റിന്റെ പേര് നൽകുക!");

            try {
                await addDoc(collection(db, "sites"), {
                    meshtriOwner: currentMeshtri,
                    name: siteName,
                    location: siteLocation,
                    client: siteClient
                });
                alert("സൈറ്റ് വിജയകരമായി ചേർത്തു! ✅");

                document.getElementById('newSiteName').value = '';
                document.getElementById('newSiteLocation').value = '';
                document.getElementById('newSiteClient').value = '';
                document.getElementById('addSiteModal').classList.add('hidden');
                loadSites();
            } catch (err) {
                console.error(err);
                alert("സൈറ്റ് സേവ് ചെയ്യുന്നതിൽ തടസ്സം നേരിട്ടു!");
            }
        });

        // സൈറ്റുകൾ ലോഡ് ചെയ്യാൻ
        async function loadSites() {
            const list = document.getElementById('siteList');
            list.innerHTML = '<p class="text-center text-xs text-slate-400 font-bold py-6">സൈറ്റുകൾ ലോഡ് ചെയ്യുന്നു...</p>';

            try {
                const sitesQuery = query(collection(db, "sites"), where("meshtriOwner", "==", currentMeshtri));
                const querySnapshot = await getDocs(sitesQuery);

                list.innerHTML = '';

                if (querySnapshot.empty) {
                    list.innerHTML = '<p class="text-center text-xs text-slate-400 font-bold py-6">സൈറ്റുകൾ ഒന്നും ചേർത്തിട്ടില്ല.</p>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const site = docSnap.data();
                    const siteId = docSnap.id;

                    const div = document.createElement('div');
                    div.className = "bg-slate-900/80 text-white p-4 rounded-3xl border border-slate-800 shadow-xl backdrop-blur-md mb-4 flex justify-between items-center";
                    
                    div.innerHTML = `
                        <div>
                            <h3 class="font-black text-base text-amber-400">🏗️ ${site.name}</h3>
                            ${site.location ? `<p class="text-xs text-slate-300 font-bold mt-1">📍 സ്ഥലം: ${site.location}</p>` : ''}
                            ${site.client ? `<p class="text-xs text-slate-400 mt-0.5">👤 ഉടമസ്ഥൻ: ${site.client}</p>` : ''}
                        </div>
                        <button onclick="deleteSite('${siteId}')" class="text-red-400 text-xs font-bold px-2.5 py-1.5 bg-red-950/60 border border-red-800/50 rounded-xl">Delete</button>
                    `;
                    list.appendChild(div);
                });
            } catch (err) {
                console.error(err);
                list.innerHTML = '<p class="text-center text-xs text-rose-400 font-bold py-6">സൈറ്റുകൾ ലോഡ് ചെയ്യുന്നതിൽ പിശക്.</p>';
            }
        }

        window.deleteSite = async function(siteId) {
            if (confirm("ഈ സൈറ്റ് ഡിലീറ്റ് ചെയ്യണമെന്ന് ഉറപ്പാണോ?")) {
                await deleteDoc(doc(db, 'sites', siteId));
                alert("സൈറ്റ് ഡിലീറ്റ് ചെയ്തു! 🗑️");
                loadSites();
            }
        }

        loadSites();
    </script>
</body>
</html>
