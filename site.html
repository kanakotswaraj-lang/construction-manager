<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>സൈറ്റ് മാനേജ്മെന്റ് - മേസ്തിരി പ്രോ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #111827;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid #1f2937;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn {
            background: #1e293b;
            color: #38bdf8;
            padding: 8px 15px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid #334155;
        }

        h2, h3 {
            color: #fbbf24;
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #94a3b8;
            font-size: 14px;
        }

        input[type="text"], input[type="number"], input[type="date"], select {
            width: 100%;
            padding: 12px;
            background: #1f2937;
            border: 1px solid #374151;
            color: #ffffff;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }

        input:focus, select:focus {
            border-color: #fbbf24;
            outline: none;
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row .form-group {
            flex: 1;
        }

        .worker-section {
            background: #1f2937;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            border: 1px solid #374151;
        }

        .worker-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
        }

        .btn {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000000;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            text-align: center;
        }

        .btn-success {
            background: #059669;
            color: #ffffff;
            width: auto;
            padding: 10px 15px;
            font-size: 14px;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
            padding: 10px 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .total-box {
            background: #1f2937;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            border: 1px solid #374151;
            color: #4ade80;
        }

        .save-btn-container {
            margin-top: 25px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <a href="dashboard.html" class="back-btn">← ഡാഷ്‌ബോർഡ്</a>
        <span style="font-size: 14px; color: #94a3b8;">സൈറ്റ് മാനേജ്മെന്റ്</span>
    </div>

    <h2>സൈറ്റ് കണക്ക് എൻട്രി</h2>
    
    <form id="siteForm" onsubmit="saveSiteData(event)">
        <div class="row">
            <div class="form-group">
                <label for="siteName">സൈറ്റിന്റെ പേര്:</label>
                <input type="text" id="siteName" required placeholder="സൈറ്റ് പേര് നൽകുക">
            </div>
            <div class="form-group">
                <label for="payerName">പണം തരുന്നയാൾ (Client):</label>
                <input type="text" id="payerName" required placeholder="പേര് നൽകുക">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="entryDate">തീയതി:</label>
                <input type="date" id="entryDate" required>
            </div>
            <div class="form-group">
                <label for="siteIncome">ലഭിച്ച മുൻകൂർ/വരവ് (₹):</label>
                <input type="number" id="siteIncome" placeholder="തുക നൽകുക">
            </div>
        </div>

        <h3 style="text-align: left; font-size: 16px; margin-top: 20px;">മറ്റു ചെലവുകൾ</h3>
        <div class="row">
            <div class="form-group">
                <label for="transportCost">വാഹനം (₹):</label>
                <input type="number" id="transportCost" placeholder="0" oninput="calculateTotal()">
            </div>
            <div class="form-group">
                <label for="foodCost">ഭക്ഷണം (₹):</label>
                <input type="number" id="foodCost" placeholder="0" oninput="calculateTotal()">
            </div>
            <div class="form-group">
                <label for="materialCost">മെറ്റീരിയൽ (₹):</label>
                <input type="number" id="materialCost" placeholder="0" oninput="calculateTotal()">
            </div>
        </div>

        <div class="worker-section">
            <h3 style="text-align: left; font-size: 16px;">തൊഴിലാളികളുടെ വിവരങ്ങൾ</h3>
            <div id="workerListContainer"></div>
            <button type="button" class="btn btn-success" onclick="addWorkerRow()">+ തൊഴിലാളിയെ ചേർക്കുക</button>
        </div>

        <div class="total-box">
            ആകെ സൈറ്റ് ചെലവ്: ₹ <span id="grandTotal">0</span>
        </div>

        <div class="save-btn-container">
            <button type="submit" class="btn">കണക്ക് സേവ് ചെയ്യുക</button>
        </div>
    </form>
</div>

<script>
    // ഇവിടെ നിങ്ങളുടെ സ്റ്റാഫ് പേജിൽ രജിസ്റ്റർ ചെയ്തിട്ടുള്ള യഥാർത്ഥ തൊഴിലാളികളുടെ ലിസ്റ്റ് ലോഡ് ചെയ്യാം
    const registeredWorkers = [
        { id: 1, name: "രാമൻ" },
        { id: 2, name: "ചന്ദ്രൻ" },
        { id: 3, name: "കുട്ടപ്പൻ" },
        { id: 4, name: "സുരേഷ്" }
    ];

    document.getElementById('entryDate').valueAsDate = new Date();

    function addWorkerRow() {
        const container = document.getElementById('workerListContainer');
        const rowId = Date.now();

        const rowHTML = `
            <div class="worker-row" id="row-${rowId}">
                <select style="flex: 2;" required>
                    <option value="">തൊഴിലാളിയെ തിരഞ്ഞെടുക്കുക</option>
                    ${registeredWorkers.map(w => `<option value="${w.name}">${w.name}</option>`).join('')}
                </select>
                <input type="text" style="flex: 2;" placeholder="ചെയ്ത പണി" required>
                <input type="number" style="flex: 1;" placeholder="കൂലി" class="worker-wage" placeholder="0" oninput="calculateTotal()" required>
                <button type="button" class="btn-danger" onclick="removeWorkerRow('row-${rowId}')">X</button>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', rowHTML);
    }

    function removeWorkerRow(rowId) {
        document.getElementById(rowId).remove();
        calculateTotal();
    }

    function calculateTotal() {
        let transport = parseFloat(document.getElementById('transportCost').value) || 0;
        let food = parseFloat(document.getElementById('foodCost').value) || 0;
        let material = parseFloat(document.getElementById('materialCost').value) || 0;
        
        let totalWages = 0;
        document.querySelectorAll('.worker-wage').forEach(input => {
            totalWages += parseFloat(input.value) || 0;
        });

        let grandTotal = transport + food + material + totalWages;
        document.getElementById('grandTotal').innerText = grandTotal;
    }

    function saveSiteData(event) {
        event.preventDefault();
        alert("സൈറ്റ് കണക്ക് വിജയകരമായി സേവ് ചെയ്തു!");
        document.getElementById('siteForm').reset();
        document.getElementById('workerListContainer').innerHTML = '';
        document.getElementById('grandTotal').innerText = '0';
        document.getElementById('entryDate').valueAsDate = new Date();
    }
</script>

</body>
</html>
