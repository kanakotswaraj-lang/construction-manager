<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>മേസ്തിരി പ്രോ - സൈറ്റ് കണക്കുകൾ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Malayalam', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4">

    <div class="max-w-md mx-auto p-2">
        <!-- ഹെഡർ -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-3xl mb-4 flex justify-between items-center shadow-xl">
            <div>
                <h1 class="text-amber-400 font-black text-lg">മേസ്തിരി പ്രോ</h1>
                <p id="loggedInMeshtri" class="text-xs text-slate-400 font-bold">സ്വാഗതം, ലോഡിംഗ്...</p>
            </div>
            <a href="dashboard.html" class="bg-slate-800 border border-slate-700 text-slate-200 px-3 py-1.5 rounded-xl text-xs font-bold">← ഡാഷ്‌ബോർഡ്</a>
        </div>

        <div class="mb-4 flex justify-between items-center">
            <h2 class="text-base font-black text-white">സൈറ്റ് കണക്കുകൾ</h2>
            <button onclick="document.getElementById('addSiteEntryModal').classList.remove('hidden')" class="bg-amber-500 hover:bg-amber-600 text-slate-950 px-3 py-2 rounded-xl text-xs font-black shadow-lg">
                ➕ പുതിയ സൈറ്റ് കണക്ക്
            </button>
        </div>

        <!-- സൈറ്റ് എൻട്രികളുടെ ലിസ്റ്റ് വരുന്ന സ്ഥലം -->
        <div id="siteEntriesList">
            <p class="text-center text-xs text-slate-400 font-bold py-6">കണക്കുകൾ ലോഡ് ചെയ്യുന്നു...</p>
        </div>
    </div>

    <!-- പുതിയ സൈറ്റ് കണക്ക് ചേർക്കാനുള്ള മോഡൽ -->
    <div id="addSiteEntryModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-3xl w-full max-w-sm space-y-3 my-auto">
            <h3 class="font-black text-amber-400 text-sm">പുതിയ സൈറ്റ് കണക്ക് ചേർക്കുക</h3>
            
            <div>
                <label class="text-[10px] text-slate-400 font-bold">സൈറ്റിന്റെ പേര് / സ്ഥലം</label>
                <input type="text" id="siteNameInput" placeholder="സൈറ്റ് പേര് ടൈപ്പ് ചെയ്യുക" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[10px] text-slate-400 font-bold">തീയതി</label>
                    <input type="date" id="siteDateInput" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 font-bold">ലഭിച്ച വരവ് (₹)</label>
                    <input type="number" id="siteIncomeInput" value="0" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white">
                </div>
            </div>

            <div class="border border-slate-800 p-3 rounded-2xl bg-slate-950/50 space-y-2">
                <p class="text-xs font-black text-amber-400">മറ്റ് ചെലവുകൾ (വാഹനം, ഭക്ഷണം, മെറ്റീരിയൽ)</p>
                <div id="expensesContainer" class="space-y-2">
                    <!-- ചെലവ് റോകൾ ഇവിടെ വരും -->
                </div>
                <button onclick="addExpenseRow()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-2 rounded-xl text-xs font-bold">+ ചെലവ് ചേർക്കുക</button>
            </div>

            <div class="border border-slate-800 p-3 rounded-2xl bg-slate-950/50 space-y-2">
                <p class="text-xs font-black text-amber-400">തൊഴിലാളികളുടെ വിവരങ്ങൾ</p>
                <div id="workersContainer" class="space-y-2">
                    <!-- തൊഴിലാളി റോകൾ ഇവിടെ വരും -->
                </div>
                <button onclick="addWorkerRow()" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-2 rounded-xl text-xs font-bold">+ തൊഴിലാളിയെ ചേർക്കുക</button>
            </div>

            <div class="flex gap-2 pt-2">
                <button id="saveSiteEntryBtn" class="flex-1 bg-amber-500 text-slate-950 p-2.5 rounded-xl text-xs font-black">കണക്ക് സേവ് ചെയ്യുക</button>
                <button onclick="document.getElementById('addSiteEntryModal').classList.add('hidden')" class="flex-1 bg-slate-800 text-slate-300 p-2.5 rounded-xl text-xs font-bold">ക്യാൻസൽ</button>
            </div>
        </div>
    </div>

    <!-- ഫയർബേസ് സ്ക്രിപ്റ്റുകൾ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { firebaseConfig } from "./firebase-config.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const currentMeshtri = localStorage.getItem('userName') || "പൊതുമേസ്തിരി";
        document.getElementById('loggedInMeshtri').innerText = "സ്വാഗതം, " + currentMeshtri;

        const getTodayDate = () => {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        document.getElementById('siteDateInput').value = getTodayDate();

        window.addExpenseRow = function(note = '', amount = '') {
            const container = document.getElementById('expensesContainer');
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center";
            div.innerHTML = `
                <input type="text" placeholder="ചെലവിന്റെ വിവരങ്ങൾ (ഉദാ: വാഹനം)" value="${note}" class="exp-note flex-1 p-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white">
                <input type="number" placeholder="തുക" value="${amount}" class="exp-amount w-24 p-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white">
                <button onclick="this.parentElement.remove()" class="bg-red-600 text-white px-2.5 py-2 rounded-xl text-xs font-bold">X</button>
            `;
            container.appendChild(div);
        }

        window.addWorkerRow = function(name = '', days = '1') {
            const container = document.getElementById('workersContainer');
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center";
            div.innerHTML = `
                <input type="text" placeholder="തൊഴിലാളിയുടെ പേര്" value="${name}" class="worker-name flex-1 p-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white">
                <input type="number" step="0.5" placeholder="ദിവസം" value="${days}" class="worker-days w-20 p-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white text-center">
                <button onclick="this.parentElement.remove()" class="bg-red-600 text-white px-2.5 py-2 rounded-xl text-xs font-bold">X</button>
            `;
            container.appendChild(div);
        }

        // സെവ് ചെയ്യാൻ
        document.getElementById('saveSiteEntryBtn').addEventListener('click', async () => {
            const siteName = document.getElementById('siteNameInput').value.trim();
            const date = document.getElementById('siteDateInput').value;
            const income = parseFloat(document.getElementById('siteIncomeInput').value) || 0;

            if (!siteName) return alert("സൈറ്റിന്റെ പേര് നൽകുക!");

            let expenses = [];
            document.querySelectorAll('#expensesContainer > div').forEach(row => {
                const note = row.querySelector('.exp-note').value.trim();
                const amt = parseFloat(row.querySelector('.exp-amount').value) || 0;
                if (amt > 0) expenses.push({ note, amount: amt });
            });

            let workers = [];
            document.querySelectorAll('#workersContainer > div').forEach(row => {
                const name = row.querySelector('.worker-name').value.trim();
                const days = parseFloat(row.querySelector('.worker-days').value) || 0;
                if (name) workers.push({ name, days });
            });

            try {
                await addDoc(collection(db, "siteEntries"), {
                    meshtriOwner: currentMeshtri,
                    siteName,
                    date,
                    income,
                    expenses,
                    workers
                });
                alert("സൈറ്റ് കണക്ക് വിജയകരമായി സേവ് ചെയ്തു! ✅");
                document.getElementById('addSiteEntryModal').classList.add('hidden');
                loadSiteEntries();
            } catch (err) {
                console.error(err);
                alert("സേവ് ചെയ്യുന്നതിൽ തടസ്സം നേരിട്ടു!");
            }
        });

        async function loadSiteEntries() {
            const list = document.getElementById('siteEntriesList');
            list.innerHTML = '<p class="text-center text-xs text-slate-400 font-bold py-6">കണക്കുകൾ ലോഡ് ചെയ്യുന്നു...</p>';

            try {
                const q = query(collection(db, "siteEntries"), where("meshtriOwner", "==", currentMeshtri));
                const snapshot = await getDocs(q);

                list.innerHTML = '';
                if (snapshot.empty) {
                    list.innerHTML = '<p class="text-center text-xs text-slate-400 font-bold py-6">കണക്കുകൾ ഒന്നും ചേർത്തിട്ടില്ല.</p>';
                    return;
                }

                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const id = docSnap.id;

                    let totalExpense = data.expenses.reduce((sum, e) => sum + (e.amount || 0), 0);
                    // തൊഴിലാളികളുടെ കൂലി കണക്കാക്കാൻ (ഡിഫോൾട്ട് കൂലി 1200 വെച്ച്)
                    let workerTotalCost = data.workers.reduce((sum, w) => sum + (w.days * 1200), 0);
                    let grandTotalExpense = totalExpense + workerTotalCost;
                    let balance = data.income - grandTotalExpense;

                    let expHtml = data.expenses.map(e => `<p class="text-xs text-slate-300">🔹 ${e.note}: ₹${e.amount}</p>`).join('');
                    let workHtml = data.workers.map(w => `<p class="text-xs text-cyan-300">👷 ${w.name} - ${w.days} ദിവസം</p>`).join('');

                    const div = document.createElement('div');
                    div.className = "bg-slate-900/80 text-white p-4 rounded-3xl border border-slate-800 shadow-xl backdrop-blur-md mb-4 space-y-3";
                    div.innerHTML = `
                        <div class="flex justify-between items-center">
                            <div>
                                <h3 class="font-black text-base text-amber-400">🏗️ ${data.siteName}</h3>
                                <p class="text-xs text-slate-400">📅 തീയതി: ${data.date}</p>
                            </div>
                            <button onclick="deleteEntry('${id}')" class="text-red-400 text-xs font-bold px-2 py-1 bg-red-950/60 border border-red-800/50 rounded-xl">Delete</button>
                        </div>

                        ${data.income > 0 ? `<div class="bg-slate-800/60 p-2.5 rounded-xl text-xs"><span class="text-slate-400 font-bold">ലഭിച്ച വരവ്:</span> <span class="text-emerald-400 font-black">₹${data.income}</span></div>` : ''}
                        
                        ${data.expenses.length > 0 ? `<div class="bg-slate-800/60 p-2.5 rounded-xl space-y-1"><p class="text-[10px] font-bold text-slate-400">മറ്റ് ചെലവുകൾ:</p>${expHtml}</div>` : ''}
                        
                        ${data.workers.length > 0 ? `<div class="bg-slate-800/60 p-2.5 rounded-xl space-y-1"><p class="text-[10px] font-bold text-slate-400">തൊഴിലാളികൾ:</p>${workHtml}</div>` : ''}

                        <div class="bg-slate-950 p-3 rounded-2xl border border-slate-800 flex justify-between items-center text-xs">
                            <div>ആകെ ചെലവ്: <span class="text-rose-400 font-bold">₹${grandTotalExpense}</span></div>
                            <div class="text-right">ബാക്കി/ബാലൻസ്: <span class="${balance >= 0 ? 'text-emerald-400' : 'text-rose-400'} font-black text-sm">₹${balance}</span></div>
                        </div>
                    `;
                    list.appendChild(div);
                });
            } catch (err) {
                console.error(err);
                list.innerHTML = '<p class="text-center text-xs text-rose-400 font-bold py-6">കണക്കുകൾ ലോഡ് ചെയ്യുന്നതിൽ പിശക്.</p>';
            }
        }

        window.deleteEntry = async function(id) {
            if (confirm("ഈ കണക്ക് ഡിലീറ്റ് ചെയ്യണമെന്ന് ഉറപ്പാണോ?")) {
                await deleteDoc(doc(db, 'siteEntries', id));
                loadSiteEntries();
            }
        }

        loadSiteEntries();
    </script>
</body>
</html>
