<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>സൈറ്റ് മാനേജ്മെന്റ് - മേസ്തിരി പ്രോ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="language.js"></script> 
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        import { setupHeader } from './header.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            databaseURL: "https://mesthri-app-default-rtdb.firebaseio.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d",
            measurementId: "G-J9Y5TW9D7T"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const currentMeshtri = localStorage.getItem('userName') || "പൊതുമേസ്തിരി";

        document.addEventListener("DOMContentLoaded", () => {
            if (typeof setupHeader === 'function') {
                setupHeader('appHeader', true, currentMeshtri);
            }
            const nameSpan = document.getElementById('loggedInMeshtri');
            if(nameSpan) nameSpan.innerText = `സ്വാഗതം, ${currentMeshtri}`;
            
            document.getElementById('entryDate').valueAsDate = new Date();
            fetchData();
        });

        // കസ്റ്റം അലേർട്ട് ഫംഗ്ഷൻ
        function showCustomAlert(message, title = "ശ്രദ്ധിക്കുക", isConfirm = false, onConfirm = null) {
            const modal = document.getElementById('customModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalOkBtn = document.getElementById('modalOkBtn');
            const modalCancelBtn = document.getElementById('modalCancelBtn');

            modalTitle.innerText = title;
            modalMessage.innerText = message;
            modal.classList.remove('hidden');

            if (isConfirm) {
                modalCancelBtn.classList.remove('hidden');
                modalOkBtn.innerText = "ഉവ്വ്";
            } else {
                modalCancelBtn.classList.add('hidden');
                modalOkBtn.innerText = "ശരി";
            }

            const newOkBtn = modalOkBtn.cloneNode(true);
            modalOkBtn.parentNode.replaceChild(newOkBtn, modalOkBtn);

            const newCancelBtn = modalCancelBtn.cloneNode(true);
            modalCancelBtn.parentNode.replaceChild(newCancelBtn, modalCancelBtn);

            newOkBtn.addEventListener('click', () => {
                modal.classList.add('hidden');
                if (onConfirm) onConfirm(true);
            });

            newCancelBtn.addEventListener('click', () => {
                modal.classList.add('hidden');
                if (onConfirm) onConfirm(false);
            });
        }

        let registeredWorkers = [];
        let allAccountsData = [];

        async function fetchData() {
            try {
                const staffQuery = query(collection(db, "staffs"), where("meshtriOwner", "==", currentMeshtri));
                const staffSnap = await getDocs(staffQuery);
                registeredWorkers = [];
                staffSnap.forEach(doc => registeredWorkers.push({ id: doc.id, ...doc.data() }));

                const accQuery = query(collection(db, "accounts"), where("meshtriOwner", "==", currentMeshtri));
                const accSnap = await getDocs(accQuery);
                allAccountsData = [];
                const siteSet = new Set();
                accSnap.forEach(doc => {
                    const d = doc.data();
                    allAccountsData.push(d);
                    if (d.site) siteSet.add(d.site);
                });

                const siteDropdown = document.getElementById('siteSelectDropdown');
                if(siteDropdown) {
                    siteDropdown.innerHTML = '<option value="">+ പുതിയ സൈറ്റ് ടൈപ്പ് ചെയ്യുക</option>';
                    siteSet.forEach(s => {
                        siteDropdown.innerHTML += `<option value="${s}">${s}</option>`;
                    });
                }

                updateAllDropdowns();
            } catch (e) {
                console.error("ഡാറ്റ ലോഡ് ചെയ്യുന്നതിൽ പിഴവ്:", e);
            }
        }

        window.onSiteSelectChange = function() {
            const selectedSite = document.getElementById('siteSelectDropdown').value;
            const siteInput = document.getElementById('siteName');
            if (selectedSite) {
                siteInput.value = selectedSite;
                siteInput.readOnly = true;
                siteInput.classList.add('opacity-60');
            } else {
                siteInput.value = '';
                siteInput.readOnly = false;
                siteInput.classList.remove('opacity-60');
            }
            calculateTotal();
        }

        function updateAllDropdowns() {
            document.querySelectorAll('.worker-select').forEach(select => {
                let currentValue = select.value;
                select.innerHTML = `<option value="">തൊഴിലാളിയെ തിരഞ്ഞെടുക്കുക</option>` + 
                    registeredWorkers.map(w => `<option value="${w.id}" data-name="${w.name}">${w.name} (${w.job || 'പണിക്കാരൻ'})</option>`).join('');
                select.value = currentValue;
            });
        }
window.addExpenseRow = function() {
    const container = document.getElementById('expenseListContainer');
    const expId = Date.now();
    container.insertAdjacentHTML('beforeend', `
        <div class="flex gap-2 items-center" id="exp-${expId}">
            <input type="text" placeholder="വിവരം (ഉദാ: വാഹനം, മെറ്റീരിയൽ)" class="expense-desc w-full p-3 bg-slate-800 text-white rounded-xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400">
            <input type="number" placeholder="തുക" class="expense-amount w-28 p-3 bg-slate-800 text-white rounded-xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400" value="0" oninput="calculateTotal()">
            <button type="button" onclick="document.getElementById('exp-${expId}').remove(); calculateTotal();" class="bg-red-600 text-white px-3 py-3 rounded-xl font-bold text-xs">X</button>
        </div>
    `);
}


        window.addWorkerRow = function() {
            const container = document.getElementById('workerListContainer');
            const rowId = Date.now();
            const optionsHTML = registeredWorkers.map(w => `<option value="${w.id}" data-name="${w.name}">${w.name} (${w.job || 'പണിക്കാരൻ'})</option>`).join('');

            container.insertAdjacentHTML('beforeend', `
                <div class="p-3 bg-slate-800/80 rounded-2xl border border-slate-700 space-y-2 worker-row" id="row-${rowId}" data-worker="">
                    <select class="worker-select w-full p-3 bg-slate-800 text-white rounded-xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400" onchange="updateRowData(this, '${rowId}')" required>
                        <option value="">തൊഴിലാളിയെ തിരഞ്ഞെടുക്കുക</option>
                        ${optionsHTML}
                    </select>
                    <div class="flex gap-2">
                        <input type="text" placeholder="പണി (ഉദാ: മേസ്തിരി പണി)" class="worker-job w-full p-3 bg-slate-800 text-white rounded-xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400" oninput="updateRowData(this, '${rowId}')" required>
                        <input type="number" placeholder="കൂലി (₹)" class="worker-wage w-32 p-3 bg-slate-800 text-white rounded-xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400" value="0" oninput="calculateTotal()" required>
                        <button type="button" onclick="document.getElementById('row-${rowId}').remove(); calculateTotal();" class="bg-red-600 text-white px-3.5 py-3 rounded-xl font-bold text-xs">X</button>
                    </div>
                </div>
            `);
        }

        window.updateRowData = function(element, rowId) {
            let row = document.getElementById(`row-${rowId}`);
            let selectVal = row.querySelector('.worker-select');
            let selectedOption = selectVal.options[selectVal.selectedIndex];
            let workerName = selectedOption ? selectedOption.getAttribute('data-name') : '';
            let jobVal = row.querySelector('.worker-job').value;
            row.setAttribute('data-worker', (workerName + ' ' + jobVal).toLowerCase());
        }

        window.filterWorkers = function() {
            let queryVal = document.getElementById('searchBox').value.toLowerCase();
            document.querySelectorAll('.worker-row').forEach(row => {
                let data = row.getAttribute('data-worker') || '';
                row.style.display = data.includes(queryVal) ? '' : 'none';
            });
        }

        window.calculateTotal = function() {
            let currentSite = document.getElementById('siteName').value.trim().toLowerCase();
            let pastIncome = 0;
            let pastExpense = 0;

            if (currentSite) {
                allAccountsData.forEach(d => {
                    if ((d.site || '').toLowerCase() === currentSite) {
                        if (d.type === 'income') pastIncome += parseFloat(d.amount) || 0;
                        else pastExpense += parseFloat(d.amount) || 0;
                    }
                });
            }

            let todayIncome = parseFloat(document.getElementById('siteIncome').value) || 0;
            let totalIncome = pastIncome + todayIncome;

            let todayOtherExp = 0;
            document.querySelectorAll('.expense-amount').forEach(input => { todayOtherExp += parseFloat(input.value) || 0; });

            let todayWages = 0;
            document.querySelectorAll('.worker-wage').forEach(input => { todayWages += parseFloat(input.value) || 0; });

            let totalExpense = pastExpense + todayOtherExp + todayWages;
            let balance = totalIncome - totalExpense;

            document.getElementById('displayIncome').innerText = `₹ ${totalIncome}`;
            document.getElementById('displayExpense').innerText = `₹ ${totalExpense}`;
            
            let balanceText = document.getElementById('grandTotal');
            balanceText.innerText = `₹ ${balance}`;
            balanceText.className = balance < 0 ? "text-red-400 font-black text-base" : "text-amber-400 font-black text-base";
        }

        window.shareSiteWhatsApp = function() {
            const siteName = document.getElementById('siteName').value.trim() || "സൈറ്റ്";
            const entryDate = document.getElementById('entryDate').value;
            const income = document.getElementById('siteIncome').value || 0;
            
            let details = "";
            let otherExpTotal = 0;
            
            document.querySelectorAll('#expenseListContainer > div').forEach(row => {
                let desc = row.querySelector('.expense-desc').value.trim();
                let amt = parseFloat(row.querySelector('.expense-amount').value) || 0;
                if (desc && amt > 0) {
                    details += `➖ ${desc}: ₹ ${amt}\n`;
                    otherExpTotal += amt;
                }
            });

            let wagesTotal = 0;
            document.querySelectorAll('.worker-wage').forEach(input => { wagesTotal += parseFloat(input.value) || 0; });

            let totalExp = otherExpTotal + wagesTotal;
            let balance = income - totalExp;

            let msg = `🏗️ *മേസ്തിരി പ്രോ - സൈറ്റ് കണക്ക്* 🏗️\n`;
            msg += `📅 തീയതി: ${entryDate}\n`;
            msg += `📍 സൈറ്റ്: ${siteName}\n`;
            msg += `--------------------------------\n`;
            msg += `💰 ലഭിച്ച വരവ്: ₹ ${income}\n\n`;
            msg += `💸 *ചെലവുകൾ:*\n${details ? details : "ചെലവുകൾ ഒന്നുമില്ല\n"}`;
            msg += `👥 തൊഴിലാളി കൂലി: ₹ ${wagesTotal}\n`;
            msg += `--------------------------------\n`;
            msg += `📉 ആകെ ചെലവ്: ₹ ${totalExp}\n`;
            msg += `💰 ബാലൻസ്: ₹ ${balance}\n`;
            msg += `--------------------------------\n`;
            msg += `👤 ${currentMeshtri}`;

            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
        };

        window.shareWorkersWhatsApp = function() {
            const siteName = document.getElementById('siteName').value.trim() || "സൈറ്റ്";
            const entryDate = document.getElementById('entryDate').value;
            
            let workerDetails = "";
            let totalWages = 0;
            let index = 1;

            document.querySelectorAll('.worker-row').forEach(row => {
                let select = row.querySelector('.worker-select');
                let opt = select.options[select.selectedIndex];
                let wName = opt ? opt.getAttribute('data-name') : 'തൊഴിലാളി';
                let job = row.querySelector('.worker-job').value || 'പണി';
                let wage = parseFloat(row.querySelector('.worker-wage').value) || 0;

                if(wage > 0) {
                    workerDetails += `${index}. ${wName} (${job}) - ₹ ${wage}\n`;
                    totalWages += wage;
                    index++;
                }
            });

            if(totalWages === 0) {
                showCustomAlert("വാട്സാപ്പിൽ അയക്കാൻ തൊഴിലാളികളുടെ കൂലി വിവരങ്ങൾ ചേർത്തിട്ടില്ല!", "ശ്രദ്ധിക്കുക");
                return;
            }

            let msg = `👥 *തൊഴിലാളികളുടെ കൂലി കണക്ക്* 👥\n`;
            msg += `📅 തീയതി: ${entryDate}\n`;
            msg += `📍 സൈറ്റ്: ${siteName}\n`;
            msg += `--------------------------------\n`;
            msg += workerDetails;
            msg += `--------------------------------\n`;
            msg += `💵 ആകെ തൊഴിലാളി കൂലി: ₹ ${totalWages}\n`;
            msg += `--------------------------------\n`;
            msg += `👤 ${currentMeshtri}`;

            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
        };

        window.saveSiteData = async function(event) {
            event.preventDefault();
            const siteName = document.getElementById('siteName').value.trim();
            const entryDate = document.getElementById('entryDate').value;
            const siteIncome = parseFloat(document.getElementById('siteIncome').value) || 0;
            const payerInput = document.getElementById('payerName').value.trim();

            if (!siteName) {
                showCustomAlert("സൈറ്റിന്റെ പേര് നൽകുക!", "ശ്രദ്ധിക്കുക");
                return;
            }

            try {
                if (siteIncome > 0) {
                    await addDoc(collection(db, "accounts"), {
                        meshtriOwner: currentMeshtri,
                        name: payerInput || "ക്ലയന്റ് വരവ്",
                        site: siteName,
                        type: "income",
                        payment: "cash",
                        amount: siteIncome,
                        date: entryDate
                    });
                }

                const expRows = document.querySelectorAll('#expenseListContainer > div');
                for (let r of expRows) {
                    const desc = r.querySelector('.expense-desc').value.trim();
                    const amt = parseFloat(r.querySelector('.expense-amount').value) || 0;
                    if (desc && amt > 0) {
                        await addDoc(collection(db, "accounts"), {
                            meshtriOwner: currentMeshtri,
                            name: desc,
                            site: siteName,
                            type: "other",
                            payment: "cash",
                            amount: amt,
                            date: entryDate
                        });
                    }
                }

                const workerRows = document.querySelectorAll('.worker-row');
                for (let row of workerRows) {
                    const select = row.querySelector('.worker-select');
                    const staffId = select.value;
                    const selectedOption = select.options[select.selectedIndex];
                    const workerName = selectedOption ? selectedOption.getAttribute('data-name') : 'തൊഴിലാളി';
                    const jobTitle = row.querySelector('.worker-job').value.trim() || "പണി";
                    const wageAmount = parseFloat(row.querySelector('.worker-wage').value) || 0;

                    if (staffId && wageAmount > 0) {
                        await addDoc(collection(db, "accounts"), {
                            meshtriOwner: currentMeshtri,
                            staffId: staffId,
                            name: workerName + ` (കൂലി - ${jobTitle})`,
                            site: siteName,
                            type: "wage",
                            payment: "cash",
                            amount: wageAmount,
                            date: entryDate
                        });
                    }
                }

                showCustomAlert("സൈറ്റ് കണക്ക് വിജയകരമായി സേവ് ചെയ്തു!", "വിജയം", false, () => {
                    location.reload();
                });
            } catch (error) {
                console.error("സേവ് ചെയ്യുന്നതിൽ പിഴവ്:", error);
                showCustomAlert("കണക്ക് സേവ് ചെയ്യാൻ കഴിഞ്ഞില്ല!", "പിഴവ്");
            }
        };
    </script>

<body class="text-white min-h-screen pb-12 p-4 font-sans">

    <div class="max-w-md mx-auto space-y-4">

        <div id="appHeader" class="w-full"></div>

<!-- പേരിന്റെ ബോക്സും വ്യക്തമായ ഹോം ബട്ടണും -->

</div>

        <!-- തിരയുന്ന ഭാഗം -->
        <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 shadow-xl">
            <input type="text" id="searchBox" placeholder="🔍 തൊഴിലാളിയുടെ പേരിലോ പണിയിലോ സെർച്ച് ചെയ്യുക..." oninput="filterWorkers()" class="w-full p-3.5 bg-slate-800/80 text-white rounded-xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400">
        </div>

        <form id="siteForm" onsubmit="saveSiteData(event)" class="space-y-4">
            
            <!-- സൈറ്റും ക്ലയന്റും -->
            <div class="bg-slate-900/90 p-5 rounded-3xl border border-slate-800 shadow-xl space-y-4">
                <div>
                    <label class="block text-xs font-black text-slate-400 mb-1.5 uppercase tracking-wide">സൈറ്റിന്റെ പേര് / സ്ഥലം:</label>
                    <div class="space-y-2">
                        <select id="siteSelectDropdown" onchange="onSiteSelectChange()" class="w-full p-3.5 bg-slate-800/80 text-white rounded-2xl border border-slate-700 text-sm font-bold focus:outline-none focus:border-amber-400">
                            <option value="">+ പുതിയ സൈറ്റ് ടൈപ്പ് ചെയ്യുക</option>
                        </select>
                        <input type="text" id="siteName" required placeholder="സൈറ്റ് പേര് ടൈപ്പ് ചെയ്യുക" class="w-full p-3.5 bg-slate-800/80 text-white rounded-2xl border border-slate-700 text-sm font-bold focus:outline-none focus:border-amber-400">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-black text-slate-400 mb-1.5 uppercase tracking-wide">പണം തരുന്നയാൾ (Client):</label>
                    <input type="text" id="payerName" placeholder="പേര് നൽകുക (ആവശ്യമെങ്കിൽ മാത്രം)" class="w-full p-3.5 bg-slate-800/80 text-white rounded-2xl border border-slate-700 text-sm font-bold focus:outline-none focus:border-amber-400">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-black text-slate-400 mb-1.5 uppercase tracking-wide">തീയതി:</label>
                        <input type="date" id="entryDate" required class="w-full p-3.5 bg-slate-800/80 text-white rounded-2xl border border-slate-700 text-sm font-bold focus:outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="block text-xs font-black text-slate-400 mb-1.5 uppercase tracking-wide">ലഭിച്ച വരവ് (₹):</label>
                        <input type="number" id="siteIncome" placeholder="0" value="0" oninput="calculateTotal()" class="w-full p-3.5 bg-slate-800/80 text-white rounded-2xl border border-slate-700 text-sm font-bold focus:outline-none focus:border-amber-400">
                    </div>
                </div>
            </div>

            <!-- മറ്റ് ചെലവുകൾ -->
            <div class="bg-slate-900/90 p-5 rounded-3xl border border-slate-800 shadow-xl space-y-3">
                <h3 class="text-sm font-black text-amber-400">മറ്റു ചെലവുകൾ (വാഹനം, ഭക്ഷണം, മെറ്റീരിയൽ)</h3>
                <div id="expenseListContainer" class="space-y-2"></div>
                <button type="button" onclick="addExpenseRow()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-3 rounded-xl font-black text-xs transition shadow-md">+ ചെലവ് ചേർക്കുക</button>
            </div>

            <!-- തൊഴിലാളികളുടെ വിവരങ്ങൾ -->
            <div class="bg-slate-900/90 p-5 rounded-3xl border border-slate-800 shadow-xl space-y-3">
                <h3 class="text-sm font-black text-amber-400">തൊഴിലാളികളുടെ വിവരങ്ങൾ</h3>
                <div id="workerListContainer" class="space-y-3"></div>
                
                <div class="grid grid-cols-2 gap-2 pt-2">
                    <button type="button" onclick="addWorkerRow()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-3 rounded-xl font-black text-xs transition shadow-md">+ തൊഴിലാളിയെ ചേർക്കുക</button>
                    <a href="staff.html" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded-xl font-black text-xs transition shadow-md text-center flex items-center justify-center">+ പുതിയ ആളെ ചേർക്കുക</a>
                </div>
            </div>

            <!-- സംഗ്രഹം & ലാഭം/നഷ്ടം -->
            <div class="bg-slate-900/90 p-5 rounded-3xl border border-slate-800 shadow-xl space-y-2.5 text-sm">
                <div class="flex justify-between font-bold text-slate-300">
                    <span>ആകെ വരവ്:</span>
                    <span id="displayIncome" class="text-cyan-400">₹ 0</span>
                </div>
                <div class="flex justify-between font-bold text-slate-300">
                    <span>ആകെ ചെലവ്:</span>
                    <span id="displayExpense" class="text-red-400">₹ 0</span>
                </div>
                <div class="flex justify-between font-black text-base border-t border-slate-800 pt-2">
                    <span>ബാക്കി തുക / ബാലൻസ് (ലാഭം/നഷ്ടം):</span>
                    <span id="grandTotal" class="text-amber-400">₹ 0</span>
                </div>
            </div>

            <!-- വാട്സാപ്പ് ഷെയർ ബട്ടണുകൾ -->
            <div class="grid grid-cols-2 gap-2.5 pt-1">
                <button type="button" onclick="shareSiteWhatsApp()" class="bg-emerald-600 hover:bg-emerald-700 text-white p-3.5 rounded-2xl font-black text-xs shadow-lg transition flex items-center justify-center gap-1.5 border border-emerald-400/30">
                    💬 സൈറ്റ് കണക്ക് WhatsApp
                </button>
                <button type="button" onclick="shareWorkersWhatsApp()" class="bg-teal-600 hover:bg-teal-700 text-white p-3.5 rounded-2.5 rounded-2xl font-black text-xs shadow-lg transition flex items-center justify-center gap-1.5 border border-teal-400/30">
                    👥 തൊഴിലാളി കൂലി WhatsApp
                </button>
            </div>

            <!-- സേവ് ബട്ടൺ -->
            <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 p-4 rounded-2xl font-black text-base shadow-xl shadow-amber-950/50 border border-white/20 transition">കണക്ക് സേവ് ചെയ്യുക</button>
        </form>
    </div>

    <!-- കസ്റ്റം അലേർട്ട് / മോഡൽ കോഡ് -->
    <div id="customModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border-2 border-amber-400/50 rounded-3xl p-6 max-w-sm w-full shadow-[0_0_40px_rgba(251,191,36,0.3)] text-center space-y-4">
            <div id="modalIcon" class="text-4xl">⚠️</div>
            <h3 id="modalTitle" class="text-xl font-black text-amber-300">ശ്രദ്ധിക്കുക</h3>
            <p id="modalMessage" class="text-sm font-bold text-blue-100 leading-relaxed">ഇവിടെ മെസ്സേജ് വരുന്നതായിരിക്കും...</p>
            
            <div class="flex gap-3 pt-2">
                <button id="modalCancelBtn" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 p-3 rounded-2xl font-black text-base transition border border-slate-700 hidden">
                    വേണ്ട
                </button>
                <button id="modalOkBtn" class="flex-1 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 p-3 rounded-2xl font-black text-base shadow-lg transition">
                    ശരി
                </button>
            </div>
        </div>
    </div>

</body>
</html>
