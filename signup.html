<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>രജിസ്ട്രേഷൻ - മേസ്തിരി ആപ്പ്</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Manjari', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4">

    <!-- ഗോൾഡൻ തീമിന് ചേരുന്ന ഔട്ടർ ബോർഡറും ഗ്ലോ ഇഫക്റ്റും നൽകിയത് -->
    <div class="bg-gradient-to-r from-[#2c1810] via-[#3d2314] to-[#2c1810] p-8 rounded-3xl shadow-[0_0_35px_rgba(251,191,36,0.4)] w-full max-w-sm border-2 border-amber-400 text-amber-200">
        
        <!-- ഹെഡിംഗ് ഭാഗം -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-black text-amber-300">മേസ്തിരി പ്രോ</h1>
            <p class="text-amber-400 font-bold mt-1 text-sm tracking-wide">സൈറ്റ് മാനേജർ പുതിയ അക്കൗണ്ട്</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-bold text-amber-200 mb-1">യൂസർനെയിം</label>
                <input type="text" id="username" placeholder="ഉദാ: swarajkolayad" 
                       class="w-full p-3.5 text-base bg-slate-900 text-amber-100 border-2 border-amber-400/60 rounded-xl outline-none focus:border-amber-400 placeholder-amber-500/50">
            </div>
            <div>
                <label class="block text-sm font-bold text-amber-200 mb-1">പാസ്‌വേർഡ്</label>
                <input type="password" id="password" placeholder="പുതിയ പാസ്‌വേർഡ്" 
                       class="w-full p-3.5 text-base bg-slate-900 text-amber-100 border-2 border-amber-400/60 rounded-xl outline-none focus:border-amber-400 placeholder-amber-500/50">
            </div>
            <div>
                <label class="block text-sm font-bold text-amber-200 mb-1">രഹസ്യ ചോദ്യം</label>
                <select id="securityQuestion" class="w-full p-3.5 text-sm bg-slate-900 text-amber-100 border-2 border-amber-400/60 rounded-xl outline-none cursor-pointer">
                    <option value="നിങ്ങളുടെ ആദ്യ സ്കൂൾ ഏതാണ്?" class="bg-slate-900 text-amber-100">നിങ്ങളുടെ ആദ്യ സ്കൂൾ ഏതാണ്?</option>
                    <option value="നിങ്ങളുടെ പ്രിയപ്പെട്ട നിറം ഏതാണ്?" class="bg-slate-900 text-amber-100">നിങ്ങളുടെ പ്രിയപ്പെട്ട നിറം ഏതാണ്?</option>
                    <option value="നിങ്ങളുടെ ആദ്യത്തെ വളർത്തുമൃഗത്തിന്റെ പേര്?" class="bg-slate-900 text-amber-100">നിങ്ങളുടെ ആദ്യത്തെ വളർത്തുമൃഗത്തിന്റെ പേര്?</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-bold text-amber-200 mb-1">ഉത്തരം</label>
                <input type="text" id="securityAnswer" placeholder="ഉത്തരം ഇവിടെ നൽകുക" 
                       class="w-full p-3.5 text-base bg-slate-900 text-amber-100 border-2 border-amber-400/60 rounded-xl outline-none focus:border-amber-400 placeholder-amber-500/50">
            </div>
        </div>

        <button id="btnSignup" class="w-full mt-6 bg-gradient-to-r from-amber-500 via-amber-400 to-yellow-500 text-slate-950 p-4 rounded-xl font-black text-lg hover:brightness-110 transition shadow-[0_0_20px_rgba(251,191,36,0.5)] cursor-pointer">
            രജിസ്റ്റർ ചെയ്യുക
        </button>

        <p class="text-center mt-6 text-amber-300 font-bold text-sm">
            ഇതിനകം അക്കൗണ്ട് ഉണ്ടോ? <a href="login.html" class="text-cyan-400 underline">ലോഗിൻ ചെയ്യുക</a>
        </p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById("btnSignup").addEventListener("click", async () => {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const question = document.getElementById('securityQuestion').value;
            const answer = document.getElementById('securityAnswer').value.trim();

            if(!user || !pass || !answer) return alert("എല്ലാ വിവരങ്ങളും കൃത്യമായി പൂരിപ്പിക്കുക!");

            try {
                await createUserWithEmailAndPassword(auth, `${user}@mesthri.com`, pass);
                await setDoc(doc(db, "users", user), {
                    username: user,
                    password: pass,
                    securityQuestion: question,
                    securityAnswer: answer
                });
                alert("രജിസ്ട്രേഷൻ വിജയിച്ചു! ഇപ്പോൾ ലോഗിൻ ചെയ്യാവുന്നതാണ്.");
                window.location.href = "login.html";
            } catch (error) {
                alert("രജിസ്ട്രേഷൻ പരാജയപ്പെട്ടു: " + error.message);
            }
        });
    </script>
</body>
</html>
