<!DOCTYPE html>
<html lang="ml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>കണക്ക് മാനേജർ - മേസ്തിരി പ്രോ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="language.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        import { setupHeader } from './header.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            databaseURL: "https://mesthri-app-default-rtdb.firebaseio.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d",
            measurementId: "G-J9Y5TW9D7T"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app); 
        const currentMeshtri = localStorage.getItem('userName') || "പൊതുമേസ്തിരി";
        
        let editId = null;
        let allTransactions = [];
        let filteredTransactions = [];
        
        // ഭാഷ മാറ്റുന്ന പ്രധാന ഫംഗ്ഷൻ
        window.switchLanguage = function(lang) {
            if (!lang) lang = localStorage.getItem('selectedLang') || 'ml';
            
            document.querySelectorAll('.lang').forEach(el => {
                const key = el.getAttribute('data-key');
                if (typeof words !== 'undefined' && words[key] && words[key][lang]) {
                    el.innerText = words[key][lang];
                }
            });

            document.querySelectorAll('.lang-placeholder').forEach(el => {
                const key = el.getAttribute('data-key');
                if (typeof words !== 'undefined' && words[key] && words[key][lang]) {
                    el.placeholder = words[key][lang];
                }
            });

            // ഡ്രോപ്പ്ഡൗൺ ഓപ്ഷനുകൾ മാറ്റാൻ
            const typeSelect = document.getElementById('type');
            if (typeSelect) {
                const keys = ['income', 'wage', 'materials', 'rent', 'otherExp'];
                Array.from(typeSelect.options).forEach((opt, index) => {
                    if (keys[index] && words[keys[index]] && words[keys[index]][lang]) {
                        opt.text = words[keys[index]][lang];
                    }
                });
            }

            const paySelect = document.getElementById('paymentMethod');
            if (paySelect) {
                const payKeys = ['cash', 'gpay', 'upi', 'bank'];
                Array.from(paySelect.options).forEach((opt, index) => {
                    if (payKeys[index] && words[payKeys[index]] && words[payKeys[index]][lang]) {
                        opt.text = words[payKeys[index]][lang];
                    }
                });
            }
        };

        document.addEventListener("DOMContentLoaded", () => {
            if (typeof setupHeader === 'function') {
                setupHeader('appHeader', true, currentMeshtri);
            }
            fetchLiveAccounts();
            
            const savedLang = localStorage.getItem('selectedLang') || 'ml';
            window.switchLanguage(savedLang);
        });

        // ഹെഡറിൽ നിന്ന് ഭാഷ മാറ്റുമ്പോൾ തനിയെ അപ്ഡേറ്റ് ആകാൻ
        window.addEventListener('languageChanged', (e) => {
            const newLang = (e && e.detail) ? e.detail : (localStorage.getItem('selectedLang') || 'ml');
            window.switchLanguage(newLang);
            renderList();
        });

        window.addEventListener('storage', (e) => {
            if (e.key === 'selectedLang') {
                window.switchLanguage(e.newValue || 'ml');
                renderList();
            }
        });

        window.showToast = function(message, isSuccess = true) {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `px-6 py-4 rounded-2xl text-white font-bold text-base shadow-2xl border backdrop-blur-md flex items-center gap-3 ${
                isSuccess ? 'bg-blue-950/95 border-blue-500 text-blue-200' : 'bg-red-950 border-red-500 text-white'
            }`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        };

        function fetchLiveAccounts() {
            const q = query(collection(db, "accounts"), where("meshtriOwner", "==", currentMeshtri));
            onSnapshot(q, (snapshot) => {
                allTransactions = []; 
                const siteSet = new Set();
                snapshot.forEach(docSnap => {
                    const d = docSnap.data();
                    if (d.meshtriOwner === currentMeshtri) {
                        allTransactions.push({ id: docSnap.id, ...d });
                        if (d.site) siteSet.add(d.site.trim());
                    }
                });

                allTransactions.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

                const siteSelect = document.getElementById('filterSite');
                if (siteSelect) {
                    const currentSelectedSite = siteSelect.value;
                    const lang = localStorage.getItem('selectedLang') || 'ml';
                    const defaultSiteText = (typeof words !== 'undefined' && words['allSites'] && words['allSites'][lang]) ? words['allSites'][lang] : 'എല്ലാ സൈറ്റുകളും';
                    
                    siteSelect.innerHTML = `<option value="" class="lang" data-key="allSites">${defaultSiteText}</option>`;
                    siteSet.forEach(site => {
                        if (site) {
                            const isSelected = site === currentSelectedSite ? 'selected' : '';
                            siteSelect.innerHTML += `<option value="${site}" ${isSelected}>${site}</option>`;
                        }
                    });
                    siteSelect.value = currentSelectedSite;
                }
                renderList();
            });
        }

        window.saveTransaction = async function() {
            const data = { 
                meshtriOwner: currentMeshtri, 
                name: document.getElementById('ownerName').value.trim(), 
                site: document.getElementById('siteName').value.trim() || "പ്രധാന സൈറ്റ്", 
                type: document.getElementById('type').value, 
                payment: document.getElementById('paymentMethod').value, 
                amount: parseFloat(document.getElementById('amount').value) || 0, 
                date: document.getElementById('transDate').value 
            };
            
            if (!data.name) { window.showToast("പേര് / വിവരം നൽകുക!", false); return; }
            if (!data.date) { window.showToast("തീയതി നൽകുക!", false); return; }
            if (!data.amount || data.amount <= 0) { window.showToast("ശരിയായ തുക നൽകുക!", false); return; }

            try {
                if (editId) { 
                    await updateDoc(doc(db, "accounts", editId), data); 
                    window.showToast("കണക്ക് അപ്ഡേറ്റ് ചെയ്തു!", true);
                    editId = null;
                } else { 
                    await addDoc(collection(db, "accounts"), data); 
                    window.showToast("കണക്ക് വിജയകരമായി സേവ് ചെയ്തു!", true);
                    document.getElementById('ownerName').value = '';
                    document.getElementById('amount').value = '';
                }
                fetchLiveAccounts();
            } catch (e) { 
                window.showToast("സേവ് ചെയ്യാൻ കഴിഞ്ഞില്ല.", false); 
            }
        };

        window.renderList = () => {
            const sSite = (document.getElementById('filterSite')?.value || '').trim();
            const sStartDate = document.getElementById('startDate')?.value || '';
            const sEndDate = document.getElementById('endDate')?.value || '';
            const sMonth = document.getElementById('filterMonth')?.value || '';
            const sWorker = (document.getElementById('filterWorker')?.value || '').toLowerCase().trim();
            
            const list = document.getElementById('transactionList');
            if (list) list.innerHTML = '';
            
            let inc = 0, exp = 0;
            filteredTransactions = [];

            allTransactions.forEach(d => {
                const itemDate = d.date || '';
                const itemSite = (d.site || '').trim();
                
                if ((!sSite || itemSite === sSite) && 
                    (!sStartDate || itemDate >= sStartDate) && 
                    (!sEndDate || itemDate <= sEndDate) && 
                    (!sMonth || itemDate.startsWith(sMonth)) && 
                    (!sWorker || (d.name || '').toLowerCase().includes(sWorker))) {
                    
                    filteredTransactions.push(d);
                    const isIncome = (String(d.type || '').toLowerCase() === 'income');
                    const amt = Number(d.amount || 0);

                    if (isIncome) inc += amt; else exp += amt;

                    if (list) {
                        list.innerHTML += `
                            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex justify-between items-center shadow-lg">
                                <div>
                                    <p class="font-black text-base text-white">${d.name}</p>
                                    <p class="text-xs text-slate-400 font-bold mt-0.5">${d.date} • ${d.site} • <span class="text-amber-400 uppercase">${d.type}</span></p>
                                </div>
                                <div class="text-right">
                                    <p class="font-black text-base ${isIncome ? 'text-emerald-400' : 'text-red-400'}">${isIncome ? '+' : '-'}₹${d.amount}</p>
                                    <span class="text-[10px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded-md font-bold uppercase">${d.payment}</span>
                                </div>
                            </div>`;
                    }
                }
            });

            if (document.getElementById('totalIncome')) document.getElementById('totalIncome').innerText = '₹' + inc;
            if (document.getElementById('totalExpense')) document.getElementById('totalExpense').innerText = '₹' + exp;
            if (document.getElementById('netBalance')) document.getElementById('netBalance').innerText = '₹' + (inc - exp);
        };
    </script>
</head>
<body class="text-white min-h-screen pb-12 p-4 font-sans flex justify-center bg-slate-950">
    <div id="toastContainer" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50"></div>
    <div class="w-full max-w-md mx-auto space-y-4 border-4 border-red-500 rounded-[40px] p-4 bg-slate-950 shadow-2xl my-4">
        
        <div id="appHeader" class="w-full"></div>

        <div class="bg-slate-900 border-2 border-red-500 p-4 rounded-2xl flex justify-between items-center">
            <h1 class="text-base font-black">
                <span class="lang text-red-400" data-key="accInfoTitle">വരവ് - ചെലവ് വിവരങ്ങൾ</span>
            </h1>
            <a href="dashboard.html" class="px-4 py-2 bg-red-500 text-white rounded-xl text-xs font-black">Home</a>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div class="bg-emerald-600 p-4 rounded-2xl text-center">
                <p class="text-[10px] font-black lang" data-key="income">വരവ്</p>
                <h2 id="totalIncome" class="text-xl font-black mt-1">₹0</h2>
            </div>
            <div class="bg-red-600 p-4 rounded-2xl text-center">
                <p class="text-[10px] font-black lang" data-key="expenseWage">ചെലവ് / കൂലി</p>
                <h2 id="totalExpense" class="text-xl font-black mt-1">₹0</h2>
            </div>
            <div class="col-span-2 bg-slate-900 p-5 rounded-2xl text-center border border-slate-700">
                <p class="text-[10px] font-black text-slate-300 lang" data-key="netProfit">ലാഭം / ബാക്കി തുക</p>
                <h2 id="netBalance" class="text-2xl font-black mt-1 text-red-400">₹0</h2>
            </div>
        </div>

        <div class="bg-slate-900 p-6 rounded-3xl border border-slate-700 space-y-4">
            <h2 class="text-base font-black text-red-400 lang" data-key="addNewAcc">പുതിയ കണക്ക് ചേർക്കുക</h2>
            <input type="date" id="transDate" class="w-full p-3.5 bg-slate-800 rounded-2xl border border-slate-600 text-white">
            <input type="text" id="ownerName" placeholder="പേര് / വിവരം" class="lang-placeholder w-full p-3.5 bg-slate-800 rounded-2xl border border-slate-600 text-white" data-key="nameDescPlaceholder">
            <input type="text" id="siteName" placeholder="സൈറ്റ്" class="lang-placeholder w-full p-3.5 bg-slate-800 rounded-2xl border border-slate-600 text-white" data-key="sitePlaceholder">
            
            <div class="grid grid-cols-2 gap-3">
                <select id="type" class="p-3.5 bg-slate-800 rounded-2xl border border-slate-600 text-white">
                    <option value="income">വരവ്</option>
                    <option value="wage">കൂലി</option>
                    <option value="material">മെറ്റീരിയൽസ്</option>
                </select>
                <select id="paymentMethod" class="p-3.5 bg-slate-800 rounded-2xl border border-slate-600 text-white">
                    <option value="cash">ക്യാഷ്</option>
                    <option value="gpay">GPay</option>
                </select>
            </div>
            
            <input type="number" id="amount" placeholder="തുക (₹)" class="lang-placeholder w-full p-3.5 bg-slate-800 rounded-2xl border border-slate-600 text-white" data-key="amountPlaceholder">
            <button onclick="saveTransaction()" class="w-full bg-red-500 text-white p-4 rounded-2xl font-black lang" data-key="saveBtn">സേവ് ചെയ്യുക</button>
        </div>

        <div id="transactionList" class="space-y-3 pb-10"></div>
    </div>
</body>
</html>
