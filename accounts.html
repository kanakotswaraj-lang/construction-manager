<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>കണക്ക് മാനേജർ പ്രോ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Manjari', sans-serif; }
        @media print {
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-[#050B18] text-white min-h-screen pb-12 p-4 font-sans">

    <div class="max-w-md mx-auto space-y-4">
        
        <!-- ഹെഡർ ലോഗോയും സ്വാഗതം പേരും ഒന്നിച്ചുള്ള ഭാഗം -->
        <div class="flex flex-col items-center pt-2 pb-2">
            <div class="inline-flex items-center gap-3 px-5 py-2.5 rounded-full bg-slate-900/90 border border-amber-400/50 shadow-lg shadow-amber-500/20 backdrop-blur-md">
                <div class="w-9 h-9 rounded-full overflow-hidden border border-amber-400 flex-shrink-0 bg-amber-400/10 flex items-center justify-center">
                    <img src="icon.png" alt="Logo" class="w-full h-full object-cover">
                </div>
                <div class="flex flex-col text-left">
                    <span class="text-amber-400 font-black text-sm tracking-wide leading-tight">മേസ്തിരി പ്രോ</span>
                    <span class="text-[10px] font-bold text-blue-200 tracking-wider uppercase">SMART SITE MANAGER</span>
                </div>
            </div>
            <!-- സ്വാഗതം പേര് (Cyan കളർ) -->
            <div class="mt-3 text-center">
                <span id="loggedInMeshtri" class="text-sm font-black tracking-wide text-cyan-300 bg-cyan-500/15 px-4 py-1.5 rounded-full border border-cyan-400/40 shadow-lg">
                    സ്വാഗതം, ലോഡിങ്...
                </span>
            </div>
        </div>

        <!-- പേജ് തലക്കെട്ടും ഡാഷ്‌ബോർഡ് ബട്ടണും -->
        <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl flex justify-between items-center shadow-xl backdrop-blur-sm mb-4">
            <div>
                <h1 class="text-lg font-black text-white">വരവ് - ചെലവ് കണക്കുകൾ</h1>
            </div>
            <a href="dashboard.html" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 border border-amber-400/40 text-amber-400 rounded-xl text-xs font-bold shadow-md transition flex items-center gap-1">
                <span>←</span> ഡാഷ്‌ബോർഡ്
            </a>
        </div>

        <!-- ഡാഷ്ബോർഡ് (ആകെ / സൈറ്റ് തിരിച്ച് കാണിക്കാൻ) -->
        <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="bg-emerald-600 text-white p-4 rounded-2xl shadow-md text-center border border-emerald-500/30">
                <p class="text-[10px] opacity-90 uppercase tracking-widest font-black">വരവ്</p>
                <h2 id="totalIncome" class="text-xl font-black mt-1">₹0</h2>
            </div>
            <div class="bg-red-600 text-white p-4 rounded-2xl shadow-md text-center border border-red-500/30">
                <p class="text-[10px] opacity-90 uppercase tracking-widest font-black">ചെലവ് / കൂലി</p>
                <h2 id="totalExpense" class="text-xl font-black mt-1">₹0</h2>
            </div>
            <div class="col-span-2 bg-gradient-to-br from-slate-900 to-slate-800 text-white p-5 rounded-2xl shadow-lg text-center border border-slate-700">
                <p class="text-[10px] opacity-75 uppercase tracking-widest font-black text-slate-300">ലാഭം / ബാക്കി തുക</p>
                <h2 id="netBalance" class="text-2xl font-black mt-1 text-amber-400">₹0</h2>
            </div>
        </div>

        <!-- ഫിൽട്ടർ ഭാഗം (തീയതിയും സൈറ്റും വെച്ച് തിരയാൻ) - ഡാർക്ക് തീം -->
        <div class="bg-slate-900/90 text-white p-5 rounded-3xl shadow-xl mb-6 border border-slate-800 backdrop-blur-sm space-y-3.5 no-print">
            <div>
                <label class="block text-xs font-black text-slate-400 mb-1.5 uppercase tracking-wide">സൈറ്റ് തിരിച്ച് നോക്കാൻ</label>
                <select id="filterSite" onchange="filterList()" class="w-full p-4 bg-slate-800/80 text-white rounded-2xl border border-slate-700 text-sm font-bold focus:outline-none focus:border-amber-400">
                    <option value="">എല്ലാ സൈറ്റുകളും (All Sites)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-black text-slate-400 mb-1.5 uppercase tracking-wide">തീയതി വെച്ച് തിരയുക</label>
                <input type="date" id="filterDate" onchange="filterList()" class="w-full p-4 bg-slate-800/80 text-white rounded-2xl border border-slate-700 text-sm font-bold focus:outline-none focus:border-amber-400">
            </div>
        </div>

        <!-- പുതിയ കണക്ക് ഫോം - ഡാർക്ക് തീം -->
        <div class="bg-slate-900/90 text-white p-6 rounded-3xl shadow-xl mb-6 border border-slate-800 backdrop-blur-sm space-y-3.5 no-print">
            <h2 class="text-base font-black text-amber-400 mb-2">പുതിയ കണക്ക് ചേർക്കുക</h2>
            
            <div>
                <label class="block text-[11px] font-bold text-slate-400 mb-1 ml-1">തീയതി</label>
                <input type="date" id="transDate" class="w-full p-4 bg-slate-800/80 text-white rounded-2xl border border-slate-700 text-sm font-bold focus:outline-none focus:border-amber-400">
            </div>
            
            <input type="text" id="ownerName" placeholder="പേര് / വിവരം" class="w-full p-4 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 text-sm font-bold focus:outline-none focus:border-amber-400">
            <input type="text" id="siteName" placeholder="സ്ഥലം / സൈറ്റ്" class="w-full p-4 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 text-sm font-bold focus:outline-none focus:border-amber-400">

            <div class="grid grid-cols-2 gap-3">
                <select id="type" class="p-4 bg-slate-800/80 text-white rounded-2xl border border-slate-700 text-sm font-bold focus:outline-none focus:border-amber-400">
                    <option value="income">വരവ്</option>
                    <option value="wage">കൂലി</option>
                    <option value="material">മെറ്റീരിയൽസ്</option>
                    <option value="rent">വാടക</option>
                    <option value="other">മറ്റ് ചെലവ് / അഡ്വാൻസ്</option>
                </select>
                <select id="paymentMethod" class="p-4 bg-slate-800/80 text-white rounded-2xl border border-slate-700 text-sm font-bold focus:outline-none focus:border-amber-400">
                    <option value="cash">ക്യാഷ്</option>
                    <option value="gpay">GPay</option>
                    <option value="UPI">യുപിഐ</option>
                    <option value="bank">ബാങ്ക്</option>
                </select>
            </div>

            <input type="number" id="amount" placeholder="തുക (₹)" class="w-full p-4 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 text-sm font-bold focus:outline-none focus:border-amber-400">
            
            <button id="saveBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 p-4 rounded-2xl font-black text-sm transition shadow-lg mt-2">സേവ് ചെയ്യുക</button>
        </div>

        <!-- PDF ഡൗൺലോഡ് -->
        <button onclick="window.print()" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-2xl font-black text-sm mb-6 transition shadow-lg no-print">PDF റിപ്പോർട്ട് ഡൗൺലോഡ് ചെയ്യുക</button>
        
        <!-- ലിസ്റ്റ് ഭാഗം -->
        <div id="transactionList" class="space-y-3 pb-10"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.appspot.com",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d352218"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const currentMeshtri = localStorage.getItem('userName') || "പൊതുമേസ്തിരി";
        document.getElementById('loggedInMeshtri').innerText = "സ്വാഗതം, " + currentMeshtri;

        let editId = null;

        document.getElementById('saveBtn').onclick = async () => {
            const data = {
                meshtriOwner: currentMeshtri,
                name: document.getElementById('ownerName').value.trim(),
                site: document.getElementById('siteName').value.trim() || "പ്രധാന സൈറ്റ്",
                type: document.getElementById('type').value,
                payment: document.getElementById('paymentMethod').value,
                amount: parseFloat(document.getElementById('amount').value) || 0,
                date: document.getElementById('transDate').value
            };

            if (!data.name) return alert("പേര് നൽകുക!");
            if (!data.date) return alert("തീയതി നൽകുക!");

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerText = "സേവ് ആകുന്നുണ്ട്...";
            saveBtn.disabled = true;

            try {
                if (editId) {
                    await updateDoc(doc(db, "accounts", editId), data);
                    editId = null;
                    saveBtn.innerText = "സേവ് ചെയ്യുക";
                } else {
                    await addDoc(collection(db, "accounts"), data);
                    saveBtn.innerText = "സേവ് ചെയ്യുക";
                }
                
                saveBtn.disabled = false;
                document.getElementById('ownerName').value = '';
                document.getElementById('siteName').value = '';
                document.getElementById('amount').value = '';
                document.getElementById('transDate').value = '';
                alert("വിവരങ്ങൾ വിജയകരമായി സേവ് ആയി!");
            } catch (error) {
                saveBtn.disabled = false;
                saveBtn.innerText = "സേവ് ചെയ്യുക";
                alert("സേവ് ചെയ്യുന്നതിൽ തടസ്സമുണ്ടായി.");
                console.error(error);
            }
        };

        let allTransactions = [];

        onSnapshot(query(collection(db, "accounts"), orderBy("date", "desc")), (snapshot) => {
            allTransactions = [];
            const siteSet = new Set();

            snapshot.forEach(docSnap => {
                const d = docSnap.data();
                if (d.meshtriOwner === currentMeshtri) {
                    allTransactions.push({ id: docSnap.id, ...d });
                    if (d.site) siteSet.add(d.site);
                }
            });

            const siteSelect = document.getElementById('filterSite');
            const currentSelectedSite = siteSelect.value;
            siteSelect.innerHTML = '<option value="">എല്ലാ സൈറ്റുകളും (All Sites)</option>';
            siteSet.forEach(site => {
                siteSelect.innerHTML += `<option value="${site}">${site}</option>`;
            });
            siteSelect.value = currentSelectedSite;

            renderList();
        });

        window.renderList = () => {
            const selectedSite = document.getElementById('filterSite').value.toLowerCase();
            const selectedDate = document.getElementById('filterDate').value;
            const list = document.getElementById('transactionList');
            list.innerHTML = '';
            let inc = 0, exp = 0;

            allTransactions.forEach(d => {
                const itemSite = (d.site || '').toLowerCase();
                const itemDate = d.date || '';

                const matchesSite = !selectedSite || itemSite === selectedSite;
                const matchesDate = !selectedDate || itemDate === selectedDate;

                if (matchesSite && matchesDate) {
                    let categoryColor = "text-red-400";
                    if(d.type === 'income') {
                        categoryColor = "text-emerald-400";
                        inc += parseFloat(d.amount) || 0;
                    } else {
                        exp += parseFloat(d.amount) || 0;
                    }

                    let typeName = d.type === 'income' ? 'വരവ്' : 
                                   d.type === 'wage' ? 'കൂലി' : 
                                   d.type === 'material' ? 'മെറ്റീരിയൽസ്' : 
                                   d.type === 'rent' ? 'വാടക' : 'മറ്റ് ചെലവ്';

                    let paymentText = d.payment === 'cash' ? '💵 ക്യാഷ്' : 
                                      d.payment === 'gpay' ? '📱 GPay' : 
                                      d.payment === 'UPI' ? '📱 യുപിഐ' : '🏦 ബാങ്ക്';

                    list.innerHTML += `
                        <div class="bg-slate-900/90 text-white p-4 rounded-2xl shadow-xl mb-3 border border-slate-800 backdrop-blur-sm flex justify-between items-center">
                            <div>
                                <p class="font-black text-base text-white">${d.name}</p>
                                <p class="text-xs text-slate-400 font-bold">${d.date || ''} • 📍 ${d.site || 'സൈറ്റ് ഇല്ല'} • 
                                   <span class="font-bold text-slate-300">${paymentText}</span> • 
                                   <span class="capitalize font-bold text-amber-400">${typeName}</span>
                                </p>
                            </div>
                            <div class="text-right">
                                <p class="font-black text-base ${categoryColor}">₹${d.amount}</p>
                                <div class="flex gap-2.5 mt-1 justify-end no-print">
                                    <button onclick="window.editTransaction('${d.id}', '${d.name}', '${d.site || ''}', '${d.type}', '${d.payment}', ${d.amount}, '${d.date}')" class="text-amber-400 hover:text-amber-300 text-xs font-black">എഡിറ്റ്</button>
                                    <button onclick="window.del('${d.id}')" class="text-red-400 hover:text-red-300 text-xs font-black">ഡിലീറ്റ്</button>
                                </div>
                            </div>
                        </div>`;
                }
            });

            document.getElementById('totalIncome').innerText = "₹" + inc;
            document.getElementById('totalExpense').innerText = "₹" + exp;
            document.getElementById('netBalance').innerText = "₹" + (inc - exp);
        };

        window.filterList = () => {
            window.renderList();
        };

        window.editTransaction = (id, name, site, type, payment, amount, date) => {
            editId = id;
            document.getElementById('ownerName').value = name;
            document.getElementById('siteName').value = site;
            document.getElementById('type').value = type;
            document.getElementById('paymentMethod').value = payment;
            document.getElementById('amount').value = amount;
            document.getElementById('transDate').value = date;
            document.getElementById('saveBtn').innerText = "അപ്ഡേറ്റ് ചെയ്യുക";
            window.scrollTo(0, 0);
        };

        window.del = async (id) => { 
            if(confirm("ഈ കണക്ക് ഡിലീറ്റ് ചെയ്യണോ?")) await deleteDoc(doc(db, "accounts", id)); 
        };
    </script>
</body>
</html>
