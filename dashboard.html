<!-- പ്രധാന ഹെഡർ & പ്രൊഫൈൽ ഭാഗം -->

        <!-- തീയതിയും ആഴ്ച ദിവസവും കാണിക്കുന്ന ബോക്സ് -->

<!-- ഹെഡർ ഭാഗം അവസാനിക്കുന്നു -->

<script>
    window.onload = function() {
        const userName = localStorage.getItem('userName') || "മേസ്തിരി";
        document.getElementById('loggedInMeshtri').innerText = "സ്വാഗതം, " + userName;

        // പ്രൊഫൈൽ ഫോട്ടോ സെറ്റ് ചെയ്യൽ
        const savedPhoto = localStorage.getItem('profilePhoto');
        if (savedPhoto) {
            document.getElementById('profileImage').src = savedPhoto;
        } else {
            document.getElementById('profileImage').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(userName)}&background=0D1117&color=FBBF24&bold=true&size=128`;
        }

        // കവർ ഫോട്ടോ സെറ്റ് ചെയ്യൽ
        const savedCover = localStorage.getItem('coverPhoto');
        if (savedCover) {
            document.getElementById('coverImage').src = savedCover;
        } else {
            document.getElementById('coverImage').src = "https://images.unsplash.com/photo-1541888946425-d0fbb18f17e2?q=80&w=1000&auto=format&fit=crop";
        }

        const today = new Date();
        const days = ['ഞായറാഴ്ച', 'തിങ്കളാഴ്ച', 'ചൊവ്വാഴ്ച', 'ബുധനാഴ്ച', 'വ്യാഴാഴ്ച', 'വെള്ളിയാഴ്ച', 'ശനിയാഴ്ച'];
        const dayName = days[today.getDay()];
        
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        const dateStr = today.toLocaleDateString('ml-IN', options);
        
        const dateElement = document.getElementById('currentDate');
        if(dateElement) {
            dateElement.innerText = `ഇന്ന്: ${dayName}, ${dateStr}`;
        }
    };

    function updateProfilePhoto(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e){
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 300;
                    canvas.height = 300;
                    ctx.drawImage(img, 0, 0, 300, 300);
                    const compressedData = canvas.toDataURL('image/jpeg', 0.7);
                    
                    document.getElementById('profileImage').src = compressedData;
                    localStorage.setItem('profilePhoto', compressedData);
                }
            };
            reader.readAsDataURL(file);
        }
    }

    function updateCoverPhoto(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e){
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 800;
                    canvas.height = 400;
                    ctx.drawImage(img, 0, 0, 800, 400);
                    const compressedData = canvas.toDataURL('image/jpeg', 0.7);

                    document.getElementById('coverImage').src = compressedData;
                    localStorage.setItem('coverPhoto', compressedData);
                }
            };
            reader.readAsDataURL(file);
        }
    }

    function logoutUser() {
        localStorage.removeItem('userName');
        localStorage.removeItem('profilePhoto');
        localStorage.removeItem('coverPhoto');
        window.location.href = "login.html";
    }
</script>
