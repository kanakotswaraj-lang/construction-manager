<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- ആപ്പ് ലോഗോ -->
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        body { 
            font-family: 'Manjari', sans-serif; 
            background-color: #050B18 !important;
        }
    </style>

    <title>മേസ്തിരി പ്രോ - ഡാഷ്‌ബോർഡ്</title>
</head>
<body class="bg-[#050B18] text-white min-h-screen p-4 font-sans pb-12">
    <div class="max-w-md mx-auto space-y-4">

        <!-- പ്രധാന ഹെഡർ & പ്രൊഫൈൽ ഭാഗം (മുകളിൽ) -->
        <div class="bg-slate-900 rounded-[2.5rem] shadow-2xl text-white border border-slate-800 relative overflow-hidden mt-2">
            
            <!-- കവർ ബാനർ ഭാഗം -->
            <div class="relative h-36 w-full bg-gradient-to-r from-slate-800 via-slate-900 to-slate-800 group overflow-hidden border-b border-slate-800">
                <label for="coverUpload" class="cursor-pointer block w-full h-full">
                    <img id="coverImage" src="" class="w-full h-full object-cover transition duration-300 group-hover:opacity-75 opacity-90" onerror="this.src='https://images.unsplash.com/photo-1541888946425-d0fbb18f17e2?q=80&w=1000&auto=format&fit=crop'">
                    <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                        <span class="text-xs font-black bg-black/70 px-3.5 py-2 rounded-full text-white backdrop-blur-sm border border-slate-700">📷 കവർ മാറ്റുക</span>
                    </div>
                </label>
                <input type="file" id="coverUpload" class="hidden" accept="image/*" onchange="updateCoverPhoto(event)">
                
                <!-- ലോഗ് ഔട്ട് ബട്ടൺ -->
                <button onclick="logoutUser()" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-slate-900/90 backdrop-blur-md text-red-400 border border-slate-700 flex items-center justify-center font-bold shadow-lg hover:bg-red-500 hover:text-white transition duration-300 z-10" title="ലോഗ് ഔട്ട്">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                </button>
            </div>

            <!-- പ്രൊഫൈൽ ഫോട്ടോയും തീയതിയും -->
            <div class="px-6 pb-6 pt-0 relative text-center">
                <!-- പ്രൊഫൈൽ ഫോട്ടോ അപ്‌ലോഡ് ഭാഗം -->
                <label for="photoUpload" class="cursor-pointer group relative inline-block -mt-10 mb-3">
                    <div class="relative p-1.5 bg-slate-900 rounded-3xl shadow-2xl border-2 border-amber-400/60">
                        <img id="profileImage" src="" class="w-24 h-24 rounded-2xl object-cover transition group-hover:opacity-75 bg-slate-800" onerror="this.src='https://ui-avatars.com/api/?name=User&background=0D1117&color=FBBF24&bold=true'">
                        <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition rounded-2xl bg-black/40">
                            <span class="text-[10px] font-black bg-black/80 px-2.5 py-1 rounded-md text-white backdrop-blur-sm">മാറ്റുക</span>
                        </div>
                    </div>
                    <input type="file" id="photoUpload" class="hidden" accept="image/*" onchange="updateProfilePhoto(event)">
                </label>

                <!-- തീയതിയും ആഴ്ച ദിവസവും കാണിക്കുന്ന ബോക്സ് -->
                <div class="mt-1 flex justify-center">
                    <div class="bg-slate-800/90 border border-slate-700 px-4 py-1.5 rounded-full flex items-center gap-2 shadow-inner backdrop-blur-sm">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                        <p id="currentDate" class="text-xs font-bold text-slate-200">ലോഡ് ചെയ്യുന്നു...</p>
                    </div>
                </div>
            </div>
        </div>
        <!-- പ്രൊഫൈൽ ഭാഗം അവസാനിക്കുന്നു -->

        <!-- ഹെഡർ ലോഗോയും സ്വാഗതം പേരും (അതിന് താഴെ) -->
        <div class="flex flex-col items-center pt-2 pb-2">
            <div class="inline-flex items-center gap-4 px-7 py-3.5 rounded-full bg-slate-900/95 border border-amber-400/60 shadow-xl shadow-amber-500/20 backdrop-blur-md">
                <div class="w-14 h-14 rounded-full overflow-hidden border-2 border-amber-400 flex-shrink-0 bg-slate-800 flex items-center justify-center shadow-lg">
                    <img src="icon.png" alt="Logo" class="w-full h-full object-cover" onerror="this.src='https://ui-avatars.com/api/?name=M&background=0D1117&color=FBBF24&bold=true'">
                </div>
                <div class="flex flex-col text-left">
                    <span class="text-amber-400 font-black text-xl tracking-wide leading-tight drop-shadow-[0_0_12px_rgba(251,191,36,0.5)]">മേസ്തിരി പ്രോ</span>
                    <span class="text-xs font-bold text-blue-200 tracking-wider uppercase">SMART SITE MANAGER</span>
                </div>
            </div>
            <!-- സ്വാഗതം പേര് -->
            <div class="mt-3 text-center">
                <span id="loggedInMeshtri" class="text-sm font-black tracking-wide text-cyan-300 bg-cyan-500/15 px-5 py-2 rounded-full border border-cyan-400/40 shadow-lg">
                    സ്വാഗതം, സുരാജ്
                </span>
            </div>
        </div>

        <!-- പുതിയതായി ചേർത്ത ലാഭ-നഷ്ട സംഗ്രഹ ബോക്സുകൾ (Profit & Loss Summary Cards) -->
        <div class="grid grid-cols-3 gap-2 pt-1">
            <div class="bg-slate-900/90 border border-emerald-500/40 p-3 rounded-2xl text-center shadow-lg">
                <span class="text-[11px] font-bold text-emerald-400 block">വരുമാനം</span>
                <p id="dashTotalIncome" class="text-sm font-black text-white mt-1">₹ 0</p>
            </div>
            <div class="bg-slate-900/90 border border-rose-500/40 p-3 rounded-2xl text-center shadow-lg">
                <span class="text-[11px] font-bold text-rose-400 block">ചെലവ്</span>
                <p id="dashTotalExpense" class="text-sm font-black text-white mt-1">₹ 0</p>
            </div>
            <div class="bg-slate-900/90 border border-blue-500/40 p-3 rounded-2xl text-center shadow-lg">
                <span id="dashProfitLabel" class="text-[11px] font-bold text-blue-400 block">ലാഭം</span>
                <p id="dashNetProfit" class="text-sm font-black text-white mt-1">₹ 0</p>
            </div>
        </div>

        <!-- ബട്ടണുകൾ -->
        <div class="space-y-3.5 pt-2">
            <a href="staff.html" class="bg-indigo-900/90 border border-indigo-700/50 p-5 rounded-2xl shadow-lg flex items-center justify-between text-white hover:bg-indigo-800 transition duration-200">
                <p class="text-base font-black">👥 ജീവനക്കാരുടെ ശമ്പളം</p>
                <span class="text-indigo-300 font-bold">→</span>
            </a>
            <a href="rentals.html" class="bg-emerald-900/90 border border-emerald-700/50 p-5 rounded-2xl shadow-lg flex items-center justify-between text-white hover:bg-emerald-800 transition duration-200">
                <p class="text-base font-black">🏗️ വാടക ഉപകരണങ്ങൾ</p>
                <span class="text-emerald-300 font-bold">→</span>
            </a>
            <a href="materials.html" class="bg-blue-900/90 border border-blue-700/50 p-5 rounded-2xl shadow-lg flex items-center justify-between text-white hover:bg-blue-800 transition duration-200">
                <p class="text-base font-black">🧱 മെറ്റീരിയൽസ്</p>
                <span class="text-blue-300 font-bold">→</span>
            </a>
            <a href="accounts.html" class="bg-rose-900/90 border border-rose-700/50 p-5 rounded-2xl shadow-lg flex items-center justify-between text-white hover:bg-rose-800 transition duration-200">
                <p class="text-base font-black">📊 വരവ് - ചെലവ്</p>
                <span class="text-rose-300 font-bold">→</span>
            </a>
            <a href="estimator.html" class="bg-amber-900/90 border border-amber-700/50 p-5 rounded-2xl shadow-lg flex items-center justify-between text-white hover:bg-amber-800 transition duration-200">
                <p class="text-base font-black">📐 മെറ്റീരിയൽ & ലേബർ എസ്റ്റിമേറ്റ്</p>
                <span class="text-amber-300 font-bold">→</span>
            </a>
        </div>

        <!-- വാട്സാപ്പ് സപ്പോർട്ട് -->
        <a href="https://wa.me/916238020523" class="mt-6 bg-emerald-600 text-white p-4 rounded-2xl flex items-center justify-center font-black text-sm shadow-lg hover:bg-emerald-500 transition duration-200 border border-emerald-500">
            💬 വാട്സാപ്പിൽ ബന്ധപ്പെടുക (916238020523)
        </a>
    </div>

    <!-- ജാവാസ്ക്രിപ്റ്റ് കോഡ് -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            let userName = localStorage.getItem('userName');
            if (!userName) {
                userName = 'സുരാജ്';
                localStorage.setItem('userName', userName);
            }
            
            const nameElement = document.getElementById('loggedInMeshtri');
            if(nameElement) {
                nameElement.innerText = "സ്വാഗതം, " + userName;
            }

            // പ്രൊഫൈൽ ഫോട്ടോ ലോഡ് ചെയ്യുന്നു
            const savedPhoto = localStorage.getItem('profilePhoto');
            if (savedPhoto) {
                document.getElementById('profileImage').src = savedPhoto;
            } else {
                document.getElementById('profileImage').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(userName)}&background=0D1117&color=FBBF24&bold=true&size=128`;
            }

            // കവർ ഫോട്ടോ ലോഡ് ചെയ്യുന്നു
            const savedCover = localStorage.getItem('coverPhoto');
            if (savedCover) {
                document.getElementById('coverImage').src = savedCover;
            } else {
                document.getElementById('coverImage').src = "https://images.unsplash.com/photo-1541888946425-d0fbb18f17e2?q=80&w=1000&auto=format&fit=crop";
            }

            // തീയതി സെറ്റ് ചെയ്യുന്നു
            const today = new Date();
            const days = ['ഞായറാഴ്ച', 'തിങ്കളാഴ്ച', 'ചൊവ്വാഴ്ച', 'ബുധനാഴ്ച', 'വ്യാഴാഴ്ച', 'വെള്ളിയാഴ്ച', 'ശനിയാഴ്ച'];
            const dayName = days[today.getDay()];
            
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = today.toLocaleDateString('ml-IN', options);
            
            const dateElement = document.getElementById('currentDate');
            if(dateElement) {
                dateElement.innerText = `ഇന്ന്: ${dayName}, ${dateStr}`;
            }

            // വരവ്-ചെലവ് കണക്കുകൾ ലോഡ് ചെയ്ത് ലാഭം/നഷ്ടം കാണിക്കുന്നു
            loadDashboardFinancials();
        });

        // ലോക്കൽ സ്റ്റോറേജിൽ നിന്നോ ഫയർബേസിൽ നിന്നോ കണക്കുകൾ എടുത്ത് ഡാഷ്‌ബോർഡിൽ കാണിക്കുന്ന ഫങ്ഷൻ
        function loadDashboardFinancials() {
            try {
                let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
                let totalInc = 0;
                let totalExp = 0;

                transactions.forEach(item => {
                    let amount = parseFloat(item.amount) || 0;
                    if (item.type === 'income' || item.category === 'income') {
                        totalInc += amount;
                    } else {
                        totalExp += amount;
                    }
                });

                let net = totalInc - totalExp;

                document.getElementById('dashTotalIncome').innerText = `₹ ${totalInc.toLocaleString('en-IN')}`;
                document.getElementById('dashTotalExpense').innerText = `₹ ${totalExp.toLocaleString('en-IN')}`;
                
                let netEl = document.getElementById('dashNetProfit');
                let labelEl = document.getElementById('dashProfitLabel');

                if (net >= 0) {
                    labelEl.innerText = "ശുദ്ധ ലാഭം";
                    labelEl.className = "text-[11px] font-bold text-emerald-400 block";
                    netEl.innerText = `₹ ${net.toLocaleString('en-IN')}`;
                    netEl.style.color = "#34d399";
                } else {
                    labelEl.innerText = "നഷ്ടം";
                    labelEl.className = "text-[11px] font-bold text-rose-400 block";
                    netEl.innerText = `₹ ${Math.abs(net).toLocaleString('en-IN')}`;
                    netEl.style.color = "#fb7185";
                }
            } catch (e) {
                console.log("Financial load error:", e);
            }
        }

        // പ്രൊഫൈൽ ഫോട്ടോ കംപ്രസ് ചെയ്ത് സേവ് ചെയ്യുന്നു
        function updateProfilePhoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        canvas.width = 300;
                        canvas.height = 300;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, 300, 300);
                        const compressedData = canvas.toDataURL('image/jpeg', 0.7);
                        
                        document.getElementById('profileImage').src = compressedData;
                        try {
                            localStorage.setItem('profilePhoto', compressedData);
                        } catch (err) {
                            alert('സ്റ്റോറേജ് ഫുൾ ആണ്.');
                        }
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        // കവർ ഫോട്ടോ കംപ്രസ് ചെയ്ത് സുരക്ഷിതമായി സേവ് ചെയ്യുന്നു
        function updateCoverPhoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        canvas.width = 600;
                        canvas.height = 300;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, 600, 300);
                        const compressedData = canvas.toDataURL('image/jpeg', 0.7);

                        document.getElementById('coverImage').src = compressedData;
                        try {
                            localStorage.setItem('coverPhoto', compressedData);
                        } catch (err) {
                            alert('സ്റ്റോറേജ് ഫുൾ ആണ്.');
                        }
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function logoutUser() {
            localStorage.removeItem('userName');
            localStorage.removeItem('profilePhoto');
            localStorage.removeItem('coverPhoto');
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
