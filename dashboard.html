    <title>മേസ്തിരി പ്രോ - ഡാഷ്‌ബോർഡ്</title>

<body class="bg-[#050B18] text-white min-h-screen p-4 font-sans pb-12">
    <div class="max-w-md mx-auto space-y-4">

<!-- ഹെഡർ ഭാഗം -->
<div class="bg-slate-900 rounded-[2.5rem] shadow-2xl text-white border border-slate-800 relative overflow-hidden">
    
    <!-- കവർ ബാനർ ഭാഗം -->
    <div class="relative h-36 w-full bg-slate-800 group overflow-hidden">
        <label for="coverUpload" class="cursor-pointer block w-full h-full">
            <img id="coverImage" src="https://images.unsplash.com/photo-1541888946425-d0fbb18f17e2?q=80&w=1000&auto=format&fit=crop" class="w-full h-full object-cover transition duration-300 group-hover:opacity-75">
            <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                <span class="text-xs font-black bg-black/60 px-3.5 py-2 rounded-full text-white backdrop-blur-sm border border-slate-700">📷 കവർ മാറ്റുക</span>
            </div>
        </label>
        <input type="file" id="coverUpload" class="hidden" accept="image/*" onchange="updateCoverPhoto(event)">
        
        <!-- ലോഗ് ഔട്ട് ബട്ടൺ -->
        <button onclick="logoutUser()" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-slate-900/90 backdrop-blur-md text-red-400 border border-slate-700 flex items-center justify-center font-bold shadow-lg hover:bg-red-500 hover:text-white transition duration-300 z-10" title="ലോഗ് ഔട്ട്">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
        </button>
    </div>

    <!-- പ്രൊഫൈൽ ഫോട്ടോയും വിവരങ്ങളും -->
    <div class="px-6 pb-6 pt-0 relative">
        <!-- പ്രൊഫൈൽ ഫോട്ടോ അപ്‌ലോഡ് ഭാഗം -->
        <label for="photoUpload" class="cursor-pointer group relative inline-block -mt-10 mb-3">
            <div class="relative p-1.5 bg-slate-900 rounded-3xl shadow-2xl border-2 border-amber-400/60">
                <img id="profileImage" src="https://ui-avatars.com/api/?name=User" class="w-24 h-24 rounded-2xl object-cover transition group-hover:opacity-75">
                <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition rounded-2xl bg-black/40">
                    <span class="text-[10px] font-black bg-black/80 px-2.5 py-1 rounded-md text-white backdrop-blur-sm">മാറ്റുക</span>
                </div>
            </div>
            <input type="file" id="photoUpload" class="hidden" accept="image/*" onchange="updateProfilePhoto(event)">
        </label>

        <!-- ടൈറ്റിലും വിവരങ്ങളും -->
        <div class="text-center space-y-1">
            <h1 class="text-2xl font-black text-white tracking-tight flex items-center justify-center gap-1.5">
                മേസ്തിരി <span class="text-amber-400 drop-shadow-[0_0_15px_rgba(251,191,36,0.4)]">പ്രോ</span>
            </h1>
            <p class="text-[10px] font-bold tracking-widest text-blue-300 uppercase">SMART SITE MANAGER</p>
            
            <!-- ലോഗിൻ ചെയ്ത ആളുടെ പേര് -->
            <p id="meshtriNameDisplay" class="text-cyan-300 font-black text-base pt-1">സ്വാഗതം, മേസ്തിരി</p>
        </div>

        <!-- തീയതിയും ആഴ്ച ദിവസവും കാണിക്കുന്ന ബോക്സ് -->
        <div class="mt-4 flex justify-center">
            <div class="bg-slate-800/90 border border-slate-700 px-4 py-1.5 rounded-full flex items-center gap-2 shadow-inner backdrop-blur-sm">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <p id="currentDate" class="text-xs font-bold text-slate-200"></p>
            </div>
        </div>
    </div>
</div>
<!-- ഹെഡർ ഭാഗം അവസാനിക്കുന്നു -->

<script>
    window.onload = function() {
        const userName = localStorage.getItem('userName');
        if (userName) {
            document.getElementById('meshtriNameDisplay').innerText = "സ്വാഗതം, " + userName;
        }

        const today = new Date();
        const days = ['ഞായറാഴ്ച', 'തിങ്കളാഴ്ച', 'ചൊവ്വാഴ്ച', 'ബുധനാഴ്ച', 'വ്യാഴാഴ്ച', 'വെള്ളിയാഴ്ച', 'ശനിയാഴ്ച'];
        const dayName = days[today.getDay()];
        
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        const dateStr = today.toLocaleDateString('ml-IN', options);
        
        const dateElement = document.getElementById('currentDate');
        if(dateElement) {
            dateElement.innerText = `ഇന്ന്: ${dayName}, ${dateStr}`;
        }

        const savedPhoto = localStorage.getItem('profilePhoto');
        if (savedPhoto) {
            document.getElementById('profileImage').src = savedPhoto;
        }

        const savedCover = localStorage.getItem('coverPhoto');
        if (savedCover) {
            document.getElementById('coverImage').src = savedCover;
        }
    };

    function updateProfilePhoto(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e){
                document.getElementById('profileImage').src = e.target.result;
                localStorage.setItem('profilePhoto', e.target.result);
            };
            reader.readAsDataURL(file);
        }
    }

    function updateCoverPhoto(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e){
                document.getElementById('coverImage').src = e.target.result;
                localStorage.setItem('coverPhoto', e.target.result);
            };
            reader.readAsDataURL(file);
        }
    }

    function logoutUser() {
        localStorage.removeItem('userName');
        localStorage.removeItem('profilePhoto');
        localStorage.removeItem('coverPhoto');
        window.location.href = "login.html";
    }
</script>
