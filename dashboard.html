    <!-- ഫയർബേസ് സ്ക്രിപ്റ്റുകൾ (Firebase SDKs 9.22.0) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.appspot.com",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d352218"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.addEventListener("DOMContentLoaded", async () => {
            let userName = localStorage.getItem('userName');
            if (!userName) {
                userName = 'സുരാജ്';
                localStorage.setItem('userName', userName);
            }
            
            const nameElement = document.getElementById('loggedInMeshtri');
            if(nameElement) {
                nameElement.innerText = "സ്വാഗതം, " + userName;
            }

            // ഫയർബേസിൽ നിന്ന് യൂസറുടെ പ്രൊഫൈൽ & കവർ ഫോട്ടോകൾ ലോഡ് ചെയ്യുന്നു
            try {
                const userDocRef = doc(db, "users", userName);
                const userSnap = await getDoc(userDocRef);
                
                if (userSnap.exists()) {
                    const userData = userSnap.data();
                    
                    // പ്രൊഫൈൽ ഫോട്ടോ സെറ്റ് ചെയ്യുന്നു
                    if (userData.profilePhoto) {
                        document.getElementById('profileImage').src = userData.profilePhoto;
                        localStorage.setItem('profilePhoto', userData.profilePhoto);
                    } else {
                        setFallbackProfile(userName);
                    }

                    // കവർ ഫോട്ടോ സെറ്റ് ചെയ്യുന്നു
                    if (userData.coverPhoto) {
                        document.getElementById('coverImage').src = userData.coverPhoto;
                        localStorage.setItem('coverPhoto', userData.coverPhoto);
                    } else {
                        document.getElementById('coverImage').src = "https://images.unsplash.com/photo-1541888946425-d0fbb18f17e2?q=80&w=1000&auto=format&fit=crop";
                    }
                } else {
                    setFallbackProfile(userName);
                }
            } catch (error) {
                console.log("Error loading photos:", error);
                setFallbackProfile(userName);
            }

            // തീയതി സെറ്റ് ചെയ്യുന്നു
            const today = new Date();
            const days = ['ഞായറാഴ്ച', 'തിങ്കളാഴ്ച', 'ചൊവ്വാഴ്ച', 'ബുധനാഴ്ച', 'വ്യാഴാഴ്ച', 'വെള്ളിയാഴ്ച', 'ശനിയാഴ്ച'];
            const dayName = days[today.getDay()];
            
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = today.toLocaleDateString('ml-IN', options);
            
            const dateElement = document.getElementById('currentDate');
            if(dateElement) {
                dateElement.innerText = `ഇന്ന്: ${dayName}, ${dateStr}`;
            }

            // ഫയർബേസിൽ നിന്ന് തത്സമയം കണക്കുകൾ എടുക്കുന്നു
            fetchDashboardData(db, userName);
        });

        function setFallbackProfile(userName) {
            const savedPhoto = localStorage.getItem('profilePhoto');
            if (savedPhoto) {
                document.getElementById('profileImage').src = savedPhoto;
            } else {
                document.getElementById('profileImage').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(userName)}&background=0D1117&color=FBBF24&bold=true&size=128`;
            }

            const savedCover = localStorage.getItem('coverPhoto');
            if (savedCover) {
                document.getElementById('coverImage').src = savedCover;
            } else {
                document.getElementById('coverImage').src = "https://images.unsplash.com/photo-1541888946425-d0fbb18f17e2?q=80&w=1000&auto=format&fit=crop";
            }
        }

        // പ്രൊഫൈൽ ഫോട്ടോ ഓട്ടോമാറ്റിക്കായി കംപ്രസ് ചെയ്ത് ഫയർബേസിലും ലോക്കൽ സ്റ്റോറേജിലും സേവ് ചെയ്യുന്നു
        window.updateProfilePhoto = function(event) {
            const file = event.target.files[0];
            let userName = localStorage.getItem('userName') || 'സുരാജ്';
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = async function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 200;
                        const MAX_HEIGHT = 200;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        const compressedData = canvas.toDataURL('image/jpeg', 0.6);
                        
                        document.getElementById('profileImage').src = compressedData;
                        localStorage.setItem('profilePhoto', compressedData);

                        // ഫയർബേസിലേക്ക് സേവ് ചെയ്യുന്നു
                        try {
                            const userDocRef = doc(db, "users", userName);
                            await setDoc(userDocRef, { profilePhoto: compressedData }, { merge: true });
                        } catch (err) {
                            console.log("Firebase save error:", err);
                        }
                    }
                };
                reader.readAsDataURL(file);
            }
        };

        // കവർ ഫോട്ടോ ഓട്ടോമാറ്റിക്കായി കംപ്രസ് ചെയ്ത് ഫയർബേസിലും ലോക്കൽ സ്റ്റോറേജിലും സേവ് ചെയ്യുന്നു
        window.updateCoverPhoto = function(event) {
            const file = event.target.files[0];
            let userName = localStorage.getItem('userName') || 'സുരാജ്';
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = async function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 600;
                        const MAX_HEIGHT = 300;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        const compressedData = canvas.toDataURL('image/jpeg', 0.6);

                        document.getElementById('coverImage').src = compressedData;
                        localStorage.setItem('coverPhoto', compressedData);

                        // ഫയർബേസിലേക്ക് സേവ് ചെയ്യുന്നു
                        try {
                            const userDocRef = doc(db, "users", userName);
                            await setDoc(userDocRef, { coverPhoto: compressedData }, { merge: true });
                        } catch (err) {
                            console.log("Firebase save error:", err);
                        }
                    }
                };
                reader.readAsDataURL(file);
            }
        };

        function fetchDashboardData(db, currentMeshtri) {
            onSnapshot(query(collection(db, "accounts")), (snapshot) => {
                let totalInc = 0;
                let totalExp = 0;

                snapshot.forEach(docSnap => {
                    const d = docSnap.data();
                    if (d.meshtriOwner === currentMeshtri) {
                        let amount = parseFloat(d.amount) || 0;
                        if (d.type === 'income') {
                            totalInc += amount;
                        } else {
                            totalExp += amount;
                        }
                    }
                });

                let net = totalInc - totalExp;

                document.getElementById('dashTotalIncome').innerText = `₹ ${totalInc.toLocaleString('en-IN')}`;
                document.getElementById('dashTotalExpense').innerText = `₹ ${totalExp.toLocaleString('en-IN')}`;
                
                let netEl = document.getElementById('dashNetProfit');
                let labelEl = document.getElementById('dashProfitLabel');

                if (net >= 0) {
                    labelEl.innerText = "ശുദ്ധ ലാഭം";
                    labelEl.className = "text-[11px] font-black text-emerald-400 block tracking-wider uppercase";
                    netEl.innerText = `₹ ${net.toLocaleString('en-IN')}`;
                    netEl.style.color = "#34d399";
                } else {
                    labelEl.innerText = "നഷ്ടം";
                    labelEl.className = "text-[11px] font-black text-rose-400 block tracking-wider uppercase";
                    netEl.innerText = `₹ ${Math.abs(net).toLocaleString('en-IN')}`;
                    netEl.style.color = "#fb7185";
                }
            });
        }

        window.logoutUser = function() {
            localStorage.removeItem('userName');
            localStorage.removeItem('profilePhoto');
            localStorage.removeItem('coverPhoto');
            window.location.href = "login.html";
        };
    </script>
