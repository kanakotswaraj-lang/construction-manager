<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700;900&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        body { font-family: 'Manjari', sans-serif; }
    </style>

    <script>
        if (!localStorage.getItem('userName')) {
            window.location.href = "login.html";
        }
    </script>

    <title>മേസ്തിരി പ്രോ - മെറ്റീരിയൽ & ലേബർ എസ്റ്റിമേറ്റർ</title>
</head>
<body class="bg-[#050B18] text-white min-h-screen p-4 font-sans pb-12">
    <div class="max-w-md mx-auto space-y-4">

        <!-- ടോപ്പ് ഹെഡർ ബാക്ക് ബട്ടൺ -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center justify-between shadow-xl">
            <div class="flex items-center gap-3">
                <a href="index.html" class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-amber-400 font-bold hover:bg-slate-700 transition">
                    ←
                </a>
                <div>
                    <h1 class="text-lg font-black text-white">എസ്റ്റിമേറ്റർ കാൽക്കുലേറ്റർ</h1>
                    <p class="text-[10px] text-slate-400 font-bold uppercase">മേസ്തിരി അനുഭവക്കണക്ക് പ്രകാരം</p>
                </div>
            </div>
        </div>

        <!-- കാൽക്കുലേറ്റർ ഫോം ബോക്സ് -->
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-3xl shadow-xl space-y-4">
            <h2 class="text-sm font-black text-amber-400 tracking-wide uppercase border-b border-slate-800 pb-2">📐 അളവുകളും പണിയുടെ തരണവും നൽകുക</h2>
            
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">പണിയേണ്ട ഏരിയ / നീളം (Square Feet / Length)</label>
                <input type="number" id="sqftInput" placeholder="ഉദാ: 1000" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white font-bold focus:outline-none focus:border-amber-400 transition">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">പണിയുടെ തരം</label>
                <select id="workType" onchange="toggleWorkType()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white font-bold focus:outline-none focus:border-amber-400 transition">
                    <option value="slab">സ്ലാബ് വാർപ്പ് (RCC Slab - 1:2:3)</option>
                    <option value="stone">വെട്ടുകല്ല് കെട്ടൽ (Laterite Stone - Malabar Style)</option>
                    <option value="steel">കമ്പി കണക്ക് മാത്രം (Steel / Reinforcement)</option>
                    <option value="plaster">പ്ലാസ്റ്റിംഗ് (Plastering)</option>
                </select>
            </div>

            <!-- സ്ലാബിന്റെ കനം തിരഞ്ഞെടുക്കാനുള്ള കോളം -->
            <div id="thicknessBox">
                <label class="block text-xs font-bold text-slate-300 mb-1">വാർപ്പിന്റെ കനം (Thickness)</label>
                <select id="slabThickness" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white font-bold focus:outline-none focus:border-amber-400 transition">
                    <option value="4">4 ഇഞ്ച് (4 Inches)</option>
                    <option value="4.5">4.5 ഇഞ്ച് (4.5 Inches)</option>
                    <option value="5" selected>5 ഇഞ്ച് - സ്റ്റാൻഡേർഡ് (5 Inches)</option>
                    <option value="5.5">5.5 ഇഞ്ച് (5.5 Inches)</option>
                    <option value="6">6 ഇഞ്ച് (6 Inches)</option>
                </select>
            </div>

            <!-- കമ്പി സൈസ് തിരഞ്ഞെടുക്കാനുള്ള കോളം (കമ്പി കണക്ക് സെലക്ട് ചെയ്യുമ്പോൾ മാത്രം കാണുക) -->
            <div id="steelSizeBox" class="hidden">
                <label class="block text-xs font-bold text-slate-300 mb-1">കമ്പിയുടെ സൈസ് / തരം (Steel Bar Type)</label>
                <select id="steelSize" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white font-bold focus:outline-none focus:border-amber-400 transition">
                    <option value="slab_dual">സ്ലാബ് കമ്പി (8mm റിങ്ങും + 10mm/12mm മെയിനും വെവ്വേറെ)</option>
                    <option value="8">8 mm മാത്രം (റിങ് / ഡിസ്ട്രിബ്യൂഷൻ)</option>
                    <option value="10">10 mm മാത്രം (മെയിൻ ബാർ)</option>
                    <option value="12">12 mm മാത്രം (ബീം / ഹെവി)</option>
                    <option value="16">16 mm മാത്രം (മെയിൻ ബീം / കോളം)</option>
                </select>
            </div>

            <button onclick="calculateMaterials()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3.5 rounded-xl shadow-lg transition duration-200">
                കണക്കുകൂട്ടുക (Calculate)
            </button>
        </div>

        <!-- ഫലം കാണിക്കുന്ന ഭാഗം -->
        <div id="resultBox" class="hidden bg-slate-900 border border-slate-800 p-5 rounded-3xl shadow-xl space-y-4">
            <h2 class="text-sm font-black text-emerald-400 tracking-wide uppercase border-b border-slate-800 pb-2">📊 കണക്കാക്കിയ അളവുകൾ</h2>
            
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-slate-800/80 border border-slate-700 p-3 rounded-2xl text-center">
                    <p id="labelItem1" class="text-[10px] text-slate-400 font-bold uppercase">ഐറ്റം 1</p>
                    <p id="resItem1" class="text-base font-black text-amber-400 mt-1">-</p>
                </div>
                <div class="bg-slate-800/80 border border-slate-700 p-3 rounded-2xl text-center">
                    <p id="labelItem2" class="text-[10px] text-slate-400 font-bold uppercase">ഐറ്റം 2</p>
                    <p id="resItem2" class="text-base font-black text-amber-400 mt-1">-</p>
                </div>
                <div class="bg-slate-800/80 border border-slate-700 p-3 rounded-2xl text-center">
                    <p id="labelItem3" class="text-[10px] text-slate-400 font-bold uppercase">ഐറ്റം 3</p>
                    <p id="resItem3" class="text-base font-black text-amber-400 mt-1">-</p>
                </div>
                <div class="bg-slate-800/80 border border-slate-700 p-3 rounded-2xl text-center">
                    <p id="labelItem4" class="text-[10px] text-slate-400 font-bold uppercase">ഐറ്റം 4</p>
                    <p id="resItem4" class="text-base font-black text-amber-400 mt-1">-</p>
                </div>
            </div>

            <!-- ലേബർ ടീം അളവ് -->
            <div class="bg-indigo-950/40 border border-indigo-800/50 p-4 rounded-2xl space-y-2">
                <p class="text-xs font-black text-indigo-300 uppercase">👥 ആവശ്യമായ ടീം അളവ് / വിവരങ്ങൾ</p>
                <p id="resLabor" class="text-xs font-bold text-slate-200 leading-relaxed">-</p>
            </div>
        </div>

        <!-- ഫൂട്ടർ നാവിഗേഷൻ -->
        <a href="index.html" class="block text-center bg-slate-800 text-slate-300 font-bold py-3.5 rounded-2xl border border-slate-700 hover:bg-slate-700 transition">
            ഡാഷ്‌ബോർഡിലേക്ക് മടങ്ങുക
        </a>

    </div>

    <script>
        function toggleWorkType() {
            const type = document.getElementById('workType').value;
            const thicknessBox = document.getElementById('thicknessBox');
            const steelSizeBox = document.getElementById('steelSizeBox');

            if (type === 'slab') {
                thicknessBox.style.display = 'block';
                steelSizeBox.style.display = 'none';
            } else if (type === 'steel') {
                thicknessBox.style.display = 'none';
                steelSizeBox.style.display = 'block';
            } else {
                thicknessBox.style.display = 'none';
                steelSizeBox.style.display = 'none';
            }
        }

        function calculateMaterials() {
            const sqft = parseFloat(document.getElementById('sqftInput').value);
            const type = document.getElementById('workType').value;
            const thickness = parseFloat(document.getElementById('slabThickness').value);
            const steelChoice = document.getElementById('steelSize').value;

            if (!sqft || sqft <= 0) {
                alert('ദയവായി ശരിയായ അളവ് നൽകുക!');
                return;
            }

            let i1 = "", i2 = "", i3 = "", i4 = "", laborText = "";

            if (type === 'slab') {
                let totalCft = sqft * (thickness / 12);
                let dryVolume = totalCft * 1.54;
                let cementBags = (dryVolume / 6) / 1.25;
                let sandCft = (dryVolume / 6) * 2;
                let metalCft = (dryVolume / 6) * 3;

                document.getElementById('labelItem1').innerText = "സിമന്റ് (Cement)";
                document.getElementById('labelItem2').innerText = "മണൽ (Sand)";
                document.getElementById('labelItem3').innerText = "മെറ്റൽ (Metal)";
                document.getElementById('labelItem4').innerText = "ഷട്ടറിങ് ഏരിയ";

                i1 = Math.round(cementBags) + " ചാക്ക് (Bags)";
                i2 = Math.round(sandCft) + " കൂബ് അടി (CFT)";
                i3 = Math.round(metalCft) + " കൂബ് അടി (CFT)";
                i4 = sqft + " Sq.Ft";

                let masons = Math.ceil(sqft / 150);
                let coolies = Math.ceil(sqft / 100);
                laborText = `ഈ സ്ലാബ് വാർപ്പ് പണിക്ക് (${thickness} ഇഞ്ച് കനം) ഏകദേശം ${masons} മേസ്തിരിമാരും ${coolies} തൊഴിലാളികളും ആവശ്യമാണ്.`;
            } 
            else if (type === 'stone') {
                let baseBricks = sqft * 1.15;
                let waste = baseBricks * 0.04;
                let totalBricks = Math.ceil(baseBricks + waste);
                let cementBags = totalBricks / 100;
                let sandCft = cementBags * 3;

                document.getElementById('labelItem1').innerText = "സിമന്റ് (Cement)";
                document.getElementById('labelItem2').innerText = "മണൽ (Sand)";
                document.getElementById('labelItem3').innerText = "വെട്ടുകല്ലുകൾ";
                document.getElementById('labelItem4').innerText = "വേസ്റ്റ് കല്ല്";

                i1 = Math.ceil(cementBags) + " ചാക്ക് (Bags)";
                i2 = Math.round(sandCft) + " കൂബ് അടി (CFT)";
                i3 = totalBricks + " എണ്ണം";
                i4 = Math.round(waste) + " എണ്ണം";

                let masons = Math.ceil(sqft / 80);
                let coolies = Math.ceil(sqft / 60);
                laborText = `വെട്ടുകല്ല് കെട്ടാൻ ഏകദേശം ${masons} മേസ്തിരിമാരും ${coolies} തൊഴിലാളികളും ആവശ്യമാണ്.`;
            }
            else if (type === 'steel') {
                if (steelChoice === 'slab_dual') {
                    // സ്ലാബിന്റെ പ്രാക്ടിക്കൽ കമ്പി കണക്ക് (1000 sqft ന് അനുസരിച്ച് കൃത്യമായ അനുപാതം)
                    let steel8mm = sqft * 0.38;  // 8mm (റിംഗ്/ഡിസ്ട്രിബ്യൂഷൻ)
                    let steelMain = sqft * 0.62; // 10mm/12mm (മെയിൻ ബാർ)
                    let totalSteel = steel8mm + steelMain;
                    let bindingWire = totalSteel * 0.025; // കെട്ടുകമ്പി

                    document.getElementById('labelItem1').innerText = "8 mm കമ്പി (റിങ്/ഡിസ്ട്രി)";
                    document.getElementById('labelItem2').innerText = "10/12 mm (മെയിൻ ബാർ)";
                    document.getElementById('labelItem3').innerText = "കെട്ടുകമ്പി (Binding Wire)";
                    document.getElementById('labelItem4').innerText = "ആകെ കമ്പി ഭാരം";

                    i1 = Math.round(steel8mm) + " കിലോ (Kg)";
                    i2 = Math.round(steelMain) + " കിലോ (Kg)";
                    i3 = Math.round(bindingWire) + " കിലോ (Kg)";
                    i4 = Math.round(totalSteel) + " കിലോ (Kg)";

                    laborText = `മേസ്തിരി അനുഭവക്കണക്ക് പ്രകാരം ${sqft} Sq.Ft സ്ലാബിന് ആവശ്യമായ 8mm, 10mm കമ്പികളുടെ വേവ്വേറെയുള്ള കൃത്യമായ കണക്കാണിത്.`;
                } else {
                    let mm = parseFloat(steelChoice);
                    let weightPerMeter = (mm * mm) / 162;
                    let totalKg = sqft * weightPerMeter * 0.35;
                    let bindingWire = totalKg * 0.02;

                    document.getElementById('labelItem1').innerText = "കമ്പി സൈസ്";
                    document.getElementById('labelItem2').innerText = "ആകെ ഭാരം (Weight)";
                    document.getElementById('labelItem3').innerText = "കെട്ടുകമ്പി (Wire)";
                    document.getElementById('labelItem4').innerText = "സ്റ്റാറ്റസ്";

                    i1 = mm + " mm";
                    i2 = Math.round(totalKg) + " കിലോ (Kg)";
                    i3 = Math.round(bindingWire) + " കിലോ (Kg)";
                    i4 = "പെർഫെക്റ്റ്";

                    laborText = `തെരഞ്ഞെടുത്ത ${mm}mm കമ്പി മാത്രം ഉപയോഗിക്കുമ്പോൾ വരുന്ന ഏകദേശ ഭാരക്കണക്കാണിത്.`;
                }
            }
            else if (type === 'plaster') {
                let factor = sqft / 1000;
                let cementBags = 25 * factor;
                let sandCft = 150 * factor;

                document.getElementById('labelItem1').innerText = "സിമന്റ് (Cement)";
                document.getElementById('labelItem2').innerText = "മണൽ (Sand)";
                document.getElementById('labelItem3').innerText = "സ്റ്റാറ്റസ്";
                document.getElementById('labelItem4').innerText = "സ്റ്റാറ്റസ്";

                i1 = Math.round(cementBags) + " ചാക്ക് (Bags)";
                i2 = Math.round(sandCft) + " കൂബ് അടി (CFT)";
                i3 = "ബാധകമല്ല";
                i4 = "ബാധകമല്ല";

                laborText = `പ്ലാസ്റ്റിംഗിന് ആവശ്യമായ മെറ്റീരിയൽ കണക്കാണിത്.`;
            }

            document.getElementById('resItem1').innerText = i1;
            document.getElementById('resItem2').innerText = i2;
            document.getElementById('resItem3').innerText = i3;
            document.getElementById('resItem4').innerText = i4;
            document.getElementById('resLabor').innerText = laborText;

            document.getElementById('resultBox').classList.remove('hidden');
        }
    </script>
</body>
</html>
