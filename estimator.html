<!DOCTYPE html>
<html lang="ml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>മേസ്തിരി പ്രോ - എസ്റ്റിമേറ്റർ കാൽക്കുലേറ്റർ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700;900&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <script src="language.js"></script>
    <style>
        body { 
            background-color: #0d1117 !important;
            color: #f3f4f6 !important;
            font-family: 'Manjari', sans-serif; 
        }
        @media print { .no-print { display: none !important; } }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast-animate { animation: slideIn 0.3s ease-out forwards; }

        .max-w-md {
            border: 3px solid #fbbf24;
            border-radius: 2.5rem;
            box-shadow: 0 0 25px rgba(251, 191, 36, 0.3);
            overflow: hidden;
            background-color: #0d1117;
        }
    </style>
    
    <script>
        window.switchLanguage = function(langCode) {
            if (!langCode) {
                langCode = localStorage.getItem('selectedLang') || 'ml';
            }
            localStorage.setItem('selectedLang', langCode);

            if (typeof words !== 'undefined') {
                document.querySelectorAll('[data-key]').forEach(element => {
                    const key = element.getAttribute('data-key');
                    if (words[key] && words[key][langCode]) {
                        element.innerText = words[key][langCode];
                    }
                });
            }

            const dropdown = document.getElementById('langDropdown');
            if (dropdown && !dropdown.classList.contains('hidden')) {
                dropdown.classList.add('hidden');
            }
        };

        window.changeLanguage = window.switchLanguage;

        window.toggleLangMenu = function(e) {
            if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
            const dropdown = document.getElementById('langDropdown');
            if (dropdown) {
                dropdown.classList.toggle('hidden');
            }
        };

        if (!localStorage.getItem('userName')) {
            window.location.href = "login.html";
        }
    </script>
</head>
<body class="text-white min-h-screen pb-16 p-4 font-sans">

    <div id="toastContainer" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 flex flex-col items-center space-y-2 pointer-events-none"></div>

    <div class="max-w-md mx-auto space-y-4">
        
        <!-- ഹെഡർ ഭാഗം -->
        <div id="appHeader" class="w-full pt-2 px-2">
            <div class="flex justify-between items-center bg-slate-900 border border-amber-500/50 p-3 rounded-2xl">
                <span class="text-amber-400 font-black text-sm">മേസ്തിരി പ്രോ</span>
                <a href="dashboard.html" class="bg-amber-500 text-slate-950 px-3 py-1 rounded-xl text-xs font-bold">ഹോം</a>
            </div>
        </div>

        <!-- ടോപ്പ് ബാർ -->
        <div class="mx-4 bg-slate-900/90 border-2 border-amber-500 p-4 rounded-2xl flex justify-between items-center shadow-xl backdrop-blur-sm">
            <div>
                <h1 class="text-sm font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-orange-300 to-amber-500 tracking-wide" data-key="estimator_title">എസ്റ്റിമേറ്റർ കാൽക്കുലേറ്റർ</h1>
                <p class="text-[10px] text-slate-400 font-bold uppercase mt-0.5" data-key="estimator_subtitle">മേസ്തിരി അനുഭവക്കണക്ക് പ്രകാരം</p>
            </div>
            <a href="dashboard.html" class="px-4 py-2 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 rounded-xl text-xs font-black shadow-lg transition flex items-center gap-1.5" data-key="home_btn">
                Home
            </a>
        </div>

        <!-- കാൽക്കുലേറ്റർ ഫോം ഭാഗം -->
        <div class="mx-4 bg-slate-900/90 text-white p-6 rounded-3xl shadow-xl border border-slate-800 backdrop-blur-sm space-y-3.5">
            <h2 class="text-base font-black text-amber-400 mb-2">📐 പണിയുടെ വിവരങ്ങൾ നൽകുക</h2>
            
            <div>
                <label class="block text-xs font-black text-slate-400 mb-1.5 uppercase">പണിയുടെ തരം (Work Category)</label>
                <select id="workCategory" onchange="toggleCategory()" class="w-full p-4 bg-slate-800/80 rounded-2xl border border-blue-500 text-sm font-bold focus:outline-none">
                    <option value="slab">സ്ലാബ് വാർപ്പ് (RCC Slab)</option>
                    <option value="beam">ബീം വാർപ്പ് (Roof Beam)</option>
                    <option value="lintel">ലിന്റൽ വാർപ്പ് (Lintel)</option>
                    <option value="stone">വെട്ടുകല്ല് കെട്ടൽ (Laterite Stone)</option>
                    <option value="plaster">പ്ലാസ്റ്റിംഗ് (Plastering)</option>
                </select>
            </div>

            <!-- അളവ് നൽകാൻ -->
            <div>
                <label id="inputLabel" class="block text-xs font-black text-slate-400 mb-1.5 uppercase">പണിയേണ്ട ഏരിയ (Square Feet - Sq.Ft)</label>
                <input type="number" id="mainInput" placeholder="ഉദാ: 500" class="w-full p-4 bg-slate-800/80 rounded-2xl border border-blue-500 text-sm font-bold placeholder-slate-500 focus:outline-none">
            </div>

            <!-- ബീം/ലിന്റലിന് വീതിയും കനവും -->
            <div id="dimensionBox" class="hidden grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-black text-slate-400 mb-1.5 uppercase">വീതി (Width - Inches)</label>
                    <input type="number" id="beamWidth" value="6" class="w-full p-3 bg-slate-800/80 rounded-xl border border-blue-500 text-sm font-bold focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-black text-slate-400 mb-1.5 uppercase">കനം (Depth - Inches)</label>
                    <input type="number" id="beamDepth" value="6" class="w-full p-3 bg-slate-800/80 rounded-xl border border-blue-500 text-sm font-bold focus:outline-none">
                </div>
            </div>

            <!-- സ്ലാബിന്റെ കനം -->
            <div id="slabThicknessBox" class="space-y-3">
                <label class="block text-xs font-black text-slate-400 mb-1.5 uppercase">വാർപ്പിന്റെ കനം (Slab Thickness)</label>
                <select id="slabThickness" class="w-full p-4 bg-slate-800/80 rounded-2xl border border-blue-500 text-sm font-bold focus:outline-none">
                    <option value="4.5">4.5 ഇഞ്ച്</option>
                    <option value="5" selected>5 ഇഞ്ച് - സ്റ്റാൻഡേർഡ്</option>
                    <option value="6">6 ഇഞ്ച്</option>
                </select>
            </div>
            
            <!-- ബീം കമ്പി കണക്കുകൾ -->
            <div id="steelSelectionBox" class="hidden space-y-3 bg-slate-800/40 p-4 rounded-2xl border border-slate-700">
                <label class="block text-xs font-black text-amber-300 uppercase">🛠️ മേസ്തിരി നിർദ്ദേശിക്കുന്ന ബീം കമ്പി കണക്കുകൾ</label>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 mb-1">മെയിൻ കമ്പി സൈസ്</label>
                        <select id="mainBarSize" class="w-full p-3 bg-slate-800 rounded-xl border border-blue-500 text-xs font-bold focus:outline-none">
                            <option value="16">16 mm</option>
                            <option value="12" selected>12 mm</option>
                            <option value="10">10 mm</option>
                            <option value="8">8 mm</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 mb-1">എണ്ണം (Nos)</label>
                        <input type="number" id="mainBarCount" value="4" class="w-full p-3 bg-slate-800 rounded-xl border border-blue-500 text-xs font-bold focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-400 mb-1">റിങ് കമ്പി സൈസ് & അകലം (ഇഞ്ചിൽ ടൈപ്പ് ചെയ്യുക)</label>
                    <div class="grid grid-cols-2 gap-2">
                        <select id="ringBarSize" class="w-full p-3 bg-slate-800 rounded-xl border border-blue-500 text-xs font-bold focus:outline-none">
                            <option value="8" selected>8 mm റിങ്</option>
                            <option value="6">6 mm റിങ്</option>
                        </select>
                        <input type="number" id="ringSpacingInput" value="6" placeholder="ഉദാ: 6" class="w-full p-3 bg-slate-800 rounded-xl border border-blue-500 text-xs font-bold focus:outline-none text-center">
                    </div>
                </div>
            </div>

            <!-- സ്ലാബ് കമ്പി കണക്കുകൾ -->
            <div id="slabSteelSelectionBox" class="space-y-3 bg-slate-800/40 p-4 rounded-2xl border border-slate-700">
                <label class="block text-xs font-black text-amber-300 uppercase">🛠️ മേസ്തിരി നിർദ്ദേശിക്കുന്ന സ്ലാബ് കമ്പി കണക്കുകൾ</label>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 mb-1">മെയിൻ കമ്പി സൈസ്</label>
                        <select id="slabMainBarSize" class="w-full p-3 bg-slate-800 rounded-xl border border-blue-500 text-xs font-bold focus:outline-none">
                            <option value="12" selected>12 mm</option>
                            <option value="10">10 mm</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-400 mb-1">ഡിസ്ട്രിബ്യൂഷൻ കമ്പി</label>
                        <select id="slabDistBarSize" class="w-full p-3 bg-slate-800 rounded-xl border border-blue-500 text-xs font-bold focus:outline-none">
                            <option value="10">10 mm</option>
                            <option value="8" selected>8 mm</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- മേസ്തിരിമാരുടെ എണ്ണം -->
            <div>
                <label class="block text-xs font-black text-slate-400 mb-1.5 uppercase">മേസ്തിരിമാരുടെ എണ്ണം (Manual Mason Count)</label>
                <input type="number" id="masonCountInput" placeholder="ഉദാ: 3 (ഓപ്ഷണൽ)" class="w-full p-4 bg-slate-800/80 rounded-2xl border border-blue-500 text-sm font-bold placeholder-slate-500 focus:outline-none">
            </div>

            <button onclick="calculateEstimation()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 p-4 rounded-2xl font-black text-sm shadow-lg shadow-amber-500/20 transition cursor-pointer">കണക്കുകൂട്ടുക (Calculate)</button>
        </div>

        <!-- ഫലം കാണിക്കുന്ന ഭാഗം -->
        <div id="resultBox" class="hidden mx-4 bg-slate-900/90 text-white p-6 rounded-3xl shadow-xl border border-slate-800 backdrop-blur-sm space-y-4">
            <h2 class="text-base font-black text-emerald-400 mb-2 border-b border-slate-800 pb-2">📊 മേസ്തിരി അനുഭവക്കണക്ക് ഫലം</h2>
            
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-slate-800/90 border border-blue-500/40 p-4 rounded-2xl text-center shadow-md">
                    <p id="labelItem1" class="text-[10px] text-slate-400 font-black uppercase">-</p>
                    <p id="resItem1" class="text-base font-black text-amber-400 mt-1">-</p>
                </div>
                <div class="bg-slate-800/90 border border-blue-500/40 p-4 rounded-2xl text-center shadow-md">
                    <p id="labelItem2" class="text-[10px] text-slate-400 font-black uppercase">-</p>
                    <p id="resItem2" class="text-base font-black text-amber-400 mt-1">-</p>
                </div>
                <div class="bg-slate-800/90 border border-blue-500/40 p-4 rounded-2xl text-center shadow-md">
                    <p id="labelItem3" class="text-[10px] text-slate-400 font-black uppercase">-</p>
                    <p id="resItem3" class="text-base font-black text-amber-400 mt-1">-</p>
                </div>
                <div class="bg-slate-800/90 border border-blue-500/40 p-4 rounded-2xl text-center shadow-md">
                    <p id="labelItem4" class="text-[10px] text-slate-400 font-black uppercase">-</p>
                    <p id="resItem4" class="text-base font-black text-amber-400 mt-1">-</p>
                </div>
                <div class="bg-slate-800/90 border border-blue-500/40 p-4 rounded-2xl text-center shadow-md col-span-2">
                    <p id="labelItem5" class="text-[10px] text-slate-400 font-black uppercase">-</p>
                    <p id="resItem5" class="text-base font-black text-amber-400 mt-1">-</p>
                </div>
            </div>

            <div class="bg-blue-950/40 border border-blue-500/40 p-4 rounded-2xl space-y-2">
                <p class="text-xs font-black text-cyan-300 uppercase">👥 സൈറ്റ് വിവരങ്ങൾ & ടീം അളവ്</p>
                <p id="resDetails" class="text-xs font-bold text-slate-200 leading-relaxed">-</p>
            </div>
        </div>

    </div>

    <script type="module">
        import { setupHeader } from './header.js';

        document.addEventListener("DOMContentLoaded", () => {
            try {
                if (typeof setupHeader === 'function') { setupHeader('appHeader'); }
            } catch (e) { console.log(e); }

            const savedLang = localStorage.getItem('selectedLang') || 'ml';
            if (typeof window.switchLanguage === 'function') {
                window.switchLanguage(savedLang);
            }
        });
    </script>

    <script>
        window.showToast = function(messageKey, isSuccess = true) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast-animate pointer-events-auto px-6 py-4 rounded-2xl text-white font-bold text-base shadow-2xl border backdrop-blur-md flex items-center gap-3 ${
                isSuccess ? 'bg-blue-950/95 border-blue-500 text-blue-200' : 'bg-red-950 border-red-500 text-white'
            }`;
            toast.innerText = messageKey;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        window.toggleCategory = function() {
            const category = document.getElementById('workCategory').value;
            const inputLabel = document.getElementById('inputLabel');
            const slabThicknessBox = document.getElementById('slabThicknessBox');
            const dimensionBox = document.getElementById('dimensionBox');
            const steelSelectionBox = document.getElementById('steelSelectionBox');
            const slabSteelSelectionBox = document.getElementById('slabSteelSelectionBox');

            if (category === 'slab') {
                inputLabel.innerText = "പണിയേണ്ട ഏരിയ (Square Feet - Sq.Ft)";
                slabThicknessBox.style.display = 'block';
                dimensionBox.style.display = 'none';
                steelSelectionBox.style.display = 'none';
                slabSteelSelectionBox.style.display = 'block';
            } else if (category === 'beam' || category === 'lintel') {
                inputLabel.innerText = "ആകെ നീളം (Running Feet - R.Ft)";
                slabThicknessBox.style.display = 'none';
                dimensionBox.style.display = 'grid';
                steelSelectionBox.style.display = 'block';
                slabSteelSelectionBox.style.display = 'none';
            } else {
                inputLabel.innerText = "പണിയേണ്ട ഏരിയ (Square Feet - Sq.Ft)";
                slabThicknessBox.style.display = 'none';
                dimensionBox.style.display = 'none';
                steelSelectionBox.style.display = 'none';
                slabSteelSelectionBox.style.display = 'none';
            }
        };

        function getSteelWeightPerFt(mm) {
            let kgPerMeter = (mm * mm) / 162;
            return kgPerMeter / 3.28084;
        }

        window.calculateEstimation = function() {
            const val = parseFloat(document.getElementById('mainInput').value);
            const category = document.getElementById('workCategory').value;
            let manualMasonInput = document.getElementById('masonCountInput').value;

            if (!val || val <= 0) {
                window.showToast('ശരിയായ അളവ് നൽകുക', false);
                return;
            }

            let i1 = "", i2 = "", i3 = "", i4 = "", i5 = "";
            let masonCount = manualMasonInput !== "" ? parseInt(manualMasonInput) : 0;

            if (category === 'beam' || category === 'lintel') {
                let length = val;
                let width = parseFloat(document.getElementById('beamWidth').value) || 6;
                let depth = parseFloat(document.getElementById('beamDepth').value) || 6;
                
                let totalCft = (width * depth / 144) * length;
                
                // തിരുത്തിയ സിമന്റ് കണക്ക് (1 Cft കോൺക്രീറ്റിന് ഏകദേശം 0.22 ചാക്ക് സിമന്റ് / അല്ലെങ്കിൽ 100 Cft-ന് ~22 ചാക്ക്)
                let cementBags = Math.round(totalCft * 0.22);
                let sandCft = Math.round(totalCft * 0.45);
                let metalCft = Math.round(totalCft * 0.75);

                let mainBarSize = parseFloat(document.getElementById('mainBarSize').value);
                let mainBarCount = parseInt(document.getElementById('mainBarCount').value) || 4;
                let weightPerFt = getSteelWeightPerFt(mainBarSize);
                let mainSteelKg = Math.round(length * mainBarCount * weightPerFt * 1.10);

                let ringBarSize = parseFloat(document.getElementById('ringBarSize').value);
                let ringSpacing = parseFloat(document.getElementById('ringSpacingInput').value) || 6;
                let ringCount = Math.round((length * 12) / ringSpacing);
                
                let ringPerimeterFt = (2 * (width + depth) + 4) / 12;
                let ringWeightPerFt = getSteelWeightPerFt(ringBarSize);
                let ringTotalKg = Math.round(ringCount * ringPerimeterFt * ringWeightPerFt);

                let bindingWire = Math.round((mainSteelKg + ringTotalKg) * 0.04);
                
                if (masonCount === 0) {
                    masonCount = Math.max(1, Math.round(length / 100));
                }

                document.getElementById('labelItem1').innerText = "സിമന്റ് (Cement)";
                document.getElementById('labelItem2').innerText = "മണൽ (Sand)";
                document.getElementById('labelItem3').innerText = "മെറ്റൽ (Metal)";
                document.getElementById('labelItem4').innerText = `മെയിൻ കമ്പി (${mainBarSize}mm - ${mainBarCount} Nos)`;
                document.getElementById('labelItem5').innerText = `റിങ് (${ringBarSize}mm - അകലം: ${ringSpacing}")`;

                i1 = cementBags + " ചാക്ക്";
                i2 = sandCft + " Cft";
                i3 = metalCft + " Cft";
                i4 = mainSteelKg + " കിലോ";
                i5 = `${ringCount} എണ്ണം (${ringTotalKg} കി.ഗ്രാം) | കെട്ടുകമ്പി: ${bindingWire} കി.ഗ്രാം`;

                document.getElementById('resDetails').innerText = `${category === 'beam' ? 'ബീം' : 'ലിന്റൽ'} നീളം: ${length} R.Ft, സൈസ്: ${width}" x ${depth}" (ആകെ വോളിയം: ${Math.round(totalCft)} Cft), അകലം: ${ringSpacing}", മേസ്തിരിമാർ: ${masonCount} പേർ`;
            } 
            else if (category === 'slab') {
                let sqFt = val;
                let thickness = parseFloat(document.getElementById('slabThickness').value) || 5;
                let factor = thickness / 5; 
                
                let cementBags = Math.round((sqFt / 100) * 7.5 * factor);
                let sandCft = Math.round(cementBags * 2.5); 
                let metalCft = Math.round(cementBags * 4.5); 

                let slabMainSize = parseFloat(document.getElementById('slabMainBarSize').value);
                let slabDistSize = parseFloat(document.getElementById('slabDistBarSize').value);

                let mainSteelKg = Math.round(sqFt * 0.45 * (slabMainSize / 12));
                let distSteelKg = Math.round(sqFt * 0.35 * (slabDistSize / 8));
                let totalSteelKg = mainSteelKg + distSteelKg;
                let bindingWire = Math.round(totalSteelKg * 0.025);

                if (masonCount === 0) {
                    masonCount = Math.max(2, Math.round(sqFt / 250));
                }

                document.getElementById('labelItem1').innerText = "സിമന്റ് (Cement)";
                document.getElementById('labelItem2').innerText = "മണൽ (Sand)";
                document.getElementById('labelItem3').innerText = "മെറ്റൽ (Metal)";
                document.getElementById('labelItem4').innerText = `കമ്പി കണക്ക് (${slabMainSize}mm & ${slabDistSize}mm)`;
                document.getElementById('labelItem5').innerText = "കെട്ടുകമ്പി & മേസ്തിരിമാർ";

                i1 = cementBags + " ചാക്ക്";
                i2 = sandCft + " Cft";
                i3 = metalCft + " Cft";
                i4 = totalSteelKg + " കിലോ";
                i5 = `കെട്ടുകമ്പി: ${bindingWire} kg | മേസ്തിരിമാർ: ${masonCount} പേർ`;

                document.getElementById('resDetails').innerText = `സ്ലാബ് ഏരിയ: ${sqFt} Sq.Ft, കനം: ${thickness} ഇഞ്ച്, മേസ്തിരിമാർ: ${masonCount} പേർ`;
            }
            else if (category === 'stone') {
                let totalBricks = Math.ceil(val * 1.15);
                let cementBags = Math.ceil(totalBricks / 90); 
                let sandCft = Math.round(cementBags * 3);
                if (masonCount === 0) { masonCount = Math.max(1, Math.round(val / 100)); }

                document.getElementById('labelItem1').innerText = "സിമന്റ് (Cement)";
                document.getElementById('labelItem2').innerText = "മണൽ (Sand)";
                document.getElementById('labelItem3').innerText = "മെറ്റൽ / കല്ല്";
                document.getElementById('labelItem4').innerText = "കല്ലുകളുടെ എണ്ണം";
                document.getElementById('labelItem5').innerText = "മേസ്തിരിമാർ";

                i1 = cementBags + " ചാക്ക്";
                i2 = sandCft + " Cft";
                i3 = "ബാധകമല്ല";
                i4 = totalBricks + " എണ്ണം";
                i5 = `മേസ്തിരിമാർ: ${masonCount} പേർ`;

                document.getElementById('resDetails').innerText = `വെട്ടുകല്ല് കെട്ടൽ (${val} Sq.Ft), മേസ്തിരിമാർ: ${masonCount} പേർ`;
            }
            else if (category === 'plaster') {
                let cementBags = Math.round((val / 1000) * 22);
                let sandCft = Math.round((val / 1000) * 140);
                if (masonCount === 0) { masonCount = Math.max(1, Math.round(val / 250)); }

                document.getElementById('labelItem1').innerText = "സിമന്റ് (Cement)";
                document.getElementById('labelItem2').innerText = "മണൽ (Sand)";
                document.getElementById('labelItem3').innerText = "മെറ്റൽ";
                document.getElementById('labelItem4').innerText = "കെട്ടുകമ്പി";
                document.getElementById('labelItem5').innerText = "മേസ്തിരിമാർ";

                i1 = cementBags + " ചാക്ക്";
                i2 = sandCft + " Cft";
                i3 = "ബാധകമല്ല";
                i4 = "ബാധകമല്ല";
                i5 = `മേസ്തിരിമാർ: ${masonCount} പേർ`;

                document.getElementById('resDetails').innerText = `പ്ലാസ്റ്റിംഗ് എസ്റ്റിമേറ്റ് (${val} Sq.Ft), മേസ്തിരിമാർ: ${masonCount} പേർ`;
            }

            document.getElementById('resItem1').innerText = i1;
            document.getElementById('resItem2').innerText = i2;
            document.getElementById('resItem3').innerText = i3;
            document.getElementById('resItem4').innerText = i4;
            document.getElementById('resItem5').innerText = i5;

            document.getElementById('resultBox').classList.remove('hidden');
            window.showToast("കണക്കുകൂട്ടൽ വിജയകരമായി പൂർത്തിയായി!", true);
        };
    </script>
</body>
</html>
