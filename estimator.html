<!DOCTYPE html>
<html lang="ml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>മേസ്തിരി പ്രോ - എസ്റ്റിമേറ്റർ കാൽക്കുലേറ്റർ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700;900&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <script src="language.js"></script>
    <style>
        body { 
            background-color: #0d1117 !important;
            color: #f3f4f6 !important;
            font-family: 'Manjari', sans-serif; 
        }
        @media print { .no-print { display: none !important; } }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast-animate { animation: slideIn 0.3s ease-out forwards; }

        .max-w-md {
            border: 3px solid #fbbf24;
            border-radius: 2.5rem;
            box-shadow: 0 0 25px rgba(251, 191, 36, 0.3);
            overflow: hidden;
            background-color: #0d1117;
        }
    </style>
    
    <script>
        window.switchLanguage = function(langCode) {
            if (!langCode) {
                langCode = localStorage.getItem('selectedLang') || 'ml';
            }
            localStorage.setItem('selectedLang', langCode);

            if (typeof words !== 'undefined') {
                document.querySelectorAll('[data-key]').forEach(element => {
                    const key = element.getAttribute('data-key');
                    if (words[key] && words[key][langCode]) {
                        element.innerText = words[key][langCode];
                    }
                });

                document.querySelectorAll('[data-key-placeholder]').forEach(input => {
                    const key = input.getAttribute('data-key-placeholder');
                    if (words[key] && words[key][langCode]) {
                        input.placeholder = words[key][langCode];
                    }
                });
            }

            const dropdown = document.getElementById('langDropdown');
            if (dropdown && !dropdown.classList.contains('hidden')) {
                dropdown.classList.add('hidden');
            }
        };

        window.changeLanguage = window.switchLanguage;

        window.toggleLangMenu = function(e) {
            if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
            const dropdown = document.getElementById('langDropdown');
            if (dropdown) {
                dropdown.classList.toggle('hidden');
            }
        };

        if (!localStorage.getItem('userName')) {
            window.location.href = "login.html";
        }
    </script>
</head>
<body class="text-white min-h-screen pb-16 p-4 font-sans">

    <div id="toastContainer" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 flex flex-col items-center space-y-2 pointer-events-none"></div>

    <div class="max-w-md mx-auto space-y-4">
        
        <!-- ഹെഡർ ഭാഗം -->
        <div id="appHeader" class="w-full pt-2 px-2">
            <div class="flex justify-between items-center bg-slate-900 border border-amber-500/50 p-3 rounded-2xl">
                <span class="text-amber-400 font-black text-sm">മേസ്തിരി പ്രോ</span>
                <a href="dashboard.html" class="bg-amber-500 text-slate-950 px-3 py-1 rounded-xl text-xs font-bold">ഹോം</a>
            </div>
        </div>

        <!-- ടോപ്പ് ബാർ -->
        <div class="mx-4 bg-slate-900/90 border-2 border-amber-500 p-4 rounded-2xl flex justify-between items-center shadow-xl backdrop-blur-sm">
            <div>
                <h1 class="text-sm font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-orange-300 to-amber-500 tracking-wide" data-key="estimator_title">എസ്റ്റിമേറ്റർ കാൽക്കുലേറ്റർ</h1>
                <p class="text-[10px] text-slate-400 font-bold uppercase mt-0.5" data-key="estimator_subtitle">മേസ്തിരി അനുഭവക്കണക്ക് പ്രകാരം</p>
            </div>
            <a href="dashboard.html" class="px-4 py-2 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 rounded-xl text-xs font-black shadow-lg transition flex items-center gap-1.5" data-key="home_btn">
                Home
            </a>
        </div>

        <!-- കാൽക്കുലേറ്റർ ഫോം ഭാഗം -->
        <div class="mx-4 bg-slate-900/90 text-white p-6 rounded-3xl shadow-xl border border-slate-800 backdrop-blur-sm space-y-3.5">
            <h2 class="text-base font-black text-amber-400 mb-2" data-key="work_details_heading">📐 പണിയുടെ വിവരങ്ങൾ തിരഞ്ഞെടുക്കുക</h2>
            
            <div>
                <label class="block text-xs font-black text-slate-400 mb-1.5 uppercase" data-key="work_category_label">പണിയുടെ തരം (Work Category)</label>
                <select id="workCategory" onchange="toggleCategory()" class="w-full p-4 bg-slate-800/80 rounded-2xl border border-blue-500 text-sm font-bold focus:outline-none">
                    <option value="slab" data-key="opt_slab">സ്ലാബ് വാർപ്പ് (RCC Slab Steel & Materials)</option>
                    <option value="beam" data-key="opt_beam">ബീം വാർപ്പ് (Roof Beam Steel)</option>
                    <option value="lintel" data-key="opt_lintel">ലിന്റൽ വാർപ്പ് (Lintel Steel)</option>
                    <option value="stone" data-key="opt_stone">വെട്ടുകല്ല് കെട്ടൽ (Laterite Stone)</option>
                    <option value="plaster" data-key="opt_plaster">പ്ലാസ്റ്റിംഗ് (Plastering)</option>
                </select>
            </div>

            <div>
                <label id="inputLabel" class="block text-xs font-black text-slate-400 mb-1.5 uppercase" data-key="input_area_label">പണിയേണ്ട ഏരിയ (Square Feet)</label>
                <input type="number" id="mainInput" data-key-placeholder="input_placeholder" placeholder="ഉദാ: 1000" class="w-full p-4 bg-slate-800/80 rounded-2xl border border-blue-500 text-sm font-bold placeholder-slate-500 focus:outline-none">
            </div>

            <!-- സ്ലാബിന്റെ കനം -->
            <div id="slabThicknessBox">
                <label class="block text-xs font-black text-slate-400 mb-1.5 uppercase" data-key="thickness_label">വാർപ്പിന്റെ കനം (Thickness)</label>
                <select id="slabThickness" class="w-full p-4 bg-slate-800/80 rounded-2xl border border-blue-500 text-sm font-bold focus:outline-none">
                    <option value="4.5" data-key="thick_4_5">4.5 ഇഞ്ച്</option>
                    <option value="5" selected data-key="thick_5">5 ഇഞ്ച് - സ്റ്റാൻഡേർഡ്</option>
                    <option value="5.5" data-key="thick_5_5">5.5 ഇഞ്ച്</option>
                    <option value="6" data-key="thick_6">6 ഇഞ്ച്</option>
                </select>
            </div>
            
            <!-- കമ്പി സൈസ് തിരഞ്ഞെടുക്കാനുള്ള ഓപ്ഷൻ (ബീം/ലിന്റലിന് മാത്രം) -->
            <div id="steelSizeBox" class="hidden">
                <label class="block text-xs font-black text-slate-400 mb-1.5 uppercase">മെയിൻ കമ്പി സൈസ് (Main Steel Size)</label>
                <select id="barSizeSelection" class="w-full p-4 bg-slate-800/80 rounded-2xl border border-blue-500 text-sm font-bold focus:outline-none">
                    <option value="16_12">16mm & 12mm (ഹെവി ബീം)</option>
                    <option value="12_10" selected>12mm & 10mm (സ്റ്റാൻഡേർഡ്)</option>
                    <option value="10_8">10mm & 8mm (ലൈറ്റ്/ലിന്റൽ)</option>
                </select>
            </div>

            <!-- അകലം (Spacing) -->
            <div id="spacingBox">
                <label id="spacingLabel" class="block text-xs font-black text-slate-400 mb-1.5 uppercase" data-key="spacing_label">കമ്പി തമ്മിലുള്ള അകലം (Spacing)</label>
                <select id="barSpacing" class="w-full p-4 bg-slate-800/80 rounded-2xl border border-blue-500 text-sm font-bold focus:outline-none">
                    <option value="5">5 ഇഞ്ച്</option>
                    <option value="6" selected>6 ഇഞ്ച് (സാധാരണ)</option>
                    <option value="7">7 ഇഞ്ച്</option>
                    <option value="8">8 ഇഞ്ച്</option>
                    <option value="9">9 ഇഞ്ച്</option>
                </select>
            </div>

            <!-- മേസ്തിരിമാരുടെ എണ്ണം മാനുവൽ ആയി നൽകാനുള്ള ഫീൽഡ് -->
            <div>
                <label class="block text-xs font-black text-slate-400 mb-1.5 uppercase">മേസ്തിരിമാരുടെ എണ്ണം (Manual Mason Count)</label>
                <input type="number" id="masonCountInput" placeholder="ഉദാ: 5" class="w-full p-4 bg-slate-800/80 rounded-2xl border border-blue-500 text-sm font-bold placeholder-slate-500 focus:outline-none">
            </div>

            <button onclick="calculateEstimation()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 p-4 rounded-2xl font-black text-sm shadow-lg shadow-amber-500/20 transition cursor-pointer" data-key="calculate_btn">കണക്കുകൂട്ടുക (Calculate)</button>
        </div>

        <!-- ഫലം കാണിക്കുന്ന ഭാഗം -->
        <div id="resultBox" class="hidden mx-4 bg-slate-900/90 text-white p-6 rounded-3xl shadow-xl border border-slate-800 backdrop-blur-sm space-y-4">
            <h2 class="text-base font-black text-emerald-400 mb-2 border-b border-slate-800 pb-2" data-key="result_heading">📊 മേസ്തിരി അനുഭവക്കണക്ക് ഫലം</h2>
            
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-slate-800/90 border border-blue-500/40 p-4 rounded-2xl text-center shadow-md">
                    <p id="labelItem1" class="text-[10px] text-slate-400 font-black uppercase">-</p>
                    <p id="resItem1" class="text-base font-black text-amber-400 mt-1">-</p>
                </div>
                <div class="bg-slate-800/90 border border-blue-500/40 p-4 rounded-2xl text-center shadow-md">
                    <p id="labelItem2" class="text-[10px] text-slate-400 font-black uppercase">-</p>
                    <p id="resItem2" class="text-base font-black text-amber-400 mt-1">-</p>
                </div>
                <div class="bg-slate-800/90 border border-blue-500/40 p-4 rounded-2xl text-center shadow-md">
                    <p id="labelItem3" class="text-[10px] text-slate-400 font-black uppercase">-</p>
                    <p id="resItem3" class="text-base font-black text-amber-400 mt-1">-</p>
                </div>
                <div class="bg-slate-800/90 border border-blue-500/40 p-4 rounded-2xl text-center shadow-md">
                    <p id="labelItem4" class="text-[10px] text-slate-400 font-black uppercase">-</p>
                    <p id="resItem4" class="text-base font-black text-amber-400 mt-1">-</p>
                </div>
                <div class="bg-slate-800/90 border border-blue-500/40 p-4 rounded-2xl text-center shadow-md col-span-2">
                    <p id="labelItem5" class="text-[10px] text-slate-400 font-black uppercase">-</p>
                    <p id="resItem5" class="text-base font-black text-amber-400 mt-1">-</p>
                </div>
            </div>

            <div class="bg-blue-950/40 border border-blue-500/40 p-4 rounded-2xl space-y-2">
                <p class="text-xs font-black text-cyan-300 uppercase" data-key="site_team_details">👥 സൈറ്റ് വിവരങ്ങൾ & ടീം അളവ്</p>
                <p id="resDetails" class="text-xs font-bold text-slate-200 leading-relaxed">-</p>
            </div>
        </div>

    </div>

    <script type="module">
        import { setupHeader } from './header.js';

        document.addEventListener("DOMContentLoaded", () => {
            try {
                if (typeof setupHeader === 'function') { setupHeader('appHeader'); }
            } catch (e) { console.log(e); }

            const savedLang = localStorage.getItem('selectedLang') || 'ml';
            if (typeof window.switchLanguage === 'function') {
                window.switchLanguage(savedLang);
            }
        });
    </script>

    <script>
        window.showToast = function(messageKey, isSuccess = true) {
            const currentLang = localStorage.getItem('selectedLang') || 'ml';
            let message = messageKey;
            
            if (typeof words !== 'undefined' && words[messageKey] && words[messageKey][currentLang]) {
                message = words[messageKey][currentLang];
            }

            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast-animate pointer-events-auto px-6 py-4 rounded-2xl text-white font-bold text-base shadow-2xl border backdrop-blur-md flex items-center gap-3 ${
                isSuccess 
                    ? 'bg-blue-950/95 border-blue-500 text-blue-200 shadow-blue-500/20' 
                    : 'bg-gradient-to-r from-red-950 to-rose-950 border-red-500 text-white'
            }`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        window.toggleCategory = function() {
            const category = document.getElementById('workCategory').value;
            const inputLabel = document.getElementById('inputLabel');
            const slabThicknessBox = document.getElementById('slabThicknessBox');
            const spacingBox = document.getElementById('spacingBox');
            const spacingLabel = document.getElementById('spacingLabel');
            const steelSizeBox = document.getElementById('steelSizeBox');

            if (category === 'slab') {
                inputLabel.innerText = "പണിയേണ്ട ഏരിയ (Square Feet)";
                spacingLabel.innerText = "കമ്പി തമ്മിലുള്ള അകലം (Spacing)";
                slabThicknessBox.style.display = 'block';
                spacingBox.style.display = 'block';
                steelSizeBox.style.display = 'none';
            } else if (category === 'beam' || category === 'lintel') {
                inputLabel.innerText = "ആകെ നീളം (Running Feet - R.Ft)";
                spacingLabel.innerText = "റിങ് തമ്മിലുള്ള അകലം (Ring Spacing in Inches)";
                slabThicknessBox.style.display = 'none';
                spacingBox.style.display = 'block';
                steelSizeBox.style.display = 'block';
            } else if (category === 'stone' || category === 'plaster') {
                inputLabel.innerText = "പണിയേണ്ട ഏരിയ (Square Feet)";
                slabThicknessBox.style.display = 'none';
                spacingBox.style.display = 'none';
                steelSizeBox.style.display = 'none';
            }
        };

        window.calculateEstimation = function() {
            const val = parseFloat(document.getElementById('mainInput').value);
            const category = document.getElementById('workCategory').value;
            const thickness = parseFloat(document.getElementById('slabThickness').value);
            const spacing = parseFloat(document.getElementById('barSpacing').value);
            const steelSelection = document.getElementById('barSizeSelection').value;
            
            // മാനുവൽ ആയി നൽകിയ മേസ്തിരിമാരുടെ എണ്ണം എടുക്കുന്നു (ഇല്ലെങ്കിൽ ഓട്ടോമാറ്റിക് കണക്കാക്കും)
            const manualMasonInput = document.getElementById('masonCountInput').value;

            if (!val || val <= 0) {
                window.showToast('ശരിയായ അളവ് നൽകുക', false);
                return;
            }

            let i1 = "", i2 = "", i3 = "", i4 = "", i5 = "";

            if (category === 'slab') {
                let factor = thickness / 5; 
                let cementBags = Math.round((val / 100) * 7.5 * factor);
                let sandCft = Math.round(cementBags * 2.5); 
                let metalCft = Math.round(cementBags * 4.5); 

                let totalSteelKg = val * 0.78; 
                let steel10mm = Math.round(totalSteelKg * 0.45); 
                let steel8mm  = Math.round(totalSteelKg * 0.55); 

                let masons = manualMasonInput !== "" ? parseInt(manualMasonInput) : Math.ceil(val / 150);

                document.getElementById('labelItem1').innerText = "സിമന്റ് (Cement)";
                document.getElementById('labelItem2').innerText = "മണൽ (Sand)";
                document.getElementById('labelItem3').innerText = "മെറ്റൽ (Metal - 4.5 Cft)";
                document.getElementById('labelItem4').innerText = "കമ്പി കണക്ക് (Steel)";
                document.getElementById('labelItem5').innerText = "കെട്ടുകമ്പി & മേസ്തിരി ടീം";

                i1 = cementBags + " ചാക്ക്";
                i2 = sandCft + " Cft";
                i3 = metalCft + " Cft";
                i4 = `10mm: ${steel10mm} kg | 8mm: ${steel8mm} kg`;
                i5 = `കെട്ടുകമ്പി: ${Math.round(totalSteelKg * 0.02)} kg | മേസ്തിരിമാർ: ${masons}`;

                document.getElementById('resDetails').innerText = `സ്ലാബ് ഏരിയ: ${val} Sq.Ft, കനം: ${thickness} ഇഞ്ച്, അകലം: ${spacing} ഇഞ്ച്. (മേസ്തിരി പ്രാക്ടിക്കൽ കണക്ക് പ്രകാരം)`;
            } 
            else if (category === 'beam' || category === 'lintel') {
                let length = val;
                let cftPerFoot = (category === 'beam') ? 0.75 : 0.40;
                let totalCft = length * cftPerFoot;
                let cementBags = Math.round(totalCft * 0.85); 
                let sandCft = Math.round(cementBags * 2.5);
                let metalCft = Math.round(cementBags * 4.5); 

                // മെയിൻ കമ്പി സൈസ് അനുസരിച്ച് ഭാരം മാറുന്നതിനുള്ള കൃത്യമായ കണക്ക്
                let mainSteelMultiplier = 0.50;
                let ringWeightMultiplier = 0.65;
                let mainBarNames = "";

                if (steelSelection === '16_12') {
                    mainSteelMultiplier = 0.95; // ഹെവി ബീം
                    ringWeightMultiplier = 0.95;
                    mainBarNames = "16mm & 12mm (ഹെവി)";
                } else if (steelSelection === '12_10') {
                    mainSteelMultiplier = 0.70; // സ്റ്റാൻഡേർഡ്
                    ringWeightMultiplier = 0.80;
                    mainBarNames = "12mm & 10mm (സ്റ്റാൻഡേർഡ്)";
                } else {
                    mainSteelMultiplier = 0.45; // ലൈറ്റ്/ലിന്റൽ
                    ringWeightMultiplier = 0.60;
                    mainBarNames = "10mm & 8mm (ലിന്റൽ)";
                }

                let mainSteelKg = Math.round(length * mainSteelMultiplier);
                let ringCount = Math.round((length * 12) / spacing);
                let ringSteelKg = Math.round(ringCount * ringWeightMultiplier);
                let bindingWire = Math.round((mainSteelKg + ringSteelKg) * 0.03);
                let masons = manualMasonInput !== "" ? parseInt(manualMasonInput) : Math.ceil(length / 200);

                document.getElementById('labelItem1').innerText = "സിമന്റ് (Cement)";
                document.getElementById('labelItem2').innerText = "മണൽ (Sand)";
                document.getElementById('labelItem3').innerText = "മെറ്റൽ (Metal - 4.5 Cft)";
                document.getElementById('labelItem4').innerText = `മെയിൻ കമ്പി ഭാരം`;
                document.getElementById('labelItem5').innerText = "റിങ് (8mm) & കെട്ടുകമ്പി";

                i1 = cementBags + " ചാക്ക്";
                i2 = sandCft + " Cft";
                i3 = metalCft + " Cft";
                i4 = `${mainSteelKg} കിലോ (${mainBarNames})`;
                i5 = `${ringCount} എണ്ണം (${ringSteelKg} കി.ഗ്രാം) | കെട്ടുകമ്പി: ${bindingWire} കി.ഗ്രാം | മേസ്തിരിമാർ: ${masons}`;

                document.getElementById('resDetails').innerText = `${category === 'beam' ? 'ബീം' : 'ലിന്റൽ'} നീളം: ${length} R.Ft, അകലം: ${spacing} ഇഞ്ച്. (മേസ്തിരി പ്രാക്ടിക്കൽ കണക്ക്)`;
            }
            else if (category === 'stone') {
                let totalBricks = Math.ceil(val * 1.15);
                let cementBags = Math.ceil(totalBricks / 90); 
                let sandCft = Math.round(cementBags * 3);
                let masons = manualMasonInput !== "" ? parseInt(manualMasonInput) : Math.ceil(val / 100);

                document.getElementById('labelItem1').innerText = "സിമന്റ് (Cement)";
                document.getElementById('labelItem2').innerText = "മണൽ (Sand)";
                document.getElementById('labelItem3').innerText = "മെറ്റൽ / കല്ല്";
                document.getElementById('labelItem4').innerText = "കല്ലുകളുടെ എണ്ണം";
                document.getElementById('labelItem5').innerText = "ആകെ ഏരിയ & മേസ്തിരിമാർ";

                i1 = cementBags + " ചാക്ക്";
                i2 = sandCft + " Cft";
                i3 = "ബാധകമല്ല";
                i4 = totalBricks + " എണ്ണം";
                i5 = `${val} Sq.Ft | മേസ്തിരിമാർ: ${masons}`;

                document.getElementById('resDetails').innerText = `വെട്ടുകല്ല് കെട്ടൽ (${val} Sq.Ft). മേസ്തിരി അനുഭവക്കണക്ക് പ്രകാരം.`;
            }
            else if (category === 'plaster') {
                let cementBags = Math.round((val / 1000) * 22);
                let sandCft = Math.round((val / 1000) * 140);
                let masons = manualMasonInput !== "" ? parseInt(manualMasonInput) : Math.ceil(val / 250);

                document.getElementById('labelItem1').innerText = "സിമന്റ് (Cement)";
                document.getElementById('labelItem2').innerText = "മണൽ (Sand)";
                document.getElementById('labelItem3').innerText = "മെറ്റൽ";
                document.getElementById('labelItem4').innerText = "കെട്ടുകമ്പി";
                document.getElementById('labelItem5').innerText = "ആകെ ഏരിയ & മേസ്തിരിമാർ";

                i1 = cementBags + " ചാക്ക്";
                i2 = sandCft + " Cft";
                i3 = "ബാധകമല്ല";
                i4 = "ബാധകമല്ല";
                i5 = `${val} Sq.Ft | മേസ്തിരിമാർ: ${masons}`;

                document.getElementById('resDetails').innerText = `പ്ലാസ്റ്റിംഗ് എസ്റ്റിമേറ്റ് (${val} Sq.Ft). മേസ്തിരി അനുഭവക്കണക്ക് പ്രകാരം.`;
            }

            document.getElementById('resItem1').innerText = i1;
            document.getElementById('resItem2').innerText = i2;
            document.getElementById('resItem3').innerText = i3;
            document.getElementById('resItem4').innerText = i4;
            document.getElementById('resItem5').innerText = i5;

            document.getElementById('resultBox').classList.remove('hidden');
            window.showToast("കണക്കുകൂട്ടൽ വിജയകരമായി പൂർത്തിയായി!", true);
        };
    </script>
</body>
</html>
