<!DOCTYPE html>
<html lang="ml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>മേസ്തിരി പ്രോ - എസ്റ്റിമേറ്റർ കാൽക്കുലേറ്റർ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700;900&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <script src="language.js"></script>
    <style>
        body { font-family: 'Manjari', sans-serif; }
        @media print { .no-print { display: none !important; } }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast-animate { animation: slideIn 0.3s ease-out forwards; }
    </style>
    
    <script>
        if (!localStorage.getItem('userName')) {
            window.location.href = "login.html";
        }
    </script>
</head>
<body class="bg-[#050B18] text-white min-h-screen pb-12 p-4 font-sans">

    <!-- Toast Notification Container (Center) -->
    <div id="toastContainer" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 flex flex-col items-center space-y-2 pointer-events-none"></div>

    <div class="max-w-md mx-auto space-y-4">
        
        <!-- ഹെഡർ (Header) -->
        <div id="appHeader" class="w-full flex justify-center"></div>

        

        <!-- ടോപ്പ് നാവിഗേഷൻ ബാർ -->
        <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl flex justify-between items-center shadow-xl backdrop-blur-sm mb-4">
            <div>
                <h1 class="text-lg font-black text-white">എസ്റ്റിമേറ്റർ കാൽക്കുലേറ്റർ</h1>
                <p class="text-[10px] text-slate-400 font-bold uppercase">മേസ്തിരി അനുഭവക്കണക്ക് പ്രകാരം</p>
            </div>
            <a href="index.html" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-amber-400/40 text-amber-400 rounded-xl text-xs font-bold shadow-md transition">← ഡാഷ്‌ബോർഡ്</a>
        </div>

        <!-- കാൽക്കുലേറ്റർ ഫോം ഭാഗം -->
        <div class="bg-slate-900/90 text-white p-6 rounded-3xl shadow-xl mb-6 border border-slate-800 backdrop-blur-sm space-y-3.5">
            <h2 class="text-base font-black text-amber-400 mb-2">📐 പണിയുടെ വിവരങ്ങൾ തിരഞ്ഞെടുക്കുക</h2>
            
            <!-- പണിയുടെ തരം -->
            <div>
                <label class="block text-xs font-black text-slate-400 mb-1.5 uppercase">പണിയുടെ തരം (Work Category)</label>
                <select id="workCategory" onchange="toggleCategory()" class="w-full p-4 bg-slate-800/80 rounded-2xl border border-blue-500 text-sm font-bold focus:outline-none">
                    <option value="slab">സ്ലാബ് വാർപ്പ് (RCC Slab Steel & Materials)</option>
                    <option value="beam">ബീം വാർപ്പ് (Roof Beam Steel)</option>
                    <option value="lintel">ലിന്റൽ വാർപ്പ് (Lintel Steel)</option>
                    <option value="stone">വെട്ടുകല്ല് കെട്ടൽ (Laterite Stone)</option>
                    <option value="plaster">പ്ലാസ്റ്റിംഗ് (Plastering)</option>
                </select>
            </div>

            <!-- ഏരിയ അല്ലെങ്കിൽ നീളം ഫീൽഡ് (നീല ബോർഡറോട് കൂടിയത്) -->
            <div>
                <label id="inputLabel" class="block text-xs font-black text-slate-400 mb-1.5 uppercase">പണിയേണ്ട ഏരിയ (Square Feet)</label>
                <input type="number" id="mainInput" placeholder="ഉദാ: 1000" class="w-full p-4 bg-slate-800/80 rounded-2xl border border-blue-500 text-sm font-bold placeholder-slate-500 focus:outline-none">
            </div>

            <!-- സ്ലാബിന്റെ കനം (സ്ലാബിന് മാത്രം) -->
            <div id="slabThicknessBox">
                <label class="block text-xs font-black text-slate-400 mb-1.5 uppercase">വാർപ്പിന്റെ കനം (Thickness)</label>
                <select id="slabThickness" class="w-full p-4 bg-slate-800/80 rounded-2xl border border-blue-500 text-sm font-bold focus:outline-none">
                    <option value="4.5">4.5 ഇഞ്ച്</option>
                    <option value="5" selected>5 ഇഞ്ച് - സ്റ്റാൻഡേർഡ്</option>
                    <option value="5.5">5.5 ഇഞ്ച്</option>
                    <option value="6">6 ഇഞ്ച്</option>
                </select>
            </div>

            <!-- കമ്പി തമ്മിലുള്ള അകലം (Spacing - സ്ലാബിന് മാത്രം) -->
            <div id="spacingBox">
                <label class="block text-xs font-black text-slate-400 mb-1.5 uppercase">കമ്പി തമ്മിലുള്ള അകലം (Spacing)</label>
                <select id="barSpacing" class="w-full p-4 bg-slate-800/80 rounded-2xl border border-blue-500 text-sm font-bold focus:outline-none">
                    <option value="6" selected>6 ഇഞ്ച് (സാധാരണ വീടുകൾക്ക്)</option>
                    <option value="7">7 ഇഞ്ച്</option>
                    <option value="8">8 ഇഞ്ച്</option>
                </select>
            </div>

            <button onclick="calculateEstimation()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 p-4 rounded-2xl font-black text-sm shadow-lg shadow-amber-500/20 transition">കണക്കുകൂട്ടുക (Calculate)</button>
        </div>

        <!-- ഫലം കാണിക്കുന്ന ഭാഗം -->
        <div id="resultBox" class="hidden bg-slate-900/90 text-white p-6 rounded-3xl shadow-xl mb-6 border border-slate-800 backdrop-blur-sm space-y-4">
            <h2 class="text-base font-black text-emerald-400 mb-2 border-b border-slate-800 pb-2">📊 കണക്കാക്കിയ അളവുകൾ (വെവ്വേറെ)</h2>
            
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-slate-800/90 border border-blue-500/40 p-4 rounded-2xl text-center shadow-md">
                    <p id="labelItem1" class="text-[10px] text-slate-400 font-black uppercase">ഐറ്റം 1</p>
                    <p id="resItem1" class="text-base font-black text-amber-400 mt-1">-</p>
                </div>
                <div class="bg-slate-800/90 border border-blue-500/40 p-4 rounded-2xl text-center shadow-md">
                    <p id="labelItem2" class="text-[10px] text-slate-400 font-black uppercase">ഐറ്റം 2</p>
                    <p id="resItem2" class="text-base font-black text-amber-400 mt-1">-</p>
                </div>
                <div class="bg-slate-800/90 border border-blue-500/40 p-4 rounded-2xl text-center shadow-md">
                    <p id="labelItem3" class="text-[10px] text-slate-400 font-black uppercase">ഐറ്റം 3</p>
                    <p id="resItem3" class="text-base font-black text-amber-400 mt-1">-</p>
                </div>
                <div class="bg-slate-800/90 border border-blue-500/40 p-4 rounded-2xl text-center shadow-md">
                    <p id="labelItem4" class="text-[10px] text-slate-400 font-black uppercase">ഐറ്റം 4</p>
                    <p id="resItem4" class="text-base font-black text-amber-400 mt-1">-</p>
                </div>
            </div>

            <!-- ലേബർ / വിവരണ ബോക്സ് -->
            <div class="bg-blue-950/40 border border-blue-500/40 p-4 rounded-2xl space-y-2">
                <p class="text-xs font-black text-cyan-300 uppercase">👥 സൈറ്റ് വിവരങ്ങൾ & ടീം അളവ്</p>
                <p id="resDetails" class="text-xs font-bold text-slate-200 leading-relaxed">-</p>
            </div>
        </div>

    </div>

    <script type="module">
        import { setupHeader } from './header.js';

        document.addEventListener("DOMContentLoaded", () => {
            try {
                if (typeof setupHeader === 'function') { setupHeader('appHeader'); }
                else { document.getElementById('appHeader').innerHTML = `<h2 class="text-amber-400 font-black text-sm">മേസ്തിരി പ്രോ</h2>`; }
            } catch (e) { document.getElementById('appHeader').innerHTML = `<h2 class="text-amber-400 font-black text-sm">മേസ്തിരി പ്രോ</h2>`; }
        });

        const currentMeshtri = localStorage.getItem('userName') || "പൊതുമേസ്തിരി";
        document.getElementById('loggedInMeshtri').innerText = "സ്വാഗതം, " + currentMeshtri;

        window.showToast = function(message, isSuccess = true) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast-animate pointer-events-auto px-6 py-4 rounded-2xl text-white font-bold text-base shadow-2xl border backdrop-blur-md flex items-center gap-3 ${
                isSuccess 
                    ? 'bg-blue-950/95 border-blue-500 text-blue-200 shadow-blue-500/20' 
                    : 'bg-gradient-to-r from-red-950 to-rose-950 border-red-500 text-white'
            }`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        window.toggleCategory = function() {
            const category = document.getElementById('workCategory').value;
            const inputLabel = document.getElementById('inputLabel');
            const slabThicknessBox = document.getElementById('slabThicknessBox');
            const spacingBox = document.getElementById('spacingBox');

            if (category === 'slab') {
                inputLabel.innerText = "പണിയേണ്ട ഏരിയ (Square Feet)";
                slabThicknessBox.style.display = 'block';
                spacingBox.style.display = 'block';
            } else if (category === 'beam' || category === 'lintel') {
                inputLabel.innerText = "ബീമിന്റെ ആകെ നീളം (Running Feet / Length)";
                slabThicknessBox.style.display = 'none';
                spacingBox.style.display = 'none';
            } else if (category === 'stone') {
                inputLabel.innerText = "ചുമരിന്റെ ഏരിയ (Square Feet)";
                slabThicknessBox.style.display = 'none';
                spacingBox.style.display = 'none';
            } else if (category === 'plaster') {
                inputLabel.innerText = "പ്ലാസ്റ്റിംഗ് ഏരിയ (Square Feet)";
                slabThicknessBox.style.display = 'none';
                spacingBox.style.display = 'none';
            }
        };

        window.calculateEstimation = function() {
            const val = parseFloat(document.getElementById('mainInput').value);
            const category = document.getElementById('workCategory').value;
            const thickness = parseFloat(document.getElementById('slabThickness').value);
            const spacing = parseFloat(document.getElementById('barSpacing').value);

            if (!val || val <= 0) {
                window.showToast('ദയവായി ശരിയായ അളവ് നൽകുക!', false);
                return;
            }

            let i1 = "", i2 = "", i3 = "", i4 = "", detailsText = "";

            if (category === 'slab') {
                let totalCft = val * (thickness / 12);
                let dryVolume = totalCft * 1.54;
                let cementBags = (dryVolume / 6) / 1.25;
                let sandCft = (dryVolume / 6) * 2;
                let metalCft = (dryVolume / 6) * 3;

                let spacingMultiplier = 6 / spacing; 
                let steel8mm = Math.round(val * 0.22 * spacingMultiplier);  
                let steelMain = Math.round(val * 0.50 * spacingMultiplier); 

                document.getElementById('labelItem1').innerText = "സിമന്റ് (Cement)";
                document.getElementById('labelItem2').innerText = "മണൽ (Sand)";
                document.getElementById('labelItem3').innerText = "മെറ്റൽ (Metal)";
                document.getElementById('labelItem4').innerText = "കമ്പി (8mm + Main)";

                i1 = Math.round(cementBags) + " ചാക്ക്";
                i2 = Math.round(sandCft) + " Cft";
                i3 = Math.round(metalCft) + " Cft";
                i4 = (steel8mm + steelMain) + " കിലോ";

                detailsText = `സ്ലാബ് കനം: ${thickness} ഇഞ്ച്, കമ്പി അകലം: ${spacing} ഇഞ്ച്. ആവശ്യമായ മേസ്തിരിമാർ: ${Math.ceil(val/150)}, തൊഴിലാളികൾ: ${Math.ceil(val/100)}.`;
            } 
            else if (category === 'beam') {
                let mainSteel = Math.round(val * 0.65); 
                let ringSteel = Math.round(val * 0.30); 
                let bindingWire = 5;

                document.getElementById('labelItem1').innerText = "മെയിൻ കമ്പി";
                document.getElementById('labelItem2').innerText = "റിങ് കമ്പി (8mm)";
                document.getElementById('labelItem3').innerText = "കെട്ടുകമ്പി";
                document.getElementById('labelItem4').innerText = "ആകെ നീളം";

                i1 = mainSteel + " കിലോ";
                i2 = ringSteel + " കിലോ";
                i3 = bindingWire + " കിലോ";
                i4 = val + " R.Ft";

                detailsText = `${val} റണ്ണിങ് ഫീറ്റ് ബീം പണിക്കുള്ള സ്റ്റീൽ കണക്കാണിത്.`;
            }
            else if (category === 'lintel') {
                let mainSteel = Math.round(val * 0.35);
                let ringSteel = Math.round(val * 0.18);
                let bindingWire = 3;

                document.getElementById('labelItem1').innerText = "മെയിൻ കമ്പി";
                document.getElementById('labelItem2').innerText = "റിങ് കമ്പി";
                document.getElementById('labelItem3').innerText = "കെട്ടുകമ്പി";
                document.getElementById('labelItem4').innerText = "ആകെ നീളം";

                i1 = mainSteel + " കിലോ";
                i2 = ringSteel + " കിലോ";
                i3 = bindingWire + " കിലോ";
                i4 = val + " R.Ft";

                detailsText = `${val} റണ്ണിങ് ഫീറ്റ് ലിന്റൽ പണിക്കുള്ള സ്റ്റീൽ കണക്കാണിത്.`;
            }
            else if (category === 'stone') {
                let baseBricks = val * 1.15;
                let totalBricks = Math.ceil(baseBricks);
                let cementBags = Math.ceil(totalBricks / 100);
                let sandCft = Math.round(cementBags * 3);

                document.getElementById('labelItem1').innerText = "സിമന്റ്";
                document.getElementById('labelItem2').innerText = "മണൽ";
                document.getElementById('labelItem3').innerText = "വെട്ടുകല്ലുകൾ";
                document.getElementById('labelItem4').innerText = "ഏരിയ";

                i1 = cementBags + " ചാക്ക്";
                i2 = sandCft + " Cft";
                i3 = totalBricks + " എണ്ണം";
                i4 = val + " Sq.Ft";

                detailsText = `വെട്ടുകല്ല് കെട്ടലിനുള്ള മെറ്റീരിയൽ എസ്റ്റിമേറ്റ്.`;
            }
            else if (category === 'plaster') {
                let cementBags = Math.round((val / 1000) * 25);
                let sandCft = Math.round((val / 1000) * 150);

                document.getElementById('labelItem1').innerText = "സിമന്റ്";
                document.getElementById('labelItem2').innerText = "മണൽ";
                document.getElementById('labelItem3').innerText = "-";
                document.getElementById('labelItem4').innerText = "-";

                i1 = cementBags + " ചാക്ക്";
                i2 = sandCft + " Cft";
                i3 = "ബാധകമല്ല";
                i4 = "ബാധകമല്ല";

                detailsText = `പ്ലാസ്റ്റിംഗ് ജോലികൾക്കുള്ള കണക്കാണിത്.`;
            }

            document.getElementById('resItem1').innerText = i1;
            document.getElementById('resItem2').innerText = i2;
            document.getElementById('resItem3').innerText = i3;
            document.getElementById('resItem4').innerText = i4;
            document.getElementById('resDetails').innerText = detailsText;

            document.getElementById('resultBox').classList.remove('hidden');
            window.showToast("എസ്റ്റിമേറ്റ് വിജയകരമായി കണക്കാക്കി!", true);
        };
    </script>
</body>
</html>
