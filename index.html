<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>സുരക്ഷാ പിൻ ലോക്ക് - Meshtri Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Manjari', sans-serif; }
        
        @keyframes pulseGlow {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 30px rgba(245, 158, 11, 0.8);
            }
        }
        .animate-glow {
            animation: pulseGlow 2s infinite ease-in-out;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-slate-950 via-blue-950 to-slate-900 min-h-screen text-white flex flex-col items-center justify-between p-6">

    <!-- ലോഗോ ഭാഗം -->
    <div class="pt-12">
        <div class="w-36 h-36 bg-amber-500/20 border-2 border-amber-500/60 rounded-3xl mx-auto flex items-center justify-center overflow-hidden shadow-2xl p-2 animate-glow">
            <img src="icon.png" alt="Meshtri Pro" class="w-full h-full object-cover rounded-2xl">
        </div>
    </div>

    <!-- പിൻ ലോക്ക് ബോക്സ് -->
    <div class="space-y-4 max-w-sm w-full bg-white/5 backdrop-blur-md p-6 rounded-3xl border border-blue-500/30 shadow-xl text-center my-auto">
        <h3 class="font-black text-xl text-white">സുരക്ഷാ പിൻ ലോക്ക്</h3>
        <p class="text-xs text-slate-300 font-medium">തുടരുന്നതിനായി നിങ്ങളുടെ 4 അക്ക പിൻ നൽകുക</p>
        
        <div class="space-y-3 pt-2">
            <!-- പ്രധാനപ്പെട്ട മാറ്റം: ID 'userPinInput' എന്ന് കൃത്യമായി നൽകിയിരിക്കുന്നു -->
            <input type="password" id="userPinInput" maxlength="4" placeholder="••••" class="w-40 bg-slate-900/90 border-2 border-slate-700 rounded-2xl px-4 py-3 text-center text-2xl tracking-widest text-amber-400 focus:outline-none focus:border-amber-400 mx-auto block shadow-inner">

            <button type="button" onclick="verifyPin()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-black py-3 rounded-2xl text-base shadow-xl transition cursor-pointer">
                അൺലോക്ക് ചെയ്യുക
            </button>
        </div>

        <div class="flex items-center justify-between text-xs pt-3 border-t border-slate-800">
            <a href="#" onclick="resetPinPrompt(); return false;" class="text-slate-400 hover:text-amber-400 transition">പിൻ റീസെറ്റ് ചെയ്യുക (1234)</a>
            <a href="login.html" class="text-amber-400 font-bold hover:underline">മറ്റൊരു അക്കൗണ്ട്?</a>
        </div>
    </div>

    <!-- ഫൂട്ടർ -->
    <div class="pb-4">
        <p class="text-center text-xs text-slate-400 font-bold">
            മേസ്തിരിമാർക്കായി നിർമ്മിച്ചത് ❤️ കേരളം
        </p>
    </div>

    <script>
        // പേജ് ലോഡ് ചെയ്യുമ്പോൾ യൂസർ ലോഗൗട്ട് ചെയ്തിട്ടുണ്ടോ എന്ന് പരിശോധിക്കുക
        window.onload = function() {
            const isLoggedOut = localStorage.getItem('isLoggedOut');
            if (isLoggedOut === 'true') {
                window.location.href = "login.html";
            }
        };

        // പിൻ വെരിഫൈ ചെയ്യുന്ന ഫങ്ഷൻ
        function verifyPin() {
            const pinInput = document.getElementById('userPinInput');
            if (!pinInput) return;
            
            const enteredPin = pinInput.value.trim();
            const savedPin = localStorage.getItem('appPin') || "1234";

            if (enteredPin === savedPin) {
                sessionStorage.setItem('isUnlocked', 'true');
                localStorage.removeItem('isLoggedOut'); // ലോഗൗട്ട് സ്റ്റാറ്റസ് ഒഴിവാക്കുക
                window.location.href = "dashboard.html";
            } else {
                alert("നൽകിയ പിൻ നമ്പർ തെറ്റാണ്! (സ്ഥിരമായ പിൻ: 1234)");
                pinInput.value = "";
            }
        }

        // പിൻ റീസെറ്റ് ചെയ്യാനുള്ള ഫങ്ഷൻ
        function resetPinPrompt() {
            localStorage.setItem('appPin', "1234");
            alert("പിൻ നമ്പർ വിജയകരമായി '1234' എന്ന് റീസെറ്റ് ചെയ്തിരിക്കുന്നു! ഇപ്പോൾ ഈ പിൻ ഉപയോഗിച്ച് അൺലോക്ക് ചെയ്യാം.");
        }
    </script>
</body>
</html>
