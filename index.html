<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>മേസ്തിരി പ്രോ - ഹോം</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Manjari', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-blue-950 to-slate-900 min-h-screen text-white flex flex-col justify-between p-6 text-center">

    <!-- ടോപ്പ് ഹെഡർ: വലിയ ലോഗോയും തിളക്കവും -->
    <div class="pt-8">
        <div class="inline-flex items-center gap-4 bg-amber-500/30 text-amber-300 px-7 py-3.5 rounded-full border-2 border-amber-300 shadow-[0_0_30px_rgba(251,191,36,0.5)] mx-auto">
            <img src="icon.png" alt="Mesthiri" class="rounded-full object-cover border-2 border-amber-200 shadow-lg" style="width: 72px; height: 72px;">
            <span class="text-2xl font-black text-amber-300 tracking-wide">മേസ്തിരി പ്രോ</span>
        </div>
        <h1 class="text-4xl font-black mt-6 tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-white via-blue-100 to-amber-400">
            സ്വാഗതം!
        </h1>
        <p class="text-lg text-blue-200 mt-2 font-bold">നിങ്ങളുടെ നിർമ്മാണ ജോലികൾ എളുപ്പത്തിൽ കൈകാര്യം ചെയ്യാം</p>
    </div>

    <!-- സെൻട്രൽ വെൽക്കം കാർഡ് -->
    <div class="bg-white/5 backdrop-blur-md p-8 rounded-3xl border border-blue-500/30 max-w-sm mx-auto w-full my-6 space-y-6 shadow-xl">
        <p class="text-base text-blue-100 font-bold leading-relaxed">
            മേസ്തിരിമാർക്കും ബിൽഡർമാർക്കും വേണ്ടിയുള്ള കേരളത്തിലെ നമ്പർ വൺ ഡിജിറ്റൽ കൂട്ടായ്മ.
        </p>

        <div class="space-y-4">
            <a href="login.html" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 text-center p-4 rounded-2xl font-black text-lg shadow-xl shadow-amber-950/50 block transition">
                ലോഗിൻ ചെയ്യുക
            </a>
            <a href="register.html" class="w-full bg-slate-900/90 border-2 border-blue-500/50 hover:border-amber-400 text-amber-300 text-center p-4 rounded-2xl font-black text-lg block transition">
                പുതിയ രജിസ്ട്രേഷൻ
            </a>
        </div>
    </div>

    <!-- ഫൂട്ടർ -->
    <div class="max-w-sm mx-auto w-full pb-4">
        <p class="text-xs text-slate-400 font-bold">
            മേസ്തിരിമാർക്കായി നിർമ്മിച്ചത് ❤️ കേരളം
        </p>
    </div>

</body>
</html>
