<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Search Console Verification -->
    <meta name="google-site-verification" content="WvP2of_1eHX_ojBwxVwTwuBCz91hW4wpjX2znfmIqIA" />
    <link rel="manifest" href="manifest.json">

    <title>മേസ്തിരി പ്രോ - പ്രവേശനം</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700;900&display=swap" rel="stylesheet">
  
    <!-- language.js ഫയൽ ഇവിടെ ഹെഡറിൽ നൽകുന്നു -->
    <script src="language.js"></script>

    <style>
        body { 
            font-family: 'Manjari', sans-serif; 
            background-color: #0d1117 !important; 
            color: #ffffff !important; 
        }
        .max-w-md {
            border: 3px solid #10b981;
            border-radius: 2.5rem;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.3);
            background-color: #0d1117;
        }
    </style>

    <!-- ലാംഗ്വേജ് മാറ്റുന്നതിനുള്ള സ്ക്രിപ്റ്റ് -->
    <script>
        window.switchLanguage = function(langCode) {
            if (!langCode) {
                langCode = localStorage.getItem('selectedLang') || 'ml';
            }
            localStorage.setItem('selectedLang', langCode);

            if (typeof words !== 'undefined') {
                document.querySelectorAll('[data-key]').forEach(element => {
                    const key = element.getAttribute('data-key');
                    if (words[key] && words[key][langCode]) {
                        element.innerText = words[key][langCode];
                    }
                });

                document.querySelectorAll('[data-key-placeholder]').forEach(input => {
                    const key = input.getAttribute('data-key-placeholder');
                    if (words[key] && words[key][langCode]) {
                        input.placeholder = words[key][langCode];
                    }
                });
            }
        };

        window.changeLanguage = window.switchLanguage;
    </script>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full p-6 space-y-6 text-center shadow-2xl">
        
        <!-- ഒറിജിനൽ ഹെഡറും ലോഗോയും (header.js വഴി) -->
        <div id="appHeader" class="w-full flex justify-center"></div>

        <!-- ഹെഡർ ടൈറ്റിൽ & സബ്‌ടൈറ്റിൽ -->
        <div class="space-y-2">
            <h1 class="lang text-2xl font-black text-amber-400" data-key="pinLoginTitle">മേസ്തിരി പ്രവേശനം</h1>
            <p class="lang text-xs text-slate-400 font-medium" data-key="pinLoginSubtitle">തുടരുന്നതിനായി നിങ്ങളുടെ 4 അക്ക പിൻ നൽകുക</p>
        </div>

        <!-- പിൻ ഇൻപുട്ട് ബോക്സ് -->
        <div class="space-y-4">
            <input type="password" id="userPinInput" maxlength="4" placeholder="••••" data-key-placeholder="pinPlaceholder" class="w-48 bg-slate-900 border-2 border-slate-700 rounded-2xl px-4 py-3 text-center text-2xl tracking-widest text-amber-400 focus:outline-none focus:border-amber-400 mx-auto block shadow-inner">

            <button onclick="verifyPin()" class="lang w-full bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-black py-3.5 rounded-2xl text-sm shadow-xl hover:opacity-95 transition cursor-pointer" data-key="unlockBtn">
                അൺലോക്ക് ചെയ്യുക
            </button>
        </div>

        <!-- താഴെയുള്ള ഓപ്ഷനുകൾ -->
        <div class="flex items-center justify-between text-xs pt-4 border-t border-slate-800">
            <a href="#" onclick="resetPinPrompt()" class="lang text-slate-400 hover:text-amber-400 transition" data-key="resetPinText">പിൻ മാറ്റുക (Reset to 1234)</a>
            <a href="login.html" class="lang text-amber-400 font-bold hover:underline" data-key="otherAccountText">മറ്റൊരു അക്കൗണ്ട്? (Login)</a>
        </div>
    </div>

    <!-- പിൻ വെരിഫിക്കേഷനും ലാംഗ്വേജ് ലോഡിംഗും -->
    <script type="module">
        import { setupHeader } from './header.js';

        // ഹെഡർ ലോഡ് ചെയ്യുന്നു
        try {
            setupHeader('appHeader');
        } catch(e) {
            console.log("Header load error:", e);
        }

        // പേജ് ലോഡ് ചെയ്യുമ്പോൾ ഭാഷ സെറ്റ് ചെയ്യുന്നു
        document.addEventListener("DOMContentLoaded", () => {
            const savedLang = localStorage.getItem('selectedLang') || 'ml';
            if (typeof window.switchLanguage === 'function') {
                window.switchLanguage(savedLang);
            }
        });

        // പിൻ പരിശോധിക്കുന്ന ഫങ്ഷൻ
        window.verifyPin = function() {
            const enteredPin = document.getElementById('userPinInput').value.trim();
            const savedPin = localStorage.getItem('appPin') || "1234"; // ഡിഫോൾട്ട് പിൻ 1234

            if (enteredPin === savedPin) {
                window.location.href = "Dashboard.html";
            } else {
                alert("നൽകിയ പിൻ നമ്പർ തെറ്റാണ്. ദയവായി വീണ്ടും ശ്രമിക്കുക.");
                document.getElementById('userPinInput').value = "";
            }
        };

        window.resetPinPrompt = function() {
            localStorage.setItem('appPin', "1234");
            alert("പിൻ നമ്പർ വിജയകരമായി '1234' എന്ന് റീസെറ്റ് ചെയ്തിരിക്കുന്നു!");
        };
    </script>
</body>
</html>
