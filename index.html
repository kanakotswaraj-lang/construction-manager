<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>മേസ്തിരി പ്രോ - ലോഗിൻ / ലോക്ക്</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&display=swap" rel="stylesheet">
    <script src="language.js"></script>
    <style>
        body { font-family: 'Manjari', sans-serif; }
    </style>
</head>

<body class="bg-gradient-to-br from-slate-950 via-blue-950 to-slate-900 min-h-screen text-white flex flex-col items-center justify-between p-6">

    <!-- ലോഗോ ഭാഗം -->
    <div class="pt-6">
        <div class="w-28 h-28 bg-amber-500/20 border border-amber-500/40 rounded-3xl mx-auto flex items-center justify-center overflow-hidden shadow-2xl p-1.5">
            <img src="icon.png" alt="Meshtri Pro" class="w-full h-full object-cover rounded-2xl">
        </div>
    </div>

    <!-- സെന്ററിലെ ബോക്സ് (യൂസർ നെയിം ഇല്ലെങ്കിൽ ലോഗിൻ ഫോം കാണിക്കും, ഉണ്ടെങ്കിൽ പിൻ ലോക്ക് കാണിക്കും) -->
    <div class="space-y-4 max-w-sm w-full bg-white/5 backdrop-blur-md p-6 rounded-3xl border border-blue-500/30 shadow-xl text-center my-auto">
        
        <!-- 1. ആദ്യമായി വരുമ്പോൾ കാണിക്കുന്ന ലോഗിൻ സെക്ഷൻ -->
        <div id="loginSection" class="hidden space-y-4">
            <h3 class="font-black text-xl text-white">സ്വാഗതം - മേസ്തിരി പ്രോ</h3>
            <p class="text-xs text-slate-300">തുടരുന്നതിനായി നിങ്ങളുടെ പേര് നൽകുക</p>
            
            <input type="text" id="userNameInput" placeholder="നിങ്ങളുടെ പേര്" class="w-full bg-slate-900/90 border-2 border-slate-700 rounded-2xl px-4 py-3 text-center text-lg text-amber-400 focus:outline-none focus:border-amber-400">

            <button onclick="saveUserAndProceed()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-black py-3 rounded-2xl text-base shadow-xl transition cursor-pointer">
                തുടരുക
            </button>
        </div>

        <!-- 2. നിലവിൽ യൂസർ ഉണ്ടെങ്കിൽ കാണിക്കുന്ന പിൻ ലോക്ക് സെക്ഷൻ -->
        <div id="pinLockSection" class="hidden space-y-4">
            <h3 class="font-black text-xl text-white">സുരക്ഷാ പിൻ ലോക്ക്</h3>
            <p class="text-xs text-slate-300">തുടരുന്നതിനായി നിങ്ങളുടെ 4 അക്ക പിൻ നൽകുക</p>
            
            <input type="password" id="userPinInput" maxlength="4" placeholder="••••" class="w-40 bg-slate-900/90 border-2 border-slate-700 rounded-2xl px-4 py-3 text-center text-2xl tracking-widest text-amber-400 focus:outline-none focus:border-amber-400 mx-auto block shadow-inner">

            <button onclick="verifyPin()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-black py-3 rounded-2xl text-base shadow-xl transition cursor-pointer">
                അൺലോക്ക് ചെയ്യുക
            </button>

            <div class="flex items-center justify-between text-xs pt-3 border-t border-slate-800">
                <a href="#" onclick="resetPinPrompt(); return false;" class="text-slate-400 hover:text-amber-400 transition">പിൻ റീസെറ്റ് (1234)</a>
                <a href="#" onclick="switchAccount(); return false;" class="text-amber-400 font-bold hover:underline">മറ്റൊരു അക്കൗണ്ട്?</a>
            </div>
        </div>

    </div>

    <!-- ഫൂട്ടർ -->
    <div class="pb-4">
        <p class="text-center text-xs text-slate-400 font-bold">
            മേസ്തിരിമാർക്കായി നിർമ്മിച്ചത് ❤️ കേരളം
        </p>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const userName = localStorage.getItem('userName');
            const isLoggedOut = localStorage.getItem('isLoggedOut');

            // യൂസർ ഇല്ലെങ്കിലോ അല്ലെങ്കിൽ ലോഗൗട്ട് ചെയ്തിട്ടുണ്ടെങ്കിലോ ലോഗിൻ ഫോം കാണിക്കുക
            if (!userName || isLoggedOut === 'true') {
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('pinLockSection').classList.add('hidden');
            } else {
                // ഇല്ലെങ്കിൽ പിൻ ലോക്ക് കാണിക്കുക
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('pinLockSection').classList.remove('hidden');
            }
        });

        // പുതിയ യൂസർ പേര് സേവ് ചെയ്ത് ഡാഷ്‌ബോർഡിലേക്ക് പോകുമ്പോൾ
        function saveUserAndProceed() {
            const nameInput = document.getElementById('userNameInput').value.trim();
            if (!nameInput) {
                alert("ദയവായി നിങ്ങളുടെ പേര് നൽകുക!");
                return;
            }
            localStorage.setItem('userName', nameInput);
            localStorage.removeItem('isLoggedOut');
            sessionStorage.setItem('isUnlocked', 'true');
            window.location.href = "dashboard.html";
        }

        // പിൻ വെരിഫൈ ചെയ്യുന്ന ഫങ്ഷൻ
        function verifyPin() {
            const enteredPin = document.getElementById('userPinInput').value.trim();
            const savedPin = localStorage.getItem('appPin') || "1234";

            if (enteredPin === savedPin) {
                sessionStorage.setItem('isUnlocked', 'true');
                localStorage.removeItem('isLoggedOut');
                window.location.href = "dashboard.html";
            } else {
                alert("നൽകിയ പിൻ നമ്പർ തെറ്റാണ്. ദയവായി വീണ്ടും ശ്രമിക്കുക.");
                document.getElementById('userPinInput').value = "";
            }
        }

        // പിൻ റീസെറ്റ് ചെയ്യാൻ
        function resetPinPrompt() {
            localStorage.setItem('appPin', "1234");
            alert("പിൻ നമ്പർ '1234' എന്ന് റീസെറ്റ് ചെയ്തിരിക്കുന്നു!");
        }

        // മറ്റൊരു അക്കൗണ്ട് മാറ്റാൻ (ലോഗിൻ പേജിലേക്ക് മാറാൻ)
        function switchAccount() {
            localStorage.setItem('isLoggedOut', 'true');
            document.getElementById('pinLockSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        }
    </script>
</body>
</html>
