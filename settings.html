<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="lang" data-key="backup_restore_title">ബാക്ക്പ്പ് & റെസ്റ്റോർ - മേസ്തിരി പ്രോ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="language.js?v=3.0"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Manjari', sans-serif; background-color: #050B18; color: white; }
        input, select, textarea {
            border: 2px solid rgba(51, 65, 85, 1);
            transition: all 0.3s ease;
            background-color: #1e293b !important;
            color: white !important;
        }
        input:focus, select:focus {
            border-color: #eab308 !important;
            outline: none;
            box-shadow: 0 0 0 4px rgba(234, 179, 8, 0.2);
        }
        /* ഹെഡറിലെ ലാംഗ്വേജ് ഡ്രോപ്പ്ഡൗൺ വ്യക്തമായി കാണാൻ */
        #langSelectDropdown {
            background-color: #facc15 !important;
            color: #000000 !important;
            font-weight: 900 !important;
        }
        #langSelectDropdown option {
            background-color: #ffffff !important;
            color: #000000 !important;
            font-weight: 900 !important;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- മെയിൻ ബോക്സ് -->
    <div class="bg-slate-900/90 p-5 rounded-3xl shadow-[0_0_35px_rgba(147,51,234,0.4)] w-full max-w-sm border-2 border-purple-500 text-white space-y-4">
        
        <!-- ഹെഡർ ഇവിടെ ലോഡ് ചെയ്യും -->
        <div id="appHeader"></div>

        <!-- ലോഗിൻ ചെയ്ത യൂസർ വിവരം -->
        <div class="bg-slate-950/80 p-4 rounded-2xl border border-purple-500/30">
            <p class="text-xs text-purple-300/80 font-bold mb-1 lang" data-key="loggedInUserLabel">ലോഗിൻ ചെയ്തിരിക്കുന്ന യൂസർ:</p>
            <p id="loggedInUserName" class="text-lg font-black text-purple-300">swaraj</p>
        </div>

        <!-- ക്ലൗഡ് ഡാറ്റ ബാക്ക്അപ്പ് സെക്ഷൻ -->
        <div class="bg-slate-950/80 p-4 rounded-2xl border border-purple-500/30 space-y-3">
            <h2 class="text-base font-black text-purple-300 lang" data-key="backupTitle">ക്ലൗഡ് ഡാറ്റ ബാക്ക്അപ്പ്</h2>
            <p class="text-xs text-purple-200/70 lang" data-key="backupDesc">നിങ്ങളുടെ മുഴുവൻ ഹാജറും കണക്കുകളും സുരക്ഷിതമായി ഡൗൺലോഡ് ചെയ്യാം.</p>
            <button onclick="window.downloadBackup()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white p-3 rounded-xl font-bold text-sm shadow-md hover:brightness-110 transition lang" data-key="backupBtn">
                ബാക്ക്അപ്പ് ഫയൽ ഡൗൺലോഡ് ചെയ്യുക (JSON)
            </button>
        </div>

        <!-- ക്ലൗഡ് ഡാറ്റ റെസ്റ്റോർ സെക്ഷൻ -->
        <div class="bg-slate-950/80 p-4 rounded-2xl border border-purple-500/30 space-y-3">
            <h2 class="text-base font-black text-purple-300 lang" data-key="restoreTitle">ക്ലൗഡ് ഡാറ്റ റെസ്റ്റോർ</h2>
            <p class="text-xs text-purple-200/70 lang" data-key="restoreDesc">മുമ്പ് ഡൗൺലോഡ് ചെയ്ത ബാക്ക്അപ്പ് ഫയൽ (JSON) തിരഞ്ഞെടുത്ത് ഡാറ്റ തിരികെ കൊണ്ടുവരാം.</p>
            <p class="text-xs font-bold text-purple-300 lang" data-key="selectFileLabel">ബാക്ക്അപ്പ് ഫയൽ തിരഞ്ഞെടുക്കുക</p>
            
            <div class="flex items-center bg-slate-900 p-2.5 rounded-xl border border-purple-500/40">
                <input type="file" id="restoreFile" class="text-xs text-purple-200 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-purple-600 file:text-white cursor-pointer">
            </div>

            <button onclick="window.restoreData()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white p-3 rounded-xl font-black text-sm shadow-md hover:brightness-110 transition lang" data-key="restoreBtn">
                ഡാറ്റ റെസ്റ്റോർ ചെയ്യുക
            </button>
        </div>

    </div>

    <!-- ജാവസ്ക്രിപ്റ്റ് ലോജിക് -->
    <script type="module">
        import { setupHeader } from './header.js';

        // മറ്റ് പേജുകളിൽ ഉള്ളതുപോലെ കൃത്യമായി ലാംഗ്വേജ് മാറ്റുന്ന ഫങ്ഷൻ
        window.switchLanguage = function(lang) {
            if (!lang) lang = localStorage.getItem('selectedLang') || 'ml';
            
            document.querySelectorAll('.lang').forEach(element => {
                const key = element.getAttribute('data-key');
                if (typeof words !== 'undefined' && words[key] && words[key][lang]) {
                    element.innerText = words[key][lang];
                }
            });
        };

        document.addEventListener("DOMContentLoaded", () => {
            const currentMeshtri = localStorage.getItem('userName') || "swaraj";
            const userEl = document.getElementById('loggedInUserName');
            if (userEl) userEl.innerText = currentMeshtri;

            // ഹെഡർ ലോഡ് ചെയ്യുന്നു
            if (typeof setupHeader === 'function') {
                setupHeader('appHeader', true, currentMeshtri);
            }

            // നിലവിലെ ഭാഷ ലോഡ് ചെയ്ത് സെറ്റ് ചെയ്യുന്നു
            const savedLang = localStorage.getItem('selectedLang') || 'ml';
            
            setTimeout(() => {
                const langDropdown = document.getElementById('langSelectDropdown');
                if (langDropdown) {
                    langDropdown.value = savedLang;
                }
            }, 50);

            window.switchLanguage(savedLang);
        });

        // ഭാഷ മാറ്റുമ്പോൾ കോൾ ചെയ്യുന്ന ഫങ്ഷൻ
        window.changeLanguageFromDropdown = function(selectedLang) {
            localStorage.setItem('selectedLang', selectedLang);
            window.switchLanguage(selectedLang);
            window.dispatchEvent(new CustomEvent('languageChanged', { detail: selectedLang }));
            location.reload();
        };
    </script>
</body>
</html>
