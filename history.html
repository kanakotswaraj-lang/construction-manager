<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="language.js?v=3.0"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700;900&display=swap" rel="stylesheet">
    <title class="lang" data-key="accounts_history_title">കണക്ക് ഹിസ്റ്ററി & എഡിറ്റ്</title>
    <style>
        body { font-family: 'Manjari', sans-serif; background-color: #050B18; color: white; }
        input, select, textarea {
            border: 2px solid rgba(51, 65, 85, 1);
            transition: all 0.3s ease;
            background-color: #1e293b !important;
            color: white !important;
        }
        input:focus, select:focus {
            border-color: #22d3ee !important;
            outline: none;
            box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.2);
        }
    </style>
</head>
<body class="min-h-screen pb-12 p-4">
    <div class="max-w-md mx-auto space-y-4 border-2 border-cyan-500/60 p-4 rounded-3xl shadow-[0_0_25px_rgba(6,182,212,0.25)] bg-[#050B18]/95">
        
        <!-- ഹെഡർ -->
        <div id="appHeader" class="w-full flex justify-center"></div>

        <!-- ടൈറ്റിലും ഹോം ബട്ടണും -->
        <div class="bg-slate-900 border-2 border-cyan-500 p-4 rounded-2xl flex justify-between items-center shadow-xl shadow-cyan-950/50 my-4">
            <h1 class="text-sm font-black">
                <span class="lang bg-gradient-to-r from-cyan-400 via-teal-300 to-sky-400 bg-clip-text text-transparent" data-key="accounts_history_edit">Accounts History & Edit</span>
            </h1>
            <a href="dashboard.html" class="px-4 py-2 bg-gradient-to-r from-cyan-600 to-teal-600 text-white rounded-xl text-xs font-black shadow-lg flex items-center gap-2 border border-white/40">
                <span>🏠</span> <span class="lang" data-key="homeBtn">Home</span>
            </a>
        </div>

        <!-- ആകെ വരവും ചെലവും കാണിക്കുന്ന ബോക്സ് -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-slate-900 border border-slate-700 p-4 rounded-3xl shadow-lg text-center">
                <p class="text-[10px] uppercase font-black text-slate-400 lang" data-key="totalIncome">Total Income</p>
                <h2 id="totalIncomeText" class="text-lg font-black text-emerald-400 mt-1">₹ 0</h2>
            </div>
            <div class="bg-slate-900 border border-slate-700 p-4 rounded-3xl shadow-lg text-center">
                <p class="text-[10px] uppercase font-black text-slate-400 lang" data-key="totalExpenseWage">Total Expense/Wage</p>
                <h2 id="totalExpenseText" class="text-lg font-black text-amber-400 mt-1">₹ 0</h2>
            </div>
        </div>

        <!-- തിരയുന്ന സെക്ഷനും ഫിൽട്ടറുകളും -->
        <div class="bg-slate-900/90 p-4 rounded-3xl shadow-xl border border-slate-800 space-y-3">
            <div class="relative">
                <input type="text" id="searchHistory" placeholder="🔍 Search by site name or details..." oninput="window.filterAndDisplay()" class="w-full p-3.5 bg-slate-800 rounded-2xl border border-slate-700 text-xs lang-placeholder text-white" data-key="search_placeholder">
            </div>
            
            <div class="grid grid-cols-4 gap-1.5 pt-1">
                <button onclick="window.setCategoryFilter('all')" id="tab-all" class="filter-tab py-2.5 rounded-xl text-[11px] font-black bg-cyan-500 text-slate-950 border border-cyan-400 transition lang" data-key="all">All</button>
                <button onclick="window.setCategoryFilter('income')" id="tab-income" class="filter-tab py-2.5 rounded-xl text-[11px] font-bold bg-slate-800 text-white border border-slate-700 transition lang" data-key="income">Income</button>
                <button onclick="window.setCategoryFilter('wage')" id="tab-wage" class="filter-tab py-2.5 rounded-xl text-[11px] font-bold bg-slate-800 text-white border border-slate-700 transition lang" data-key="wage">Wage</button>
                <button onclick="window.setCategoryFilter('expense')" id="tab-expense" class="filter-tab py-2.5 rounded-xl text-[11px] font-bold bg-slate-800 text-white border border-slate-700 transition lang" data-key="expense">Expense</button>
            </div>
        </div>

        <!-- കണക്കുകൾ ലിസ്റ്റ് ചെയ്യുന്ന സ്ഥലം -->
        <div id="historyListContainer" class="space-y-3">
            <div class="text-center text-slate-500 py-8 text-xs font-bold lang" data-key="noAccounts">No accounts found</div>
        </div>
    </div>

    <!-- എഡിറ്റ് മോഡൽ -->
    <div id="editModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl w-full max-w-sm space-y-3 shadow-2xl">
            <h3 class="font-black text-white text-sm mb-2 lang" data-key="editAccountTitle">കണക്ക് എഡിറ്റ് ചെയ്യുക</h3>
            <input type="hidden" id="editDocId">
            <div>
                <label class="text-[10px] text-slate-400 font-bold block mb-1 lang" data-key="nameLabel">പേര്</label>
                <input type="text" id="editName" class="w-full p-3 bg-slate-800 rounded-xl text-xs">
            </div>
            <div>
                <label class="text-[10px] text-slate-400 font-bold block mb-1 lang" data-key="siteLabel">സൈറ്റ്</label>
                <input type="text" id="editSite" class="w-full p-3 bg-slate-800 rounded-xl text-xs">
            </div>
            <div>
                <label class="text-[10px] text-slate-400 font-bold block mb-1 lang" data-key="amountLabel">തുക</label>
                <input type="number" id="editAmount" class="w-full p-3 bg-slate-800 rounded-xl text-xs">
            </div>
            <div>
                <label class="text-[10px] text-slate-400 font-bold block mb-1 lang" data-key="date">തീയതി</label>
                <input type="date" id="editDate" class="w-full p-3 bg-slate-800 rounded-xl text-xs">
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="window.closeEditModal()" class="flex-1 bg-slate-800 text-slate-300 py-3 rounded-xl text-xs font-bold lang" data-key="cancelEditBtn">ഇല്ല</button>
                <button onclick="window.updateAccountData()" class="flex-1 bg-cyan-600 text-white py-3 rounded-xl text-xs font-black lang" data-key="updateBtn">അപ്ഡേറ്റ്</button>
            </div>
        </div>
    </div>

    <!-- ടോസ്റ്റ് നോട്ടിഫിക്കേഷൻ -->
    <div id="customToast" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-900 border-2 border-cyan-400 text-cyan-300 px-6 py-3 rounded-2xl shadow-2xl font-black text-xs z-50 transition-all duration-300 opacity-0 pointer-events-none text-center"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        import { setupHeader } from './header.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            databaseURL: "https://mesthri-app-default-rtdb.firebaseio.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d",
            measurementId: "G-J9Y5TW9D7T"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let currentMeshtri = localStorage.getItem('userName') || "പൊതുമേസ്തിരി";
        let allHistoryData = [];
        let currentFilter = 'all';

        window.showToast = (message, isSuccess = true) => {
            const toast = document.getElementById('customToast');
            if(!toast) return;
            toast.innerText = message;
            toast.className = `fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 px-6 py-3 rounded-2xl shadow-2xl font-black text-xs z-50 transition-all duration-300 text-center ${isSuccess ? 'bg-cyan-900 border-2 border-cyan-400 text-cyan-200' : 'bg-red-900 border-2 border-rose-400 text-rose-200'} opacity-100`;
            setTimeout(() => {
                toast.className = "fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-900 border-2 border-cyan-400 text-cyan-300 px-6 py-3 rounded-2xl shadow-2xl font-black text-xs z-50 transition-all duration-300 opacity-0 pointer-events-none text-center";
            }, 2500);
        };

        window.switchLanguage = function(lang) {
            if (!lang) lang = localStorage.getItem('selectedLang') || 'ml';
            
            document.querySelectorAll('.lang').forEach(el => {
                const key = el.getAttribute('data-key');
                if (typeof words !== 'undefined' && words[key] && words[key][lang]) {
                    el.innerText = words[key][lang];
                }
            });

            document.querySelectorAll('.lang-placeholder').forEach(el => {
                const key = el.getAttribute('data-key');
                if (typeof words !== 'undefined' && words[key] && words[key][lang]) {
                    el.placeholder = words[key][lang];
                }
            });
            
            if (typeof window.filterAndDisplay === 'function') {
                window.filterAndDisplay();
            }
        };

        document.addEventListener("DOMContentLoaded", () => {
            currentMeshtri = localStorage.getItem('userName') || "പൊതുമേസ്തിരി";
            
            try {
                if (typeof setupHeader === 'function') { 
                    setupHeader('appHeader', true, currentMeshtri); 
                } else { 
                    document.getElementById('appHeader').innerHTML = `<h2 class="text-cyan-400 font-black text-sm">മേസ്തിരി പ്രോ</h2>`; 
                }
            } catch (e) { 
                document.getElementById('appHeader').innerHTML = `<h2 class="text-cyan-400 font-black text-sm">മേസ്തിരി പ്രോ</h2>`; 
            }

            const savedLang = localStorage.getItem('selectedLang') || 'ml';
            window.switchLanguage(savedLang);

            initDataListener();
        });

        window.addEventListener('languageChanged', (e) => {
            const newLang = (e && e.detail) ? e.detail : (localStorage.getItem('selectedLang') || 'ml');
            window.switchLanguage(newLang);
        });

        window.addEventListener('storage', (e) => {
            if (e.key === 'selectedLang') {
                window.switchLanguage(e.newValue || 'ml');
            }
            if (e.key === 'userName') {
                currentMeshtri = e.newValue || "പൊതുമേസ്തിരി";
                initDataListener();
            }
        });

        function initDataListener() {
            onSnapshot(collection(db, "accounts"), (querySnapshot) => {
                allHistoryData = [];
                
                querySnapshot.forEach((document) => {
                    const data = document.data();
                    const owner = String(data.meshtriOwner || '').trim().toLowerCase();
                    const activeUser = String(currentMeshtri).trim().toLowerCase();

                    if (owner === activeUser || owner === "" || !data.meshtriOwner) {
                        allHistoryData.push({ id: document.id, ...data });
                    }
                });

                allHistoryData.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
                updateSummary(allHistoryData);
                window.filterAndDisplay();
            }, (error) => {
                console.error("Firebase Error:", error);
            });
        }

        function updateSummary(data) {
            let totalIncome = 0;
            let totalExpense = 0;

            data.forEach(item => {
                let amt = parseFloat(item.amount) || 0;
                let dataType = String(item.type || '').toLowerCase();
                let isIncome = (dataType === 'income' || dataType === 'varavu' || dataType === 'വരവ്');

                if (isIncome) {
                    totalIncome += amt;
                } else {
                    totalExpense += amt;
                }
            });

            const incEl = document.getElementById('totalIncomeText');
            const expEl = document.getElementById('totalExpenseText');
            if(incEl) incEl.innerText = `₹ ${totalIncome}`;
            if(expEl) expEl.innerText = `₹ ${totalExpense}`;
        }

        window.setCategoryFilter = function(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.remove('bg-cyan-500', 'text-slate-950', 'border-cyan-400', 'font-black');
                tab.classList.add('bg-slate-800', 'text-white', 'border-slate-700', 'font-bold');
            });
            const activeTab = document.getElementById(`tab-${type}`);
            if(activeTab) {
                activeTab.classList.remove('bg-slate-800', 'text-white', 'border-slate-700', 'font-bold');
                activeTab.classList.add('bg-cyan-500', 'text-slate-950', 'border-cyan-400', 'font-black');
            }
            window.filterAndDisplay();
        }

        window.filterAndDisplay = function() {
            let queryVal = (document.getElementById('searchHistory')?.value || '').toLowerCase();
            
            let filtered = allHistoryData.filter(item => {
                let dataType = String(item.type || '').toLowerCase();
                let matchesCategory = true;

                if (currentFilter === 'income') {
                    matchesCategory = (dataType === 'income' || dataType === 'varavu' || dataType === 'വരവ്');
                } else if (currentFilter === 'wage') {
                    matchesCategory = (dataType === 'wage' || dataType === 'കൂലി');
                } else if (currentFilter === 'expense') {
                    matchesCategory = (dataType !== 'income' && dataType !== 'varavu' && dataType !== 'വരവ്' && dataType !== 'wage' && dataType !== 'കൂലി');
                }

                let searchString = ((item.site || '') + ' ' + (item.name || '')).toLowerCase();
                let matchesSearch = searchString.includes(queryVal);
                return matchesCategory && matchesSearch;
            });

            displayHistory(filtered);
        }

        function displayHistory(dataList) {
            const container = document.getElementById('historyListContainer');
            if (!container) return;

            const currentLang = localStorage.getItem('selectedLang') || 'ml';

            if (dataList.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 py-8 text-xs font-bold lang" data-key="noAccounts">No accounts found</div>`;
                window.switchLanguage(currentLang);
                return;
            }

            container.innerHTML = dataList.map(item => {
                let dataType = String(item.type || '').toLowerCase();
                let isIncome = (dataType === 'income' || dataType === 'varavu' || dataType === 'വരവ്');
                let badgeColor = isIncome ? 'bg-cyan-500/20 text-cyan-300 border-cyan-400/50' : 'bg-red-500/20 text-red-300 border-red-400/50';

                return `
                    <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 shadow-xl space-y-2">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-[10px] font-black px-2.5 py-1 rounded-full border ${badgeColor} uppercase">${item.type || 'Expense'}</span>
                                <h3 class="text-sm font-black text-white mt-1.5">${item.site || 'സൈറ്റ് പേരില്ല'}</h3>
                            </div>
                            <span class="text-xs font-bold text-slate-400">${item.date || ''}</span>
                        </div>
                        <div class="flex justify-between items-center border-t border-slate-800/80 pt-2 text-xs">
                            <span class="font-bold text-slate-300"><span class="lang" data-key="nameLabel">Name</span>: <strong class="text-white">${item.name || '-'}</strong></span>
                            <span class="font-black text-base ${isIncome ? 'text-emerald-400' : 'text-amber-400'}">₹ ${item.amount || 0}</span>
                        </div>
                        <div class="flex gap-2 pt-1">
                            <button type="button" onclick="window.openEditModal('${item.id}', '${item.name || ''}', '${item.site || ''}', '${item.amount || 0}', '${item.date || ''}')" class="w-full bg-cyan-600/80 hover:bg-cyan-600 text-white py-2 rounded-xl text-xs font-bold transition lang" data-key="editBtn">Edit</button>
                            <button type="button" onclick="window.deleteAccount('${item.id}')" class="w-full bg-red-600/80 hover:bg-red-600 text-white py-2 rounded-xl text-xs font-bold transition lang" data-key="deleteBtn">Delete</button>
                        </div>
                    </div>
                `;
            }).join('');

            window.switchLanguage(currentLang);
        }

        window.openEditModal = function(id, name, site, amount, date) {
            document.getElementById('editDocId').value = id;
            document.getElementById('editName').value = name;
            document.getElementById('editSite').value, site;
            document.getElementById('editAmount').value = amount;
            document.getElementById('editDate').value = date;
            document.getElementById('editModal').classList.remove('hidden');
        }

        window.closeEditModal = function() {
            document.getElementById('editModal').classList.add('hidden');
        }

        window.updateAccountData = async function() {
            const id = document.getElementById('editDocId').value;
            const name = document.getElementById('editName').value.trim();
            const site = document.getElementById('editSite').value.trim();
            const amount = parseFloat(document.getElementById('editAmount').value) || 0;
            const date = document.getElementById('editDate').value;

            if (!id) return;

            try {
                const docRef = doc(db, "accounts", id);
                await updateDoc(docRef, { name, site, amount, date });
                window.showToast("കണക്ക് വിജയകരമായി അപ്ഡേറ്റ് ചെയ്തു!", true);
                window.closeEditModal();
            } catch (error) {
                window.showToast("കണക്ക് അപ്ഡേറ്റ് ചെയ്യാൻ കഴിഞ്ഞില്ല!", false);
            }
        }

        window.deleteAccount = async function(id) {
            if (confirm("ഈ കണക്ക് തീർച്ചയായും ഡിലീറ്റ് ചെയ്യ வேண்டுമോ?")) {
                try {
                    await deleteDoc(doc(db, "accounts", id));
                    window.showToast("കണക്ക് വിജയകരമായി ഡിലീറ്റ് ചെയ്തു!", true);
                } catch (error) {
                    window.showToast("കണക്ക് ഡിലീറ്റ് ചെയ്യാൻ കഴിഞ്ഞില്ല!", false);
                }
            }
        }
    </script>
</body>
</html>
