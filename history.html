<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>കണക്ക് ഹിസ്റ്ററി & എഡിറ്റ് - മേസ്തിരി പ്രോ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Manjari', sans-serif; }
    </style>
</head>
<body class="bg-[#050B18] text-white min-h-screen pb-12 p-4 font-sans">

    <div class="max-w-md mx-auto space-y-4">
        
        <!-- ഹെഡർ ലോഗോയും സ്വാഗതം പേരും ഒന്നിച്ചുള്ള ഭാഗം -->
        <div class="flex flex-col items-center pt-2 pb-2">
            <div class="inline-flex items-center gap-3 px-5 py-2.5 rounded-full bg-slate-900/90 border border-amber-400/50 shadow-lg shadow-amber-500/20 backdrop-blur-md">
                <div class="w-9 h-9 rounded-full overflow-hidden border border-amber-400 flex-shrink-0 bg-amber-400/10 flex items-center justify-center">
                    <img src="icon.png" alt="Logo" class="w-full h-full object-cover">
                </div>
                <div class="flex flex-col text-left">
                    <span class="text-amber-400 font-black text-sm tracking-wide leading-tight">മേസ്തിരി പ്രോ</span>
                    <span class="text-[10px] font-bold text-blue-200 tracking-wider uppercase">SMART SITE MANAGER</span>
                </div>
            </div>
            <div class="mt-3 text-center">
                <span id="loggedInMeshtri" class="text-sm font-black tracking-wide text-cyan-300 bg-cyan-500/15 px-4 py-1.5 rounded-full border border-cyan-400/40 shadow-lg">
                    സ്വാഗതം, ലോഡിങ്...
                </span>
            </div>
        </div>

        <!-- പേജ് തലക്കെട്ടും ഡാഷ്‌ബോർഡ് ബട്ടണും -->
        <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl flex justify-between items-center shadow-xl backdrop-blur-sm mb-4">
            <div>
                <h1 class="text-lg font-black text-white">കണക്ക് ഹിസ്റ്ററി & എഡിറ്റ്</h1>
            </div>
            <a href="dashboard.html" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 border border-amber-400/40 text-amber-400 rounded-xl text-xs font-bold shadow-md transition flex items-center gap-1">
                <span>←</span> ഡാഷ്‌ബോർഡ്
            </a>
        </div>

        <!-- തിരയുന്ന ഭാഗം (Search & Filter) -->
        <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 shadow-xl space-y-3">
            <input type="text" id="searchHistory" placeholder="🔍 സൈറ്റിന്റെ പേരിലോ വിവരത്തിലോ തിരയുക..." oninput="filterHistory()" class="w-full p-3.5 bg-slate-800/80 text-white rounded-xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400">
        </div>

        <!-- കണക്കുകൾ ലിസ്റ്റ് ചെയ്യുന്ന സ്ഥലം -->
        <div id="historyListContainer" class="space-y-3">
            <div class="text-center text-slate-400 py-8 text-sm">കണക്കുകൾ ലോഡ് ചെയ്യുന്നു...</div>
        </div>

    </div>

    <!-- എഡിറ്റ് ചെയ്യുന്നതിനുള്ള മോഡൽ (Popup Modal) -->
    <div id="editModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl w-full max-w-sm space-y-4 shadow-2xl">
            <h3 class="text-base font-black text-amber-400">കണക്ക് തിരുത്തുക (Edit)</h3>
            <input type="hidden" id="editDocId">
            
            <div>
                <label class="block text-xs font-black text-slate-400 mb-1">വിവരം / പേര്:</label>
                <input type="text" id="editName" class="w-full p-3 bg-slate-800 text-white rounded-xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400">
            </div>

            <div>
                <label class="block text-xs font-black text-slate-400 mb-1">സൈറ്റ് പേര്:</label>
                <input type="text" id="editSite" class="w-full p-3 bg-slate-800 text-white rounded-xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400">
            </div>

            <div>
                <label class="block text-xs font-black text-slate-400 mb-1">തുക (₹):</label>
                <input type="number" id="editAmount" class="w-full p-3 bg-slate-800 text-white rounded-xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400">
            </div>

            <div>
                <label class="block text-xs font-black text-slate-400 mb-1">തീയതി:</label>
                <input type="date" id="editDate" class="w-full p-3 bg-slate-800 text-white rounded-xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400">
            </div>

            <div class="flex gap-2 pt-2">
                <button type="button" onclick="closeEditModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 p-3 rounded-xl font-black text-xs transition">വേണ്ട</button>
                <button type="button" onclick="updateAccountData()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 p-3 rounded-xl font-black text-xs transition">അപ്ഡേറ്റ് ചെയ്യുക</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.appspot.com",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d352218"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const currentMeshtri = localStorage.getItem('userName') || "പൊതുമേസ്തിരി";
        document.getElementById('loggedInMeshtri').innerText = "സ്വാഗതം, " + currentMeshtri;

        let allHistoryData = [];

        async function fetchHistory() {
            try {
                const q = query(collection(db, "accounts"), where("meshtriOwner", "==", currentMeshtri));
                const querySnapshot = await getDocs(q);
                allHistoryData = [];
                querySnapshot.forEach((document) => {
                    allHistoryData.push({ id: document.id, ...document.data() });
                });

                // തീയതിയുടെ അടിസ്ഥാനത്തിൽ പുതിയത് മുകളിൽ വരുന്ന രീതിയിൽ സോർട്ട് ചെയ്യാം
                allHistoryData.sort((a, b) => new Date(b.date) - new Date(a.date));

                displayHistory(allHistoryData);
            } catch (error) {
                console.error("ഡാറ്റ ലോഡ് ചെയ്യുന്നതിൽ പിഴവ്:", error);
                document.getElementById('historyListContainer').innerHTML = `<div class="text-center text-red-400 text-xs">ഡാറ്റ ലോഡ് ചെയ്യാൻ കഴിഞ്ഞില്ല!</div>`;
            }
        }

        function displayHistory(dataList) {
            const container = document.getElementById('historyListContainer');
            if (dataList.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 py-8 text-xs font-bold">കണക്കുകൾ ഒന്നും ലഭ്യമല്ല</div>`;
                return;
            }

            container.innerHTML = dataList.map(item => {
                let badgeColor = item.type === 'income' ? 'bg-cyan-500/15 text-cyan-400 border-cyan-400/30' : 
                                 item.type === 'wage' ? 'bg-amber-500/15 text-amber-400 border-amber-400/30' : 'bg-red-500/15 text-red-400 border-red-400/30';
                let typeLabel = item.type === 'income' ? 'വരവ് (Income)' : item.type === 'wage' ? 'കൂലി (Wage)' : 'ചെലവ് (Expense)';

                return `
                    <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 shadow-xl space-y-2 history-card" data-search="${(item.site + ' ' + item.name).toLowerCase()}">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-[10px] font-black px-2.5 py-1 rounded-full border ${badgeColor}">${typeLabel}</span>
                                <h3 class="text-sm font-black text-white mt-1.5">${item.site || 'സൈറ്റ് പേരില്ല'}</h3>
                            </div>
                            <span class="text-xs font-bold text-slate-400">${item.date || ''}</span>
                        </div>
                        <div class="flex justify-between items-center border-t border-slate-800/80 pt-2 text-xs">
                            <span class="font-bold text-slate-300">പേര്: <strong class="text-white">${item.name || '-'}</strong></span>
                            <span class="font-black text-base text-amber-400">₹ ${item.amount || 0}</span>
                        </div>
                        <div class="flex gap-2 pt-1">
                            <button onclick="openEditModal('${item.id}', '${item.name || ''}', '${item.site || ''}', '${item.amount || 0}', '${item.date || ''}')" class="w-full bg-blue-600/80 hover:bg-blue-600 text-white py-2 rounded-xl text-xs font-bold transition">എഡിറ്റ്</button>
                            <button onclick="deleteAccount('${item.id}')" class="w-full bg-red-600/80 hover:bg-red-600 text-white py-2 rounded-xl text-xs font-bold transition">ഡിലീറ്റ്</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.filterHistory = function() {
            let queryVal = document.getElementById('searchHistory').value.toLowerCase();
            document.querySelectorAll('.history-card').forEach(card => {
                let searchData = card.getAttribute('data-search') || '';
                card.style.display = searchData.includes(queryVal) ? '' : 'none';
            });
        }

        window.openEditModal = function(id, name, site, amount, date) {
            document.getElementById('editDocId').value = id;
            document.getElementById('editName').value = name;
            document.getElementById('editSite').value = site;
            document.getElementById('editAmount').value = amount;
            document.getElementById('editDate').value = date;
            document.getElementById('editModal').classList.remove('hidden');
        }

        window.closeEditModal = function() {
            document.getElementById('editModal').classList.add('hidden');
        }

        window.updateAccountData = async function() {
            const id = document.getElementById('editDocId').value;
            const name = document.getElementById('editName').value.trim();
            const site = document.getElementById('editSite').value.trim();
            const amount = parseFloat(document.getElementById('editAmount').value) || 0;
            const date = document.getElementById('editDate').value;

            if (!id) return;

            try {
                const docRef = doc(db, "accounts", id);
                await updateDoc(docRef, {
                    name: name,
                    site: site,
                    amount: amount,
                    date: date
                });
                alert("കണക്ക് വിജയകരമായി അപ്ഡേറ്റ് ചെയ്തു!");
                closeEditModal();
                fetchHistory();
            } catch (error) {
                console.error("അപ്ഡേറ്റ് ചെയ്യുന്നതിൽ പിഴവ്:", error);
                alert("കണക്ക് അപ്ഡേറ്റ് ചെയ്യാൻ കഴിഞ്ഞില്ല!");
            }
        }

        window.deleteAccount = async function(id) {
            if (confirm("ഈ കണക്ക് തീർച്ചയായും ഡിലീറ്റ് ചെയ്യ வேண்டுമോ?")) {
                try {
                    await deleteDoc(doc(db, "accounts", id));
                    alert("കണക്ക് വിജയകരമായി ഡിലീറ്റ് ചെയ്തു!");
                    fetchHistory();
                } catch (error) {
                    console.error("ഡിലീറ്റ് ചെയ്യുന്നതിൽ പിഴവ്:", error);
                    alert("കണക്ക് ഡിലീറ്റ് ചെയ്യാൻ കഴിഞ്ഞില്ല!");
                }
            }
        }

        fetchHistory();
    </script>
</body>
</html>
