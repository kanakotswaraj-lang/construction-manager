<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ലോഗിൻ / രജിസ്ട്രേഷൻ - മേസ്തിരി പ്രോ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Manjari', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-blue-950 to-slate-900 min-h-screen text-white flex flex-col justify-between p-5">

    <!-- ആപ്പ് തുറക്കുമ്പോൾ ആദ്യം കാണുന്ന സ്പ്ലാഷ് സ്ക്രീൻ (Splash Screen) -->
    <div id="splash-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom right, #090d16, #172554); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s ease;">
        <img src="icon.png" alt="Mesthri Pro Logo" class="w-28 h-28 rounded-2xl object-cover border-2 border-amber-400 shadow-2xl mb-4">
        <h1 class="text-amber-300 text-3xl font-black tracking-wide">മേസ്തിരി പ്രോ</h1>
    </div>

    <!-- ടോപ്പ് ഹെഡർ ഭാഗം -->
    <div class="text-center pt-4">
        <div class="inline-flex items-center gap-2.5 bg-amber-500/20 text-amber-400 text-base font-bold px-4 py-2 rounded-full border border-amber-500/50 shadow-lg">
            <img src="icon.png" alt="Mesthiri" class="w-7 h-7 rounded-full object-cover border-2 border-amber-400">
            <span class="text-base font-black text-amber-300 tracking-wide">മേസ്തിരി പ്രോ</span>
        </div>
        <h1 id="formTitle" class="text-4xl font-black mt-4 tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-white via-blue-100 to-amber-400">
            ലോഗിൻ ചെയ്യുക
        </h1>
        <p class="text-sm text-blue-200 mt-1 font-bold">നിങ്ങളുടെ അക്കൗണ്ടിലേക്ക് സ്വാഗതം</p>
    </div>

    <!-- ലോഗിൻ / രജിസ്ട്രേഷൻ ഫോം കാർഡ് -->
    <div class="bg-white/5 backdrop-blur-md p-6 rounded-3xl border border-blue-500/30 max-w-sm mx-auto w-full my-4 space-y-4 shadow-xl">
        <div>
            <label class="block text-sm font-bold text-blue-200 mb-1">യൂസർനെയിം (പേര്)</label>
            <input type="text" id="username" placeholder="നിങ്ങളുടെ പേര് നൽകുക" 
                   class="w-full bg-slate-900/80 border border-blue-500/40 rounded-xl p-3.5 text-white text-sm font-bold focus:outline-none focus:border-amber-400">
        </div>

        <!-- രജിസ്റ്റർ ചെയ്യുമ്പോൾ മാത്രം കാണുന്ന ഫോൺ നമ്പർ ബോക്സ് -->
        <div id="phoneDiv" class="hidden">
            <label class="block text-sm font-bold text-blue-200 mb-1">ഫോൺ നമ്പർ</label>
            <input type="tel" id="phone" placeholder="10 അക്ക ഫോൺ നമ്പർ" 
                   class="w-full bg-slate-900/80 border border-blue-500/40 rounded-xl p-3.5 text-white text-sm font-bold focus:outline-none focus:border-amber-400">
        </div>

        <div>
            <label class="block text-sm font-bold text-blue-200 mb-1">പാസ്‌വേർഡ്</label>
            <div class="relative">
                <input type="password" id="password" placeholder="കുറഞ്ഞത് 6 അക്കങ്ങൾ നൽകുക" 
                       class="w-full bg-slate-900/80 border border-blue-500/40 rounded-xl p-3.5 pr-12 text-white text-sm font-bold focus:outline-none focus:border-amber-400">
                <!-- കണ്ണ് ഐക്കൺ (Password Toggle Eye Button) -->
                <button type="button" id="togglePassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-blue-300 hover:text-amber-400 focus:outline-none">
                    <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </button>
            </div>
            <p class="text-xs text-blue-300/80 mt-1.5 font-bold">ശ്രദ്ധിക്കുക: പാസ്‌വേർഡിൽ കുറഞ്ഞത് 6 അക്കങ്ങളോ അക്ഷരങ്ങളോ ഉണ്ടായിരിക്കണം.</p>
        </div>

        <!-- ആക്ഷൻ ബട്ടൺ -->
        <button id="btnAction" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 text-center p-4 rounded-xl font-black text-base shadow-lg shadow-amber-950/40 transition mt-2">
            ലോഗിൻ ചെയ്യുക
        </button>

        <button id="btnForgot" class="w-full text-blue-300 font-bold text-sm hover:text-amber-400 underline block text-center pt-1">
            പാസ്‌വേർഡ് മറന്നുപോയോ?
        </button>
    </div>

    <!-- പേജ് മാറാനുള്ള ലിങ്ക് -->
    <div class="max-w-sm mx-auto w-full text-center pb-4 space-y-3">
        <p class="text-sm text-blue-200 font-bold">
            <span id="toggleText">അക്കൗണ്ട് ഇല്ലെങ്കിൽ?</span> 
            <a href="#" id="toggleBtn" class="text-amber-400 font-black underline ml-1">പുതിയതായി രജിസ്റ്റർ ചെയ്യുക</a>
        </p>
        <p class="text-xs text-slate-400 font-bold pt-2">
            മേസ്തിരിമാർക്കായി നിർമ്മിച്ചത് ❤️ കേരളം
        </p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        window.addEventListener('load', function() {
            setTimeout(function() {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(function() {
                        splash.style.display = 'none';
                    }, 500);
                }
            }, 2000);
        });

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isLoginMode = true;

        const toggleBtn = document.getElementById("toggleBtn");
        const formTitle = document.getElementById("formTitle");
        const phoneDiv = document.getElementById("phoneDiv");
        const btnAction = document.getElementById("btnAction");
        const btnForgot = document.getElementById("btnForgot");
        const toggleText = document.getElementById("toggleText");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const eyeIcon = document.getElementById("eyeIcon");

        togglePassword.addEventListener("click", () => {
            const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
            passwordInput.setAttribute("type", type);
            
            if (type === "text") {
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.03 10.03 0 012.23-3.38m3.54-2.54A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" />
                `;
            } else {
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                `;
            }
        });

        toggleBtn.addEventListener("click", (e) => {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                formTitle.innerText = "ലോഗിൻ ചെയ്യുക";
                phoneDiv.classList.add("hidden");
                btnAction.innerText = "ലോഗിൻ ചെയ്യുക";
                btnForgot.style.display = "block";
                toggleText.innerText = "അക്കൗണ്ട് ഇല്ലെങ്കിൽ?";
                toggleBtn.innerText = "പുതിയതായി രജിസ്റ്റർ ചെയ്യുക";
            } else {
                formTitle.innerText = "പുതിയ രജിസ്ട്രേഷൻ";
                phoneDiv.classList.remove("hidden");
                btnAction.innerText = "രജിസ്റ്റർ ചെയ്യുക";
                btnForgot.style.display = "none";
                toggleText.innerText = "അക്കൗണ്ട് ഉണ്ടോ?";
                toggleBtn.innerText = "ലോഗിൻ ചെയ്യുക";
            }
        });

        btnAction.addEventListener("click", async () => {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const phone = document.getElementById('phone').value.trim();

            if (!user || !pass) {
                return alert("ദയവായി യൂസർനെയിമും പാസ്‌വേർഡും നൽകുക!");
            }

            if (!isLoginMode && pass.length < 6) {
                return alert("പാസ്‌വേർഡിന് കുറഞ്ഞത് 6 അക്കങ്ങളോ അക്ഷരങ്ങളോ ഉണ്ടായിരിക്കണം!");
            }

            if (isLoginMode) {
                signInWithEmailAndPassword(auth, `${user}@mesthri.com`, pass)
                    .then(() => {
                        localStorage.setItem('userName', user);
                        window.location.href = "dashboard.html";
                    })
                    .catch(() => alert("ലോഗിൻ പരാജയപ്പെട്ടു! യൂസർനെയിമോ പാസ്‌വേർഡോ തെറ്റാണ്."));
            } else {
                if (!phone) {
                    return alert("ദയവായി ഫോൺ നമ്പർ കൂടി നൽകുക!");
                }

                try {
                    await createUserWithEmailAndPassword(auth, `${user}@mesthri.com`, pass);
                    
                    await setDoc(doc(db, "users", user), {
                        username: user,
                        phone: phone,
                        password: pass
                    });

                    const webAppUrl = "https://script.google.com/macros/s/AKfycbznevcjdsSz7JgWrKeyaO2gOnxnrd-8-rMMiycABRruqFJQ_hfz4Ac79aLqyvnqf09FXg/exec";
                    fetch(webAppUrl, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ name: user, phone: phone })
                    }).catch(err => console.log(err));

                    alert("വിജയകരമായി രജിസ്റ്റർ ചെയ്തു!");
                    localStorage.setItem('userName', user);
                    window.location.href = "dashboard.html";

                } catch (error) {
                    alert("രജിസ്ട്രേഷൻ പരാജയപ്പെട്ടു! ഈ യൂസർനെയിം നേരത്തെ ഉണ്ടാകാം അല്ലെങ്കിൽ പാസ്‌വേർഡ് ചെറുതാണ്.");
                }
            }
        });

        document.getElementById("btnForgot").addEventListener("click", async () => {
            const user = document.getElementById('username').value.trim();
            if(!user) return alert("ആദ്യം യൂസർനെയിം ബോക്സിൽ നിങ്ങളുടെ പേര് നൽകുക!");

            const docRef = doc(db, "users", user);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const data = docSnap.data();
                alert("നിങ്ങളുടെ പാസ്‌വേർഡ്: " + data.password);
            } else {
                alert("ഈ യൂസർനെയിം നിലവിലില്ല!");
            }
        });
    </script>
</body>
</html>
