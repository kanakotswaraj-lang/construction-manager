<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>മേസ്തിരി പ്രോ - ലോഗിൻ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Changa+One&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="language.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- ലോഗോ ഹെഡർ -->
    <div class="w-full max-w-sm mx-auto mb-6">
        <div id="appHeader" class="w-full"></div>
    </div>

    <!-- ലോഗിൻ കാർഡ് -->
    <div class="w-full max-w-sm bg-slate-900/80 border border-slate-700/60 rounded-2xl p-6 shadow-xl backdrop-blur-md">
        
        <h2 data-key="loginTitle" class="text-xl font-bold text-white mb-1">ലോഗിൻ ചെയ്യുക</h2>
        <p data-key="loginSubtitle" class="text-xs text-slate-400 mb-5">നിങ്ങളുടെ അക്കൗണ്ടിലേക്ക് സ്വാഗതം</p>

        <div class="space-y-4">
            <!-- യൂസർനെയിം -->
            <div>
                <label data-key="usernameLabel" class="block text-xs font-semibold text-amber-300/90 mb-1.5">യൂസർനെയിം (പേര്)</label>
                <input type="text" id="username" data-key-placeholder="usernamePlaceholder" placeholder="നിങ്ങളുടെ പേര് നൽകുക" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-400">
            </div>

            <!-- പാസ്‌വേർഡ് -->
            <div>
                <label data-key="passwordLabel" class="block text-xs font-semibold text-amber-300/90 mb-1.5">പാസ്‌വേർഡ്</label>
                <div class="relative">
                    <input type="password" id="password" data-key-placeholder="passwordPlaceholder" placeholder="പാസ്‌വേർഡ് നൽകുക" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 pr-12 text-white text-sm focus:outline-none focus:border-amber-400">
                    <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-amber-400 p-2">
                        <i class="fa-solid fa-eye text-base" id="eyeIcon"></i>
                    </button>
                </div>
                <p data-key="passwordNote" class="text-[11px] text-slate-400 mt-1.5">ശ്രദ്ധിക്കുക: പാസ്‌വേർഡിൽ കുറഞ്ഞത് 6 അക്കങ്ങളോ അക്ഷരങ്ങളോ ഉണ്ടായിരിക്കണം.</p>
            </div>

            <!-- ലോഗിൻ ബട്ടൺ -->
            <button id="btnLogin" data-key="loginBtn" class="w-full mt-2 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg hover:from-amber-400 hover:to-orange-400 transition duration-200 text-sm">
                ലോഗിൻ ചെയ്യാം
            </button>
        </div>

        <!-- പാസ്‌വേർഡ് മറന്നുപോയോ ലിങ്ക് -->
        <div class="mt-4 text-center">
            <a href="forgot-password.html" data-key="forgotPassword" class="text-xs text-amber-400/90 hover:underline">പാസ്‌വേർഡ് മറന്നുപോയോ?</a>
        </div>
    </div>

    <!-- പുതിയ രജിസ്ട്രേഷൻ ലിങ്ക് -->
    <div class="mt-6 text-center text-xs text-slate-400">
        <span data-key="noAccountText">അക്കൗണ്ട് ഇല്ലെങ്കിൽ?</span> 
        <a href="register.html" data-key="registerLinkText" class="text-amber-400 font-bold hover:underline ml-1">പുതിയതായി രജിസ്റ്റർ ചെയ്യുക</a>
    </div>

    <!-- ഫൂട്ടർ -->
    <div data-key="footerCredit" class="mt-8 text-center text-[11px] text-slate-500">
        മേസ്തിരിമാർക്കായി നിർമ്മിച്ചത് ❤️ കേരളം
    </div>

    <!-- ഫയർബേസ് & ലാംഗ്വേജ് സ്ക്രിപ്റ്റുകൾ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
        
        import { setupModal } from './modal.js';
        import { setupHeader } from './header.js';

        setupModal();
        setupHeader('appHeader');

        // പേജ് പൂർണ്ണമായി ലോഡ് ആയി ഹെഡറും വന്നതിനു ശേഷം ഭാഷ സെറ്റ് ചെയ്യാൻ
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const savedLang = localStorage.getItem('selectedLang') || 'ml';
                if (typeof window.switchLanguage === 'function') {
                    window.switchLanguage(savedLang);
                }
            }, 300); // ഹെഡർ ലോഡ് ആകാൻ ചെറിയൊരു സമയം നൽകുന്നു
        });

        // ഫയർബേസ് ലോഗിൻ കോഡുകൾ...
        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            databaseURL: "https://mesthri-app-default-rtdb.firebaseio.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d",
            measurementId: "G-J9Y5TW9D7T"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const eyeIcon = document.getElementById("eyeIcon");
        const btnLogin = document.getElementById("btnLogin");

        if (togglePassword && passwordInput && eyeIcon) {
            togglePassword.addEventListener("click", () => {
                const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
                passwordInput.setAttribute("type", type);
                
                if (type === "text") {
                    eyeIcon.classList.remove("fa-eye");
                    eyeIcon.classList.add("fa-eye-slash");
                    togglePassword.style.color = "#fbbf24";
                } else {
                    eyeIcon.classList.remove("fa-eye-slash");
                    eyeIcon.classList.add("fa-eye");
                    togglePassword.style.color = "#94a3b8";
                }
            });
        }

        if (btnLogin) {
            btnLogin.addEventListener("click", async () => {
                const user = usernameInput.value.trim().toLowerCase();
                const pass = passwordInput.value.trim();

                if (!user || !pass) {
                    return showModal("ദയവായി യൂസർനെയിമും പാസ്‌വേർഡും നൽകുക!", "ശ്രദ്ധിക്കുക", "⚠️");
                }

                try {
                    const userRef = ref(db, 'users/' + user);
                    const snapshot = await get(userRef);

                    if (snapshot.exists()) {
                        const userData = snapshot.val();
                        if (userData.password === pass) {
                            showModal("ലോഗിൻ വിജയിച്ചു!", "വിജയം", "✅");
                            localStorage.setItem('userName', user);
                            setTimeout(() => {
                                window.location.href = "dashboard.html";
                            }, 1200);
                        } else {
                            showModal("പാസ്‌വേർഡ് തെറ്റാണ്!", "ശ്രദ്ധിക്കുക", "⚠️");
                        }
                    } else {
                        showModal("ഈ യൂസർനെയിം നിലവിലില്ല!", "ശ്രദ്ധിക്കുക", "⚠️");
                    }
                } catch (error) {
                    console.error(error);
                    showModal("കണക്റ്റിവിറ്റി പ്രശ്നം നേരിടുന്നു. വീണ്ടും ശ്രമിക്കുക.", "തകരാറ്", "⚠️");
                }
            });
        }
    </script>

</body>
</html>
