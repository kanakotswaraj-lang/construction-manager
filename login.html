<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>മേസ്തിരി പ്രോ - ലോഗിൻ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Changa+One&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- language.js ഉം header.js ഉം ഇവിടെ ലോഡ് ചെയ്യുന്നു -->
    <script src="language.js"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- മുകളിൽ ഹെഡർ വരാനുള്ള കണ്ടെയ്നർ -->
    <div class="w-full max-w-sm mx-auto mb-4">
        <div id="appHeader" class="w-full"></div>
    </div>

    <!-- ലോഗിൻ കാർഡ് -->
    <div class="w-full max-w-sm bg-slate-900/90 border border-slate-700/60 rounded-2xl p-6 shadow-xl backdrop-blur-md">
        
        <h2 data-key="loginTitle" class="lang text-xl font-bold text-white mb-1">ലോഗിൻ ചെയ്യുക</h2>
        <p data-key="loginSubtitle" class="lang text-xs text-slate-400 mb-5">നിങ്ങളുടെ അക്കൗണ്ടിലേക്ക് സ്വാഗതം</p>

        <div class="space-y-4">
            <div>
                <label data-key="usernameLabel" class="lang block text-xs font-semibold text-amber-300/90 mb-1.5">യൂസർനെയിം (പേര്)</label>
                <input type="text" id="username" data-key-placeholder="usernamePlaceholder" placeholder="നിങ്ങളുടെ പേര് നൽകുക" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-400">
            </div>

            <div>
                <label data-key="passwordLabel" class="lang block text-xs font-semibold text-amber-300/90 mb-1.5">പാസ്‌വേർഡ്</label>
                <div class="relative">
                    <input type="password" id="password" data-key-placeholder="passwordPlaceholder" placeholder="പാസ്‌വേർഡ് നൽകുക" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 pr-12 text-white text-sm focus:outline-none focus:border-amber-400">
                    <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-amber-400 p-2 cursor-pointer">
                        <i class="fa-solid fa-eye text-base" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <button id="btnLogin" data-key="loginBtn" class="lang w-full mt-2 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg hover:from-amber-400 hover:to-orange-400 transition duration-200 text-sm cursor-pointer">
                ലോഗിൻ ചെയ്യാം
            </button>
        </div>

        <div class="mt-4 text-center">
            <button type="button" id="btnForgotOpen" data-key="forgotPassword" class="lang text-xs text-amber-400/90 hover:underline bg-transparent border-none cursor-pointer">പാസ്‌വേർഡ് മറന്നുപോയോ?</button>
        </div>
    </div>

    <div class="mt-6 text-center text-xs text-slate-400">
        <span data-key="noAccountText" class="lang">അക്കൗണ്ട് ഇല്ലെങ്കിൽ?</span> 
        <a href="register.html" data-key="loginLinkText" class="lang text-amber-400 font-bold hover:underline ml-1">പുതിയതായി രജിസ്റ്റർ ചെയ്യുക</a>
    </div>

<!-- ഫോർഗെറ്റ് പാസ്‌വേർഡ് / യൂസർനെയിം മോഡൽ -->
<div id="forgotModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 w-full max-w-sm shadow-2xl relative">
        
        <h3 data-key="forgotTitle" class="lang text-lg font-bold text-white mb-2">യൂസർനെയിം / പാസ്‌വേർഡ് വീണ്ടെടുക്കുക</h3>
        <p data-key="forgotDesc" class="lang text-xs text-slate-400 mb-4">നിങ്ങൾ രജിസ്റ്റർ ചെയ്ത ഫോൺ നമ്പർ നൽകുക:</p>
        
        <input type="tel" id="forgotPhone" data-key-placeholder="phonePlaceholder" placeholder="ഫോൺ നമ്പർ നൽകുക (10 അക്കം)" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-400 mb-4">
        
        <div id="forgotResult" class="hidden bg-amber-500/10 border border-amber-500/30 rounded-xl p-3 mb-4 text-center">
            <p class="text-xs text-slate-300">നിങ്ങളുടെ യൂസർനെയിം: <strong id="displayUsername" class="text-amber-400"></strong></p>
            <p class="text-xs text-slate-300 mt-1">നിങ്ങളുടെ പാസ്‌വേർഡ്: <strong id="displayPassword" class="text-amber-400"></strong></p>
        </div>

        <div class="flex gap-2">
            <button type="button" id="btnForgotClose" data-key="closeBtn" class="lang flex-1 bg-slate-800 hover:bg-slate-700 text-white font-semibold py-2.5 rounded-xl text-sm transition cursor-pointer">അടയ്ക്കുക</button>
            <button type="button" id="btnGetDetails" data-key="showDetailsBtn" class="lang flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl text-sm transition cursor-pointer">വിവരങ്ങൾ കാണുക</button>
        </div>
    </div>
</div>

    <!-- ഫയർബേസ് & സ്ക്രിപ്റ്റുകൾ -->
     
            <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
        import { setupHeader } from './header.js';

        // ഹെഡർ ലോഡ് ചെയ്യുന്നു
        setupHeader('appHeader');

        // ഭാഷ മാറ്റാനുള്ള കോഡ്
        function applySavedLanguage() {
            const savedLang = localStorage.getItem('selectedLang') || 'ml';
            if (typeof window.switchLanguage === 'function') {
                window.switchLanguage(savedLang);
            }
        }
        window.addEventListener('DOMContentLoaded', applySavedLanguage);
        window.addEventListener('languageChanged', (e) => {
            const newLang = (e && e.detail) ? e.detail : localStorage.getItem('selectedLang');
            if (typeof window.switchLanguage === 'function') {
                window.switchLanguage(newLang);
            }
        });

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            databaseURL: "https://mesthri-app-default-rtdb.firebaseio.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d",
            measurementId: "G-J9Y5TW9D7T"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // എലമെന്റുകൾ
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const eyeIcon = document.getElementById("eyeIcon");
        const btnLogin = document.getElementById("btnLogin");

        const btnForgotOpen = document.getElementById("btnForgotOpen");
        const forgotModal = document.getElementById("forgotModal");
        const btnForgotClose = document.getElementById("btnForgotClose");
        const btnGetDetails = document.getElementById("btnGetDetails");
        const forgotPhone = document.getElementById("forgotPhone");
        const forgotResult = document.getElementById("forgotResult");
        const displayUsername = document.getElementById("displayUsername");
        const displayPassword = document.getElementById("displayPassword");

        // പാസ്‌വേർഡ് കാണിക്കാൻ / മറയ്ക്കാൻ
        togglePassword.addEventListener("click", () => {
            const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
            passwordInput.setAttribute("type", type);
            eyeIcon.classList.toggle("fa-eye");
            eyeIcon.classList.toggle("fa-eye-slash");
        });

        // ഫോർഗെറ്റ് പാസ്‌വേർഡ് മോഡൽ ഓപ്പൺ/ക്ലോസ്
        btnForgotOpen.addEventListener("click", () => {
            forgotModal.classList.remove("hidden");
            forgotModal.classList.add("flex");
            forgotResult.classList.add("hidden");
            forgotPhone.value = "";
        });

        btnForgotClose.addEventListener("click", () => {
            forgotModal.classList.add("hidden");
            forgotModal.classList.remove("flex");
        });

        // 🌟 കസ്റ്റം പോപ്പ്-അപ്പ് ഫംഗ്ഷനുകൾ ഇവിടെയാണ് വെക്കേണ്ടത് (ശരിയായ സ്ഥലം)
        window.showCustomAlert = function(messageKey) {
            const currentLang = localStorage.getItem('selectedLang') || 'ml';
            let message = messageKey;
            
            if (typeof words !== 'undefined' && words[messageKey] && words[messageKey][currentLang]) {
                message = words[messageKey][currentLang];
            }
            
            document.getElementById('popupMessage').innerText = message;
            const popup = document.getElementById('customPopup');
            popup.classList.remove('hidden');
            popup.classList.add('flex');
        }

        window.closeCustomPopup = function() {
            const popup = document.getElementById('customPopup');
            popup.classList.add('hidden');
            popup.classList.remove('flex');
        }

        // ഫോർഗെറ്റ് പാസ്‌വേർഡ് ഫോൺ നമ്പർ ചെക്ക് ചെയ്യുന്ന ഭാഗം:
        btnGetDetails.addEventListener("click", async () => {
            const phone = forgotPhone.value.trim();
            if (!phone || phone.length < 10) {
                showCustomAlert('phoneRequired');
                return;
            }

            try {
                const usersRef = ref(db, 'users');
                const snapshot = await get(usersRef);

                if (snapshot.exists()) {
                    let found = false;
                    snapshot.forEach((childSnapshot) => {
                        const userData = childSnapshot.val();
                        if (userData.phone === phone) {
                            displayUsername.textContent = userData.username || childSnapshot.key;
                            displayPassword.textContent = userData.password;
                            forgotResult.classList.remove("hidden");
                            found = true;
                        }
                    });

                    if (!found) {
                        showCustomAlert('phoneNotFound');
                        forgotResult.classList.add("hidden");
                    }
                } else {
                    showCustomAlert('userNotFound');
                }
            } catch (err) {
                console.error(err);
                showCustomAlert('connectivityError');
            }
        });

        // ലോഗിൻ ബട്ടൺ ആക്ഷൻ:
        btnLogin.addEventListener("click", async () => {
            const user = usernameInput.value.trim().toLowerCase();
            const pass = passwordInput.value.trim();

            if (!user || !pass) {
                showCustomAlert('fillAllFields');
                return;
            }

            try {
                const userRef = ref(db, 'users/' + user);
                const snapshot = await get(userRef);

                if (snapshot.exists()) {
                    if (snapshot.val().password === pass) {
                        showCustomAlert('loginSuccess');
                        localStorage.setItem('userName', user);
                        setTimeout(() => {
                            window.location.href = "dashboard.html";
                        }, 1500);
                    } else {
                        showCustomAlert('wrongPassword');
                    }
                } else {
                    showCustomAlert('userNotFound');
                }
            } catch (err) {
                console.error(err);
                showCustomAlert('connectivityError');
            }
        });
    </script>

<!-- Custom Popup Modal -->
<div id="customPopup" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-slate-900 border border-amber-500/40 rounded-2xl shadow-2xl w-full max-w-sm p-6 text-center relative">
        <p id="popupMessage" class="text-white text-base mb-6 font-medium">മെസ്സേജ് ഇവിടെ വരും</p>
        <button onclick="closeCustomPopup()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-bold py-3 rounded-xl transition-all shadow-lg cursor-pointer">
            (OK)
        </button>
    </div>
</div>
    

        
</body>
</html>
