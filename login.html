<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ലോഗിൻ - മേസ്തിരി പ്രോ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="language.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        import { setupHeader } from './header.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            databaseURL: "https://mesthri-app-default-rtdb.firebaseio.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d",
            measurementId: "G-J9Y5TW9D7T"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.addEventListener("DOMContentLoaded", () => {
            if (typeof setupHeader === 'function') {
                setupHeader('appHeader', false);
            }
            const savedLang = localStorage.getItem('selectedLang') || 'ml';
            changePageLanguage(savedLang);

            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                loginForm.addEventListener('submit', handleLogin);
            }
        });

        window.changePageLanguage = function(lang) {
            localStorage.setItem('selectedLang', lang);
            if (typeof words === 'undefined') return;

            document.querySelectorAll('[data-key]').forEach(element => {
                const key = element.getAttribute('data-key');
                if (words[key] && words[key][lang]) {
                    if (element.tagName === 'INPUT' || element.tagName === 'TEXTAREA') {
                        element.placeholder = words[key][lang];
                    } else {
                        element.innerText = words[key][lang];
                    }
                }
            });
        }

        function showCustomAlert(message, title = "ശ്രദ്ധിക്കുക", isConfirm = false, onConfirm = null) {
            const modal = document.getElementById('customModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalOkBtn = document.getElementById('modalOkBtn');
            const modalCancelBtn = document.getElementById('modalCancelBtn');

            modalTitle.innerText = title;
            modalMessage.innerText = message;
            modal.classList.remove('hidden');

            if (isConfirm) {
                modalCancelBtn.classList.remove('hidden');
                modalOkBtn.innerText = "ഉവ്വ്";
            } else {
                modalCancelBtn.classList.add('hidden');
                modalOkBtn.innerText = "ശരി";
            }

            const newOkBtn = modalOkBtn.cloneNode(true);
            modalOkBtn.parentNode.replaceChild(newOkBtn, modalOkBtn);

            const newCancelBtn = modalCancelBtn.cloneNode(true);
            modalCancelBtn.parentNode.replaceChild(newCancelBtn, modalCancelBtn);

            newOkBtn.addEventListener('click', () => {
                modal.classList.add('hidden');
                if (onConfirm) onConfirm(true);
            });

            newCancelBtn.addEventListener('click', () => {
                modal.classList.add('hidden');
                if (onConfirm) onConfirm(false);
            });
        }

        async function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();

            if (!usernameInput || !passwordInput) {
                showCustomAlert("ദയവായി മേസ്തിരിയുടെ പേരും പാസ്‌വേർഡും നൽകുക!", "ശ്രദ്ധിക്കുക");
                return;
            }

            try {
                // ഫയർബേസിൽ നിന്ന് യൂസറെ പരിശോധിക്കുന്നു
                const q = query(collection(db, "mesthris"), where("name", "==", usernameInput));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    showCustomAlert("ഈ പേരിൽ മേസ്തിരി ആരെയും കണ്ടെത്താനായില്ല! ദയവായി രജിസ്റ്റർ ചെയ്യുക.", "പിഴവ്");
                    return;
                }

                let userFound = false;
                let userPass = "";

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    userPass = data.password || "";
                    if (userPass === passwordInput) {
                        userFound = true;
                    }
                });

                if (userFound) {
                    localStorage.setItem('userName', usernameInput);
                    showCustomAlert("ലോഗിൻ വിജയകരമാണ്!", "വിജയം", false, () => {
                        window.location.href = "dashboard.html";
                    });
                } else {
                    showCustomAlert("നൽകിയ പാസ്‌വേർഡ് തെറ്റാണ്. ദയവായി ശരിയായ പാസ്‌വേർഡ് നൽകുക.", "പാസ്‌വേർഡ് തെറ്റാണ്");
                }

            } catch (error) {
                console.error("Login Error:", error);
                showCustomAlert("ലോഗിൻ ചെയ്യുന്നതിൽ തടസ്സം നേരിട്ടു. വീണ്ടും ശ്രമിക്കുക.", "പിഴവ്");
            }
        }

        window.togglePassword = function() {
            const passwordInput = document.getElementById('password');
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
            } else {
                passwordInput.type = "password";
            }
        }
    </script>

    <style>
        body { font-family: 'Manjari', sans-serif; background: radial-gradient(circle at top, #0f172a 0%, #050b18 100%) !important; }
    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full space-y-6">
        
        <div id="appHeader" class="w-full"></div>

        <div class="bg-slate-900/90 p-6 rounded-3xl border border-slate-800 shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <h1 class="text-xl font-black text-amber-400">ലോഗിൻ ചെയ്യുക[span_1](start_span)[span_1](end_span)</h1>
                <p class="text-xs text-slate-400 font-bold">നിങ്ങളുടെ അക്കൗണ്ടിലേക്ക് സ്വാഗതം[span_2](start_span)[span_2](end_span)</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-black text-slate-400 mb-1.5 uppercase">മേസ്തിരിയുടെ പേര്[span_3](start_span)[span_3](end_span):</label>
                    <input type="text" id="username" required placeholder="പേര് നൽകുക" class="w-full p-3.5 bg-slate-800/80 text-white rounded-2xl border border-slate-700 text-sm font-bold focus:outline-none focus:border-amber-400">
                </div>

                <div>
                    <label class="block text-xs font-black text-slate-400 mb-1.5 uppercase">പാസ്‌വേർഡ് (Password)[span_4](start_span)[span_4](end_span):</label>
                    <div class="relative">
                        <input type="password" id="password" required placeholder="പാസ്‌വേർഡ് നൽകുക" class="w-full p-3.5 bg-slate-800/80 text-white rounded-2xl border border-slate-700 text-sm font-bold focus:outline-none focus:border-amber-400 pr-10">
                        <button type="button" onclick="togglePassword()" class="absolute right-3 top-3.5 text-slate-400 hover:text-white text-xs">👁️</button>
                    </div>
                </div>

                <div class="text-right">
                    <a href="forgot_password.html" class="text-xs text-amber-400 hover:underline font-bold">പാസ്‌വേർഡ് മറന്നുപോയോ?[span_5](start_span)[span_5](end_span)</a>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 p-4 rounded-2xl font-black text-base shadow-xl shadow-amber-950/50 transition">ലോഗിൻ ചെയ്യാം[span_6](start_span)[span_6](end_span)</button>
            </form>

            <div class="text-center pt-2 border-t border-slate-800">
                <p class="text-xs text-slate-400">അക്കൗണ്ട് ഇല്ലെങ്കിൽ? <a href="register.html" class="text-amber-400 font-bold hover:underline">പുതിയ അക്കൗണ്ട് ഉണ്ടാക്കാം[span_7](start_span)[span_7](end_span)</a></p>
            </div>
        </div>
    </div>

    <div id="customModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border-2 border-amber-400/50 rounded-3xl p-6 max-w-sm w-full shadow-[0_0_40px_rgba(251,191,36,0.3)] text-center space-y-4">
            <h3 id="modalTitle" class="text-xl font-black text-amber-300">ശ്രദ്ധിക്കുക</h3>
            <p id="modalMessage" class="text-sm font-bold text-blue-100 leading-relaxed"></p>
            <div class="flex gap-3 pt-2">
                <button id="modalCancelBtn" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 p-3 rounded-2xl font-black text-base transition hidden">വേണ്ട</button>
                <button id="modalOkBtn" class="flex-1 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 p-3 rounded-2xl font-black text-base shadow-lg transition">ശരി</button>
            </div>
        </div>
    </div>

</body>
</html>
