<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ലോഗിൻ - മേസ്ത്രി പ്രോ</title>

    <!-- Eruda കൺസോൾ ടൂൾ -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    
    <!-- Tailwind CSS & Icons -->
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Changa+One&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Language Script -->
    <script src="language.js"></script>
</head>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- പിൻ ലോക്ക് മോഡൽ -->
    <div id="pinLockModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-700/80 rounded-2xl p-6 w-full max-w-xs shadow-2xl text-center">
            
            <div class="w-12 h-12 bg-amber-500/10 rounded-full flex items-center justify-center mx-auto mb-3 text-amber-400 text-xl">
                <i class="fa-solid fa-lock"></i>
            </div>

            <h3 class="text-base font-bold text-white mb-1" data-key="pin_lock_title">സുരക്ഷിത ലോഗിൻ</h3>
            <p class="text-xs text-slate-400 mb-4" data-key="pin_lock_desc">തുടരാൻ നിങ്ങളുടെ 4 അക്ക പിൻ നമ്പർ നൽകുക</p>
            
            <input type="password" id="appPinInput" maxlength="4" data-key-placeholder="placeholder_pin" placeholder="••••" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-center text-white text-lg tracking-widest focus:outline-none focus:border-amber-400 mb-4">
            
            <button type="button" id="btnVerifyPin" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl text-sm transition cursor-pointer shadow-lg" data-key="btn_open">
                തുറക്കുക
            </button>
        </div>
    </div>

    <!-- ആപ്പ് ഹെഡർ -->
    <div class="w-full max-w-sm mx-auto mb-4">
        <div id="appHeader" class="w-full"></div>
    </div>

    <!-- മെയിൻ ലോഗിൻ കാർഡ് -->
    <div class="w-full max-w-sm bg-slate-900/90 border border-slate-700/60 rounded-2xl p-6 shadow-xl backdrop-blur-md">
        
        <h2 class="text-xl font-bold text-white mb-1" data-key="login_heading">ലോഗിൻ ചെയ്യുക</h2>
        <p class="text-xs text-slate-400 mb-5" data-key="login_subheading">നിങ്ങളുടെ അക്കൗണ്ടിലേക്ക് സ്വാഗതം</p>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-amber-300/90 mb-1.5" data-key="label_username">യൂസർനെയിം (പേര്)</label>
                <input type="text" id="username" data-key-placeholder="placeholder_username" placeholder="നിങ്ങളുടെ പേര് നൽകുക" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-400">
            </div>

            <div>
                <label class="block text-xs font-semibold text-amber-300/90 mb-1.5" data-key="label_password">പാസ്‌വേർഡ്</label>
                <div class="relative">
                    <input type="password" id="password" data-key-placeholder="placeholder_password" placeholder="പാസ്‌വേർഡ് നൽകുക" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 pr-12 text-white text-sm focus:outline-none focus:border-amber-400">
                    <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-amber-400 p-2 cursor-pointer">
                        <i class="fa-solid fa-eye text-base" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <button id="btnLogin" class="w-full mt-2 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg hover:from-amber-400 hover:to-orange-400 transition duration-200 text-sm cursor-pointer" data-key="btn_login">
                ലോഗിൻ ചെയ്യാം
            </button>
        </div>

        <div class="mt-4 text-center">
            <button type="button" id="btnForgotOpen" class="text-xs text-amber-400/90 hover:underline bg-transparent border-none cursor-pointer" data-key="btn_forgot">പാസ്‌വേർഡ് മറന്നുപോയോ?</button>
        </div>
    </div>

    <!-- രജിസ്റ്റർ ലിങ്ക് -->
    <div class="mt-6 text-center text-xs text-slate-400">
        <span data-key="no_account_text">അക്കൗണ്ട് ഇല്ലെങ്കിൽ?</span> 
        <a href="register.html" class="text-amber-400 font-bold hover:underline ml-1" data-key="link_register">പുതിയതായി രജിസ്റ്റർ ചെയ്യുക</a>
    </div>

    <!-- പാസ്‌വേർഡ് വീണ്ടെടുക്കൽ മോഡൽ -->
    <div id="forgotModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 w-full max-w-sm shadow-2xl relative">
            
            <h3 class="text-lg font-bold text-white mb-2" data-key="forgot_title">പാസ്‌വേർഡ് വീണ്ടെടുക്കുക</h3>
            <p class="text-xs text-slate-400 mb-4" data-key="forgot_desc">നിങ്ങൾ രജിസ്റ്റർ ചെയ്ത ഫോൺ നമ്പർ നൽകുക:</p>
            
            <input type="tel" id="forgotPhone" data-key-placeholder="placeholder_phone" placeholder="ഫോൺ നമ്പർ നൽകുക (10 അക്കം)" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-400 mb-4">
            
            <div class="flex gap-2">
                <button type="button" id="btnForgotClose" class="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-semibold py-2.5 rounded-xl text-sm transition cursor-pointer" data-key="btn_close">അടയ്ക്കുക</button>
                <button type="button" id="btnGetDetails" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl text-sm transition cursor-pointer" data-key="btn_verify">പരിശോധിക്കുക</button>
            </div>
        </div>
    </div>

    <!-- ജാവാസ്ക്രിപ്റ്റ് ഭാഗം -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
        import { setupHeader } from './header.js';

        setupHeader('appHeader');

        // പേജ് ലോഡ് ചെയ്യുമ്പോൾ ഒരേസമയം ഭാഷയും പിൻ ലോക്കും സെറ്റ് ചെയ്യാൻ
        document.addEventListener("DOMContentLoaded", () => {
            // 1. ഭാഷ മാറ്റാനുള്ള കോഡ്
            const savedLang = localStorage.getItem('selectedLang') || 'ml';
            if (typeof window.switchLanguage === "function") {
                window.switchLanguage(savedLang);
            } else if (typeof updatePageLanguage === "function") {
                updatePageLanguage(savedLang);
            }

            // 2. പിൻ ലോക്ക് വെരിഫിക്കേഷൻ കോഡ്
            const pinModal = document.getElementById("pinLockModal");
            const pinInput = document.getElementById("appPinInput");
            const btnVerifyPin = document.getElementById("btnVerifyPin");

            const savedPin = localStorage.getItem("appPin") || "1234";

            if (btnVerifyPin) {
                btnVerifyPin.addEventListener("click", () => {
                    if (pinInput.value.trim() === savedPin) {
                        pinModal.classList.add("hidden");
                        pinModal.classList.remove("flex");
                    } else {
                        alert("നൽകിയ പിൻ നമ്പർ തെറ്റാണ്!");
                        pinInput.value = "";
                    }
                });
            }
        });

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            databaseURL: "https://mesthri-app-default-rtdb.firebaseio.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d",
            measurementId: "G-J9Y5TW9D7T"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const togglePasswordBtn = document.getElementById("togglePassword");
        const eyeIcon = document.getElementById("eyeIcon");
        const btnLogin = document.getElementById("btnLogin");

        const btnForgotOpen = document.getElementById("btnForgotOpen");
        const forgotModal = document.getElementById("forgotModal");
        const btnForgotClose = document.getElementById("btnForgotClose");
        const btnGetDetails = document.getElementById("btnGetDetails");
        const forgotPhone = document.getElementById("forgotPhone");

        // പാസ്‌വേർഡ് കാണാനും മറയ്ക്കാനുമുള്ള ഫങ്ഷൻ
        togglePasswordBtn.addEventListener("click", () => {
            const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
            passwordInput.setAttribute("type", type);
            eyeIcon.classList.toggle("fa-eye");
            eyeIcon.classList.toggle("fa-eye-slash");
        });

        // പാസ്‌വേർഡ് വീണ്ടെടുക്കൽ മോഡൽ ഓപ്പൺ/ക്ലോസ് ചെയ്യൽ
        btnForgotOpen.addEventListener("click", () => {
            forgotModal.classList.remove("hidden");
            forgotModal.classList.add("flex");
            forgotPhone.value = "";
        });

        btnForgotClose.addEventListener("click", () => {
            forgotModal.classList.add("hidden");
            forgotModal.classList.remove("flex");
        });

        // ലോഗിൻ ബട്ടൺ ക്ലിക്ക് ചെയ്യുമ്പോൾ വർക്ക് ചെയ്യുന്ന ഭാഗം
        if (btnLogin) {
            btnLogin.addEventListener("click", async () => {
                const userInput = usernameInput.value.trim();
                const passInput = passwordInput.value.trim();

                if (!userInput || !passInput) {
                    alert('ദയവായി യൂസർനെയിമും പാസ്‌വേർഡും നൽകുക!');
                    return;
                }

                try {
                    const usersRef = ref(db, 'users');
                    const snapshot = await get(usersRef);

                    if (snapshot.exists()) {
                        let matchedUserData = null;

                        snapshot.forEach((childSnapshot) => {
                            const key = childSnapshot.key;
                            const data = childSnapshot.val();
                            const dbUsername = (data.username || key || "").toString().trim();

                            if (dbUsername.toLowerCase() === userInput.toLowerCase()) {
                                matchedUserData = data;
                            }
                        });

                        if (matchedUserData) {
                            if (matchedUserData.password === passInput) {
                                alert('ലോഗിൻ വിജയകരമാണ്!');
                                localStorage.setItem('userName', userInput);
                                setTimeout(() => {
                                    window.location.href = "dashboard.html";
                                }, 1000);
                            } else {
                                alert('നൽകിയ പാസ്‌വേർഡ് തെറ്റാണ്!');
                            }
                        } else {
                            alert('ഈ പേരിൽ അക്കൗണ്ട് കണ്ടെത്താനായില്ല!');
                        }
                    } else {
                        alert('അക്കൗണ്ടുകൾ ലഭ്യമല്ല.');
                    }
                } catch (err) {
                    console.error(err);
                    alert("Firebase Error: " + err.message);
                }
            });
        }
    </script>
</body>
</html>
