<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ലോഗിൻ - മേസ്തിരി പ്രോ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&display=swap" rel="stylesheet">
    <script type="module" src="app.js"></script>
    <style>
        body { font-family: 'Manjari', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-blue-950 to-slate-900 min-h-screen text-white flex flex-col justify-between p-5">

    <!-- ടോപ്പ് ഹെഡർ: വലിയ ലോഗോയും Smart Site Manager ടാഗും -->
    <div class="text-center pt-6">
        <div class="inline-flex items-center gap-4 bg-amber-500/30 text-amber-300 px-6 py-3 rounded-full border-2 border-amber-300 shadow-[0_0_30px_rgba(251,191,36,0.5)]">
            <img src="icon.png" alt="Mesthiri" class="rounded-full object-cover border-2 border-amber-200 shadow-lg" style="width: 64px; height: 64px;">
            <div class="text-left">
                <span class="text-2xl font-black text-amber-300 tracking-wide block leading-tight">മേസ്തിരി പ്രോ</span>
                <span class="text-[13px] font-bold text-blue-200 tracking-wider uppercase">Smart Site Manager</span>
            </div>
        </div>
        <h1 class="text-4xl font-black mt-5 tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-white via-blue-100 to-amber-400">
            ലോഗിൻ ചെയ്യുക
        </h1>
        <p class="text-base text-blue-200 mt-1 font-bold">നിങ്ങളുടെ അക്കൗണ്ടിലേക്ക് സ്വാഗതം</p>
    </div>

    <!-- ലോഗിൻ ഫോം കാർഡ് -->
    <div class="bg-white/5 backdrop-blur-md p-6 rounded-3xl border border-blue-500/30 max-w-sm mx-auto w-full my-4 space-y-4 shadow-xl">
        <div>
            <label class="block text-base font-black text-amber-300 mb-1.5">യൂസർനെയിം (പേര്)</label>
            <input type="text" id="username" placeholder="നിങ്ങളുടെ പേര് നൽകുക" 
                   class="w-full bg-slate-900/90 border-2 border-blue-500/50 rounded-2xl p-4 text-white text-base font-black focus:outline-none focus:border-amber-400 placeholder:text-slate-400">
        </div>

        <div>
            <label class="block text-base font-black text-amber-300 mb-1.5">പാസ്‌വേർഡ്</label>
            <div class="relative">
                <input type="password" id="password" placeholder="കുറഞ്ഞത് 6 അക്കങ്ങൾ നൽകുക" 
                       class="w-full bg-slate-900/90 border-2 border-blue-500/50 rounded-2xl p-4 pr-12 text-white text-base font-black focus:outline-none focus:border-amber-400 placeholder:text-slate-400">
                <!-- പാസ്‌വേർഡ് കാണാനുള്ള കണ്ണ് ഐക്കൺ -->
                <button type="button" id="togglePassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-blue-300 hover:text-amber-400 focus:outline-none">
                    <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </button>
            </div>
            <p class="text-sm text-blue-200 mt-2 font-bold leading-relaxed">ശ്രദ്ധിക്കുക: പാസ്‌വേർഡിൽ കുറഞ്ഞത് 6 അക്കങ്ങളോ അക്ഷരങ്ങളോ ഉണ്ടായിരിക്കണം.</p>
        </div>

        <!-- ലോഗിൻ ബട്ടൺ -->
        <button id="btnLogin" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 text-center p-4 rounded-2xl font-black text-lg shadow-xl shadow-amber-950/50 transition mt-3">
            ലോഗിൻ ചെയ്യുക
        </button>

        <button id="btnForgot" class="w-full text-amber-300 font-bold text-base hover:underline block text-center pt-2">
            പാസ്‌വേർഡ് മറന്നുപോയോ?
        </button>
    </div>

    <!-- രജിസ്ട്രേഷൻ ലിങ്ക് -->
    <div class="max-w-sm mx-auto w-full text-center pb-4 space-y-3">
        <p class="text-base text-blue-100 font-bold">
            അക്കൗണ്ട് ഇല്ലെങ്കിൽ? 
            <a href="register.html" class="text-amber-400 font-black underline ml-1 text-lg">പുതിയതായി രജിസ്റ്റർ ചെയ്യുക</a>
        </p>
        <p class="text-xs text-slate-400 font-bold pt-2">
            മേസ്തിരിമാർക്കായി നിർമ്മിച്ചത് ❤️ കേരളം
        </p>
    </div>

                <!-- ഫയർബേസ് സ്ക്രിപ്റ്റുകൾ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app); // 👉 ലോഗിൻ പേജിന് സ്റ്റാൻഡേർഡ് ഫയർസ്റ്റോർ ഉപയോഗിക്കുന്നു

        // മുമ്പ് ലോഗിൻ ചെയ്തിട്ടുണ്ടെങ്കിൽ ഓട്ടോമാറ്റിക് ആയി ഡാഷ്‌ബോർഡിലേക്ക് പോകും
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = "dashboard.html";
            }
        });

        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        // പാസ്‌വേർഡ് കാണാനുള്ള കണ്ണ് ബട്ടൺ വർക്ക് ചെയ്യാൻ
        togglePassword.addEventListener("click", () => {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                togglePassword.style.opacity = "1";
            } else {
                passwordInput.type = "password";
                togglePassword.style.opacity = "0.6";
            }
        });

        // ലോഗിൻ ബട്ടൺ ക്ലിക്ക് ചെയ്യുമ്പോൾ
        document.getElementById("btnLogin").addEventListener("click", () => {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (!user || !pass) {
                return alert("ദയവായി യൂസർനെയിമും പാസ്‌വേർഡും നൽകുക!");
            }

            const email = user.includes("@") ? user : `${user}@mesthri.com`;

            signInWithEmailAndPassword(auth, email, pass)
                .then(() => {
                    localStorage.setItem('userName', user);
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    console.error(error);
                    alert("ലോഗിൻ പരാജയപ്പെട്ടു! യൂസർനെയിമോ പാസ്‌വേർഡോ തെറ്റാണ്.");
                });
        });

        // പാസ്‌വേർഡ് മറന്നുപോയാൽ
        document.getElementById("btnForgot").addEventListener("click", async () => {
            const user = document.getElementById('username').value.trim();
            if(!user) return alert("ആദ്യം യൂസർനെയിം ബോക്സിൽ നിങ്ങളുടെ പേര് നൽകുക!");

            try {
                const docRef = doc(db, "users", user);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    alert("നിങ്ങളുടെ പാസ്‌വേർഡ്: " + data.password);
                } else {
                    alert("ഈ യൂസർനെയിം നിലവിലില്ല!");
                }
            } catch (e) {
                alert("ഡാറ്റ എടുക്കുന്നതിൽ തടസ്സം നേരിട്ടു. ഇന്റർനെറ്റ് കണക്ഷൻ പരിശോധിക്കുക.");
            }
        });
    </script>



</body>
</html>
