<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ലോഗിൻ - മേസ്തിരി പ്രോ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Manjari', sans-serif; }
        @keyframes popUp {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .animate-pop-up {
            /* സമയം 0.3 സെക്കൻഡിൽ നിന്ന് 0.5 സെക്കൻഡ് ആക്കി കൂട്ടിയിരിക്കുന്നു, ഇത് കൂടുതൽ സ്മൂത്ത് തരും */
            animation: popUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-blue-950 to-slate-900 min-h-screen text-white flex flex-col justify-between p-5">

    <!-- സെന്ററിൽ പതുക്കെ സ്മൂത്ത് ആയി പൊന്തിവരുന്ന മോഡൽ അലേർട്ട് -->
    <div id="customModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-sm transition-all">
        <div class="bg-slate-900 border-2 border-amber-400/50 rounded-3xl p-6 max-w-sm w-full shadow-[0_0_50px_rgba(251,191,36,0.3)] text-center space-y-4 animate-pop-up">
            <div class="text-4xl">⚠️</div>
            <h3 id="modalTitle" class="text-xl font-black text-amber-300">ശ്രദ്ധിക്കുക</h3>
            <p id="modalMessage" class="text-sm font-bold text-blue-100 leading-relaxed"></p>
            <button onclick="closeModal()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 p-3.5 rounded-2xl font-black text-base shadow-lg transition">ശരി</button>
        </div>
    </div>

    <!-- ടോപ്പ് ഹെഡർ: ലോഗോയും ഫോം കാർഡിന്റെ അതേ അളവും -->
    <div class="w-full max-w-sm mx-auto pt-6 text-center">
        <div class="flex items-center gap-4 bg-amber-500/30 text-amber-300 px-6 py-3 rounded-full border-2 border-amber-300 shadow-[0_0_30px_rgba(251,191,36,0.5)] w-full">
            <img src="icon.png" alt="മേസ്തിരി പ്രോ ലോഗോ" class="rounded-full object-cover border-2 border-amber-200 shadow-lg flex-shrink-0" style="width: 54px; height: 54px;">
            <div class="text-left">
                <span class="text-xl font-black text-amber-300 tracking-wide block leading-tight">മേസ്തിരി പ്രോ</span>
                <span class="text-[11px] font-bold text-blue-200 tracking-wider uppercase">Smart Site Manager</span>
            </div>
        </div>
        <h1 class="text-3xl font-black mt-5 tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-white via-blue-100 to-amber-400">
            ലോഗിൻ ചെയ്യുക
        </h1>
        <p class="text-sm text-blue-200 mt-1 font-bold">നിങ്ങളുടെ അക്കൗണ്ടിലേക്ക് സ്വാഗതം</p>
    </div>

    <!-- ലോഗിൻ ഫോം കാർഡ് -->
    <div class="bg-white/5 backdrop-blur-md p-6 rounded-3xl border border-blue-500/30 max-w-sm mx-auto w-full my-4 space-y-4 shadow-xl">
        <div>
            <label class="block text-base font-black text-amber-300 mb-1.5">യൂസർനെയിം (പേര്)</label>
            <input type="text" id="username" placeholder="നിങ്ങളുടെ പേര് നൽകുക" 
                   class="w-full bg-slate-900/90 border-2 border-blue-500/50 rounded-2xl p-4 text-white text-base font-black focus:outline-none focus:border-amber-400 placeholder:text-slate-400">
        </div>

        <div>
            <label class="block text-base font-black text-amber-300 mb-1.5">പാസ്‌വേർഡ്</label>
            <div class="relative">
                <input type="password" id="password" placeholder="കുറഞ്ഞത് 6 അക്കങ്ങൾ നൽകുക" 
                       class="w-full bg-slate-900/90 border-2 border-blue-500/50 rounded-2xl p-4 pr-12 text-white text-base font-black focus:outline-none focus:border-amber-400 placeholder:text-slate-400">
                <button type="button" id="togglePassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-blue-300 hover:text-amber-400 focus:outline-none">
                    <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </button>
            </div>
            <p class="text-sm text-blue-200 mt-2 font-bold leading-relaxed">ശ്രദ്ധിക്കുക: പാസ്‌വേർഡിൽ കുറഞ്ഞത് 6 അക്കങ്ങളോ അക്ഷരങ്ങളോ ഉണ്ടായിരിക്കണം.</p>
        </div>

        <button id="btnLogin" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 text-center p-4 rounded-2xl font-black text-lg shadow-xl shadow-amber-950/50 transition mt-3">
            ലോഗിൻ ചെയ്യുക
        </button>

        <button id="btnForgot" class="w-full text-amber-300 font-bold text-base hover:underline block text-center pt-2">
            പാസ്‌വേർഡ് മറന്നുപോയോ?
        </button>
    </div>

    <div class="max-w-sm mx-auto w-full text-center pb-4 space-y-3">
        <p class="text-base text-blue-100 font-bold">
            അക്കൗണ്ട് ഇല്ലെങ്കിൽ? 
            <a href="register.html" class="text-amber-400 font-black underline ml-1 text-lg">പുതിയതായി രജിസ്റ്റർ ചെയ്യുക</a>
        </p>
        <p class="text-xs text-slate-400 font-bold pt-2">
            മേസ്തിരിമാർക്കായി നിർമ്മിച്ചത് ❤️ കേരളം
        </p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            databaseURL: "https://mesthri-app-default-rtdb.firebaseio.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.showModal = (msg, title = "ശ്രദ്ധിക്കുക") => {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = msg;
            document.getElementById('customModal').classList.remove('hidden');
        };
        window.closeModal = () => document.getElementById('customModal').classList.add('hidden');

        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const btnLogin = document.getElementById("btnLogin");
        const btnForgot = document.getElementById("btnForgot");

        togglePassword.addEventListener("click", () => {
            const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
            passwordInput.setAttribute("type", type);
            togglePassword.style.color = (type === "text") ? "#fbbf24" : "#93c5fd";
        });

        btnLogin.addEventListener("click", () => {
            const user = usernameInput.value.trim().toLowerCase();
            const pass = passwordInput.value.trim();

            if (!user || !pass) {
                return showModal("ദയവായി യൂസർനെയിമും പാസ്‌വേർഡും നൽകുക!");
            }

            const dbRef = ref(db);
            get(child(dbRef, `users/${user}`)).then((snapshot) => {
                if (!snapshot.exists()) {
                    return showModal("ഈ യൂസർനെയിം നിലവിലില്ല! പുതിയതായി രജിസ്റ്റർ ചെയ്യുക.");
                }
                const data = snapshot.val();
                if (data.password !== pass) {
                    return showModal("പാസ്‌വേർഡ് തെറ്റാണ്!");
                }
                localStorage.setItem('userName', user);
                window.location.href = "dashboard.html";
            }).catch((error) => {
                console.error(error);
                showModal("ലോഗിൻ പരാജയപ്പെട്ടു. ഇന്റർനെറ്റ് കണക്ഷൻ പരിശോധിക്കുക.");
            });
        });

        btnForgot.addEventListener("click", () => {
            const user = usernameInput.value.trim().toLowerCase();
            if (!user) {
                return showModal("ആദ്യം യൂസർനെയിം ബോക്സിൽ നിങ്ങളുടെ പേര് നൽകുക!");
            }

            const dbRef = ref(db);
            get(child(dbRef, `users/${user}`)).then((snapshot) => {
                if (snapshot.exists()) {
                    showModal("നിങ്ങളുടെ പാസ്‌വേർഡ്: " + snapshot.val().password, "പാസ്‌വേർഡ് ഓർമ്മപ്പെടുത്തൽ");
                } else {
                    showModal("ഈ യൂസർനെയിം നിലവിലില്ല!");
                }
            }).catch((error) => {
                console.error(error);
                showModal("ഡാറ്റ എടുക്കുന്നതിൽ തടസ്സം നേരിട്ടു.");
            });
        });
    </script>
</body>
</html>
