<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ലോഗിൻ - മേസ്തിരി പ്രോ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Manjari', sans-serif; }</style>
</head>
<body class="bg-[#050B18] text-white min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="w-full max-w-md space-y-4">
        
        <!-- ഹെഡർ ലോഗോയും സ്വാഗതം പേരും ഒന്നിച്ചുള്ള ഭാഗം -->
        <div class="flex flex-col items-center pt-2 pb-2">
            <div class="inline-flex items-center gap-3 px-5 py-2.5 rounded-full bg-slate-900/90 border border-amber-400/50 shadow-lg shadow-amber-500/20 backdrop-blur-md">
                <div class="w-9 h-9 rounded-full overflow-hidden border border-amber-400 flex-shrink-0 bg-amber-400/10 flex items-center justify-center">
                    <img src="icon.png" alt="Logo" class="w-full h-full object-cover">
                </div>
                <div class="flex flex-col text-left">
                    <span class="text-amber-400 font-black text-sm tracking-wide leading-tight">മേസ്തിരി പ്രോ</span>
                    <span class="text-[10px] font-bold text-blue-200 tracking-wider uppercase">SMART SITE MANAGER</span>
                </div>
            </div>
        </div>

        <!-- ലോഗിൻ കാർഡ് -->
        <div class="bg-slate-900/90 border border-slate-800 p-6 rounded-3xl shadow-2xl backdrop-blur-sm space-y-5">
            <div class="text-center">
                <h1 class="text-xl font-black text-white">ലോഗിൻ ചെയ്യുക</h1>
                <p class="text-xs font-bold text-slate-400 mt-1">നിങ്ങളുടെ അക്കൗണ്ടിലേക്ക് സ്വാഗതം</p>
            </div>
            
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-black text-slate-400 mb-1.5 uppercase tracking-wide">യൂസർനെയിം (പേര്)</label>
                    <input type="text" id="username" class="w-full p-3.5 bg-slate-800/80 text-white rounded-2xl border border-slate-700 text-sm font-bold focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-black text-slate-400 mb-1.5 uppercase tracking-wide">പാസ്‌വേഡ്</label>
                    <input type="password" id="password" class="w-full p-3.5 bg-slate-800/80 text-white rounded-2xl border border-slate-700 text-sm font-bold focus:outline-none focus:border-amber-400">
                </div>
                
                <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 p-4 rounded-2xl font-black text-base shadow-xl shadow-amber-950/50 border border-white/25 transition mt-3">
                    ലോഗിൻ ചെയ്യുക
                </button>
            </form>
            
            <div class="text-center pt-2">
                <p class="text-xs font-bold text-slate-400">അക്കൗണ്ട് ഇല്ലെങ്കിൽ? <a href="register.html" class="text-amber-400 underline font-black">പുതിയതായി രജിസ്റ്റർ ചെയ്യുക</a></p>
            </div>
        </div>
    </div>

    <!-- കസ്റ്റം അലേർട്ട് മോഡൽ -->
    <div id="customModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border-2 border-amber-400/50 rounded-3xl p-6 max-w-sm w-full shadow-[0_0_40px_rgba(251,191,36,0.3)] text-center space-y-4">
            <div id="modalIcon" class="text-4xl">⚠️</div>
            <h3 id="modalTitle" class="text-xl font-black text-amber-300">ശ്രദ്ധിക്കുക</h3>
            <p id="modalMessage" class="text-sm font-bold text-blue-100 leading-relaxed"></p>
            <button id="modalOkBtn" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 p-3 rounded-2xl font-black text-base shadow-lg transition">ശരി</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            databaseURL: "https://mesthri-app-default-rtdb.firebaseio.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d",
            measurementId: "G-J9Y5TW9D7T"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function showCustomAlert(message, title = "ശ്രദ്ധിക്കുക") {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;
            document.getElementById('customModal').classList.remove('hidden');
        }

        document.getElementById('modalOkBtn').addEventListener('click', () => {
            document.getElementById('customModal').classList.add('hidden');
        });

        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (!user) {
                showCustomAlert("ദയവായി യൂസർനെയിം നൽകുക!", "ശ്രദ്ധിക്കുക");
                return;
            }
            if (!pass) {
                showCustomAlert("ദയവായി പാസ്‌വേഡ് നൽകുക!", "ശ്രദ്ധിക്കുക");
                return;
            }

            try {
                const q = query(collection(db, "users"), where("name", "==", user), where("password", "==", pass));
                const snap = await getDocs(q);
                if (!snap.empty) {
                    localStorage.setItem('userName', user);
                    window.location.href = "dashboard.html";
                } else {
                    showCustomAlert("തെറ്റായ പേരോ പാസ്‌വേഡോ!", "പിഴവ്");
                }
            } catch (e) {
                showCustomAlert("ലോഗിൻ ചെയ്യാൻ സാധിച്ചില്ല!", "പിഴവ്");
            }
        };
    </script>
</body>
</html>
