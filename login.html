<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>മേസ്തിരി പ്രോ - ലോഗിൻ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Changa+One&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- language.js ഫയൽ ഇവിടെ ഹെഡറിൽ നൽകുന്നു -->
    <script src="language.js?v=2.0"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- ലോഗോ ഹെഡർ -->
    <div class="w-full max-w-sm mx-auto mb-6">
        <div id="appHeader" class="w-full"></div>
    </div>

    <!-- ലോഗിൻ കാർഡ് -->
    <div class="w-full max-w-sm bg-slate-900/80 border border-slate-700/60 rounded-2xl p-6 shadow-xl backdrop-blur-md">
        
        <h2 class="lang text-xl font-bold text-white mb-1" data-key="loginTitle">ലോഗിൻ ചെയ്യുക</h2>
        <p class="lang text-xs text-slate-400 mb-5" data-key="loginSubtitle">നിങ്ങളുടെ അക്കൗണ്ടിലേക്ക് സ്വാഗതം</p>

        <div class="space-y-4">
            <!-- പേര് -->
            <div>
                <label class="lang block text-xs font-semibold text-amber-300/90 mb-1.5" data-key="mesthriNameLabel">മേസ്തിരിയുടെ പേര്</label>
                <input type="text" id="username" class="lang-placeholder w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-400" data-key-placeholder="usernamePlaceholder" placeholder="നിങ്ങളുടെ പേര് നൽകുക">
            </div>

            <!-- പാസ്‌വേർഡ് -->
            <div>
                <label class="lang block text-xs font-semibold text-amber-300/90 mb-1.5" data-key="passwordLabel">പാസ്‌വേർഡ് (Password)</label>
                <div class="relative">
                    <input type="password" id="password" class="lang-placeholder w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 pr-12 text-white text-sm focus:outline-none focus:border-amber-400" data-key-placeholder="passwordPlaceholder" placeholder="പാസ്‌വേർഡ് നൽകുക">
                    <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-amber-400 p-2">
                        <i class="fa-solid fa-eye text-base" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <!-- പാസ്‌വേർഡ് മറന്നുപോയോ ലിങ്ക് -->
            <div class="text-right">
                <button type="button" onclick="openForgotModal()" class="lang text-xs text-amber-400 hover:underline font-medium" data-key="forgotPasswordText">പാസ്‌വേർഡ് മറന്നുപോയോ?</button>
            </div>

            <!-- ലോഗിൻ ബട്ടൺ -->
            <button id="btnLogin" class="lang w-full mt-2 bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg hover:from-amber-400 hover:to-orange-400 transition duration-200 text-sm" data-key="loginSubmitBtn">
                ലോഗിൻ ചെയ്യാം
            </button>
        </div>
    </div>

    <!-- രജിസ്ട്രേഷൻ ലിങ്ക് -->
    <div class="mt-6 text-center text-xs text-slate-400">
        <span class="lang" data-key="noAccountText">അക്കൗണ്ട് ഇല്ലേ?</span> 
        <a href="register.html" class="lang text-amber-400 font-bold hover:underline ml-1" data-key="registerLinkText">പുതിയ അക്കൗണ്ട് ഉണ്ടാക്കാം</a>
    </div>

    <!-- ഫൂട്ടർ -->
    <div class="lang mt-8 text-center text-[11px] text-slate-500" data-key="footerCredit">
        മേസ്തിരിമാർക്കായി നിർമ്മിച്ചത് ❤️ കേരളം
    </div>

    <!-- പാസ്‌വേർഡ് റിക്കവറി മോഡൽ (Forgot Password Modal) -->
    <div id="forgotModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-slate-900 border border-amber-500/40 rounded-2xl shadow-2xl w-full max-w-sm p-6 relative">
            <h3 class="lang text-amber-400 font-bold text-lg mb-2" data-key="forgotModalTitle">പാസ്‌വേർഡ് വീണ്ടെടുക്കുക</h3>
            <p class="lang text-xs text-slate-400 mb-4" data-key="forgotModalDesc">രജിസ്റ്റർ ചെയ്ത ഫോൺ നമ്പറും 4 അക്ക പിൻ നമ്പറും നൽകുക.</p>
            
            <div class="space-y-3 mb-4">
                <div>
                    <label class="lang block text-xs font-semibold text-slate-300 mb-1" data-key="phoneLabel">ഫോൺ നമ്പർ</label>
                    <input type="tel" id="recoveryPhone" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-amber-400" placeholder="10 അക്ക ഫോൺ നമ്പർ">
                </div>
                <div>
                    <label class="lang block text-xs font-semibold text-slate-300 mb-1" data-key="securityPinLabel">സുരക്ഷാ പിൻ (4 Digit PIN)</label>
                    <input type="password" id="recoveryPin" maxlength="4" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-amber-400" placeholder="4 അക്ക പിൻ നൽകുക">
                </div>
            </div>

            <!-- ഫലം കാണിക്കുന്ന സ്ഥലം -->
            <div id="recoveryResult" class="hidden mb-4 p-3 bg-slate-800/80 border border-slate-700 rounded-xl text-center">
                <p class="text-xs text-slate-400">നിങ്ങളുടെ വിവരങ്ങൾ:</p>
                <p id="recoveredInfo" class="text-amber-400 font-bold text-sm mt-1"></p>
            </div>

            <div class="flex space-x-2">
                <button type="button" onclick="closeForgotModal()" class="w-1/2 bg-slate-800 text-slate-300 font-bold py-2.5 rounded-xl text-sm hover:bg-slate-700">അടയ്ക്കുക</button>
                <button type="button" onclick="verifyAndRecover()" class="w-1/2 bg-amber-500 text-slate-950 font-bold py-2.5 rounded-xl text-sm hover:bg-amber-400">പരിശോധിക്കുക</button>
            </div>
        </div>
    </div>

    <!-- ഫയർബേസ് സ്ക്രിപ്റ്റുകൾ -->
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
        
        import { setupModal } from './modal.js';
        import { setupHeader } from './header.js';

        setupModal();
        setupHeader('appHeader');

        function applySavedLanguage() {
            const savedLang = localStorage.getItem('selectedLang') || 'ml';
            if (typeof window.switchLanguage === 'function') {
                window.switchLanguage(savedLang);
            }
        }

        window.addEventListener('DOMContentLoaded', applySavedLanguage);
        window.addEventListener('languageChanged', (e) => {
            const newLang = (e && e.detail) ? e.detail : localStorage.getItem('selectedLang');
            if (typeof window.switchLanguage === 'function') {
                window.switchLanguage(newLang);
            }
        });

        window.showCustomAlert = function(messageKey, isSuccess = false) {
            const currentLang = localStorage.getItem('selectedLang') || 'ml';
            let message = messageKey;
            
            if (typeof words !== 'undefined' && words[messageKey] && words[messageKey][currentLang]) {
                message = words[messageKey][currentLang];
            }
            
            document.getElementById('popupMessage').innerText = message;
            const titleEl = document.getElementById('popupTitle');
            const iconEl = document.getElementById('popupIcon');
            
            if (isSuccess) {
                titleEl.innerText = (typeof words !== 'undefined' && words['alertSuccessTitle'] && words['alertSuccessTitle'][currentLang]) ? words['alertSuccessTitle'][currentLang] : "Success";
                iconEl.innerHTML = '<i class="fa-solid fa-circle-check text-green-400"></i>';
            } else {
                titleEl.innerText = (typeof words !== 'undefined' && words['alertWarningTitle'] && words['alertWarningTitle'][currentLang]) ? words['alertWarningTitle'][currentLang] : "Warning";
                iconEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-amber-400"></i>';
            }

            const popup = document.getElementById('customPopup');
            popup.classList.remove('hidden');
            popup.classList.add('flex');
        }

        window.closeCustomPopup = function() {
            const popup = document.getElementById('customPopup');
            popup.classList.remove('flex');
            popup.classList.add('hidden');
        }

        window.openForgotModal = function() {
            document.getElementById('recoveryResult').classList.add('hidden');
            document.getElementById('recoveryPhone').value = '';
            document.getElementById('recoveryPin').value = '';
            document.getElementById('forgotModal').classList.remove('hidden');
            document.getElementById('forgotModal').classList.add('flex');
        }

        window.closeForgotModal = function() {
            document.getElementById('forgotModal').classList.remove('flex');
            document.getElementById('forgotModal').classList.add('hidden');
        }

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            databaseURL: "https://mesthri-app-default-rtdb.firebaseio.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d",
            measurementId: "G-J9Y5TW9D7T"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const eyeIcon = document.getElementById("eyeIcon");
        const btnLogin = document.getElementById("btnLogin");

        if (togglePassword && passwordInput && eyeIcon) {
            togglePassword.addEventListener("click", () => {
                const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
                passwordInput.setAttribute("type", type);
                
                if (type === "text") {
                    eyeIcon.classList.remove("fa-eye");
                    eyeIcon.classList.add("fa-eye-slash");
                    togglePassword.style.color = "#fbbf24";
                } else {
                    eyeIcon.classList.remove("fa-eye-slash");
                    eyeIcon.classList.add("fa-eye");
                    togglePassword.style.color = "#94a3b8";
                }
            });
        }
                
        // പാസ്‌വേർഡ് റിക്കവറി പരിശോധന
        window.verifyAndRecover = async function() {
            const phone = document.getElementById('recoveryPhone').value.trim();
            const pin = document.getElementById('recoveryPin').value.trim();
            const resultBox = document.getElementById('recoveryResult');
            const recoveredInfo = document.getElementById('recoveredInfo');

            if (!phone || phone.length !== 10) {
                return showCustomAlert('alertInvalidPhone', false);
            }

            try {
                const dbRef = ref(db);
                const snapshot = await get(child(dbRef, 'users'));
                
                if (snapshot.exists()) {
                    let found = false;
                    snapshot.forEach((childSnapshot) => {
                        const userData = childSnapshot.val();
                        if (userData.phone === phone) {
                            if (userData.securityPin && userData.securityPin.trim() !== "" && userData.securityPin !== pin) {
                                return;
                            }
                            
                            found = true;
                            recoveredInfo.innerHTML = `പേര്: ${userData.username || childSnapshot.key}<br>പാസ്‌വേർഡ്: ${userData.password}`;
                            resultBox.classList.remove('hidden');
                        }
                    });

                    if (!found) {
                        showCustomAlert('alertUserNotFound', false);
                    }
                } else {
                    showCustomAlert('alertUserNotFound', false);
                }
            } catch (error) {
                console.error(error);
                showCustomAlert('alertError', false);
            }
        };

        if (btnLogin) {
            btnLogin.addEventListener("click", async () => {
                const user = usernameInput.value.trim().toLowerCase();
                const pass = passwordInput.value.trim();

                if (!user || !pass) {
                    return showCustomAlert('alertFillAll', false);
                }

                try {
                    const snapshot = await get(child(ref(db), 'users/' + user));
                    if (snapshot.exists()) {
                        const userData = snapshot.val();
                        if (userData.password === pass) {
                            localStorage.setItem('userName', user);
                            window.location.href = "dashboard.html";
                        } else {
                            showCustomAlert('alertWrongPass', false);
                        }
                    } else {
                        showCustomAlert('alertUserNotFound', false);
                    }
                } catch (error) {
                    console.error(error);
                    showCustomAlert('alertError', false);
                }
            });
        }
    </script>

    </script>

    <!-- Custom Popup Modal -->
    <div id="customPopup" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-slate-900 border border-amber-500/40 rounded-2xl shadow-2xl w-full max-w-sm p-6 text-center relative">
            <div id="popupIcon" class="text-amber-400 text-3xl mb-2">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 id="popupTitle" class="text-amber-400 font-bold text-lg mb-2">ശ്രദ്ധിക്കുക</h3>
            <p id="popupMessage" class="text-white text-base mb-6 font-medium">മെസ്സേജ് ഇവിടെ വരും</p>
            <button onclick="closeCustomPopup()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-bold py-3 rounded-xl transition-all shadow-lg cursor-pointer">
                OK
            </button>
        </div>
    </div>
</body>
</html>
