<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>മേസ്ത്രി പ്രോ - സുരക്ഷിത പ്രവേശനം</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between relative overflow-x-hidden">

    <!-- 1. Splash Screen (Logo Animation) -->
    <div id="splashScreen" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center transition-opacity duration-700">
        <div class="relative flex flex-col items-center">
            <div class="w-24 h-24 bg-amber-500/10 border-2 border-amber-500 rounded-3xl flex items-center justify-center mb-4 shadow-2xl shadow-amber-500/30 animate-pulse">
                <i class="fa-solid fa-hard-hat text-amber-400 text-4xl"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-wider text-amber-400 mb-1">മേസ്ത്രി പ്രോ</h1>
            <p class="text-xs text-slate-400 tracking-widest uppercase">Smart Site Manager</p>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="flex-grow flex items-center justify-center p-4">
        <div class="text-center">
            <i class="fa-solid fa-helmet-safety text-amber-400 text-5xl mb-3 animate-bounce"></i>
            <h2 class="text-xl font-bold text-amber-400">മേസ്ത്രി പ്രോ</h2>
            <p class="text-sm text-slate-400">സുരക്ഷിത ഡാഷ്‌ബോർഡിലേക്ക് സ്വാഗതം...</p>
        </div>
    </div>

    <!-- 2. Modern PIN Lock Modal -->
    <div id="pinLockModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 z-40">
        <div class="bg-gradient-to-b from-slate-900 to-slate-950 border border-amber-500/30 rounded-3xl p-6 w-full max-w-sm text-center shadow-2xl relative overflow-hidden">
            <div class="w-16 h-16 bg-amber-500/10 border border-amber-500/20 rounded-2xl flex items-center justify-center mx-auto mb-4 text-amber-400 text-2xl">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h3 class="text-xl font-bold text-white mb-1">മേസ്ത്രി പ്രവേശനം</h3>
            <p class="text-xs text-slate-400 mb-6">തുടരുന്നതിനായി നിങ്ങളുടെ 4 അക്ക പിൻ നൽകുക</p>
            
            <div class="relative mb-6">
                <input type="password" id="appPinInput" maxlength="6" class="w-full bg-slate-900/80 border border-slate-700/80 rounded-2xl px-4 py-3.5 text-center text-3xl tracking-[1em] text-amber-400 placeholder-slate-600 focus:outline-none focus:border-amber-500 transition" placeholder="••••">
            </div>

            <button type="button" id="btnVerifyPin" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3.5 rounded-2xl transition shadow-lg shadow-amber-500/20 mb-3">
                അൺലോക്ക് ചെയ്യുക
            </button>

            <!-- Forgot / Reset PIN & Full Login Switch -->
            <div class="flex justify-between items-center text-xs mt-2 px-1">
                <button type="button" id="btnResetPinQuick" class="text-slate-400 hover:text-amber-400 underline transition">
                    പിൻ മാറ്റുക (Reset to 1234)
                </button>
                <button type="button" id="btnSwitchLogin" class="text-amber-400 hover:underline transition">
                    മറ്റൊരു അക്കൗണ്ട്? (Login)
                </button>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const splashScreen = document.getElementById("splashScreen");
            const pinModal = document.getElementById("pinLockModal");
            const pinInput = document.getElementById("appPinInput");
            const btnVerifyPin = document.getElementById("btnVerifyPin");
            const btnResetPinQuick = document.getElementById("btnResetPinQuick");
            const btnSwitchLogin = document.getElementById("btnSwitchLogin");

            // Hide splash screen after 1.2 seconds
            setTimeout(() => {
                if (splashScreen) {
                    splashScreen.style.opacity = "0";
                    setTimeout(() => {
                        splashScreen.style.display = "none";
                    }, 500);
                }
            }, 1200);

            // Quick Reset PIN
            if (btnResetPinQuick) {
                btnResetPinQuick.onclick = () => {
                    localStorage.setItem("appPin", "1234");
                    alert("പിൻ നമ്പർ വിജയകരമായി '1234' എന്ന് മാറ്റിയിരിക്കുന്നു!");
                    if (pinInput) pinInput.value = "1234";
                };
            }

            // Switch to full login page if user wants to change account
            if (btnSwitchLogin) {
                btnSwitchLogin.onclick = () => {
                    window.location.href = "login_full.html"; // നിങ്ങളുടെ പഴയ ഫുൾ ലോഗിൻ പേജ് ഫയൽ നെയിം ഇവിടെ നൽകാം
                };
            }

            // Verify PIN and enter Dashboard while maintaining Owner/Meshtri context
            const verifyAndEnter = () => {
                const inputVal = pinInput.value.trim();
                const savedPin = localStorage.getItem("appPin") || "1234";

                if (inputVal === "1234" || inputVal === savedPin) {
                    pinModal.classList.add("hidden");
                    pinModal.classList.remove("flex");
                    
                    // മേസ്ത്രി/ഓണർ പ്രൊഫൈൽ സെറ്റ് ചെയ്തിട്ടുണ്ടോ എന്ന് പരിശോധിക്കുന്നു
                    const savedUser = localStorage.getItem('userName');
                    
                    if (!savedUser) {
                        // ആദ്യമായിട്ടാണ് വരുന്നതെങ്കിൽ ലോഗിൻ പേജിലേക്ക് വിടാം
                        window.location.href = "login_full.html";
                    } else {
                        // നിലവിലെ മേസ്ത്രി പ്രൊഫൈൽ നിലനിർത്തിക്കൊണ്ട് നേരെ ഡാഷ്‌ബോർഡിലേക്ക്
                        window.location.href = "dashboard.html";
                    }
                } else {
                    alert("നൽകിയ പിൻ നമ്പർ തെറ്റാണ്!");
                    pinInput.value = "";
                }
            };

            if (btnVerifyPin) {
                btnVerifyPin.addEventListener("click", verifyAndEnter);
            }
            if (pinInput) {
                pinInput.addEventListener("keypress", (e) => {
                    if (e.key === "Enter") verifyAndEnter();
                });
            }
        });
    </script>
</body>
</html>
