<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ലോഗിൻ / രജിസ്ട്രേഷൻ - മേസ്തിരി ആപ്പ്</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Manjari', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-blue-800 to-cyan-900 min-h-screen flex items-center justify-center p-3 sm:p-4">

    <!-- ആപ്പ് തുറക്കുമ്പോൾ ആദ്യം കാണുന്ന സ്പ്ലാഷ് സ്ക്രീൻ (Splash Screen) -->
    <div id="splash-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom right, #311059, #1e1b4b); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s ease;">
        <img src="icon.png" alt="Mesthri Pro Logo" style="width: 180px; height: 180px; border-radius: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 20px;">
        <h1 style="color: #ffcc00; font-size: 32px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.3);">മേസ്തിരി പ്രോ</h1>
    </div>

    <!-- ബോക്സിന്റെ വലിപ്പം മൊബൈൽ സ്ക്രീനിൽ നന്നായി കാണാൻ w-full ഉം max-w-lg ഉം നൽകിയിരിക്കുന്നു -->
    <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-2xl w-full max-w-lg border-t-4 border-blue-500">
        <!-- ഹെഡിംഗ് -->
        <div class="text-center mb-6">
            <h1 class="text-3xl sm:text-4xl font-black text-blue-900">മേസ്തിരി ആപ്പ്</h1>
            <p id="formTitle" class="text-blue-500 font-bold text-lg sm:text-xl mt-2">ലോഗിൻ ചെയ്യുക</p>
        </div>

        <!-- ലോഗിൻ / രജിസ്ട്രേഷൻ ഫോം -->
        <div class="space-y-4">
            <div>
                <label class="block text-base sm:text-lg font-bold text-gray-700 mb-1">യൂസർനെയിം (പേര്)</label>
                <input type="text" id="username" placeholder="നിങ്ങളുടെ പേര് നൽകുക" 
                       class="w-full p-4 text-lg sm:text-xl border-2 border-gray-200 rounded-xl outline-none focus:border-blue-500">
            </div>

            <!-- രജിസ്റ്റർ ചെയ്യുമ്പോൾ മാത്രം കാണുന്ന ഫോൺ നമ്പർ ബോക്സ് -->
            <div id="phoneDiv" class="hidden">
                <label class="block text-base sm:text-lg font-bold text-gray-700 mb-1">ഫോൺ നമ്പർ</label>
                <input type="tel" id="phone" placeholder="10 അക്ക ഫോൺ നമ്പർ" 
                       class="w-full p-4 text-lg sm:text-xl border-2 border-gray-200 rounded-xl outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-base sm:text-lg font-bold text-gray-700 mb-1">പാസ്‌വേർഡ്</label>
                <div class="relative">
                    <input type="password" id="password" placeholder="കുറഞ്ഞത് 6 അക്കങ്ങൾ നൽകുക" 
                           class="w-full p-4 pr-12 text-lg sm:text-xl border-2 border-gray-200 rounded-xl outline-none focus:border-blue-500">
                    <!-- കണ്ണ് ഐക്കൺ (Password Toggle Eye Button) -->
                    <button type="button" id="togglePassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-blue-600 focus:outline-none">
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
                <p class="text-sm sm:text-base text-gray-500 mt-1 font-bold">ശ്രദ്ധിക്കുക: പാസ്‌വേർഡിൽ കുറഞ്ഞത് 6 അക്കങ്ങളോ അക്ഷരങ്ങളോ ഉണ്ടായിരിക്കണം.</p>
            </div>
        </div>

        <!-- ആക്ഷൻ ബട്ടൺ -->
        <button id="btnAction" class="w-full mt-6 bg-blue-600 text-white p-4 rounded-xl font-black text-xl hover:bg-blue-700 transition shadow-lg">
            ലോഗിൻ ചെയ്യുക
        </button>

        <button id="btnForgot" class="w-full mt-4 text-gray-500 font-bold text-base sm:text-lg hover:text-blue-600 underline block text-center">
            പാസ്‌വേർഡ് മറന്നുപോയോ?
        </button>

        <!-- പേജ് മാറാനുള്ള ലിങ്ക് -->
        <p class="text-center mt-6 text-gray-600 font-bold text-base sm:text-lg">
            <span id="toggleText">അക്കൗണ്ട് ഇല്ലെങ്കിൽ?</span> 
            <a href="#" id="toggleBtn" class="text-blue-600 underline ml-1">പുതിയതായി രജിസ്റ്റർ ചെയ്യുക</a>
        </p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // സ്പ്ലാഷ് സ്ക്രീൻ കുറച്ചു സമയം കാണിച്ച് അപ്രത്യക്ഷമാക്കാനുള്ള കോഡ്
        window.addEventListener('load', function() {
            setTimeout(function() {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(function() {
                        splash.style.display = 'none';
                    }, 500);
                }
            }, 2000); // 2 സെക്കൻഡ് ലോഗോ കാണിക്കും
        });

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isLoginMode = true;

        const toggleBtn = document.getElementById("toggleBtn");
        const formTitle = document.getElementById("formTitle");
        const phoneDiv = document.getElementById("phoneDiv");
        const btnAction = document.getElementById("btnAction");
        const btnForgot = document.getElementById("btnForgot");
        const toggleText = document.getElementById("toggleText");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const eyeIcon = document.getElementById("eyeIcon");

        // പാസ്‌വേർഡ് കാണാനും മറയ്ക്കാനുമുള്ള കോഡ്
        togglePassword.addEventListener("click", () => {
            const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
            passwordInput.setAttribute("type", type);
            
            if (type === "text") {
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.03 10.03 0 012.23-3.38m3.54-2.54A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" />
                `;
            } else {
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                `;
            }
        });

        toggleBtn.addEventListener("click", (e) => {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                formTitle.innerText = "ലോഗിൻ ചെയ്യുക";
                phoneDiv.classList.add("hidden");
                btnAction.innerText = "ലോഗിൻ ചെയ്യുക";
                btnForgot.style.display = "block";
                toggleText.innerText = "അക്കൗണ്ട് ഇല്ലെങ്കിൽ?";
                toggleBtn.innerText = "പുതിയതായി രജിസ്റ്റർ ചെയ്യുക";
            } else {
                formTitle.innerText = "പുതിയ രജിസ്ട്രേഷൻ";
                phoneDiv.classList.remove("hidden");
                btnAction.innerText = "രജിസ്റ്റർ ചെയ്യുക";
                btnForgot.style.display = "none";
                toggleText.innerText = "പഴയ അക്കൗണ്ട് ഉണ്ടോ?";
                toggleBtn.innerText = "ലോഗിൻ ചെയ്യുക";
            }
        });

        btnAction.addEventListener("click", async () => {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const phone = document.getElementById('phone').value.trim();

            if (!user || !pass) {
                return alert("ദയവായി യൂസർനെയിമും പാസ്‌വേർഡും നൽകുക!");
            }

            if (!isLoginMode && pass.length < 6) {
                return alert("പാസ്‌വേർഡിന് കുറഞ്ഞത് 6 അക്കങ്ങളോ അക്ഷരങ്ങളോ ഉണ്ടായിരിക്കണം!");
            }

            if (isLoginMode) {
                signInWithEmailAndPassword(auth, `${user}@mesthri.com`, pass)
                    .then(() => {
                        localStorage.setItem('userName', user);
                        window.location.href = "dashboard.html";
                    })
                    .catch(() => alert("ലോഗിൻ പരാജയപ്പെട്ടു! യൂസർനെയിമോ പാസ്‌വേർഡോ തെറ്റാണ്."));
            } else {
                if (!phone) {
                    return alert("ദയവായി ഫോൺ നമ്പർ കൂടി നൽകുക!");
                }

                try {
                    await createUserWithEmailAndPassword(auth, `${user}@mesthri.com`, pass);
                    
                    await setDoc(doc(db, "users", user), {
                        username: user,
                        phone: phone,
                        password: pass
                    });

                    const webAppUrl = "https://script.google.com/macros/s/AKfycbznevcjdsSz7JgWrKeyaO2gOnxnrd-8-rMMiycABRruqFJQ_hfz4Ac79aLqyvnqf09FXg/exec";
                    fetch(webAppUrl, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ name: user, phone: phone })
                    }).catch(err => console.log(err));

                    alert("വിജയകരമായി രജിസ്റ്റർ ചെയ്തു!");
                    localStorage.setItem('userName', user);
                    window.location.href = "dashboard.html";

                } catch (error) {
                    alert("രജിസ്ട്രേഷൻ പരാജയപ്പെട്ടു! ഈ യൂസർനെയിം നേരത്തെ ഉണ്ടാകാം അല്ലെങ്കിൽ പാസ്‌വേർഡ് ചെറുതാണ്.");
                }
            }
        });

        document.getElementById("btnForgot").addEventListener("click", async () => {
            const user = document.getElementById('username'.trim()).value.trim();
            if(!user) return alert("ആദ്യം യൂസർനെയിം ബോക്സിൽ നിങ്ങളുടെ പേര് നൽകുക!");

            const docRef = doc(db, "users", user);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const data = docSnap.data();
                alert("നിങ്ങളുടെ പാസ്‌വേർഡ്: " + data.password);
            } else {
                alert("ഈ യൂസർനെയിം നിലവിലില്ല!");
            }
        });
    </script>
</body>
</html>
