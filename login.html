<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ലോഗിൻ - മേസ്ത്രി പ്രോ</title>

    <!-- Eruda കോൺസോൾ ടൂൾ (ഫോണിലെ എററുകൾ പരിശോധിക്കാൻ) -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    
    <!-- Tailwind CSS & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Changa+One&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- പിൻ ലോക്ക് മോഡൽ -->
    <div id="pinLockModal" class="fixed inset-0 bg-slate-900/90 z-50 flex flex-col items-center justify-center p-4">
        <div class="bg-slate-800 p-6 rounded-2xl shadow-xl w-full max-w-sm text-center border border-slate-700">
            <h2 class="text-xl font-bold mb-2 text-white">സുരക്ഷിത ലോഗിൻ</h2>
            <p class="text-slate-400 text-sm mb-4">തുടരാൻ നിങ്ങളുടെ 4 അക്ക പിൻ നമ്പർ നൽകുക</p>
            <input type="password" id="appPinInput" maxlength="4" placeholder="....type pin" class="w-full bg-slate-900 border border-slate-700 text-white text-center text-2xl tracking-widest rounded-xl p-3 mb-4 focus:outline-none focus:border-amber-500">
            <button id="btnVerifyPin" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl transition duration-200">തുറക്കുക</button>
        </div>
    </div>

    <!-- പ്രധാന കണ്ടന്റ് ബോക്സ് -->
    <div class="w-full max-w-md bg-slate-800/50 backdrop-blur-md p-6 rounded-3xl border border-slate-700 shadow-2xl">
        
        <!-- ആപ്പ് ലോഗോ / ഹെഡർ പേര് -->
        <div class="flex items-center gap-3 mb-6">
            <div class="w-12 h-12 bg-amber-500 rounded-2xl flex items-center justify-center text-slate-950 text-xl font-bold">
                <i class="fa-solid fa-hard-hat"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white" data-i18n="app_title">മേസ്ത്രി പ്രോ</h1>
                <p class="text-xs text-slate-400" data-i18n="app_subtitle">സ്മാർട്ട് സൈറ്റ് മാനേജർ</p>
            </div>
        </div>

        <!-- ഭാഷ മാറ്റാനുള്ള സെലക്ടർ -->
        <div class="mb-6">
            <label class="block text-xs font-semibold text-slate-400 mb-2">ഭാഷ തിരഞ്ഞെടുക്കുക / Select Language</label>
            <select id="languageSelect" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500">
                <option value="ml">മലയാളം</option>
                <option value="en">English</option>
                <option value="hi">हिन्दी</option>
                <option value="ta">தமிழ்</option>
                <option value="kn">ಕನ್ನಡ</option>
                <option value="bn">বাংলা</option>
                <option value="as">অসমীয়া</option>
            </select>
        </div>

        <h2 class="text-2xl font-bold mb-6 text-white" data-i18n="login_title">ലോഗിൻ ചെയ്യുക</h2>

        <!-- ലോഗിൻ ഫോം -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1" data-i18n="username_label">യൂസർനെയിം (പേര്)</label>
                <input type="text" id="username" placeholder="നിങ്ങളുടെ പേര് നൽകുക" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1" data-i18n="password_label">പാസ്‌വേർഡ്</label>
                <div class="relative">
                    <input type="password" id="password" placeholder="പാസ്‌വേർഡ് നൽകുക" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500 pr-10">
                    <button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
                        <i id="eyeIcon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button id="btnLogin" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3.5 rounded-xl transition duration-200 shadow-lg shadow-amber-500/20" data-i18n="login_btn">ലോഗിൻ ചെയ്യാം</button>

            <div class="flex items-center justify-between pt-2 text-sm">
                <button id="btnForgotOpen" class="text-amber-400 hover:underline" data-i18n="forgot_pass">പാസ്‌വേർഡ് മറന്നുപോയോ?</button>
                <a href="register.html" class="text-slate-400 hover:text-white" data-i18n="register_link">അക്കൗണ്ട് ഇല്ലെങ്കിൽ? രജിസ്റ്റർ ചെയ്യുക</a>
            </div>
        </div>
    </div>

    <!-- പാസ്‌വേർഡ് വീണ്ടെടുക്കൽ മോഡൽ -->
    <div id="forgotModal" class="fixed inset-0 bg-slate-900/90 z-50 hidden flex flex-col items-center justify-center p-4">
        <div class="bg-slate-800 p-6 rounded-2xl shadow-xl w-full max-w-sm border border-slate-700">
            <h3 class="text-lg font-bold mb-2 text-white" data-i18n="forgot_modal_title">പാസ്‌വേർഡ് വീണ്ടെടുക്കുക</h3>
            <p class="text-slate-400 text-xs mb-4" data-i18n="forgot_modal_desc">നിങ്ങൾ രജിസ്റ്റർ ചെയ്ത ഫോൺ നമ്പർ നൽകുക.</p>
            <input type="tel" id="forgotPhone" placeholder="ഫോൺ നമ്പർ (10 അക്കം)" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3 text-sm mb-4 focus:outline-none focus:border-amber-500">
            <div class="flex gap-2">
                <button id="btnForgotClose" class="w-1/2 bg-slate-700 hover:bg-slate-600 text-white py-2.5 rounded-xl text-sm" data-i18n="close_btn">അടയ്ക്കുക</button>
                <button id="btnGetDetails" class="w-1/2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2.5 rounded-xl text-sm" data-i18n="verify_btn">പരിശോധിക്കുക</button>
            </div>
        </div>
    </div>

    <!-- ലാംഗ്വേജ് ഡാറ്റയും പ്രധാന ജാവാസ്ക്രിപ്റ്റ് കോഡും -->

        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const translations = {

                verify_btn: "Verify"
            },
            hi: {
                app_title: "मेस्त्री प्रो",
                app_subtitle: "स्मार्ट साइट मैनेजर",
                login_title: "लॉगिन करें",
                username_label: "यूजरनेम (नाम)",
                password_label: "पासवर्ड",
                login_btn: "लॉगिन करें",
                forgot_pass: "पासवर्ड भूल गए?",
                register_link: "खाता नहीं है? रजिस्टर करें",
                forgot_modal_title: "पासवर्ड पुनर्प्राप्त करें",
                forgot_modal_desc: "अपना पंजीकृत फोन नंबर दर्ज करें।",
                close_btn: "बंद करें",
                verify_btn: "जांच करें"
            },
            ta: {
                app_title: "மேஸ்திரி ப்ரோ",
                app_subtitle: "ஸ்மார்ட் சைட் மேலாளர்",
                login_title: "உள்நுழைக",
                username_label: "பயனர் பெயர்",

                forgot_pass: "கடவுச்சொல் மறந்துவிட்டதா?",
                register_link: "கணக்கு இல்லையா? பதிவு செய்க",
                forgot_modal_title: "கடவுச்சொல்லை மீட்டெடுக்க",
                forgot_modal_desc: "உங்கள் பதிவு செய்யப்பட்ட தொலைபேசி எண்ணை உள்ளிடவும்.",

            },

                forgot_modal_title: "ಪಾಸ್‌ವರ್ಡ್ ಮರುಪಡೆಯಿರಿ",
                forgot_modal_desc: "ನಿಮ್ಮ ನೋಂದಾಯಿತ ಫೋನ್ ಸಂಖ್ಯೆಯನ್ನು ನಮೂದಿಸಿ.",
                close_btn: "ಮುಚ್ಚಿ",

            },
            bn: {

                forgot_pass: "পাসওয়ার্ড ভুলে গেছেন?",
                register_link: "অ্যাকাউন্ট নেই? নিবন্ধন করুন",
                forgot_modal_title: "পাসওয়ার্ড উদ্ধার করুন",
                forgot_modal_desc: "আপনার নিবন্ধিত ফোন নম্বর লিখুন।",
                close_btn: "বন্ধ করুন",
                verify_btn: "যাচাই করুন"
            },
            as: {
                app_title: "মেস্ত্ৰী প্ৰ’",
                app_subtitle: "স্মাৰ্ট ছাইট মেনেজাৰ",
                login_title: "লগইন কৰক",
                username_label: "ব্যৱহাৰকাৰী নাম",
                password_label: "পাছৱৰ্ড",
                login_btn: "লগইন কৰক",
                forgot_pass: "পাছৱৰ্ড পাহৰিলে?",
                register_link: "একাউণ্ট নাই নেকি? পঞ্জীয়ন কৰক",
                forgot_modal_title: "পাছৱৰ্ড উদ্ধাৰ কৰক",
                forgot_modal_desc: "আপোনাৰ পঞ্জীভুক্ত ফোন নম্বৰটো দিয়ক।",
                close_btn: "বন্ধ কৰক",
                verify_btn: "যাচাই কৰক"
            }
        };

        // ഭാഷ മാറ്റുന്ന ഫങ്ഷൻ
        window.switchLanguage = function(lang) {
            localStorage.setItem('selectedLang', lang);
            const elements = document.querySelectorAll("[data-i18n]");
            elements.forEach(el => {
                const key = el.getAttribute("data-i18n");
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
        };

        // പേജ് ലോഡ് ചെയ്യുമ്പോൾ ഭാഷയും പിൻ ലോക്കും സെറ്റ് ചെയ്യാൻ
        document.addEventListener("DOMContentLoaded", () => {
            try {
                const savedLang = localStorage.getItem('selectedLang') || 'ml';
                const langSelect = document.getElementById("languageSelect");
                if (langSelect) {
                    langSelect.value = savedLang;
                    langSelect.addEventListener("change", (e) => {
                        window.switchLanguage(e.target.value);
                    });
                }
                window.switchLanguage(savedLang);
            } catch (e) {
                console.error("Language switch error:", e);
            }

            const pinModal = document.getElementById("pinLockModal");
            const pinInput = document.getElementById("appPinInput");
            const btnVerifyPin = document.getElementById("btnVerifyPin");
            const savedPin = localStorage.getItem("appPin") || "1234";

            if (btnVerifyPin && pinModal) {
                btnVerifyPin.addEventListener("click", () => {
                    if (pinInput.value.trim() === savedPin) {
                        pinModal.classList.add("hidden");
                        pinModal.classList.remove("flex");
                    } else {
                        alert("നൽകിയ പിൻ നമ്പർ തെറ്റാണ്!");
                        pinInput.value = "";
                    }
                });
            }
        });

        // Firebase കോൺഫിഗറേഷൻ & ലോഗിൻ ഫങ്ഷനുകൾ
        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            databaseURL: "https://mesthri-app-default-rtdb.firebaseio.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d",
            measurementId: "G-J9Y5TW9D7T"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const togglePasswordBtn = document.getElementById("togglePassword");
        const eyeIcon = document.getElementById("eyeIcon");
        const btnLogin = document.getElementById("btnLogin");

        const btnForgotOpen = document.getElementById("btnForgotOpen");
        const forgotModal = document.getElementById("forgotModal");
        const btnForgotClose = document.getElementById("btnForgotClose");

        if (togglePasswordBtn && passwordInput && eyeIcon) {
            togglePasswordBtn.addEventListener("click", () => {
                const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
                passwordInput.setAttribute("type", type);
                eyeIcon.classList.toggle("fa-eye");
                eyeIcon.classList.toggle("fa-eye-slash");
            });
        }

        if (btnForgotOpen && forgotModal) {
            btnForgotOpen.addEventListener("click", () => {
                forgotModal.classList.remove("hidden");
                forgotModal.classList.add("flex");
            });
        }

        if (btnForgotClose && forgotModal) {
            btnForgotClose.addEventListener("click", () => {
                forgotModal.classList.add("hidden");
                forgotModal.classList.remove("flex");
            });
        }

        if (btnLogin) {
            btnLogin.addEventListener("click", async () => {
                const userInput = usernameInput.value.trim();
                const passInput = passwordInput.value.trim();

                if (!userInput || !passInput) {
                    alert('ദയവായി യൂസർനെയിമും പാസ്‌വേർഡും നൽകുക!');
                    return;
                }

                try {
                    const usersRef = ref(db, 'users');
                    const snapshot = await get(usersRef);

                    if (snapshot.exists()) {
                        let matchedUserData = null;

                        snapshot.forEach((childSnapshot) => {
                            const data = childSnapshot.val();
                            const dbUsername = (data.username || childSnapshot.key || "").toString().trim();

                            if (dbUsername.toLowerCase() === userInput.toLowerCase()) {
                                matchedUserData = data;
                            }
                        });

                        if (matchedUserData) {
                            if (matchedUserData.password === passInput) {
                                alert('ലോഗിൻ വിജയകരമാണ്!');
                                localStorage.setItem('userName', userInput);
                                setTimeout(() => {
                                    window.location.href = "dashboard.html";
                                }, 1000);
                            } else {
                                alert('നൽകിയ പാസ്‌വേർഡ് തെറ്റാണ്!');
                            }
                        } else {
                            alert('ഈ പേരിൽ അക്കൗണ്ട് കണ്ടെത്താനായില്ല!');
                        }
                    } else {
                        alert('അക്കൗണ്ടുകൾ ലഭ്യമല്ല.');
                    }
                } catch (err) {
                    console.error(err);
                    alert("Firebase Error: " + err.message);
                }
            });
        }
    </script>
</body>
</html>
