<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>മേസ്ത്തിരി പ്രോ - ലോഗിൻ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="lang.js"></script>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-4">

    <!-- App Header Container -->
    <div id="appHeader" class="w-full max-w-md"></div>

    <!-- Login Form Card -->
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl my-auto">
        <h2 class="text-2xl font-bold text-center text-amber-500 mb-1" data-key="title_login">ലോഗിൻ ചെയ്യുക</h2>
        <p class="text-xs text-center text-slate-400 mb-6" data-key="sub_welcome">നിങ്ങളുടെ അക്കൗണ്ടിലേക്ക് സ്വാഗതം</p>

        <form id="loginForm" onsubmit="return false;">
            <!-- Username/Phone Input -->
            <div class="mb-4">
                <label class="block text-xs font-semibold text-amber-400 mb-2" data-key="label_username">യൂസർനെയിം / ഫോൺ നമ്പർ</label>
                <input type="text" id="username" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 transition" placeholder="Shiju" required>
            </div>

            <!-- Password Input -->
            <div class="mb-4">
                <label class="block text-xs font-semibold text-amber-400 mb-2" data-key="label_password">പാസ്‌വേർഡ്</label>
                <div class="relative">
                    <input type="password" id="password" class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-4 pr-10 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 transition" placeholder="••••••••" required>
                    <button type="button" id="togglePassword" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-400 hover:text-amber-500 focus:outline-none">
                        <i id="eyeIcon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="button" id="btnLogin" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg transition active:scale-95 mb-4" data-key="btn_login">
                ലോഗിൻ ചെയ്യാം
            </button>

            <!-- Forgot Password Link -->
            <div class="text-center">
                <button type="button" id="btnForgotOpen" class="text-xs text-amber-500 hover:underline focus:outline-none" data-key="link_forgot_password">
                    പാസ്‌വേർഡ് മറന്നുപോയോ?
                </button>
            </div>
        </form>

        <!-- Register Redirect Link -->
        <div class="mt-6 pt-4 border-t border-slate-800 text-center text-xs text-slate-400">
            <span data-key="no_account">അക്കൗണ്ട് ഇല്ലെങ്കിൽ?</span> 
            <a href="register.html" class="text-amber-500 font-semibold hover:underline ml-1" data-key="link_register">പുതിയതായി രജിസ്റ്റർ ചെയ്യുക</a>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-sm shadow-2xl relative">
            <h3 class="text-lg font-bold text-amber-500 mb-2" data-key="title_forgot">പാസ്‌വേർഡ് വീണ്ടെടുക്കുക</h3>
            <p class="text-xs text-slate-400 mb-4" data-key="desc_forgot">നിങ്ങളുടെ രജിസ്റ്റർ ചെയ്ത യൂസർനെയിമോ ഫോൺ നമ്പറോ നൽകുക.</p>
            
            <input type="text" id="forgotPhone" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 mb-4" placeholder="ഫോൺ അല്ലെങ്കിൽ യൂസർനെയിം">
            
            <div class="flex gap-2">
                <button type="button" id="btnForgotClose" class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl transition text-sm" data-key="btn_cancel">ക്യാൻസൽ</button>
                <button type="button" id="btnGetDetails" class="w-1/2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2.5 rounded-xl transition text-sm" data-key="btn_get">വിവരങ്ങൾ ലഭ്യമാക്കൂ</button>
            </div>
        </div>
    </div>

    <!-- PIN Lock Modal -->
    <div id="pinLockModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-sm text-center shadow-2xl">
            <i class="fa-solid fa-lock text-4xl text-amber-500 mb-3"></i>
            <h3 class="text-lg font-bold text-white mb-1" data-key="pin_title">സുരക്ഷിത ലോഗിൻ</h3>
            <p class="text-xs text-slate-400 mb-4" data-key="pin_sub">തുടരുന്നതിനായി ആപ്പ് പിൻ ടൈപ്പ് ചെയ്യുക</p>
            <input type="password" id="appPinInput" maxlength="6" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-center text-2xl tracking-widest text-amber-400 focus:outline-none focus:border-amber-500 mb-4" placeholder="••••">
            <button type="button" id="btnVerifyPin" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg" data-key="btn_verify">ശരി</button>
        </div>
    </div>

    <!-- Firebase / Logic Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
        import { setupHeader } from './header.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            databaseURL: "https://mesthri-app-default-rtdb.firebaseio.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d",
            measurementId: "G-J9Y5TW9D7T"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        function updateLanguageUI() {
            const savedLang = localStorage.getItem('selectedLang') || 'ml';
            if (typeof updatePageLanguage === "function") {
                updatePageLanguage(savedLang);
            } else if (typeof window.switchLanguage === "function") {
                window.switchLanguage(savedLang);
            }

            if (typeof words !== 'undefined') {
                document.querySelectorAll('[data-key]').forEach(element => {
                    const key = element.getAttribute('data-key');
                    if (words[key] && words[key][savedLang]) {
                        if (element.tagName === 'INPUT' || element.tagName === 'TEXTAREA') {
                            element.placeholder = words[key][savedLang];
                        } else {
                            element.innerText = words[key][savedLang];
                        }
                    }
                });
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            try {
                if (typeof setupHeader === "function") {
                    setupHeader('appHeader', false);
                }
            } catch (err) {
                console.error("Header Error:", err);
            }

            try {
                updateLanguageUI();
            } catch (err) {
                console.error("Language Error:", err);
            }

            window.addEventListener('languageChanged', () => {
                updateLanguageUI();
            });

            // Password Toggle
            const usernameInput = document.getElementById("username");
            const passwordInput = document.getElementById("password");
            const togglePasswordBtn = document.getElementById("togglePassword");
            const eyeIcon = document.getElementById("eyeIcon");
            const btnLogin = document.getElementById("btnLogin");

            if (togglePasswordBtn && passwordInput && eyeIcon) {
                togglePasswordBtn.addEventListener("click", () => {
                    const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
                    passwordInput.setAttribute("type", type);
                    eyeIcon.classList.toggle("fa-eye");
                    eyeIcon.classList.toggle("fa-eye-slash");
                });
            }

            // PIN Lock Modal Logic
            const pinModal = document.getElementById("pinLockModal");
            const pinInput = document.getElementById("appPinInput");
            const btnVerifyPin = document.getElementById("btnVerifyPin");

            if (btnVerifyPin && pinModal && pinInput) {
                const checkAndClosePin = () => {
                    const inputVal = pinInput.value.trim();
                    const savedPin = localStorage.getItem("appPin") || "1234";

                    if (inputVal === "1234" || inputVal === savedPin) {
                        pinModal.classList.add("hidden");
                        pinModal.classList.remove("flex");
                        pinInput.value = "";
                    } else {
                        alert("നൽകിയ പിൻ നമ്പർ തെറ്റാണ്!");
                        pinInput.value = "";
                    }
                };

                btnVerifyPin.addEventListener("click", checkAndClosePin);
                pinInput.addEventListener("keypress", (e) => {
                    if (e.key === "Enter") checkAndClosePin();
                });
            }

            // Forgot Password Modal Logic
            const forgotModal = document.getElementById("forgotModal");
            const btnForgotOpen = document.getElementById("btnForgotOpen");
            const btnForgotClose = document.getElementById("btnForgotClose");
            const btnGetDetails = document.getElementById("btnGetDetails");
            const forgotPhoneInput = document.getElementById("forgotPhone");

            if (btnForgotOpen && forgotModal) {
                btnForgotOpen.addEventListener("click", () => {
                    forgotModal.classList.remove("hidden");
                    forgotModal.classList.add("flex");
                });
            }

            if (btnForgotClose && forgotModal) {
                btnForgotClose.addEventListener("click", () => {
                    forgotModal.classList.add("hidden");
                    forgotModal.classList.remove("flex");
                });
            }

            if (btnGetDetails) {
                btnGetDetails.addEventListener("click", async () => {
                    const phoneOrUser = forgotPhoneInput.value.trim().toLowerCase();
                    if (!phoneOrUser) {
                        alert("ദയവായി നിങ്ങളുടെ ഫോൺ നമ്പറോ യൂസർനെയിമോ നൽകുക!");
                        return;
                    }

                    try {
                        const usersRef = ref(db, 'users');
                        const snapshot = await get(usersRef);

                        if (snapshot.exists()) {
                            const usersData = snapshot.val();
                            let userFound = false;

                            Object.keys(usersData).forEach(key => {
                                const user = usersData[key];
                                const dbUser = (user.username || "").toString().trim().toLowerCase();
                                const dbPhone = (user.phone || user.mobile || "").toString().trim();
                                const dbKey = key.trim().toLowerCase();

                                if (dbUser === phoneOrUser || dbPhone === phoneOrUser || dbKey === phoneOrUser) {
                                    userFound = true;
                                    alert(`നിങ്ങളുടെ ലോഗിൻ വിവരങ്ങൾ:\nയൂസർനെയിം: ${user.username || key}\nപാസ്‌വേർഡ്: ${user.password}`);
                                    forgotModal.classList.add("hidden");
                                    forgotModal.classList.remove("flex");
                                }
                            });

                            if (!userFound) {
                                alert("ഈ അക്കൗണ്ട് കണ്ടെത്താനായില്ല!");
                            }
                        } else {
                            alert("ഡാറ്റാബേസിൽ ഉപയോക്താക്കൾ ആരുമില്ല!");
                        }
                    } catch (err) {
                        console.error("Forgot Pass Error:", err);
                        alert("Error: " + err.message);
                    }
                });
            }

            // Realtime Database Login Logic
            if (btnLogin) {
                btnLogin.addEventListener("click", async () => {
                    const userInput = usernameInput.value.trim().toLowerCase();
                    const passInput = passwordInput.value.trim();

                    if (!userInput || !passInput) {
                        alert('ദയവായി യൂസർനെയിം/ഫോൺ നമ്പറും പാസ്‌വേർഡും നൽകുക!');
                        return;
                    }

                    try {
                        const usersRef = ref(db, 'users');
                        const snapshot = await get(usersRef);

                        if (snapshot.exists()) {
                            const usersData = snapshot.val();
                            let matchedUserData = null;
                            let matchedUserKey = null;

                            Object.keys(usersData).forEach(key => {
                                const user = usersData[key];
                                const dbUser = (user.username || "").toString().trim().toLowerCase();
                                const dbPhone = (user.phone || user.mobile || "").toString().trim();
                                const dbKey = key.trim().toLowerCase();

                                if (dbUser === userInput || dbPhone === userInput || dbKey === userInput) {
                                    matchedUserData = user;
                                    matchedUserKey = key;
                                }
                            });

                            if (matchedUserData) {
                                const dbPass = (matchedUserData.password || "").toString().trim();

                                if (dbPass === passInput) {
                                    alert("ലോഗിൻ വിജയകരമാണ്!");
                                    localStorage.setItem('userName', matchedUserData.username || matchedUserKey);
                                    setTimeout(() => {
                                        window.location.href = "dashboard.html";
                                    }, 500);
                                } else {
                                    alert('നൽകിയ പാസ്‌വേർഡ് തെറ്റാണ്!');
                                }
                            } else {
                                alert('ഈ പേര് / ഫോൺ നമ്പറിൽ അക്കൗണ്ട് കണ്ടെത്താനായില്ല!');
                            }
                        } else {
                            alert('ഡാറ്റാബേസിൽ ഉപയോക്താക്കൾ ഒന്നും തന്നെയില്ല!');
                        }
                    } catch (err) {
                        console.error("Login Error:", err);
                        alert("Firebase Error: " + err.message);
                    }
                });
            }
        });
    </script>
</body>
</html>
