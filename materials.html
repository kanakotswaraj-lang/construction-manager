<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700;900&display=swap" rel="stylesheet">
    
    <title>മെറ്റീരിയൽസ് മാനേജ്മെന്റ്</title>
    <style>
        body { font-family: 'Manjari', sans-serif; }
        
        input, select {
            border: 2px solid rgba(51, 65, 85, 1);
            transition: all 0.3s ease;
            background-color: #1e293b !important;
        }

        input:focus, select:focus {
            border-color: #22d3ee !important; 
            outline: none;
            box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.2); 
        }

        .mic-btn {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            color: #94a3b8; background: transparent;
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: none;
            display: flex; align-items: center; justify-content: center;
            z-index: 20;
            transition: all 0.2s ease;
        }
        .mic-btn:hover {
            background: rgba(34, 211, 238, 0.1);
            color: #22d3ee;
        }

        @media print {
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-[#050B18] text-white min-h-screen pb-12 p-4 font-sans">
    <div class="max-w-md mx-auto space-y-4">
        
        <!-- ഹെഡർ (റന്റൽ പേജിലേതുപോലെ) -->
        <div id="appHeader" class="w-full flex justify-center"></div>

        <div class="text-center w-full">
            <span id="loggedInMeshtri" class="block w-full py-3 rounded-2xl text-sm font-black text-cyan-300 bg-cyan-500/10 border border-cyan-400/40">സ്വാഗതം...</span>
        </div>

        <!-- പേജ് തലക്കെട്ടും ഡാഷ്‌ബോർഡ് ബട്ടണും -->
        <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl flex justify-between items-center shadow-xl backdrop-blur-sm">
            <h1 class="text-lg font-black text-white">മെറ്റീരിയൽസ് & സ്റ്റോക്ക്</h1>
            <a href="dashboard.html" class="px-3 py-1.5 bg-slate-800 border border-amber-400/40 text-amber-400 rounded-xl text-xs font-bold">← ഡാഷ്‌ബോർഡ്</a>
        </div>
        
        <!-- ആകെ തുക കാണിക്കുന്ന ബോക്സ് -->
        <div class="bg-gradient-to-br from-slate-900 to-slate-800 text-white p-6 rounded-3xl shadow-lg text-center border border-slate-700">
            <p class="text-[11px] opacity-75 uppercase tracking-widest font-black text-slate-300">ആകെ മെറ്റീരിയൽ ചെലവ്</p>
            <h2 id="totalMaterialCost" class="text-3xl font-black mt-1 text-emerald-400">₹0</h2>
        </div>

        <!-- സപ്ലയർ/കടകളുടെ ലിസ്റ്റ് കാണിക്കുന്ന സെക്ഷൻ (പുതിയത്) -->
        <div class="bg-slate-900/90 p-4 rounded-3xl shadow-xl border border-slate-800 space-y-3 no-print">
            <div class="bg-slate-800/50 border border-slate-700 p-3 rounded-2xl space-y-2">
                <div class="flex justify-between items-center cursor-pointer" onclick="toggleShopList()">
                    <p class="text-xs font-black text-amber-400">🏬 സപ്ലയർ ലിസ്റ്റ് & കോൺടാക്റ്റുകൾ</p>
                    <span id="shopToggleIcon" class="text-xs text-slate-400 font-bold">▼ കാണുക</span>
                </div>
                <div id="shopDirectoryContainer" class="hidden space-y-1.5 pt-2 border-t border-slate-700 max-h-40 overflow-y-auto">
                    <!-- ജാവാസ്ക്രിപ്റ്റ് വഴി കടകൾ ഇവിടെ വരും -->
                </div>
            </div>

            <!-- സൈറ്റ് പേര് വെച്ച് ഫിൽട്ടർ ചെയ്യാനുള്ള ബോക്സ് -->
            <div class="relative">
                <input type="text" id="filterSite" placeholder="🔍 സൈറ്റ് പേര് വെച്ച് തിരയുക..." oninput="filterMaterials()" class="w-full p-3.5 bg-slate-800 rounded-2xl border border-slate-700 text-xs">
            </div>
        </div>
        
        <!-- മെറ്റീരിയൽസ് ഫോം -->
        <div class="bg-slate-900/90 text-white p-6 rounded-3xl shadow-xl border border-slate-800 space-y-4 backdrop-blur-sm no-print">
            <h2 id="formTitle" class="text-sm font-black text-amber-400">പുതിയ മെറ്റീരിയൽ / സ്റ്റോക്ക് ചേർക്കുക</h2>
            
            <div>
                <label class="text-[10px] text-slate-400 font-bold block mb-1">തീയതി</label>
                <input type="date" id="matDate" class="w-full p-3 bg-slate-800 rounded-2xl border border-slate-700 text-xs">
            </div>
            
            <div class="relative">
                <input type="text" id="matName" placeholder="മെറ്റീരിയൽ പേര് (ഉദാ: സിമന്റ് / കമ്പി)" class="w-full p-3.5 pr-12 bg-slate-800 rounded-2xl border border-slate-700 text-xs">
                <button type="button" onclick="startVoiceInputFor('matName')" class="mic-btn"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg></button>
            </div>

            <div class="relative">
                <input type="text" id="matSite" placeholder="സ്ഥലം/സൈറ്റ് പേര് (ഉദാ: Edumba)" class="w-full p-3.5 pr-12 bg-slate-800 rounded-2xl border border-slate-700 text-xs">
                <button type="button" onclick="startVoiceInputFor('matSite')" class="mic-btn"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg></button>
            </div>
            
            <div class="grid grid-cols-2 gap-2">
                <input type="number" id="matQty" placeholder="വാങ്ങിയ അളവ്" class="w-full p-3.5 bg-slate-800 rounded-2xl border border-slate-700 text-xs">
                <input type="number" id="matUsed" placeholder="ഉപയോഗിച്ചത് (ഓപ്ഷണൽ)" class="w-full p-3.5 bg-slate-800 rounded-2xl border border-slate-700 text-xs">
            </div>

            <div class="relative">
                <input type="text" id="matUnit" placeholder="യൂണിറ്റ് (ചാക്ക് / ടൺ / കിലോ / എണ്ണം)" class="w-full p-3.5 pr-12 bg-slate-800 rounded-2xl border border-slate-700 text-xs">
                <button type="button" onclick="startVoiceInputFor('matUnit')" class="mic-btn"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg></button>
            </div>

            <input type="number" id="matPrice" placeholder="ആകെ വില (₹)" class="w-full p-3.5 bg-slate-800 rounded-2xl border border-slate-700 text-xs">
            <input type="tel" id="matPhone" placeholder="സപ്ലയർ ഫോൺ നമ്പർ" class="w-full p-3.5 bg-slate-800 rounded-2xl border border-slate-700 text-xs">

            <div class="flex gap-2">
                <button id="cancelEditBtn" class="hidden flex-1 bg-slate-800 text-slate-300 p-4 rounded-2xl font-black text-xs">ക്ൻസൽ</button>
                <button id="saveBtn" class="flex-1 bg-amber-500 text-slate-950 p-4 rounded-2xl font-black text-xs">വിവരങ്ങൾ സേവ് ചെയ്യുക</button>
            </div>
        </div>

        <!-- PDF ഡൗൺലോഡ് ബട്ടൺ -->
        <button onclick="window.print()" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-2xl font-black transition no-print shadow-lg text-xs">PDF റിപ്പോർട്ട് ഡൗൺലോഡ് ചെയ്യുക</button>

        <!-- ലിസ്റ്റ് വിത്ത് ആക്ഷൻ ബട്ടൺസ് -->
        <section class="space-y-4 pb-12">
            <h2 class="font-black text-white text-base mb-2">സ്റ്റോക്ക് നിലവാരവും വിവരങ്ങളും</h2>
            <div id="materialList" class="space-y-4">
                <!-- ഡാറ്റ ഇവിടെ ഫയർബേസിൽ നിന്നും ലോഡ് ആകും -->
            </div>
        </section>
    </div>

    <!-- മോഡലുകളും ടോസ്റ്റും -->
    <div id="customToast" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-900 border-2 border-amber-400 text-amber-300 px-8 py-4 rounded-3xl shadow-2xl font-black text-base z-50 transition-all duration-300 opacity-0 pointer-events-none text-center scale-100">ഫലം...</div>

    <div id="customConfirmModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl w-full max-w-sm space-y-4 shadow-2xl text-center">
            <h3 id="confirmTitle" class="font-black text-white text-sm">ഉറപ്പാണോ?</h3>
            <div class="flex gap-2">
                <button id="confirmCancelBtn" class="flex-1 bg-slate-800 text-slate-300 py-3 rounded-2xl text-xs font-black">ഇല്ല</button>
                <button id="confirmOkBtn" class="flex-1 bg-red-600 text-white py-3 rounded-2xl text-xs font-black">ഉവ്വ്</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { setupHeader } from './header.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        document.addEventListener("DOMContentLoaded", () => {
            try {
                if (typeof setupHeader === 'function') {
                    setupHeader('appHeader');
                } else {
                    document.getElementById('appHeader').innerHTML = `<h2 class="text-amber-400 font-black text-sm">മേസ്തിരി പ്രോ</h2>`;
                }
            } catch (e) {
                document.getElementById('appHeader').innerHTML = `<h2 class="text-amber-400 font-black text-sm">മേസ്തിരി പ്രോ</h2>`;
            }
        });

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            databaseURL: "https://mesthri-app-default-rtdb.firebaseio.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d",
            measurementId: "G-J9Y5TW9D7T"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const currentMeshtri = localStorage.getItem('userName') || "പൊതുമേസ്തിരി";
        document.getElementById('loggedInMeshtri').innerText = "സ്വാഗതം, " + currentMeshtri;
        document.getElementById('matDate').valueAsDate = new Date();

        let editId = null;

        window.showToast = (message, isSuccess = true) => {
            const toast = document.getElementById('customToast');
            toast.innerText = message;
            toast.className = `fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 px-8 py-4 rounded-3xl shadow-2xl font-black text-base z-50 transition-all duration-300 text-center ${isSuccess ? 'bg-emerald-950 border-2 border-emerald-500 text-emerald-200' : 'bg-red-950 border-2 border-red-500 text-red-200'} opacity-100 scale-105`;
            setTimeout(() => {
                toast.className = "fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-900 border-2 border-amber-400 text-amber-300 px-8 py-4 rounded-3xl shadow-2xl font-black text-base z-50 transition-all duration-300 opacity-0 pointer-events-none text-center scale-100";
            }, 2500);
        };

        window.openCustomConfirm = (title) => new Promise(resolve => {
            const modal = document.getElementById('customConfirmModal');
            document.getElementById('confirmTitle').innerText = title;
            modal.classList.remove('hidden');
            document.getElementById('confirmOkBtn').onclick = () => { modal.classList.add('hidden'); resolve(true); };
            document.getElementById('confirmCancelBtn').onclick = () => { modal.classList.add('hidden'); resolve(false); };
        });

        window.startVoiceInputFor = (fieldId) => {
            const target = document.getElementById(fieldId);
            if (!target) return;

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("നിങ്ങളുടെ ബ്രൗസർ വോയിസ് ഇൻപുട്ട് പിന്തുണയ്ക്കുന്നില്ല.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'ml-IN';
            target.style.borderColor = "#fbbf24"; 
            window.showToast("🎙️ സംസാരിക്കൂ...");

            try { recognition.start(); } catch (err) { console.log(err); }

            recognition.onresult = (e) => {
                target.value = e.results[0][0].transcript;
                target.dispatchEvent(new Event('input'));
                window.showToast("✓ കേട്ടെടുത്തു!");
            };
            recognition.onerror = () => { window.showToast("ശബ്ദം വ്യക്തമല്ല, വീണ്ടും ശ്രമിക്കുക", false); };
            recognition.onend = () => { target.style.borderColor = ""; };
        };

        window.toggleShopList = () => {
            const container = document.getElementById('shopDirectoryContainer');
            const icon = document.getElementById('shopToggleIcon');
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                icon.innerText = "▲ മറയ്ക്കുക";
            } else {
                container.classList.add('hidden');
                icon.innerText = "▼ കാണുക";
            }
        };

        document.getElementById('saveBtn').onclick = async () => {
            const name = document.getElementById('matName').value.trim();
            const site = document.getElementById('matSite').value.trim();
            
            if (!name) return alert("മെറ്റീരിയൽ പേര് നൽകുക!");
            if (!site) return alert("സൈറ്റിന്റെ പേര് നൽകുക!");

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerText = "സേവ് ആകുന്നുണ്ട്...";
            saveBtn.disabled = true;

            const data = {
                meshtriOwner: currentMeshtri,
                date: document.getElementById('matDate').value,
                name: name,
                site: site,
                qty: parseFloat(document.getElementById('matQty').value) || 0,
                used: parseFloat(document.getElementById('matUsed').value) || 0,
                unit: document.getElementById('matUnit').value.trim(),
                price: parseFloat(document.getElementById('matPrice').value) || 0,
                phone: document.getElementById('matPhone').value.trim()
            };

            try {
                if (editId) {
                    await updateDoc(doc(db, "materials", editId), data);
                    editId = null;
                    document.getElementById('formTitle').innerText = "പുതിയ മെറ്റീരിയൽ / സ്റ്റോക്ക് ചേർക്കുക";
                    document.getElementById('cancelEditBtn').classList.add('hidden');
                    saveBtn.innerText = "വിവരങ്ങൾ സേവ് ചെയ്യുക";
                    window.showToast("✏️ വിവരങ്ങൾ അപ്ഡേറ്റ് ചെയ്തു!");
                } else {
                    await addDoc(collection(db, "materials"), data);
                    saveBtn.innerText = "വിവരങ്ങൾ സേവ് ചെയ്യുക";
                    window.showToast("🚀 വിജയകരമായി ചേർത്തു!");
                }

                saveBtn.disabled = false;
                document.getElementById('matName').value = '';
                document.getElementById('matSite').value = '';
                document.getElementById('matQty').value = '';
                document.getElementById('matUsed').value = '';
                document.getElementById('matUnit').value = '';
                document.getElementById('matPrice').value = '';
                document.getElementById('matPhone').value = '';
            } catch (error) {
                saveBtn.disabled = false;
                saveBtn.innerText = "വിവരങ്ങൾ സേവ് ചെയ്യുക";
                window.showToast("തടസ്സമുണ്ടായി, വീണ്ടും ശ്രമിക്കുക.", false);
            }
        };

        document.getElementById('cancelEditBtn').onclick = () => {
            editId = null;
            document.getElementById('formTitle').innerText = "പുതിയ മെറ്റീരിയൽ / സ്റ്റോക്ക് ചേർക്കുക";
            document.getElementById('cancelEditBtn').classList.add('hidden');
            document.getElementById('saveBtn').innerText = "വിവരങ്ങൾ സേവ് ചെയ്യുക";
            document.getElementById('matName').value = '';
            document.getElementById('matSite').value = '';
            document.getElementById('matQty').value = '';
            document.getElementById('matUsed').value = '';
            document.getElementById('matUnit').value = '';
            document.getElementById('matPrice').value = '';
            document.getElementById('matPhone').value = '';
        };

        onSnapshot(query(collection(db, "materials"), orderBy("date", "desc")), (snapshot) => {
            const list = document.getElementById('materialList');
            list.innerHTML = '';
            let totalCost = 0;
            let suppliersMap = new Map();
            
            snapshot.forEach(docSnap => {
                const d = docSnap.data();
                
                if (d.meshtriOwner === currentMeshtri) {
                    totalCost += parseFloat(d.price) || 0;
                    if (d.phone) {
                        suppliersMap.set(d.name + " സപ്ലയർ", d.phone);
                    }
                    
                    const totalQty = parseFloat(d.qty) || 0;
                    const usedQty = parseFloat(d.used) || 0;
                    const remainingQty = totalQty - usedQty;

                    list.innerHTML += `
                        <div class="bg-slate-900/90 text-white p-5 rounded-3xl border border-slate-800 shadow-xl backdrop-blur-sm material-item" data-site="${(d.site || '').toLowerCase()}">
                            <div class="flex justify-between items-start mb-1">
                                <p class="font-black text-white text-base">${d.name}</p>
                                <a href="tel:${d.phone}" class="bg-blue-900/50 text-blue-300 border border-blue-700/50 px-3 py-1 rounded-xl font-black text-xs no-print shadow-sm">📞 വിളിക്കുക</a>
                            </div>
                            <p class="text-xs text-slate-400 font-bold mb-3">
                                ${d.date || ''} ${d.site ? '• സൈറ്റ്: ' + d.site : ''}
                            </p>
                            
                            <div class="bg-slate-800/80 p-3 rounded-2xl mb-3 border border-slate-700">
                                <div class="flex justify-between text-xs font-bold text-slate-400 mb-1">
                                    <span>വാങ്ങിയത്: ${totalQty} ${d.unit || ''}</span>
                                    <span>ഉപയോഗിച്ചത്: ${usedQty} ${d.unit || ''}</span>
                                </div>
                                <div class="text-xs font-black text-emerald-400">
                                    ബാക്കി സ്റ്റോക്ക്: ${remainingQty} ${d.unit || ''}
                                </div>
                            </div>
                            
                            <p class="text-xs font-black text-slate-200 mb-4 bg-slate-800 p-2.5 rounded-xl inline-block border border-slate-700">ആകെ വില: ₹${d.price}</p>
                            
                            <div class="flex gap-2.5 no-print">
                                <button onclick="window.editMat('${docSnap.id}', '${d.date || ''}', '${d.name}', '${d.site || ''}', ${totalQty}, ${usedQty}, '${d.unit || ''}', ${d.price}, '${d.phone}')" class="flex-1 bg-amber-500 text-slate-950 py-2.5 rounded-xl font-black text-xs hover:bg-amber-400 transition shadow-sm">എഡിറ്റ്</button>
                                <button onclick="window.delMat('${docSnap.id}')" class="bg-red-600 text-white px-4 py-2.5 rounded-xl font-black text-xs hover:bg-red-500 transition shadow-sm">ഡിലീറ്റ്</button>
                            </div>
                        </div>`;
                }
            });

            const shopContainer = document.getElementById('shopDirectoryContainer');
            if (suppliersMap.size > 0) {
                let shopHtml = '';
                suppliersMap.forEach((phone, supName) => {
                    shopHtml += `<div class="flex justify-between items-center bg-slate-900/80 p-2 rounded-xl text-xs"><span class="font-bold text-white">${supName}</span><a href="tel:${phone}" class="text-cyan-400 font-bold">📞 ${phone}</a></div>`;
                });
                shopContainer.innerHTML = shopHtml;
            } else {
                shopContainer.innerHTML = `<p class="text-[11px] text-slate-400 text-center py-1">സപ്ലയർ നമ്പറുകൾ ഒന്നും ചേർത്തിട്ടില്ല</p>`;
            }

            document.getElementById('totalMaterialCost').innerText = "₹" + totalCost;
        });

        window.filterMaterials = () => {
            const searchTerm = document.getElementById('filterSite').value.toLowerCase();
            const items = document.querySelectorAll('.material-item');

            items.forEach(item => {
                const siteName = item.getAttribute('data-site');
                if (siteName.includes(searchTerm)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        };

        window.editMat = (id, date, name, site, qty, used, unit, price, phone) => {
            editId = id;
            document.getElementById('matDate').value = date;
            document.getElementById('matName').value = name;
            document.getElementById('matSite').value = site;
            document.getElementById('matQty').value = qty;
            document.getElementById('matUsed').value = used;
            document.getElementById('matUnit').value = unit;
            document.getElementById('matPrice').value = price;
            document.getElementById('matPhone').value = phone;
            document.getElementById('formTitle').innerText = "മെറ്റീരിയൽ വിവരങ്ങൾ മാറ്റം വരുത്തുക";
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            document.getElementById('saveBtn').innerText = "അപ്ഡേറ്റ് ചെയ്യുക";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.delMat = async (id) => {
            if (await window.openCustomConfirm("ഈ വിവരങ്ങൾ ഡിലീറ്റ് ചെയ്യണോ?")) {
                await deleteDoc(doc(db, "materials", id));
                window.showToast("🗑️ ഡാറ്റ നീക്കം ചെയ്തു!", false);
            }
        };
    </script>
</body>
</html>
