<!DOCTYPE html>
<html lang="ml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>മെറ്റീരിയൽസ് & സ്റ്റോക്ക് - മേസ്തിരി പ്രോ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="language.js?v=2.0"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        import { setupHeader } from './header.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            databaseURL: "https://mesthri-app-default-rtdb.firebaseio.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d",
            measurementId: "G-J9Y5TW9D7T"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app); 
        const currentMeshtri = localStorage.getItem('userName') || "പൊതുമേസ്തിരി";

        window.switchLanguage = function(lang) {
            if (!lang) lang = localStorage.getItem('selectedLang') || 'ml';
            
            document.querySelectorAll('.lang').forEach(el => {
                const key = el.getAttribute('data-key');
                if (typeof words !== 'undefined' && words[key] && words[key][lang]) {
                    el.innerText = words[key][lang];
                }
            });

            document.querySelectorAll('.lang-placeholder').forEach(el => {
                const key = el.getAttribute('data-key');
                if (typeof words !== 'undefined' && words[key] && words[key][lang]) {
                    el.placeholder = words[key][lang];
                }
            });
        };

        document.addEventListener("DOMContentLoaded", () => {
            if (typeof setupHeader === 'function') {
                setupHeader('appHeader', true, currentMeshtri);
            }
            
            const savedLang = localStorage.getItem('selectedLang') || 'ml';
            if (typeof window.switchLanguage === 'function') {
                window.switchLanguage(savedLang);
            }
        });

        window.addEventListener('languageChanged', (e) => {
            const newLang = (e && e.detail) ? e.detail : (localStorage.getItem('selectedLang') || 'ml');
            if (typeof window.switchLanguage === 'function') {
                window.switchLanguage(newLang);
            }
        });

        window.addEventListener('storage', (e) => {
            if (e.key === 'selectedLang') {
                const newLang = e.newValue || 'ml';
                if (typeof window.switchLanguage === 'function') {
                    window.switchLanguage(newLang);
                }
            }
        });
    </script>
</head>
<body class="text-white min-h-screen pb-12 bg-slate-950 flex flex-col items-center justify-center font-['Manjari']">

    <div id="toastContainer" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 pointer-events-none"></div>
    
    <div class="w-[92%] max-w-md mx-auto border-2 border-blue-600 rounded-[35px] p-5 shadow-[0_0_20px_rgba(37,99,235,0.4)] my-8 box-border space-y-4 bg-slate-950">

        <!-- ഹെഡർ -->
        <div id="appHeader" class="w-full"></div>

        <!-- മെറ്റീരിയൽസ് & സ്റ്റോക്ക് ഹെഡർ ബോർഡ് (ക്ലിയർ ആക്കിയ ഹോം ബട്ടൺ കള്ളി) -->
        <div class="bg-slate-900 border-2 border-blue-500 p-4 rounded-2xl flex justify-between items-center shadow-xl shadow-blue-950/50">
            <h1 class="text-base font-black">
                <span class="lang bg-gradient-to-r from-blue-400 via-sky-300 to-indigo-500 bg-clip-text text-transparent drop-shadow-md" data-key="materialsStock">മെറ്റീരിയൽസ് & സ്റ്റോക്ക്</span>
            </h1>
            
            <a href="dashboard.html" class="px-4 py-2 bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white rounded-xl text-xs font-black shadow-lg shadow-blue-900/50 transition flex items-center gap-2 border border-white/40 shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a22 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span class="lang" data-key="homeBtn">Home</span>
            </a>
        </div>

        <!-- ആകെ മെറ്റീരിയൽ ചെലവ് കാർഡ് -->
        <div class="bg-slate-900/90 p-5 rounded-2xl shadow-md text-center border border-slate-800 backdrop-blur-sm">
            <p class="text-[10px] opacity-75 uppercase tracking-widest font-black text-slate-300 lang" data-key="totalMaterialExpense">ആകെ മെറ്റീരിയൽ ചെലവ്</p>
            <h2 id="totalMaterialCost" class="text-2xl font-black mt-1 text-emerald-400">₹0</h2>
        </div>

        <!-- മാസത്തിലെ മെറ്റീരിയൽ ചെലവ് ചാർട്ട് സെക്ഷൻ -->
        <div class="bg-slate-900/90 text-white p-5 rounded-3xl shadow-xl border-2 border-slate-700/80 backdrop-blur-sm space-y-3">
            <h3 class="text-sm font-black text-blue-400 flex items-center gap-2">
                📈 <span class="lang" data-key="monthlyMaterialChart">മാസത്തിലെ മെറ്റീരിയൽ ചെലവ് ചാർട്ട്</span>
            </h3>
            <div class="p-4 bg-slate-800/60 rounded-2xl text-center text-xs text-slate-400 font-bold lang" data-key="chartDataNotAvailable">
                ചാർട്ട് ഡാറ്റ ലഭ്യമല്ല
            </div>
        </div>

        <!-- സപ്ലയർ സെക്ഷനുകൾ -->
        <div class="space-y-3">
            <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 flex justify-between items-center shadow-lg">
                <span class="text-xs font-black text-slate-200 lang" data-key="supplierPaymentLedger">സപ്ലയർ പെയ്മെന്റ് ലെഡ്ജർ (ബാക്കി തുക)</span>
                <span class="text-xs font-bold text-blue-400 lang" data-key="viewBtn">കാണുക</span>
            </div>

            <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 flex justify-between items-center shadow-lg">
                <span class="text-xs font-black text-slate-200 lang" data-key="supplierContactBook">സപ്ലയർ കോണ്ടാക്ട് ബുക്ക്</span>
                <span class="text-xs font-bold text-blue-400 lang" data-key="viewBtn">കാണുക</span>
            </div>

            <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 flex justify-between items-center shadow-lg">
                <span class="text-xs font-black text-slate-200 lang" data-key="quickNotes">പ്രത്യേക കുറിപ്പുകൾ (Quick Notes)</span>
                <span class="text-xs font-bold text-blue-400 lang" data-key="viewBtn">കാണുക</span>
            </div>
        </div>

    </div>

</body>
</html>
