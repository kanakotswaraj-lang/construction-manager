<!DOCTYPE html>
<html lang="ml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ഹാജർ റിപ്പോർട്ട് - മേസ്തിരി പ്രോ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700;900&display=swap" rel="stylesheet">

    <!-- language.js ഫയൽ ഇവിടെ ലിങ്ക് ചെയ്തിരിക്കുന്നുവെന്ന് ഉറപ്പുവരുത്തുക -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        import { setupHeader } from './header.js';
        import { getTxt } from './language.js'; // language.js-ൽ നിന്നുള്ള ഫംഗ്ഷൻ

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            databaseURL: "https://mesthri-app-default-rtdb.firebaseio.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d",
            measurementId: "G-J9Y5TW9D7T"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const currentMeshtri = localStorage.getItem('userName') || localStorage.getItem('meshtriName') || "മേസ്തിരി";

        let allLogs = [];
        let allWorkers = new Map();
        let allSites = new Set();

        document.addEventListener("DOMContentLoaded", () => {
            if (typeof setupHeader === 'function') {
                setupHeader('appHeader', true, currentMeshtri);
            }
            loadAttendanceData();

            window.addEventListener('languageChanged', () => {
                updateStaticTexts();
                populateDropdowns();
                renderReport();
            });
            updateStaticTexts();
        });

        function updateStaticTexts() {
            document.querySelectorAll('.lang').forEach(el => {
                const key = el.getAttribute('data-key');
                if (key) {
                    el.innerText = getTxt(key, el.innerText);
                }
            });
            const searchInput = document.getElementById('searchInput');
            if(searchInput) {
                searchInput.placeholder = getTxt('search_placeholder', '🔍 പേരോ സൈറ്റോ തിരയുക...');
            }
        }

        async function loadAttendanceData() {
            const list = document.getElementById('reportList');
            list.innerHTML = `<p class="text-center text-xs text-slate-400 font-bold py-8 lang" data-key="checking_data">${getTxt('checking_data', 'ഡാറ്റ പരിശോധിക്കുന്നു...')}</p>`;

            try {
                const staffQuery = query(collection(db, "staffs"), where("meshtriOwner", "==", currentMeshtri));
                const staffSnapshot = await getDocs(staffQuery);
                staffSnapshot.forEach(docSnap => {
                    const s = docSnap.data();
                    if (s.name) {
                        const cleanPhone = s.phone ? s.phone.replace(/\D/g, '') : '';
                        allWorkers.set(s.name.trim(), cleanPhone);
                    }
                });

                const q = query(collection(db, "accounts"), where("meshtriOwner", "==", currentMeshtri), where("type", "==", "wage"));
                const querySnapshot = await getDocs(q);

                allLogs = [];
                allSites.clear();

                querySnapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    let workerName = data.name ? data.name.split('(')[0].trim() : "തൊഴിലാളി";
                    let siteName = data.site || "പ്രധാന സൈറ്റ്";

                    if (!allWorkers.has(workerName)) {
                        allWorkers.set(workerName, '');
                    }
                    allSites.add(siteName);

                    allLogs.push({
                        id: docSnap.id,
                        workerName: workerName,
                        site: siteName,
                        amount: parseFloat(data.amount) || 0,
                        date: data.date || "",
                        days: data.days || 1
                    });
                });

                allLogs.sort((a, b) => new Date(b.date) - new Date(a.date));

                populateDropdowns();
                renderReport();

            } catch (err) {
                console.error(err);
                list.innerHTML = `<p class="text-center text-xs text-rose-400 font-bold py-4 lang" data-key="load_error">${getTxt('load_error', 'ഡാറ്റ ലോഡ് ചെയ്യാൻ കഴിഞ്ഞില്ല.')}</p>`;
            }
        }

        function populateDropdowns() {
            const workerSelect = document.getElementById('filterWorker');
            const siteSelect = document.getElementById('filterSite');

            const allWorkersText = getTxt('all_workers', 'എല്ലാ തൊഴിലാളികളും');
            const allSitesText = getTxt('all_sites', 'എല്ലാ സൈറ്റുകളും');

            const selectedWorkerVal = workerSelect.value;
            const selectedSiteVal = siteSelect.value;

            workerSelect.innerHTML = `<option value="">${allWorkersText}</option>`;
            siteSelect.innerHTML = `<option value="">${allSitesText}</option>`;

            allWorkers.forEach((phone, worker) => {
                workerSelect.innerHTML += `<option value="${worker}">${worker}</option>`;
            });

            allSites.forEach(site => {
                siteSelect.innerHTML += `<option value="${site}">${site}</option>`;
            });

            workerSelect.value = selectedWorkerVal;
            siteSelect.value = selectedSiteVal;
        }

        window.renderReport = function() {
            const selectedWorker = document.getElementById('filterWorker').value;
            const selectedSite = document.getElementById('filterSite').value;
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            const filtered = allLogs.filter(log => {
                const matchWorker = !selectedWorker || log.workerName === selectedWorker;
                const matchSite = !selectedSite || log.site === selectedSite;
                const matchSearch = !searchVal || log.workerName.toLowerCase().includes(searchVal) || log.site.toLowerCase().includes(searchVal);
                return matchWorker && matchSite && matchSearch;
            });

            let totalDays = 0;
            let totalWage = 0;

            filtered.forEach(item => {
                totalDays += parseFloat(item.days) || 1;
                totalWage += item.amount;
            });

            document.getElementById('statTotalDays').innerText = totalDays;
            document.getElementById('statTotalWage').innerText = "₹" + totalWage;

            const waContainer = document.getElementById('waBtnContainer');
            if (selectedWorker) {
                const phone = allWorkers.get(selectedWorker) || '';
                const msgPrefix = getTxt('wa_msg_prefix', 'നമസ്കാരം');
                const waAtt = getTxt('wa_attendance', 'ഹാജർ വിവരങ്ങൾ');
                const waTDays = getTxt('wa_total_days', 'ആകെ പണി ദിവസം');
                const waTWage = getTxt('wa_total_wage', 'ആകെ കൂലി');
                const waBtnTitle = getTxt('wa_btn_text', 'WhatsApp മെസ്സേജ് അയക്കുക');

                const msg = `${msgPrefix} ${selectedWorker},%0A${waAtt}:%0A- ${waTDays}: ${totalDays}%0A- ${waTWage}: ₹${totalWage}`;
                
                waContainer.innerHTML = `
                    <a href="https://wa.me/${phone}?text=${msg}" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white p-3 text-center rounded-xl text-xs font-black shadow-lg transition flex items-center justify-center gap-2">
                        💬 ${selectedWorker} - ${waBtnTitle}
                    </a>
                `;
                waContainer.classList.remove('hidden');
            } else {
                waContainer.classList.add('hidden');
            }

            const list = document.getElementById('reportList');
            list.innerHTML = '';

            if (filtered.length === 0) {
                list.innerHTML = `<p class="text-center text-slate-400 font-bold text-xs py-8 lang" data-key="no_data">${getTxt('no_data', 'വിവരങ്ങൾ ഒന്നും ലഭ്യമല്ല')}</p>`;
                return;
            }

            const daysLabel = getTxt('days_label', 'പണി:');
            const dayUnit = getTxt('day_unit', 'ദിവസം');

            filtered.forEach(item => {
                list.innerHTML += `
                    <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 flex justify-between items-center shadow-lg backdrop-blur-sm">
                        <div class="space-y-1">
                            <h4 class="font-black text-sm text-white">${item.workerName}</h4>
                            <p class="text-xs text-slate-400 font-bold">📅 ${item.date} | 📍 <span class="text-cyan-300">${item.site}</span></p>
                        </div>
                        <div class="text-right">
                            <span class="px-2.5 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded-lg text-xs font-black">${daysLabel} ${item.days} ${dayUnit}</span>
                            <p class="font-black text-sm text-emerald-400 mt-1 shadow-sm">₹${item.amount}</p>
                        </div>
                    </div>
                `;
            });
        };
    </script>

    <style>
        body { font-family: 'Manjari', sans-serif; background: radial-gradient(circle at top, #0f172a 0%, #050b18 100%) !important; }
        
        .glowing-outer-card {
            position: relative;
            background: #0b1329;
            border-radius: 1.5rem;
        }
        .glowing-outer-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(45deg, #06b6d4, #3b82f6, #6366f1, #06b6d4);
            border-radius: 1.6rem;
            z-index: -1;
            opacity: 0.8;
            filter: blur(4px);
            animation: glowingBorder 6s linear infinite;
        }
        @keyframes glowingBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>

<body class="text-white min-h-screen pb-12 p-4 font-sans flex items-center justify-center">

    <div class="w-full max-w-md p-1 glowing-outer-card shadow-2xl">
        <div class="bg-slate-950/95 rounded-[1.3rem] p-4 space-y-4 backdrop-blur-md">
            
            <div id="appHeader" class="w-full"></div>

            <div class="bg-slate-900/90 border-2 border-amber-500/50 p-4 rounded-2xl flex justify-between items-center shadow-xl backdrop-blur-sm">
                <h1 class="text-base font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-orange-300 to-amber-500 tracking-wide lang" data-key="report_title">ഹാജർ & പണി റിപ്പോർട്ട്</h1>
                <a href="dashboard.html" class="px-4 py-2 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 rounded-xl text-xs font-black shadow-lg transition flex items-center gap-1.5 lang" data-key="home">
                    Home
                </a>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-slate-900/90 border border-cyan-500/40 p-4 rounded-2xl text-center shadow-lg">
                    <p class="text-[10px] font-bold text-slate-400 uppercase lang" data-key="total_days">ആകെ പണി ദിവസങ്ങൾ</p>
                    <p id="statTotalDays" class="text-xl font-black text-cyan-300 mt-1">0</p>
                </div>
                <div class="bg-slate-900/90 border border-emerald-500/40 p-4 rounded-2xl text-center shadow-lg">
                    <p class="text-[10px] font-bold text-slate-400 uppercase lang" data-key="total_wage">ആകെ നൽകിയ കൂലി</p>
                    <p id="statTotalWage" class="text-xl font-black text-emerald-400 mt-1">₹0</p>
                </div>
            </div>

            <div class="bg-slate-900/90 border border-slate-800 p-4 rounded-2xl space-y-3 shadow-xl">
                <input type="text" id="searchInput" oninput="renderReport()" placeholder="🔍 പേരോ സൈറ്റോ തിരയുക..." class="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 text-xs font-bold text-white focus:outline-none">
                
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[9px] text-slate-400 font-bold block mb-1 uppercase lang" data-key="worker">തൊഴിലാളി</label>
                        <select id="filterWorker" onchange="renderReport()" class="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs font-bold text-amber-400 focus:outline-none">
                            <option value="">എല്ലാ തൊഴിലാളികളും</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[9px] text-slate-400 font-bold block mb-1 uppercase lang" data-key="site">സൈറ്റ്</label>
                        <select id="filterSite" onchange="renderReport()" class="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs font-bold text-amber-400 focus:outline-none">
                            <option value="">എല്ലാ സൈറ്റുകളും</option>
                        </select>
                    </div>
                </div>

                <div id="waBtnContainer" class="hidden pt-1"></div>
            </div>

            <div class="space-y-2.5">
                <h3 class="text-xs font-black text-slate-400 uppercase px-1 lang" data-key="attendance_info">ഹാജർ വിവരങ്ങൾ</h3>
                <div id="reportList" class="space-y-3"></div>
            </div>
            
        </div>
    </div>

</body>
</html>
