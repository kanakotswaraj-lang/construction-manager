<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="lang" data-key="historyEditTitle">കണക്ക് ഹിസ്റ്ററി & എഡിറ്റ് - മേസ്തിരി പ്രോ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="language.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700;900&display=swap" rel="stylesheet">
    
        <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, where, doc, updateDoc, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        import { setupHeader } from './header.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            databaseURL: "https://mesthri-app-default-rtdb.firebaseio.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d",
            measurementId: "G-J9Y5TW9D7T"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const currentMeshtri = localStorage.getItem('userName') || "പൊതുമേസ്തിരി";
        let allHistoryData = [];
        let currentFilter = 'all';

        window.switchLanguage = function(lang) {
            if (!lang) lang = localStorage.getItem('selectedLang') || 'ml';
            
            document.querySelectorAll('.lang').forEach(el => {
                const key = el.getAttribute('data-key');
                if (typeof words !== 'undefined' && words[key] && words[key][lang]) {
                    el.innerText = words[key][lang];
                }
            });

            document.querySelectorAll('.lang-placeholder').forEach(el => {
                const key = el.getAttribute('data-key');
                if (typeof words !== 'undefined' && words[key] && words[key][lang]) {
                    el.placeholder = words[key][lang];
                }
            });
            filterAndDisplay();
        };

        document.addEventListener("DOMContentLoaded", () => {
            try {
                if (typeof setupHeader === 'function') { 
                    setupHeader('appHeader', true, currentMeshtri); 
                } else { 
                    document.getElementById('appHeader').innerHTML = `<h2 class="text-amber-400 font-black text-sm">മേസ്തിരി പ്രോ</h2>`; 
                }
            } catch (e) { 
                document.getElementById('appHeader').innerHTML = `<h2 class="text-amber-400 font-black text-sm">മേസ്തിരി പ്രോ</h2>`; 
            }

            const savedLang = localStorage.getItem('selectedLang') || 'ml';
            if (typeof window.switchLanguage === 'function') {
                window.switchLanguage(savedLang);
            }
        });

        window.addEventListener('languageChanged', (e) => {
            const newLang = (e && e.detail) ? e.detail : (localStorage.getItem('selectedLang') || 'ml');
            if (typeof window.switchLanguage === 'function') {
                window.switchLanguage(newLang);
            }
        });

        window.addEventListener('storage', (e) => {
            if (e.key === 'selectedLang') {
                const newLang = e.newValue || 'ml';
                if (typeof window.switchLanguage === 'function') {
                    window.switchLanguage(newLang);
                }
            }
        });

        // onSnapshot ഉപയോഗിച്ച് ലൈവ് ആയി ഡാറ്റ എടുക്കാൻ മാറ്റിയിരിക്കുന്നു (മറ്റ് പേജുകൾ പോലെ)
        onSnapshot(query(collection(db, "accounts"), where("meshtriOwner", "==", currentMeshtri)), (querySnapshot) => {
            allHistoryData = [];
            
            querySnapshot.forEach((document) => {
                allHistoryData.push({ id: document.id, ...document.data() });
            });

            allHistoryData.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
            updateSummary(allHistoryData);
            filterAndDisplay();
        });

        function updateSummary(data) {
            let totalIncome = 0;
            let totalExpense = 0;

            data.forEach(item => {
                let amt = parseFloat(item.amount) || 0;
                let dataType = String(item.type || '').toLowerCase();
                let isIncome = (dataType === 'income' || dataType === 'varavu' || dataType === 'വരവ്');

                if (isIncome) {
                    totalIncome += amt;
                } else {
                    totalExpense += amt;
                }
            });

            document.getElementById('totalIncomeText').innerText = `₹ ${totalIncome}`;
            document.getElementById('totalExpenseText').innerText = `₹ ${totalExpense}`;
        }

        window.setCategoryFilter = function(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.remove('bg-amber-500', 'text-slate-950', 'border-amber-400', 'font-black');
                tab.classList.add('bg-slate-800', 'text-white', 'border-slate-700', 'font-bold');
            });
            const activeTab = document.getElementById(`tab-${type}`);
            if(activeTab) {
                activeTab.classList.remove('bg-slate-800', 'text-white', 'border-slate-700', 'font-bold');
                activeTab.classList.add('bg-amber-500', 'text-slate-950', 'border-amber-400', 'font-black');
            }
            filterAndDisplay();
        }

        window.filterAndDisplay = function() {
            let queryVal = (document.getElementById('searchHistory')?.value || '').toLowerCase();
            
            let filtered = allHistoryData.filter(item => {
                let dataType = String(item.type || '').toLowerCase();
                let matchesCategory = true;

                if (currentFilter === 'income') {
                    matchesCategory = (dataType === 'income' || dataType === 'varavu' || dataType === 'വരവ്');
                } else if (currentFilter === 'wage') {
                    matchesCategory = (dataType === 'wage' || dataType === 'കൂലി');
                } else if (currentFilter === 'expense') {
                    matchesCategory = (dataType !== 'income' && dataType !== 'varavu' && dataType !== 'വരവ്' && dataType !== 'wage' && dataType !== 'കൂലി');
                }

                let searchString = ((item.site || '') + ' ' + (item.name || '')).toLowerCase();
                let matchesSearch = searchString.includes(queryVal);
                return matchesCategory && matchesSearch;
            });

            displayHistory(filtered);
        }

        function displayHistory(dataList) {
            const container = document.getElementById('historyListContainer');
            if (!container) return;

            const currentLang = localStorage.getItem('selectedLang') || 'ml';

            if (dataList.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 py-8 text-xs font-bold lang" data-key="noAccounts">കണക്കുകൾ ഒന്നും ലഭ്യമല്ല</div>`;
                window.switchLanguage(currentLang);
                return;
            }

            container.innerHTML = dataList.map(item => {
                let dataType = String(item.type || '').toLowerCase();
                let isIncome = (dataType === 'income' || dataType === 'varavu' || dataType === 'വരവ്');
                let badgeColor = isIncome ? 'bg-cyan-500/20 text-cyan-300 border-cyan-400/50' : 'bg-red-500/20 text-red-300 border-red-400/50';

                return `
                    <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 shadow-xl space-y-2">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-[10px] font-black px-2.5 py-1 rounded-full border ${badgeColor} uppercase">${item.type || 'ചെലവ്'}</span>
                                <h3 class="text-sm font-black text-white mt-1.5">${item.site || 'സൈറ്റ് പേരില്ല'}</h3>
                            </div>
                            <span class="text-xs font-bold text-slate-400">${item.date || ''}</span>
                        </div>
                        <div class="flex justify-between items-center border-t border-slate-800/80 pt-2 text-xs">
                            <span class="font-bold text-slate-300"><span class="lang" data-key="nameLabel">പേര്</span>: <strong class="text-white">${item.name || '-'}</strong></span>
                            <span class="font-black text-base ${isIncome ? 'text-emerald-400' : 'text-amber-400'}">₹ ${item.amount || 0}</span>
                        </div>
                        <div class="flex gap-2 pt-1">
                            <button type="button" onclick="openEditModal('${item.id}', '${item.name || ''}', '${item.site || ''}', '${item.amount || 0}', '${item.date || ''}')" class="w-full bg-blue-600/80 hover:bg-blue-600 text-white py-2 rounded-xl text-xs font-bold transition lang" data-key="editBtn">എഡിറ്റ്</button>
                            <button type="button" onclick="deleteAccount('${item.id}')" class="w-full bg-red-600/80 hover:bg-red-600 text-white py-2 rounded-xl text-xs font-bold transition lang" data-key="deleteBtn">ഡിലീറ്റ്</button>
                        </div>
                    </div>
                `;
            }).join('');

            window.switchLanguage(currentLang);
        }

        window.openEditModal = function(id, name, site, amount, date) {
            document.getElementById('editDocId').value = id;
            document.getElementById('editName').value = name;
            document.getElementById('editSite').value = site;
            document.getElementById('editAmount').value = amount;
            document.getElementById('editDate').value = date;
            document.getElementById('editModal').classList.remove('hidden');
        }

        window.closeEditModal = function() {
            document.getElementById('editModal').classList.add('hidden');
        }

        window.updateAccountData = async function() {
            const id = document.getElementById('editDocId').value;
            const name = document.getElementById('editName').value.trim();
            const site = document.getElementById('editSite').value.trim();
            const amount = parseFloat(document.getElementById('editAmount').value) || 0;
            const date = document.getElementById('editDate.value') || document.getElementById('editDate').value;

            if (!id) return;

            try {
                const docRef = doc(db, "accounts", id);
                await updateDoc(docRef, { name, site, amount, date });
                window.showToast("കണക്ക് വിജയകരമായി അപ്ഡേറ്റ് ചെയ്തു!", true);
                closeEditModal();
            } catch (error) {
                window.showToast("കണക്ക് അപ്ഡേറ്റ് ചെയ്യാൻ കഴിഞ്ഞില്ല!", false);
            }
        }

        window.deleteAccount = async function(id) {
            if (confirm("ഈ കണക്ക് തീർച്ചയായും ഡിലീറ്റ് ചെയ്യ வேண்டுമോ?")) {
                try {
                    await deleteDoc(doc(db, "accounts", id));
                    window.showToast("കണക്ക് വിജയകരമായി ഡിലീറ്റ് ചെയ്തു!", true);
                } as error catch (error) {
                    window.showToast("കണക്ക് ഡിലീറ്റ് ചെയ്യാൻ കഴിഞ്ഞില്ല!", false);
                }
            }
        }
    </script>


</body>
</html>
