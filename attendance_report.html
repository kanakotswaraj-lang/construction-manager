<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title class="lang" data-key="historyEditTitle">കണക്ക് ഹിസ്റ്ററി & എഡിറ്റ് - മേസ്തിരി പ്രോ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="language.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        import { setupHeader } from './header.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            databaseURL: "https://mesthri-app-default-rtdb.firebaseio.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d",
            measurementId: "G-J9Y5TW9D7T"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const currentMeshtri = localStorage.getItem('userName') || "പൊതുമേസ്തിരി";
        let allHistoryData = [];
        let currentFilter = 'all';

        window.switchLanguage = function(lang) {
            if (!lang) lang = localStorage.getItem('selectedLang') || 'ml';
            
            document.querySelectorAll('.lang').forEach(el => {
                const key = el.getAttribute('data-key');
                if (typeof words !== 'undefined' && words[key] && words[key][lang]) {
                    el.innerText = words[key][lang];
                }
            });

            document.querySelectorAll('.lang-placeholder').forEach(el => {
                const key = el.getAttribute('data-key');
                if (typeof words !== 'undefined' && words[key] && words[key][lang]) {
                    el.placeholder = words[key][lang];
                }
            });
            filterAndDisplay();
        };

        document.addEventListener("DOMContentLoaded", () => {
            try {
                if (typeof setupHeader === 'function') { 
                    setupHeader('appHeader', true, currentMeshtri); 
                } else { 
                    document.getElementById('appHeader').innerHTML = `<h2 class="text-amber-400 font-black text-sm">മേസ്തിരി പ്രോ</h2>`; 
                }
            } catch (e) { 
                document.getElementById('appHeader').innerHTML = `<h2 class="text-amber-400 font-black text-sm">മേസ്തിരി പ്രോ</h2>`; 
            }

            fetchHistory(); // ഡാറ്റ ലോഡ് ചെയ്യാൻ ഈ ഫങ്ഷൻ കോൾ ചെയ്യുന്നു

            const savedLang = localStorage.getItem('selectedLang') || 'ml';
            if (typeof window.switchLanguage === 'function') {
                window.switchLanguage(savedLang);
            }
        });

        window.addEventListener('languageChanged', (e) => {
            const newLang = (e && e.detail) ? e.detail : (localStorage.getItem('selectedLang') || 'ml');
            if (typeof window.switchLanguage === 'function') {
                window.switchLanguage(newLang);
            }
        });

        window.addEventListener('storage', (e) => {
            if (e.key === 'selectedLang') {
                const newLang = e.newValue || 'ml';
                if (typeof window.switchLanguage === 'function') {
                    window.switchLanguage(newLang);
                }
            }
        });

        // ഫയർബേസിൽ നിന്ന് കണക്കുകൾ എടുക്കുന്ന ഫങ്ഷൻ തിരികെ ചേർത്തു
        async function fetchHistory() {
            const container = document.getElementById('historyListContainer');
            try {
                const q = query(collection(db, "accounts"), where("meshtriOwner", "==", currentMeshtri));
                const querySnapshot = await getDocs(q);
                allHistoryData = [];
                
                querySnapshot.forEach((document) => {
                    allHistoryData.push({ id: document.id, ...document.data() });
                });

                allHistoryData.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
                updateSummary(allHistoryData);
                filterAndDisplay();
            } catch (error) {
                console.error("ഡാറ്റ ലോഡ് ചെയ്യുന്നതിൽ പിഴവ്:", error);
                if(container) {
                    container.innerHTML = `<div class="text-center text-red-400 py-8 text-xs font-bold lang" data-key="loadError">കണക്കുകൾ ലോഡ് ചെയ്യുന്നതിൽ പിഴവ്!</div>`;
                    const currentLang = localStorage.getItem('selectedLang') || 'ml';
                    window.switchLanguage(currentLang);
                }
            }
        }

        function updateSummary(data) {
            let totalIncome = 0;
            let totalExpense = 0;

            data.forEach(item => {
                let amt = parseFloat(item.amount) || 0;
                let dataType = String(item.type || '').toLowerCase();
                let isIncome = (dataType === 'income' || dataType === 'varavu' || dataType === 'വരവ്');

                if (isIncome) {
                    totalIncome += amt;
                } else {
                    totalExpense += amt;
                }
            });

            document.getElementById('totalIncomeText').innerText = `₹ ${totalIncome}`;
            document.getElementById('totalExpenseText').innerText = `₹ ${totalExpense}`;
        }

        window.setCategoryFilter = function(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.remove('bg-amber-500', 'text-slate-950', 'border-amber-400', 'font-black');
                tab.classList.add('bg-slate-800', 'text-white', 'border-slate-700', 'font-bold');
            });
            const activeTab = document.getElementById(`tab-${type}`);
            if(activeTab) {
                activeTab.classList.remove('bg-slate-800', 'text-white', 'border-slate-700', 'font-bold');
                activeTab.classList.add('bg-amber-500', 'text-slate-950', 'border-amber-400', 'font-black');
            }
            filterAndDisplay();
        }

        window.filterAndDisplay = function() {
            let queryVal = (document.getElementById('searchHistory')?.value || '').toLowerCase();
            
            let filtered = allHistoryData.filter(item => {
                let dataType = String(item.type || '').toLowerCase();
                let matchesCategory = true;

                if (currentFilter === 'income') {
                    matchesCategory = (dataType === 'income' || dataType === 'varavu' || dataType === 'വരവ്');
                } else if (currentFilter === 'wage') {
                    matchesCategory = (dataType === 'wage' || dataType === 'കൂലി');
                } else if (currentFilter === 'expense') {
                    matchesCategory = (dataType !== 'income' && dataType !== 'varavu' && dataType !== 'വരവ്' && dataType !== 'wage' && dataType !== 'കൂലി');
                }

                let searchString = ((item.site || '') + ' ' + (item.name || '')).toLowerCase();
                let matchesSearch = searchString.includes(queryVal);
                return matchesCategory && matchesSearch;
            });

            displayHistory(filtered);
        }

        function displayHistory(dataList) {
            const container = document.getElementById('historyListContainer');
            if (!container) return;

            const currentLang = localStorage.getItem('selectedLang') || 'ml';

            if (dataList.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 py-8 text-xs font-bold lang" data-key="noAccounts">കണക്കുകൾ ഒന്നും ലഭ്യമല്ല</div>`;
                window.switchLanguage(currentLang);
                return;
            }

            container.innerHTML = dataList.map(item => {
                let dataType = String(item.type || '').toLowerCase();
                let isIncome = (dataType === 'income' || dataType === 'varavu' || dataType === 'വരവ്');
                let badgeColor = isIncome ? 'bg-cyan-500/20 text-cyan-300 border-cyan-400/50' : 'bg-red-500/20 text-red-300 border-red-400/50';

                return `
                    <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 shadow-xl space-y-2">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-[10px] font-black px-2.5 py-1 rounded-full border ${badgeColor} uppercase">${item.type || 'ചെലവ്'}</span>
                                <h3 class="text-sm font-black text-white mt-1.5">${item.site || 'സൈറ്റ് പേരില്ല'}</h3>
                            </div>
                            <span class="text-xs font-bold text-slate-400">${item.date || ''}</span>
                        </div>
                        <div class="flex justify-between items-center border-t border-slate-800/80 pt-2 text-xs">
                            <span class="font-bold text-slate-300"><span class="lang" data-key="nameLabel">പേര്</span>: <strong class="text-white">${item.name || '-'}</strong></span>
                            <span class="font-black text-base ${isIncome ? 'text-emerald-400' : 'text-amber-400'}">₹ ${item.amount || 0}</span>
                        </div>
                        <div class="flex gap-2 pt-1">
                            <button type="button" onclick="openEditModal('${item.id}', '${item.name || ''}', '${item.site || ''}', '${item.amount || 0}', '${item.date || ''}')" class="w-full bg-blue-600/80 hover:bg-blue-600 text-white py-2 rounded-xl text-xs font-bold transition lang" data-key="editBtn">എഡിറ്റ്</button>
                            <button type="button" onclick="deleteAccount('${item.id}')" class="w-full bg-red-600/80 hover:bg-red-600 text-white py-2 rounded-xl text-xs font-bold transition lang" data-key="deleteBtn">ഡിലീറ്റ്</button>
                        </div>
                    </div>
                `;
            }).join('');

            window.switchLanguage(currentLang);
        }

        window.openEditModal = function(id, name, site, amount, date) {
            document.getElementById('editDocId').value = id;
            document.getElementById('editName').value = name;
            document.getElementById('editSite').value = site;
            document.getElementById('editAmount').value = amount;
            document.getElementById('editDate').value = date;
            document.getElementById('editModal').classList.remove('hidden');
        }

        window.closeEditModal = function() {
            document.getElementById('editModal').classList.add('hidden');
        }

        window.updateAccountData = async function() {
            const id = document.getElementById('editDocId').value;
            const name = document.getElementById('editName').value.trim();
            const site = document.getElementById('editSite').value.trim();
            const amount = parseFloat(document.getElementById('editAmount').value) || 0;
            const date = document.getElementById('editDate').value;

            if (!id) return;

            try {
                const docRef = doc(db, "accounts", id);
                await updateDoc(docRef, { name, site, amount, date });
                window.showToast("കണക്ക് വിജയകരമായി അപ്ഡേറ്റ് ചെയ്തു!", true);
                closeEditModal();
                fetchHistory();
            } catch (error) {
                window.showToast("കണക്ക് അപ്ഡേറ്റ് ചെയ്യാൻ കഴിഞ്ഞില്ല!", false);
            }
        }

        window.deleteAccount = async function(id) {
            if (confirm("ഈ കണക്ക് തീർച്ചയായും ഡിലീറ്റ് ചെയ്യ வேண்டுമോ?")) {
                try {
                    await deleteDoc(doc(db, "accounts", id));
                    window.showToast("കണക്ക് വിജയകരമായി ഡിലീറ്റ് ചെയ്തു!", true);
                    fetchHistory();
                } catch (error) {
                    window.showToast("കണക്ക് ഡിലീറ്റ് ചെയ്യാൻ കഴിഞ്ഞില്ല!", false);
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Manjari', sans-serif; background: radial-gradient(circle at top, #0f172a 0%, #050b18 100%) !important; }
    </style>
</head>
<body class="text-white min-h-screen pb-12 p-4 font-sans">

    <div id="toastContainer" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 flex flex-col items-center space-y-2 pointer-events-none"></div>

    <!-- ഔട്ടർ ബോർഡർ മഞ്ഞ കളറിൽ തിളങ്ങുന്ന രീതിയിൽ -->
    <div class="max-w-md mx-auto space-y-4 p-2 rounded-3xl border-2 border-amber-500 shadow-[0_0_25px_rgba(245,158,11,0.3)] bg-[#050B18]">
        
        <!-- ഹെഡർ കണ്ടെയ്നർ -->
        <div id="appHeader" class="w-full"></div>

        <!-- പേരിന്റെ ബോക്സും ഹോം ബട്ടണും (മഞ്ഞ ഗ്രേഡിയന്റ് തീം) -->
        <div class="bg-gradient-to-r from-amber-950/80 via-slate-900 to-amber-950/80 border-2 border-amber-500/80 p-4 rounded-2xl flex justify-between items-center shadow-xl backdrop-blur-sm">
            <h1 class="text-base font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-yellow-300 to-amber-500 tracking-wide lang" data-key="historyEditTitle">കണക്ക് ഹിസ്റ്ററി & എഡിറ്റ്</h1>
            
            <!-- ഹോം ബട്ടൺ മഞ്ഞ കളറിൽ -->
            <a href="dashboard.html" class="px-4 py-2 bg-gradient-to-r from-amber-500 to-yellow-600 hover:from-amber-400 hover:to-yellow-500 text-slate-950 rounded-xl text-xs font-black shadow-lg shadow-amber-900/40 transition flex items-center gap-2 border border-amber-300/40">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>Home</span>
            </a>
        </div>

        <!-- ടോട്ടൽ സമ്മറി കാർഡ് -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-slate-900/90 border border-cyan-500/30 p-3.5 rounded-2xl shadow-xl flex flex-col justify-between">
                <span class="text-[11px] font-bold text-cyan-400 lang" data-key="totalIncome">ആകെ വരവ് (Income)</span>
                <span id="totalIncomeText" class="text-base font-black text-white mt-1">₹ 0</span>
            </div>
            <div class="bg-slate-900/90 border border-red-500/30 p-3.5 rounded-2xl shadow-xl flex flex-col justify-between">
                <span class="text-[11px] font-bold text-red-400 lang" data-key="totalExpense">ആകെ ചെലവ്/കൂലി</span>
                <span id="totalExpenseText" class="text-base font-black text-white mt-1">₹ 0</span>
            </div>
        </div>

        <!-- സെർച്ചും ഫിൽട്ടർ ടാബുകളും -->
        <div class="bg-slate-900/90 p-4 rounded-2xl border border-slate-800 shadow-xl space-y-3">
            <input type="text" id="searchHistory" placeholder="🔍 സൈറ്റിന്റെ പേരിലോ വിവരത്തിലോ തിരയുക..." oninput="filterAndDisplay()" class="lang-placeholder w-full p-3.5 bg-slate-800/80 text-white rounded-xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400" data-key="searchPlaceholder">
            
            <div class="grid grid-cols-4 gap-1.5 pt-1">
                <button type="button" id="tab-all" onclick="setCategoryFilter('all')" class="filter-tab bg-amber-500 text-slate-950 border border-amber-400 py-2 rounded-xl text-[11px] font-black transition lang" data-key="all">എല്ലാം</button>
                <button type="button" id="tab-income" onclick="setCategoryFilter('income')" class="filter-tab bg-slate-800 text-white border border-slate-700 py-2 rounded-xl text-[11px] font-bold transition lang" data-key="income">വരവ്</button>
                <button type="button" id="tab-wage" onclick="setCategoryFilter('wage')" class="filter-tab bg-slate-800 text-white border border-slate-700 py-2 rounded-xl text-[11px] font-bold transition lang" data-key="wage">കൂലി</button>
                <button type="button" id="tab-expense" onclick="setCategoryFilter('expense')" class="filter-tab bg-slate-800 text-white border border-slate-700 py-2 rounded-xl text-[11px] font-bold transition lang" data-key="expense">ചെലവ്</button>
            </div>
        </div>

        <!-- കണക്കുകൾ ലിസ്റ്റ് ചെയ്യുന്ന സ്ഥലം -->
        <div id="historyListContainer" class="space-y-3">
            <div class="text-center text-slate-400 py-8 text-sm lang" data-key="loading">കണക്കുകൾ ലോഡ് ചെയ്യുന്നു...</div>
        </div>

    </div>

    <!-- മോഡൽ -->
    <div id="editModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-amber-500/50 p-6 rounded-3xl w-full max-w-sm space-y-4 shadow-2xl">
            <h3 class="text-base font-black text-amber-400 lang" data-key="editAccount">കണക്ക് തിരുത്തുക (Edit)</h3>
            <input type="hidden" id="editDocId">
            
            <div>
                <label class="block text-xs font-black text-slate-400 mb-1 lang" data-key="descName">വിവരം / പേര്:</label>
                <input type="text" id="editName" class="w-full p-3 bg-slate-800 text-white rounded-xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400">
            </div>

            <div>
                <label class="block text-xs font-black text-slate-400 mb-1 lang" data-key="siteName">സൈറ്റ് പേര്:</label>
                <input type="text" id="editSite" class="w-full p-3 bg-slate-800 text-white rounded-xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400">
            </div>

            <div>
                <label class="block text-xs font-black text-slate-400 mb-1 lang" data-key="amountPlaceholder">തുക (₹):</label>
                <input type="number" id="editAmount" class="w-full p-3 bg-slate-800 text-white rounded-xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400">
            </div>

            <div>
                <label class="block text-xs font-black text-slate-400 mb-1 lang" data-key="selectDateLabel">തീയതി:</label>
                <input type="date" id="editDate" class="w-full p-3 bg-slate-800 text-white rounded-xl border border-slate-700 text-xs font-bold focus:outline-none focus:border-amber-400">
            </div>

            <div class="flex gap-2 pt-2">
                <button type="button" onclick="closeEditModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 p-3 rounded-xl font-black text-xs transition lang" data-key="cancel">വേണ്ട</button>
                <button type="button" onclick="updateAccountData()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 p-3 rounded-xl font-black text-xs transition lang" data-key="update">അപ്ഡേറ്റ് ചെയ്യുക</button>
            </div>
        </div>
    </div>

</body>
</html>
