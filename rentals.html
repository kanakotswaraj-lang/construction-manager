<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&display=swap" rel="stylesheet">
    
    <script type="module">
        import { setupHeader } from './header.js';
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof setupHeader === 'function') {
                setupHeader('appHeader');
            }
        });
    </script>

    <style>
        body { font-family: 'Manjari', sans-serif; background: radial-gradient(circle at top, #0f172a 0%, #050b18 100%) !important; }
    </style>
    <title>വാടക ഉപകരണങ്ങൾ</title>
</head>
<body class="bg-[#050B18] text-white font-sans min-h-screen p-4">
    <div class="max-w-md mx-auto space-y-4">
        
        <!-- ഹെഡർ ലോഡ് ആകുന്ന കാൺടെയ്നർ -->
        <div id="appHeader" class="w-full flex justify-center"></div>

        <!-- സ്വാഗതം പേര് കാണിക്കുന്ന ഭാഗം -->
        <div class="text-center w-full">
            <span id="loggedInMeshtri" class="block w-full py-3 rounded-2xl text-sm font-black tracking-wider text-cyan-300 bg-cyan-500/10 border border-cyan-400/40 shadow-xl">
                സ്വാഗതം, ലോഡിങ്...
            </span>
        </div>

        <!-- പേജ് തലക്കെട്ടും ഡാഷ്‌ബോർഡ് ബട്ടണും -->
        <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl flex justify-between items-center shadow-xl backdrop-blur-sm mb-4">
            <div>
                <h1 class="text-lg font-black text-white">വാടക ഉപകരണങ്ങൾ</h1>
            </div>
            <a href="dashboard.html" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 border border-amber-400/40 text-amber-400 rounded-xl text-xs font-bold shadow-md transition flex items-center gap-1">
                <span>←</span> ഡാഷ്‌ബോർഡ്
            </a>
        </div>
        
        <!-- ഫോം ഭാഗം -->
        <div class="bg-slate-900/90 text-white p-6 rounded-3xl shadow-xl border border-slate-800 mb-8 space-y-4 backdrop-blur-sm">
            <h2 class="font-black text-amber-400 mb-2 text-sm">പുതിയ ഉപകരണം ചേർക്കുക</h2>
            
            <input type="text" id="itemName" placeholder="ഉപകരണത്തിന്റെ പേര്" class="w-full p-4 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400 text-xs">
            <input type="number" id="itemQty" placeholder="എത്ര എണ്ണം?" class="w-full p-4 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400 text-xs">
            
            <!-- സൈറ്റിന്റെ പേര് ചേർക്കാനുള്ള ഫീൽഡ് -->
            <input type="text" id="siteName" placeholder="ഏത് സൈറ്റിലാണ് (Site Name)?" class="w-full p-4 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-cyan-400 text-xs">

            <div class="grid grid-cols-2 gap-2">
                <input type="text" id="shopName" placeholder="എടുത്ത കടയുടെ പേര്" class="w-full p-4 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400 text-xs">
                <input type="text" id="clientName" placeholder="നൽകിയ ആളിന്റെ പേര്" class="w-full p-4 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400 text-xs">
            </div>

            <input type="tel" id="shopPhone" placeholder="ഫോൺ നമ്പർ" class="w-full p-4 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400 text-xs">
            
            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 ml-1">എടുത്ത തീയതി</label>
                    <input type="date" id="startDate" class="w-full p-4 bg-slate-800/80 text-white rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400 text-xs">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 ml-1">തിരികെ നൽകേണ്ടത്</label>
                    <input type="date" id="endDate" class="w-full p-4 bg-slate-800/80 text-white rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400 text-xs">
                </div>
            </div>
            
            <input type="number" id="unitRent" placeholder="ഒരെണ്ണത്തിന്റെ വാടക (₹)" class="w-full p-4 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400 text-xs">
            <input type="number" id="totalRent" placeholder="ആകെ വാടക (₹)" class="w-full p-4 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400 text-xs">
            <input type="number" id="paidRent" placeholder="നൽകിയ തുക (₹)" class="w-full p-4 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400 text-xs">
            
            <button id="saveRentBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 p-4 rounded-2xl font-black shadow-lg transition text-xs">വാടകയ്ക്ക് എടുത്തു ചേർക്കുക</button>
        </div>

        <!-- ഫിൽട്ടർ ബട്ടണുകൾ -->
        <div class="flex gap-2 mb-2">
            <button onclick="setFilter('active')" id="filterActiveBtn" class="flex-1 py-2.5 rounded-xl text-xs font-black bg-amber-500 text-slate-950 transition">നടന്നുകൊണ്ടിരിക്കുന്നത്</button>
            <button onclick="setFilter('returned')" id="filterReturnedBtn" class="flex-1 py-2.5 rounded-xl text-xs font-black bg-slate-800 text-slate-300 border border-slate-700 transition">തിരികെ നൽകിയത്</button>
        </div>

        <!-- സെർച്ച് ബാർ -->
        <div class="mb-6">
            <input type="text" id="searchInput" placeholder="🔍 ഉപകരണത്തിന്റെ പേരോ കടയോ സൈറ്റോ സെർച്ച് ചെയ്യുക..." 
                class="w-full p-4 bg-slate-900/50 text-white placeholder-slate-500 rounded-xl border border-slate-700 focus:outline-none focus:border-cyan-400 font-bold text-xs">
        </div>

        <section id="rentList" class="space-y-4 pb-12">
            <h2 class="font-black text-white mb-2 text-sm">എടുത്ത ഉപകരണങ്ങളുടെ ഹിസ്റ്ററി</h2>
        </section>
    </div>

    <!-- കോസ്റ്റം പ്രോംപ്റ്റ് മോഡൽ (ബ്രൗസർ പ്രോംപ്റ്റിന് പകരം ഇത് വർക്ക് ചെയ്യും) -->
    <div id="customPromptModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center hidden p-4">
        <div class="bg-slate-900 border-2 border-amber-400 p-6 rounded-3xl shadow-2xl max-w-sm w-full space-y-4">
            <h3 id="promptTitle" class="text-amber-400 font-black text-base">വിവരം നൽകുക</h3>
            <input type="text" id="promptInput" class="w-full p-4 bg-slate-800 text-white placeholder-slate-500 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400 text-sm" placeholder="ഇവിടെ എഴുതുക...">
            <div class="flex gap-2">
                <button id="promptCancelBtn" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-3 rounded-xl font-black text-xs">വേണ്ട</button>
                <button id="promptOkBtn" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 py-3 rounded-xl font-black text-xs">ശരി</button>
            </div>
        </div>
    </div>

    <!-- സെന്ററിൽ മനോഹരമായി വരുന്ന ടോസ്റ്റ് പോപ്പ്-അപ്പ് -->
    <div id="customToast" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-900 border-2 border-amber-400 text-amber-300 px-8 py-4 rounded-3xl shadow-2xl font-black text-base z-50 transition-all duration-300 opacity-0 pointer-events-none text-center">
        ഫലം ഇവിടെ കാണിക്കും
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            databaseURL: "https://mesthri-app-default-rtdb.firebaseio.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d",
            measurementId: "G-J9Y5TW9D7T"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const currentMeshtri = localStorage.getItem('userName') || "പൊതുമേസ്തിരി";
        document.getElementById('loggedInMeshtri').innerText = "സ്വാഗതം, " + currentMeshtri;

        function showToast(message, isSuccess = true) {
            const toast = document.getElementById('customToast');
            toast.innerText = message;
            toast.className = `fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 px-8 py-4 rounded-3xl shadow-2xl font-black text-base z-50 transition-all duration-300 text-center ${isSuccess ? 'bg-emerald-950 border-2 border-emerald-500 text-emerald-200' : 'bg-red-950 border-2 border-red-500 text-red-200'} opacity-100 scale-105`;
            setTimeout(() => {
                toast.className = "fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-900 border-2 border-amber-400 text-amber-300 px-8 py-4 rounded-3xl shadow-2xl font-black text-base z-50 transition-all duration-300 opacity-0 pointer-events-none text-center scale-100";
            }, 2500);
        }

        // കോസ്റ്റം പ്രോംപ്റ്റ് ഫങ്ഷൻ
        function openCustomPrompt(title, placeholder) {
            return new Promise((resolve) => {
                const modal = document.getElementById('customPromptModal');
                const titleEl = document.getElementById('promptTitle');
                const inputEl = document.getElementById('promptInput');
                const okBtn = document.getElementById('promptOkBtn');
                const cancelBtn = document.getElementById('promptCancelBtn');

                titleEl.innerText = title;
                inputEl.placeholder = placeholder;
                inputEl.value = '';
                modal.classList.remove('hidden');
                inputEl.focus();

                const handleOk = () => {
                    const val = inputEl.value;
                    cleanup();
                    resolve(val);
                };

                const handleCancel = () => {
                    cleanup();
                    resolve(null);
                };

                const cleanup = () => {
                    modal.classList.add('hidden');
                    okBtn.removeEventListener('click', handleOk);
                    cancelBtn.removeEventListener('click', handleCancel);
                };

                okBtn.addEventListener('click', handleOk);
                cancelBtn.addEventListener('click', handleCancel);
            });
        }

        let currentFilter = 'active';
        window.setFilter = (filter) => {
            currentFilter = filter;
            document.getElementById('filterActiveBtn').className = `flex-1 py-2.5 rounded-xl text-xs font-black transition ${filter === 'active' ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300 border border-slate-700'}`;
            document.getElementById('filterReturnedBtn').className = `flex-1 py-2.5 rounded-xl text-xs font-black transition ${filter === 'returned' ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300 border border-slate-700'}`;
            loadData();
        };

        function calculateTotal() {
            const start = new Date(document.getElementById('startDate').value);
            const end = new Date(document.getElementById('endDate').value);
            const unitRent = parseFloat(document.getElementById('unitRent').value) || 0;
            const qty = parseFloat(document.getElementById('itemQty').value) || 1;
            
            if (start && end && end >= start) {
                const diffDays = Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1;
                document.getElementById('totalRent').value = diffDays * unitRent * qty;
            }
        }
        document.querySelectorAll('input').forEach(input => input.addEventListener('input', calculateTotal));

        window.editItemDetails = async (id, currentItem, currentQty, currentShop, currentClient, currentSite) => {
            const newName = await openCustomPrompt("ഉപകരണത്തിന്റെ പുതിയ പേര്:", currentItem);
            if (newName === null) return;
            const newQty = await openCustomPrompt("പുതിയ എണ്ണം:", currentQty);
            if (newQty === null) return;
            const newSite = await openCustomPrompt("സൈറ്റിന്റെ പേര്:", currentSite);
            if (newSite === null) return;
            const newShop = await openCustomPrompt("കടയുടെ പേര്:", currentShop);
            if (newShop === null) return;
            const newClient = await openCustomPrompt("നൽകിയ ആളിന്റെ പേര്:", currentClient);
            if (newClient === null) return;

            if(newName && newShop) {
                await updateDoc(doc(db, "rentals", id), {
                    item: newName,
                    qty: newQty,
                    site: newSite || '',
                    shop: newShop,
                    client: newClient || ''
                });
                showToast("✏️ വിവരങ്ങൾ വിജയകരമായി എഡിറ്റ് ചെയ്തു!");
            }
        };

        window.editRent = async (id, currentPaid) => {
            const extraPaid = await openCustomPrompt("ഇപ്പോൾ നൽകിയ തുക എത്രയാണ്?", "തുക നൽകുക (₹)");
            if(extraPaid) {
                await updateDoc(doc(db, "rentals", id), { paid: parseFloat(currentPaid) + parseFloat(extraPaid) });
                showToast("✨ പെയ്മെന്റ് വിജയകരമായി അപ്ഡേറ്റ് ചെയ്തു!");
            }
        };

        window.settleFull = async (id, total) => {
            if(confirm("ബാക്കി തുക മുഴുവൻ അടച്ചു തീർത്ത് അക്കൗണ്ട് ക്ലിയർ ചെയ്യണോ?")) {
                await updateDoc(doc(db, "rentals", id), { paid: total });
                showToast("🎉 അക്കൗണ്ട് വിജയകരമായി സെറ്റിൽ ചെയ്തു!");
            }
        };

        window.toggleReturn = async (id, currentStatus) => {
            const newStatus = !currentStatus;
            await updateDoc(doc(db, "rentals", id), { isReturned: newStatus });
            showToast(newStatus ? "📦 ഉപകരണം തിരികെ നൽകിയതായി അടയാളപ്പെടുത്തി!" : "🔄 വാടക സ്റ്റാറ്റസ് മാറ്റിയിരിക്കുന്നു!");
        };

        window.deleteRent = async (id) => {
            if(confirm("ഈ ഡാറ്റ ഡിലീറ്റ് ചെയ്യണോ?")) {
                await deleteDoc(doc(db, "rentals", id));
                showToast("🗑️ ഡാറ്റ വിജയകരമായി ഡിലീറ്റ് ചെയ്തു!", false);
            }
        };

        window.shareWhatsApp = (item, qty, site, shop, client, total, paid, bal, totalDays) => {
            const msg = `*വാടക ഉപകരണ കണക്ക് (മേസ്തിരി പ്രോ)*\n\nഉപകരണം: ${item} (${qty} എണ്ണം)\nസൈറ്റ്: ${site || 'പറഞ്ഞിട്ടില്ല'}\nകട: ${shop}\nആർക്ക് നൽകി: ${client || 'നൽകിയിട്ടില്ല'}\nആകെ ദിവസങ്ങൾ: ${totalDays}\nആകെ വാടക: ₹${total}\nനൽകിയത്: ₹${paid}\nബാലൻസ് തുക: ₹${bal}\n\nദയവായി കണക്ക് തീർക്കുക.`;
            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        };

        document.getElementById('saveRentBtn').addEventListener('click', async () => {
            const itemName = document.getElementById('itemName').value;
            if (!itemName) return alert("ഉപകരണത്തിന്റെ പേര് നൽകുക!");

            await addDoc(collection(db, "rentals"), {
                meshtriOwner: currentMeshtri,
                item: itemName,
                qty: document.getElementById('itemQty').value || 1,
                site: document.getElementById('siteName').value || '',
                shop: document.getElementById('shopName').value || 'കട',
                client: document.getElementById('clientName').value || '',
                phone: document.getElementById('shopPhone').value || '',
                start: document.getElementById('startDate').value,
                end: document.getElementById('endDate').value,
                unitRent: parseFloat(document.getElementById('unitRent').value) || 0,
                total: parseFloat(document.getElementById('totalRent').value) || 0,
                paid: parseFloat(document.getElementById('paidRent').value) || 0,
                isReturned: false
            });
            showToast("🚀 വാടക വിവരങ്ങൾ വിജയകരമായി ചേർത്തു!");
            
            document.getElementById('itemName').value = '';
            document.getElementById('itemQty').value = '';
            document.getElementById('siteName').value = '';
            document.getElementById('shopName').value = '';
            document.getElementById('clientName').value = '';
            document.getElementById('shopPhone').value = '';
            document.getElementById('unitRent').value = '';
            document.getElementById('totalRent').value = '';
            document.getElementById('paidRent').value = '';
        });

        document.getElementById('searchInput').addEventListener('input', () => {
            loadData();
        });

        let cachedSnapshot = null;
        function loadData() {
            if (!cachedSnapshot) return;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const list = document.getElementById('rentList');
            list.innerHTML = `<h2 class="font-black text-white mb-2 text-sm">${currentFilter === 'active' ? 'നടന്നുകൊണ്ടിരിക്കുന്ന ഉപകരണങ്ങൾ' : 'തിരികെ നൽകിയ ഉപകരണങ്ങൾ'}</h2>`;
            
            cachedSnapshot.forEach((d) => {
                const r = d.data();
                const matchesSearch = r.item.toLowerCase().includes(searchTerm) || r.shop.toLowerCase().includes(searchTerm) || (r.site && r.site.toLowerCase().includes(searchTerm));
                
                if (r.meshtriOwner === currentMeshtri && matchesSearch) {
                    const isRet = r.isReturned === true;
                    if ((currentFilter === 'active' && !isRet) || (currentFilter === 'returned' && isRet)) {
                        
                        let calculatedTotal = parseFloat(r.total) || 0;
                        const today = new Date();
                        const startDate = new Date(r.start);
                        const endDate = new Date(r.end);
                        const unitPerDay = (parseFloat(r.unitRent) || 0) * (parseFloat(r.qty) || 1);

                        let totalDays = Math.ceil((endDate - startDate) / (1000 * 60 * 60 * 24)) + 1;

                        if (!isRet && today > endDate) {
                            const extraDays = Math.ceil((today - endDate) / (1000 * 60 * 60 * 24));
                            const baseDays = totalDays;
                            totalDays += extraDays;
                            calculatedTotal = (baseDays * unitPerDay) + (extraDays * unitPerDay);
                        }

                        const bal = calculatedTotal - (parseFloat(r.paid) || 0);

                        const div = document.createElement('div');
                        div.className = `bg-slate-900/90 border border-slate-800 p-5 rounded-2xl border-l-4 ${bal > 0 ? 'border-red-500' : 'border-green-500'} shadow-xl mb-4 text-white backdrop-blur-sm`;
                        div.innerHTML = `
                            <div class="flex justify-between items-start mb-1">
                                <p class="font-black text-white text-base">${r.item} <span class="text-xs font-normal text-slate-400">(${r.qty} എണ്ണം)</span></p>
                                <div class="flex gap-1">
                                    <button onclick="editItemDetails('${d.id}', '${r.item}', '${r.qty}', '${r.shop}', '${r.client || ''}', '${r.site || ''}')" class="bg-cyan-900/50 text-cyan-300 border border-cyan-700/50 px-2.5 py-1 rounded-lg text-[10px] font-black">എഡിറ്റ്</button>
                                    <button onclick="toggleReturn('${d.id}', ${isRet})" class="text-[10px] font-black px-2.5 py-1 rounded-lg border ${isRet ? 'bg-emerald-900/50 text-emerald-300 border-emerald-700/50' : 'bg-slate-800 text-slate-300 border-slate-700'}">
                                        ${isRet ? '✓ തിരികെ നൽകി' : 'റിട്ടേൺ'}
                                    </button>
                                </div>
                            </div>
                            ${r.site ? `<p class="text-xs text-cyan-400 font-bold mb-1">🏗️ സൈറ്റ്: ${r.site}</p>` : ''}
                            <p class="text-xs text-slate-300 font-bold mb-1">കട: <span class="text-amber-400">${r.shop}</span> ${r.client ? `| ആർക്ക്: <span class="text-cyan-300">${r.client}</span>` : ''} | 📞 ${r.phone}</p>
                            <p class="text-[11px] text-slate-400 mb-2">തീയതി: ${r.start} മുതൽ ${r.end} വരെ | <strong class="text-amber-300">${totalDays} ദിവസങ്ങൾ</strong> (ഒരെണ്ണത്തിന് പ്രതിദിനം: ₹${r.unitRent})</p>
                            
                            <div class="border-t border-slate-800 pt-2 flex flex-col gap-2">
                                <div class="flex justify-between items-center text-xs font-black text-slate-200">
                                    <span>ആകെ: ₹${calculatedTotal} | നൽകിയത്: ₹${r.paid}</span>
                                    <span class="${bal > 0 ? 'text-red-400' : 'text-emerald-400'}">ബാലൻസ്: ₹${bal}</span>
                                </div>
                                
                                <div class="flex items-center justify-between pt-2 gap-1">
                                    <button onclick="shareWhatsApp('${r.item}', '${r.qty}', '${r.site || ''}', '${r.shop}', '${r.client || ''}', ${calculatedTotal}, ${r.paid}, ${bal}, ${totalDays})" class="bg-emerald-700 hover:bg-emerald-600 text-white px-2.5 py-1.5 rounded-xl text-[10px] font-black flex items-center gap-1 shadow-md">
                                        💬 വാട്സാപ്പ്
                                    </button>
                                    
                                    <div class="flex items-center gap-1">
                                        ${bal > 0 ? `<button onclick="settleFull('${d.id}', ${calculatedTotal})" class="bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1.5 rounded-xl text-[10px] font-black">സെറ്റിൽ</button>` : ''}
                                        <button onclick="editRent('${d.id}', ${r.paid})" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-2.5 py-1.5 rounded-xl text-[10px] font-black">പെയ്മെന്റ്</button>
                                        <button onclick="deleteRent('${d.id}')" class="bg-red-600 hover:bg-red-500 text-white px-2.5 py-1.5 rounded-xl text-[10px] font-black shadow-md">ഡിലീറ്റ്</button>
                                    </div>
                                </div>
                            </div>
                        `;
                        list.appendChild(div);
                    }
                }
            });
        }

        onSnapshot(collection(db, "rentals"), (snapshot) => {
            cachedSnapshot = snapshot;
            loadData();
        });
    </script>
</body>
</html>
