    <!-- ജാവാസ്ക്രിപ്റ്റ് ഭാഗം പൂർണ്ണമായി -->
    <script type="module">
        import { setupHeader } from './header.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof setupHeader === 'function') setupHeader('appHeader');
        });

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            databaseURL: "https://mesthri-app-default-rtdb.firebaseio.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d",
            measurementId: "G-J9Y5TW9D7T"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const currentMeshtri = localStorage.getItem('userName') || "പൊതുമേസ്തിരി";
        document.getElementById('loggedInMeshtri').innerText = "സ്വാഗതം, " + currentMeshtri;

        window.showToast = (message, isSuccess = true) => {
            const toast = document.getElementById('customToast');
            toast.innerText = message;
            toast.className = `fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 px-8 py-4 rounded-3xl shadow-2xl font-black text-base z-50 transition-all duration-300 text-center ${isSuccess ? 'bg-emerald-950 border-2 border-emerald-500 text-emerald-200' : 'bg-red-950 border-2 border-red-500 text-red-200'} opacity-100 scale-105`;
            setTimeout(() => {
                toast.className = "fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-900 border-2 border-amber-400 text-amber-300 px-8 py-4 rounded-3xl shadow-2xl font-black text-base z-50 transition-all duration-300 opacity-0 pointer-events-none text-center scale-100";
            }, 2500);
        };

        // ആപ്പിന്റെ ലുക്ക് ഭംഗിയാക്കാൻ മൈക്ക് എന്ന എഴുത്ത് പൂർണ്ണമായി ഒഴിവാക്കി
window.startVoiceInputFor = (fieldId) => {
    const target = document.getElementById(fieldId);
    if (!target) return;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'ml-IN';
    recognition.start();

    // മൈക്ക് ഓൺ ആകുമ്പോൾ ഒരു ചെറിയ വിഷ്വൽ എഫക്റ്റ് നൽകാം
    target.style.borderColor = "#fbbf24"; 

    recognition.onresult = (e) => {
        target.value = e.results[0][0].transcript;
        target.dispatchEvent(new Event('input'));
    };

    recognition.onend = () => {
        target.style.borderColor = ""; // സാധാരണ നിലയിലേക്ക്
    };
};


            showToast("🎙️ സംസാരിക്കൂ...");
            
            recognition.onresult = (e) => {
                const target = document.getElementById(fieldId);
                if (target) {
                    target.value = e.results[0][0].transcript;
                    target.dispatchEvent(new Event('input'));
                }
                showToast("✓ കേട്ടെടുത്തു!");
            };

            recognition.onerror = (event) => {
                showToast("ശബ്ദം വ്യക്തമല്ല, വീണ്ടും ശ്രമിക്കുക", false);
            };

            recognition.start();
        };

        window.openCustomPrompt = (title, placeholder) => new Promise(resolve => {
            const modal = document.getElementById('customPromptModal');
            document.getElementById('promptTitle').innerText = title;
            const input = document.getElementById('promptInput');
            input.placeholder = placeholder; input.value = '';
            modal.classList.remove('hidden');
            input.focus();
            document.getElementById('promptOkBtn').onclick = () => { modal.classList.add('hidden'); resolve(input.value); };
            document.getElementById('promptCancelBtn').onclick = () => { modal.classList.add('hidden'); resolve(null); };
        });

        window.openCustomConfirm = (title) => new Promise(resolve => {
            const modal = document.getElementById('customConfirmModal');
            document.getElementById('confirmTitle').innerText = title;
            modal.classList.remove('hidden');
            document.getElementById('confirmOkBtn').onclick = () => { modal.classList.add('hidden'); resolve(true); };
            document.getElementById('confirmCancelBtn').onclick = () => { modal.classList.add('hidden'); resolve(false); };
        });

        let currentFilter = 'active';
        window.setFilter = (filter) => {
            currentFilter = filter;
            document.getElementById('filterActiveBtn').className = `flex-1 py-2.5 rounded-xl text-xs font-black transition ${filter === 'active' ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300 border border-slate-700'}`;
            document.getElementById('filterReturnedBtn').className = `flex-1 py-2.5 rounded-xl text-xs font-black transition ${filter === 'returned' ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300 border border-slate-700'}`;
            loadData();
        };

        function calculateTotal() {
            const start = new Date(document.getElementById('startDate').value);
            const end = new Date(document.getElementById('endDate').value);
            const unitRent = parseFloat(document.getElementById('unitRent').value) || 0;
            const qty = parseFloat(document.getElementById('itemQty').value) || 1;
            
            if (start && end && end >= start) {
                const diffDays = Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1;
                document.getElementById('totalRent').value = diffDays * unitRent * qty;
            }
        }
        document.querySelectorAll('input').forEach(input => input.addEventListener('input', calculateTotal));

        window.editItemDetails = async (id, currentItem, currentQty, currentShop, currentClient, currentSite) => {
            const newName = await openCustomPrompt("ഉപകരണത്തിന്റെ പുതിയ പേര്:", currentItem);
            if (newName === null) return;
            const newQty = await openCustomPrompt("പുതിയ എണ്ണം:", currentQty);
            if (newQty === null) return;
            const newSite = await openCustomPrompt("സൈറ്റിന്റെ പേര്:", currentSite);
            if (newSite === null) return;
            const newShop = await openCustomPrompt("കടയുടെ പേര്:", currentShop);
            if (newShop === null) return;
            const newClient = await openCustomPrompt("നൽകിയ ആളിന്റെ പേര്:", currentClient);
            if (newClient === null) return;

            if(newName && newShop) {
                await updateDoc(doc(db, "rentals", id), { item: newName, qty: newQty, site: newSite || '', shop: newShop, client: newClient || '' });
                showToast("✏️ വിവരങ്ങൾ എഡിറ്റ് ചെയ്തു!");
            }
        };

        window.editRent = async (id, currentPaid) => {
            const extraPaid = await openCustomPrompt("ഇപ്പോൾ നൽകിയ തുക എത്രയാണ്?", "തുക (₹)");
            if(extraPaid) {
                await updateDoc(doc(db, "rentals", id), { paid: parseFloat(currentPaid) + parseFloat(extraPaid) });
                showToast("✨ പെയ്മെന്റ് അപ്ഡേറ്റ് ചെയ്തു!");
            }
        };

        window.settleFull = async (id, total) => {
            if(await openCustomConfirm("ബാക്കി തുക മുഴുവൻ അടച്ചു തീർത്ത് അക്കൗണ്ട് ക്ലിയർ ചെയ്യണോ?")) {
                await updateDoc(doc(db, "rentals", id), { paid: total });
                showToast("🎉 അക്കൗണ്ട് സെറ്റിൽ ചെയ്തു!");
            }
        };

        window.toggleReturn = async (id, currentStatus) => {
            const newStatus = !currentStatus;
            await updateDoc(doc(db, "rentals", id), { isReturned: newStatus });
            showToast(newStatus ? "📦 ഉപകരണം തിരികെ നൽകി!" : "🔄 വാടക സ്റ്റാറ്റസ് മാറ്റി!");
        };

        window.deleteRent = async (id) => {
            if(await openCustomConfirm("ഈ ഡാറ്റ ഡിലീറ്റ് ചെയ്യണോ?")) {
                await deleteDoc(doc(db, "rentals", id));
                showToast("🗑️ ഡിലീറ്റ് ചെയ്തു!", false);
            }
        };

        window.shareWhatsApp = (item, qty, site, shop, client, total, paid, bal, totalDays) => {
            const msg = `*വാടക ഉപകരണ കണക്ക് (മേസ്തിരി പ്രോ)*\n\nഉപകരണം: ${item} (${qty} എണ്ണം)\nസൈറ്റ്: ${site || 'പറഞ്ഞിട്ടില്ല'}\nകട: ${shop}\nആർക്ക് നൽകി: ${client || 'നൽകിയിട്ടില്ല'}\nആകെ ദിവസങ്ങൾ: ${totalDays}\nആകെ വാടക: ₹${total}\nനൽകിയത്: ₹${paid}\nബാലൻസ് തുക: ₹${bal}\n\nദയവായി കണക്ക് തീർക്കുക.`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
        };

        document.getElementById('saveRentBtn').addEventListener('click', async () => {
            const itemName = document.getElementById('itemName').value;
            if (!itemName) return alert("ഉപകരണത്തിന്റെ പേര് നൽകുക!");

            await addDoc(collection(db, "rentals"), {
                meshtriOwner: currentMeshtri,
                item: itemName,
                qty: document.getElementById('itemQty').value || 1,
                site: document.getElementById('siteName').value || '',
                shop: document.getElementById('shopName').value || 'കട',
                client: document.getElementById('clientName').value || '',
                phone: document.getElementById('shopPhone').value || '',
                start: document.getElementById('startDate').value,
                end: document.getElementById('endDate').value,
                unitRent: parseFloat(document.getElementById('unitRent').value) || 0,
                total: parseFloat(document.getElementById('totalRent').value) || 0,
                paid: parseFloat(document.getElementById('paidRent').value) || 0,
                isReturned: false
            });
            showToast("🚀 വിജയകരമായി ചേർത്തു!");
            
            document.getElementById('itemName').value = '';
            document.getElementById('itemQty').value = '';
            document.getElementById('siteName').value = '';
            document.getElementById('shopName').value = '';
            document.getElementById('clientName').value = '';
            document.getElementById('shopPhone').value = '';
            document.getElementById('unitRent').value = '';
            document.getElementById('totalRent').value = '';
            document.getElementById('paidRent').value = '';
        });

        document.getElementById('searchInput').addEventListener('input', () => loadData());

        let cachedSnapshot = null;
        function loadData() {
            if (!cachedSnapshot) return;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const list = document.getElementById('rentList');
            list.innerHTML = `<h2 class="font-black text-white mb-2 text-sm">${currentFilter === 'active' ? 'നടന്നുകൊണ്ടിരിക്കുന്ന ഉപകരണങ്ങൾ' : 'തിരികെ നൽകിയ ഉപകരണങ്ങൾ'}</h2>`;
            
            let grandTotalRent = 0, grandTotalPaid = 0;
            let reminders = [];
            const today = new Date();

            cachedSnapshot.forEach((d) => {
                const r = d.data();
                if (r.meshtriOwner === currentMeshtri) {
                    const isRet = r.isReturned === true;
                    let calculatedTotal = parseFloat(r.total) || 0;
                    const startDate = new Date(r.start);
                    const endDate = new Date(r.end);
                    const unitPerDay = (parseFloat(r.unitRent) || 0) * (parseFloat(r.qty) || 1);
                    let totalDays = Math.ceil((endDate - startDate) / (1000 * 60 * 60 * 24)) + 1;

                    if (!isRet && today > endDate) {
                        const extraDays = Math.ceil((today - endDate) / (1000 * 60 * 60 * 24));
                        totalDays += extraDays;
                        calculatedTotal = ((totalDays - extraDays) * unitPerDay) + (extraDays * unitPerDay);
                        reminders.push(`${r.item} (${r.shop}) - കാലാവധി കഴിഞ്ഞിരിക്കുന്നു!`);
                    }

                    if (!isRet) {
                        grandTotalRent += calculatedTotal;
                        grandTotalPaid += (parseFloat(r.paid) || 0);
                    }

                    const matchesSearch = r.item.toLowerCase().includes(searchTerm) || r.shop.toLowerCase().includes(searchTerm) || (r.site && r.site.toLowerCase().includes(searchTerm));
                    
                    if (matchesSearch && ((currentFilter === 'active' && !isRet) || (currentFilter === 'returned' && isRet))) {
                        const bal = calculatedTotal - (parseFloat(r.paid) || 0);

                        const div = document.createElement('div');
                        div.className = `bg-slate-900/90 border border-slate-800 p-5 rounded-2xl border-l-4 ${bal > 0 ? 'border-red-500' : 'border-green-500'} shadow-xl mb-4 text-white backdrop-blur-sm`;
                        div.innerHTML = `
                            <div class="flex justify-between items-start mb-1">
                                <p class="font-black text-white text-base">${r.item} <span class="text-xs font-normal text-slate-400">(${r.qty} എണ്ണം)</span></p>
                                <div class="flex gap-1">
                                    <button onclick="editItemDetails('${d.id}', '${r.item}', '${r.qty}', '${r.shop}', '${r.client || ''}', '${r.site || ''}')" class="bg-cyan-900/50 text-cyan-300 border border-cyan-700/50 px-2.5 py-1 rounded-lg text-[10px] font-black">എഡിറ്റ്</button>
                                    <button onclick="toggleReturn('${d.id}', ${isRet})" class="text-[10px] font-black px-2.5 py-1 rounded-lg border ${isRet ? 'bg-emerald-900/50 text-emerald-300 border-emerald-700/50' : 'bg-slate-800 text-slate-300 border-slate-700'}">
                                        ${isRet ? '✓ തിരികെ നൽകി' : 'റിട്ടേൺ'}
                                    </button>
                                </div>
                            </div>
                            ${r.site ? `<p class="text-xs text-cyan-400 font-bold mb-1">🏗️ സൈറ്റ്: ${r.site}</p>` : ''}
                            <p class="text-xs text-slate-300 font-bold mb-1">കട: <span class="text-amber-400">${r.shop}</span> ${r.client ? `| ആർക്ക്: <span class="text-cyan-300">${r.client}</span>` : ''} | 📞 ${r.phone}</p>
                            <p class="text-[11px] text-slate-400 mb-2">തീയതി: ${r.start} മുതൽ ${r.end} വരെ | <strong class="text-amber-300">${totalDays} ദിവസങ്ങൾ</strong></p>
                            
                            <div class="border-t border-slate-800 pt-2 flex flex-col gap-2">
                                <div class="flex justify-between items-center text-xs font-black text-slate-200">
                                    <span>ആകെ: ₹${calculatedTotal} | നൽകിയത്: ₹${r.paid}</span>
                                    <span class="${bal > 0 ? 'text-red-400' : 'text-emerald-400'}">ബാലൻസ്: ₹${bal}</span>
                                </div>
                                
                                <div class="flex items-center justify-between pt-2 gap-1">
                                    <button onclick="shareWhatsApp('${r.item}', '${r.qty}', '${r.site || ''}', '${r.shop}', '${r.client || ''}', ${calculatedTotal}, ${r.paid}, ${bal}, ${totalDays})" class="bg-emerald-700 hover:bg-emerald-600 text-white px-2.5 py-1.5 rounded-xl text-[10px] font-black flex items-center gap-1 shadow-md">
                                        💬 വാട്സാപ്പ്
                                    </button>
                                    
                                    <div class="flex items-center gap-1">
                                        ${bal > 0 ? `<button onclick="settleFull('${d.id}', ${calculatedTotal})" class="bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1.5 rounded-xl text-[10px] font-black">സെറ്റിൽ</button>` : ''}
                                        <button onclick="editRent('${d.id}', ${r.paid})" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-2.5 py-1.5 rounded-xl text-[10px] font-black">പെയ്മെന്റ്</button>
                                        <button onclick="deleteRent('${d.id}')" class="bg-red-600 hover:bg-red-500 text-white px-2.5 py-1.5 rounded-xl text-[10px] font-black shadow-md">ഡിലീറ്റ്</button>
                                    </div>
                                </div>
                            </div>
                        `;
                        list.appendChild(div);
                    }
                }
            });

            const totalBal = grandTotalRent - grandTotalPaid;
            document.getElementById('statTotalRent').innerText = `₹${grandTotalRent}`;
            document.getElementById('statTotalBal').innerText = `₹${totalBal}`;
            
            const paidPercentage = grandTotalRent > 0 ? (grandTotalPaid / grandTotalRent) * 100 : 0;
            document.getElementById('barPaid').style.width = `${Math.min(paidPercentage, 100)}%`;
            document.getElementById('barBal').style.width = `${Math.max(100 - paidPercentage, 0)}%`;

            const reminderBox = document.getElementById('reminderBox');
            const reminderList = document.getElementById('reminderList');
            if (reminders.length > 0) {
                reminderBox.classList.remove('hidden');
                reminderList.innerHTML = reminders.map(rem => `<p>• ${rem}</p>`).join('');
            } else {
                reminderBox.classList.add('hidden');
            }
        }

        onSnapshot(collection(db, "rentals"), (snapshot) => {
            cachedSnapshot = snapshot;
            loadData();
        });
    </script>
</body>
</html>
