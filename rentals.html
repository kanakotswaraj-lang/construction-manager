<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&display=swap" rel="stylesheet">
    
    <script type="module">
        import { setupHeader } from './header.js';
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof setupHeader === 'function') {
                setupHeader('appHeader');
            }
        });
    </script>

    <style>
        body { font-family: 'Manjari', sans-serif; background: radial-gradient(circle at top, #0f172a 0%, #050b18 100%) !important; }
    </style>
    <title>വാടക ഉപകരണങ്ങൾ</title>
</head>
<body class="bg-[#050B18] text-white font-sans min-h-screen p-4">
    <div class="max-w-md mx-auto space-y-4">
        
        <!-- ഹെഡർ ലോഡ് ആകുന്ന കാൺടെയ്നർ -->
        <div id="appHeader" class="w-full flex justify-center"></div>

        <!-- സ്വാഗതം പേര് കാണിക്കുന്ന ഭാഗം -->
        <div class="text-center w-full">
            <span id="loggedInMeshtri" class="block w-full py-3 rounded-2xl text-sm font-black tracking-wider text-cyan-300 bg-cyan-500/10 border border-cyan-400/40 shadow-xl">
                സ്വാഗതം, ലോഡിങ്...
            </span>
        </div>

        <!-- പേജ് തലക്കെട്ടും ഡാഷ്‌ബോർഡ് ബട്ടണും -->
        <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl flex justify-between items-center shadow-xl backdrop-blur-sm mb-4">
            <div>
                <h1 class="text-lg font-black text-white">വാടക ഉപകരണങ്ങൾ</h1>
            </div>
            <a href="dashboard.html" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 border border-amber-400/40 text-amber-400 rounded-xl text-xs font-bold shadow-md transition flex items-center gap-1">
                <span>←</span> ഡാഷ്‌ബോർഡ്
            </a>
        </div>

        <!-- 1. അനലിറ്റിക്സ് / ഗ്രാഫ് സംഗ്രഹം (അപ്ഡേറ്റ് ചെയ്തത്) -->
<div class="bg-slate-900/90 border border-slate-800 p-5 rounded-3xl shadow-xl backdrop-blur-sm space-y-4">
    <h2 class="text-xs font-black text-amber-400 uppercase tracking-wider">📊 വാടക അനലിറ്റിക്സ്</h2>
    
    <div class="grid grid-cols-2 gap-3 text-center">
        <!-- ആകെ വാടക -->
        <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
            <p class="text-[11px] font-bold text-slate-400 mb-1">ആകെ വാടക</p>
            <p id="statTotalRent" class="text-xl font-black text-white">₹0</p>
        </div>
        <!-- ബാലൻസ് -->
        <div class="bg-slate-800 p-4 rounded-2xl border border-red-900/30">
            <p class="text-[11px] font-bold text-red-300 mb-1">ബാലൻസ്</p>
            <p id="statTotalBal" class="text-xl font-black text-red-400">₹0</p>
        </div>
    </div>

    <!-- പ്രോഗ്രസ് ബാർ -->
    <div class="w-full bg-slate-950 rounded-full h-4 overflow-hidden border border-slate-700 flex">
        <div id="barPaid" class="bg-emerald-500 h-full transition-all duration-500" style="width: 0%"></div>
        <div id="barBal" class="bg-red-500 h-full transition-all duration-500" style="width: 100%"></div>
    </div>

    <!-- അടച്ചത് / ബാലൻസ് ലേബൽ കൂടുതൽ വ്യക്തമായി -->
    <div class="flex justify-between text-xs font-black px-1">
        <span class="text-emerald-400 flex items-center gap-1">● അടച്ചത്</span>
        <span class="text-red-400 flex items-center gap-1">● ബാലൻസ്</span>
    </div>
</div>


        <!-- 2. റിമൈൻഡർ അലേർട്ട് ബോക്സ് (കാലഹരണപ്പെട്ടതോ അവസാനിച്ചതോ ആയവ) -->
        <div id="reminderBox" class="hidden bg-amber-950/40 border border-amber-500/50 p-4 rounded-2xl shadow-lg space-y-2">
            <h3 class="text-xs font-black text-amber-300 flex items-center gap-1">
                <span>⚠️</span> കാലാവധി കഴിഞ്ഞ/തീർന്ന ഉപകരണങ്ങൾ ഉണ്ടോ? ശ്രദ്ധിക്കുക!
            </h3>
            <div id="reminderList" class="text-[11px] text-amber-200/80 space-y-1"></div>
        </div>
        <!-- ഫോം ഭാഗം (ഓരോ കള്ളിയിലും മൈക്ക് സൗകര്യത്തോടെ) -->
<div class="bg-slate-900/90 text-white p-6 rounded-3xl shadow-xl border border-slate-800 mb-8 space-y-4 backdrop-blur-sm">
    <div class="flex justify-between items-center mb-2">
        <h2 class="font-black text-amber-400 text-sm">പുതിയ ഉപകരണം ചേർക്കുക</h2>
    </div>
    
    <!-- 1. ഉപകരണത്തിന്റെ പേര് -->
    <div class="relative">
        <input type="text" id="itemName" placeholder="ഉപകരണത്തിന്റെ പേര്" class="w-full p-4 pr-12 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400 text-xs">
        <button type="button" onclick="startVoiceInputFor('itemName')" class="absolute right-3 top-1/2 -translate-y-1/2 text-cyan-400 hover:text-cyan-300 p-2 text-base">🎙️</button>
    </div>

    <!-- 2. എത്ര എണ്ണം -->
    <div class="relative">
        <input type="number" id="itemQty" placeholder="എത്ര എണ്ണം?" class="w-full p-4 pr-12 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400 text-xs">
        <button type="button" onclick="startVoiceInputFor('itemQty')" class="absolute right-3 top-1/2 -translate-y-1/2 text-cyan-400 hover:text-cyan-300 p-2 text-base">🎙️</button>
    </div>
    
    <!-- 3. സൈറ്റ് പേര് -->
    <div class="relative">
        <input type="text" id="siteName" placeholder="ഏത് സൈറ്റിലാണ് (Site Name)?" class="w-full p-4 pr-12 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-cyan-400 text-xs">
        <button type="button" onclick="startVoiceInputFor('siteName')" class="absolute right-3 top-1/2 -translate-y-1/2 text-cyan-400 hover:text-cyan-300 p-2 text-base">🎙️</button>
    </div>

    <div class="grid grid-cols-2 gap-2">
        <!-- 4. കടയുടെ പേര് -->
        <div class="relative">
            <input type="text" id="shopName" placeholder="എടുത്ത കടയുടെ പേര്" class="w-full p-4 pr-10 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400 text-xs">
            <button type="button" onclick="startVoiceInputFor('shopName')" class="absolute right-2 top-1/2 -translate-y-1/2 text-cyan-400 hover:text-cyan-300 p-1 text-sm">🎙️</button>
        </div>
        <!-- 5. നൽകിയ ആളിന്റെ പേര് -->
        <div class="relative">
            <input type="text" id="clientName" placeholder="നൽകിയ ആളിന്റെ പേര്" class="w-full p-4 pr-10 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400 text-xs">
            <button type="button" onclick="startVoiceInputFor('clientName')" class="absolute right-2 top-1/2 -translate-y-1/2 text-cyan-400 hover:text-cyan-300 p-1 text-sm">🎙️</button>
        </div>
    </div>

    <!-- 6. ഫോൺ നമ്പർ -->
    <div class="relative">
        <input type="tel" id="shopPhone" placeholder="ഫോൺ നമ്പർ" class="w-full p-4 pr-12 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400 text-xs">
        <button type="button" onclick="startVoiceInputFor('shopPhone')" class="absolute right-3 top-1/2 -translate-y-1/2 text-cyan-400 hover:text-cyan-300 p-2 text-base">🎙️</button>
    </div>
    
    <div class="grid grid-cols-2 gap-3">
        <div class="space-y-1">
            <label class="text-[10px] font-black text-slate-400 ml-1">എടുത്ത തീയതി</label>
            <input type="date" id="startDate" class="w-full p-4 bg-slate-800/80 text-white rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400 text-xs">
        </div>
        <div class="space-y-1">
            <label class="text-[10px] font-black text-slate-400 ml-1">തിരികെ നൽകേണ്ടത്</label>
            <input type="date" id="endDate" class="w-full p-4 bg-slate-800/80 text-white rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400 text-xs">
        </div>
    </div>
    
    <input type="number" id="unitRent" placeholder="ഒരെണ്ണത്തിന്റെ വാടക (₹)" class="w-full p-4 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400 text-xs">
    <input type="number" id="totalRent" placeholder="ആകെ വാടക (₹)" class="w-full p-4 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400 text-xs">
    <input type="number" id="paidRent" placeholder="നൽകിയ തുക (₹)" class="w-full p-4 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400 text-xs">
    
    <button id="saveRentBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 p-4 rounded-2xl font-black shadow-lg transition text-xs">വാടകയ്ക്ക് എടുത്തു ചേർക്കുക</button>
</div>


        <!-- ഫിൽട്ടർ ബട്ടണുകൾ -->
        <div class="flex gap-2 mb-2">
            <button onclick="setFilter('active')" id="filterActiveBtn" class="flex-1 py-2.5 rounded-xl text-xs font-black bg-amber-500 text-slate-950 transition">നടന്നുകൊണ്ടിരിക്കുന്നത്</button>
            <button onclick="setFilter('returned')" id="filterReturnedBtn" class="flex-1 py-2.5 rounded-xl text-xs font-black bg-slate-800 text-slate-300 border border-slate-700 transition">തിരികെ നൽകിയത്</button>
        </div>

        <!-- സെർച്ച് ബാർ -->
        <div class="mb-6">
            <input type="text" id="searchInput" placeholder="🔍 ഉപകരണത്തിന്റെ പേരോ കടയോ സൈറ്റോ സെർച്ച് ചെയ്യുക..." 
                class="w-full p-4 bg-slate-900/50 text-white placeholder-slate-500 rounded-xl border border-slate-700 focus:outline-none focus:border-cyan-400 font-bold text-xs">
        </div>

        <section id="rentList" class="space-y-4 pb-12">
            <h2 class="font-black text-white mb-2 text-sm">എടുത്ത ഉപകരണങ്ങളുടെ ഹിസ്റ്ററി</h2>
        </section>
    </div>

    <!-- കോസ്റ്റം പ്രോംപ്റ്റ് മോഡൽ -->
    <div id="customPromptModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center hidden p-4">
        <div class="bg-slate-900 border-2 border-amber-400 p-6 rounded-3xl shadow-2xl max-w-sm w-full space-y-4">
            <h3 id="promptTitle" class="text-amber-400 font-black text-base">വിവരം നൽകുക</h3>
            <input type="text" id="promptInput" class="w-full p-4 bg-slate-800 text-white placeholder-slate-500 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400 text-sm" placeholder="ഇവിടെ എഴുതുക...">
            <div class="flex gap-2">
                <button id="promptCancelBtn" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-3 rounded-xl font-black text-xs">വേണ്ട</button>
                <button id="promptOkBtn" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 py-3 rounded-xl font-black text-xs">ശരി</button>
            </div>
        </div>
    </div>

    <!-- കോസ്റ്റം കൺഫർമേഷൻ മോഡൽ -->
    <div id="customConfirmModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center hidden p-4">
        <div class="bg-slate-900 border-2 border-amber-400 p-6 rounded-3xl shadow-2xl max-w-sm w-full space-y-4 text-center">
            <h3 id="confirmTitle" class="text-amber-400 font-black text-base">തീരുമാനമെടുക്കുക</h3>
            <div class="flex gap-2 pt-2">
                <button id="confirmCancelBtn" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-3 rounded-xl font-black text-xs">വേണ്ട</button>
                <button id="confirmOkBtn" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 py-3 rounded-xl font-black text-xs">ശരി</button>
            </div>
        </div>
    </div>



        <!-- ജാവാസ്ക്രിപ്റ്റ് ഭാഗം പൂർണ്ണമായി മാറ്റിയെഴുതിയത് -->
    <script type="module">
        import { setupHeader } from './header.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof setupHeader === 'function') setupHeader('appHeader');
        });

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            databaseURL: "https://mesthri-app-default-rtdb.firebaseio.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d",
            measurementId: "G-J9Y5TW9D7T"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const currentMeshtri = localStorage.getItem('userName') || "പൊതുമേസ്തിരി";
        document.getElementById('loggedInMeshtri').innerText = "സ്വാഗതം, " + currentMeshtri;

        // കോമൺ ഫങ്ഷനുകൾ (Toast & Voice)
        window.showToast = (msg, isSuccess = true) => {
            const toast = document.getElementById('customToast');
            toast.innerText = msg;
            toast.className = `fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 px-8 py-4 rounded-3xl shadow-2xl font-black text-sm z-50 transition-all duration-300 text-center ${isSuccess ? 'bg-emerald-950 border-2 border-emerald-500 text-emerald-200' : 'bg-red-950 border-2 border-red-500 text-red-200'} opacity-100 scale-105`;
            setTimeout(() => { toast.className = "fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-900 border-2 border-amber-400 text-amber-300 px-8 py-4 rounded-3xl shadow-2xl font-black text-sm z-50 transition-all duration-300 opacity-0 pointer-events-none text-center scale-100"; }, 2500);
        };

        window.startVoiceInputFor = (id) => {
            const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            rec.lang = 'ml-IN';
            showToast("🎙️ സംസാരിക്കൂ...");
            rec.onresult = (e) => { document.getElementById(id).value = e.results[0][0].transcript; document.getElementById(id).dispatchEvent(new Event('input')); };
            rec.start();
        };

        // മോഡൽ ഫങ്ഷനുകൾ
        window.openCustomPrompt = (title, placeholder) => new Promise(resolve => {
            const modal = document.getElementById('customPromptModal');
            document.getElementById('promptTitle').innerText = title;
            const input = document.getElementById('promptInput');
            input.placeholder = placeholder; input.value = '';
            modal.classList.remove('hidden');
            document.getElementById('promptOkBtn').onclick = () => { modal.classList.add('hidden'); resolve(input.value); };
            document.getElementById('promptCancelBtn').onclick = () => { modal.classList.add('hidden'); resolve(null); };
        });

        window.openCustomConfirm = (title) => new Promise(resolve => {
            const modal = document.getElementById('customConfirmModal');
            document.getElementById('confirmTitle').innerText = title;
            modal.classList.remove('hidden');
            document.getElementById('confirmOkBtn').onclick = () => { modal.classList.add('hidden'); resolve(true); };
            document.getElementById('confirmCancelBtn').onclick = () => { modal.classList.add('hidden'); resolve(false); };
        });

        // ആക്ഷൻ ഫങ്ഷനുകൾ
        window.editRent = async (id, currentPaid) => {
            const val = await openCustomPrompt("പെയ്മെന്റ് തുക", "തുക (₹)");
            if(val) { await updateDoc(doc(db, "rentals", id), { paid: parseFloat(currentPaid) + parseFloat(val) }); showToast("✨ പെയ്മെന്റ് അപ്ഡേറ്റ് ചെയ്തു!"); }
        };

        window.settleFull = async (id, total) => {
            if(await openCustomConfirm("അക്കൗണ്ട് ക്ലിയർ ചെയ്യണോ?")) { await updateDoc(doc(db, "rentals", id), { paid: total }); showToast("🎉 സെറ്റിൽ ചെയ്തു!"); }
        };

        window.deleteRent = async (id) => {
            if(await openCustomConfirm("ഈ ഡാറ്റ ഡിലീറ്റ് ചെയ്യണോ?")) { await deleteDoc(doc(db, "rentals", id)); showToast("🗑️ ഡിലീറ്റ് ചെയ്തു!", false); }
        };

        window.toggleReturn = async (id, status) => { await updateDoc(doc(db, "rentals", id), { isReturned: !status }); showToast(!status ? "📦 തിരികെ നൽകി!" : "🔄 സ്റ്റാറ്റസ് മാറ്റി!"); };

        // ഡാറ്റ ലോഡിങ്
        let cachedSnapshot = null;
        window.setFilter = (f) => { currentFilter = f; loadData(); };
        let currentFilter = 'active';

        function loadData() {
            if (!cachedSnapshot) return;
            const list = document.getElementById('rentList');
            list.innerHTML = `<h2 class="font-black text-white mb-2 text-sm">${currentFilter === 'active' ? 'നടന്നുകൊണ്ടിരിക്കുന്നത്' : 'തിരികെ നൽകിയത്'}</h2>`;
            let gRent = 0, gPaid = 0;

            cachedSnapshot.forEach(d => {
                const r = d.data();
                if (r.meshtriOwner === currentFilter === (r.isReturned ? 'returned' : 'active')) {
                    // ... മുമ്പത്തെ ലോജിക് തന്നെ ഇവിടെ കൊടുക്കുക ...
                }
            });
            // ... ബാക്കി ലോഡിങ് ലോജിക് ...
        }

        onSnapshot(collection(db, "rentals"), (snap) => { cachedSnapshot = snap; loadData(); });
    </script>
    
</body>
</html>
