<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&display=swap" rel="stylesheet">
    <script src="language.js"></script>
    <style>
    body { font-family: 'Manjari', sans-serif; }
    
    input, select {
        border: 2px solid rgba(51, 65, 85, 1);
        transition: all 0.3s ease;
        background-color: #1e293b !important;
        color: white !important;
    }

    input:focus, select:focus {
        border-color: #22d3ee !important; 
        outline: none;
        box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.2); 
    }

    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus {
        -webkit-box-shadow: 0 0 0 1000px #1e293b inset !important;
        -webkit-text-fill-color: white !important;
    }

    .mic-btn {
        position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
        color: #94a3b8; background: transparent;
        width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: none;
        display: flex; align-items: center; justify-content: center;
        z-index: 20;
        transition: all 0.2s ease;
    }
    .mic-btn:hover {
        background: rgba(34, 211, 238, 0.1);
        color: #22d3ee;
    }
</style>
    <title class="lang" data-key="rentals">വാടക ഉപകരണങ്ങൾ</title>

</head>
<body class="bg-[#050B18] text-white font-sans min-h-screen p-4">
    <div class="max-w-md mx-auto space-y-4">
        
        <!-- ഹെഡർ -->
        <div id="appHeader" class="w-full"></div>

        <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl flex justify-between items-center shadow-xl backdrop-blur-sm">
            <h1 class="text-lg font-black text-white lang" data-key="rentals">വാടക ഉപകരണങ്ങൾ</h1>

            <div class="flex gap-2">
                <a href="index.html" class="px-3 py-1.5 bg-amber-500 text-slate-950 rounded-xl text-xs font-black shadow-md lang" data-key="home_btn">🏠 ഹോം</a>
            </div>
        </div>

        <!-- സ്റ്റാറ്റിസ്റ്റിക്സ് & ഫിൽട്ടർ -->
        <div class="bg-slate-900/90 p-4 rounded-3xl shadow-xl border border-slate-800 space-y-3">
            <div class="grid grid-cols-2 gap-3 text-center">
                <div class="bg-slate-800/80 p-3 rounded-2xl border border-slate-700">
                    <p class="text-[11px] text-slate-400 font-bold lang" data-key="total_rent_label">ആകെ വാടക</p>
                    <p id="statTotalRent" class="text-base font-black text-amber-400">₹0</p>
                </div>
                <div class="bg-slate-800/80 p-3 rounded-2xl border border-slate-700">
                    <p class="text-[11px] text-slate-400 font-bold lang" data-key="balance_amount_label">ബാലൻസ് തുക</p>
                    <p id="statTotalBal" class="text-base font-black text-red-400">₹0</p>
                </div>
            </div>

            <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden flex border border-slate-700">
                <div id="barPaid" class="bg-emerald-500 h-full transition-all duration-500" style="width: 0%"></div>
                <div id="barBal" class="bg-red-500 h-full transition-all duration-500" style="width: 100%"></div>
            </div>

            <div id="reminderBox" class="hidden bg-red-500/10 border border-red-500/40 p-3 rounded-2xl text-red-300 text-xs space-y-1">
                <p class="font-black lang" data-key="overdue_equipments">🚨 കാലാവധി കഴിഞ്ഞ ഉപകരണങ്ങൾ:</p>
                <div id="reminderList"></div>
            </div>

            <div class="bg-slate-800/50 border border-slate-700 p-3 rounded-2xl space-y-2">
                <div class="flex justify-between items-center cursor-pointer" onclick="toggleShopList()">
                    <p class="text-xs font-black text-amber-400 lang" data-key="shops_list_edit">🏬 കടകളുടെ ലിസ്റ്റ് & എഡിറ്റ്‌ ചെയ്യാം</p>
                    <span id="shopToggleIcon" class="text-xs text-slate-400 font-bold lang" data-key="view_btn">▼ കാണുക</span>
                </div>
                <div id="shopDirectoryContainer" class="hidden space-y-2 pt-2 border-t border-slate-700 max-h-48 overflow-y-auto"></div>
            </div>

            <input type="text" id="searchInput" placeholder="🔍 തിരയുക (ഉപകരണം, കട, സൈറ്റ്...)" class="w-full p-3 bg-slate-800 rounded-2xl border border-slate-700 text-xs lang-placeholder" data-key-placeholder="search_placeholder">

            <div class="flex gap-2 w-full px-1 my-2">
                <button id="filter_active" onclick="setFilter('active')" class="lang flex-1 py-3 rounded-2xl text-[11px] font-black bg-amber-500 text-slate-950 transition-all" data-key="filter_active">നടന്നുകൊണ്ടിരിക്കുന്നത്</button>
                <button id="filter_returned" onclick="setFilter('returned')" class="lang flex-1 py-3 rounded-2xl text-[11px] font-black bg-slate-800 text-slate-400 border border-slate-700 transition-all" data-key="filter_returned">തിരികെ നൽകിയത്</button>
            </div>
        </div>

        <!-- ഫോം ഭാഗം -->
        <div class="bg-slate-900/90 p-6 rounded-3xl shadow-xl border border-slate-800 space-y-4">
            <h2 class="font-black text-amber-400 text-sm lang" data-key="add_new_equipment">പുതിയ ഉപകരണം ചേർക്കുക</h2>
            
            <div class="relative">
                <input type="text" id="itemName" placeholder="ഉപകരണത്തിന്റെ പേര്" class="w-full p-3.5 pr-12 bg-slate-800 rounded-2xl border border-slate-700 text-xs lang-placeholder" data-key-placeholder="item_name_placeholder">
                <button type="button" onclick="startVoiceInputFor('itemName')" class="mic-btn"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg></button>
            </div>

            <div class="relative">
                <input type="text" id="bedroomName" placeholder="ബെഡ്റൂം പേര്/നമ്പർ (ഉദാ: റൂം 1 / ഫസ്റ്റ് ഫ്ലോർ)" class="w-full p-3.5 pr-12 bg-slate-800 rounded-2xl border border-slate-700 text-xs lang-placeholder" data-key-placeholder="bedroom_placeholder">
                <button type="button" onclick="startVoiceInputFor('bedroomName')" class="mic-btn"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg></button>
            </div>

            <div class="relative">
                <input type="text" id="siteName" placeholder="സൈറ്റിന്റെ പേര്" class="w-full p-3.5 pr-12 bg-slate-800 rounded-2xl border border-slate-700 text-xs lang-placeholder" data-key-placeholder="site_name_placeholder">
                <button type="button" onclick="startVoiceInputFor('siteName')" class="mic-btn"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg></button>
            </div>

            <div class="relative">
                <input type="text" id="shopName" list="shopSuggestions" placeholder="കടയുടെ പേര് തിരഞ്ഞെടുക്കുക അല്ലെങ്കിൽ ടൈപ്പ് ചെയ്യുക" class="w-full p-3.5 pr-12 bg-slate-800 rounded-2xl border border-slate-700 text-xs lang-placeholder" data-key-placeholder="shop_name_placeholder">
                <datalist id="shopSuggestions"></datalist>
                <button type="button" onclick="startVoiceInputFor('shopName')" class="mic-btn"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg></button>
            </div>

            <div class="relative">
                <input type="text" id="clientName" list="clientSuggestions" placeholder="വാങ്ങിയ ആളിന്റെ പേര് തിരഞ്ഞെടുക്കുക" class="w-full p-3.5 pr-12 bg-slate-800 rounded-2xl border border-slate-700 text-xs lang-placeholder" data-key-placeholder="client_name_placeholder">
                <datalist id="clientSuggestions"></datalist>
                <button type="button" onclick="startVoiceInputFor('clientName')" class="mic-btn"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg></button>
            </div>

            <div class="relative flex gap-2">
                <input type="tel" id="shopPhone" placeholder="ഫോൺ നമ്പർ" class="w-full p-3.5 bg-slate-800 rounded-2xl border border-slate-700 text-xs lang-placeholder" data-key-placeholder="phone_placeholder">
                <button type="button" id="pickContactBtn" onclick="pickContact()" class="bg-cyan-700 hover:bg-cyan-600 text-white px-3.5 rounded-2xl text-xs font-black whitespace-nowrap shadow-md lang" data-key="contact_btn">📇 കോൺടാക്റ്റ്</button>
            </div>
            
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[10px] text-slate-400 font-bold block mb-1 lang" data-key="start_date_label">ആരംഭ തീയതി</label>
                    <input type="date" id="startDate" class="w-full p-3 bg-slate-800 rounded-2xl border border-slate-700 text-xs">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 font-bold block mb-1 lang" data-key="end_date_label">അവസാന തീയതി</label>
                    <input type="date" id="endDate" class="w-full p-3 bg-slate-800 rounded-2xl border border-slate-700 text-xs">
                </div>
            </div>

            <input type="number" id="itemQty" placeholder="എത്ര എണ്ണം?" class="w-full p-3.5 bg-slate-800 rounded-2xl border border-slate-700 text-xs lang-placeholder" data-key-placeholder="qty_placeholder">
            <input type="number" id="unitRent" placeholder="ഒരെണ്ണത്തിന്റെ വാടക (₹)" class="w-full p-3.5 bg-slate-800 rounded-2xl border border-slate-700 text-xs lang-placeholder" data-key-placeholder="unit_rent_placeholder">
            <input type="number" id="totalRent" placeholder="ആകെ വാടക (₹)" class="w-full p-3.5 bg-slate-800 rounded-2xl border border-slate-700 text-xs lang-placeholder" data-key-placeholder="total_rent_placeholder">
            <input type="number" id="paidRent" placeholder="ഇതുവരെ നൽകിയ മുൻകൂർ തുക (₹)" class="w-full p-3.5 bg-slate-800 rounded-2xl border border-slate-700 text-xs lang-placeholder" data-key-placeholder="paid_rent_placeholder">
            
            <button id="saveRentBtn" class="w-full bg-amber-500 text-slate-950 p-4 rounded-2xl font-black text-xs shadow-lg lang" data-key="add_rent_btn">വാടകയ്ക്ക് എടുത്തു ചേർക്കുക</button>
        </div>

        <div id="rentList" class="space-y-3"></div>
    </div>

    <!-- Modals -->
    <div id="customToast" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-900 border-2 border-amber-400 text-amber-300 px-8 py-4 rounded-3xl shadow-2xl font-black text-base z-50 transition-all duration-300 opacity-0 pointer-events-none text-center scale-100">ഫലം...</div>

    <div id="customPromptModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl w-full max-w-sm space-y-4 shadow-2xl">
            <h3 id="promptTitle" class="font-black text-amber-400 text-sm">ടൈറ്റിൽ</h3>
            <input type="text" id="promptInput" class="w-full p-4 bg-slate-800 rounded-2xl border border-slate-700 text-xs text-white">
            <div class="flex gap-2">
                <button id="promptCancelBtn" class="flex-1 bg-slate-800 text-slate-300 py-3 rounded-2xl text-xs font-black">ക്ൻസൽ</button>
                <button id="promptOkBtn" class="flex-1 bg-amber-500 text-slate-950 py-3 rounded-2xl text-xs font-black">ശരി</button>
            </div>
        </div>
    </div>

    <div id="customConfirmModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl w-full max-w-sm space-y-4 shadow-2xl text-center">
            <h3 id="confirmTitle" class="font-black text-white text-sm">ഉറപ്പാണോ?</h3>
            <div class="flex gap-2">
                <button id="confirmCancelBtn" class="flex-1 bg-slate-800 text-slate-300 py-3 rounded-2xl text-xs font-black">ഇല്ല</button>
                <button id="confirmOkBtn" class="flex-1 bg-red-600 text-white py-3 rounded-2xl text-xs font-black">ഉവ്വ്</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { setupHeader } from './header.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
        
        const currentMeshtri = localStorage.getItem('userName') || "പൊതുമേസ്തിരി";

        document.addEventListener("DOMContentLoaded", () => {
            try {
                if (typeof setupHeader === 'function') {
                    setupHeader('appHeader', true, currentMeshtri);
                } else {
                    document.getElementById('appHeader').innerHTML = `<h2 class="text-amber-400 font-black text-sm">മേസ്തിരി പ്രോ</h2>`;
                }
            } catch (e) {
                document.getElementById('appHeader').innerHTML = `<h2 class="text-amber-400 font-black text-sm">മേസ്തിരി പ്രോ</h2>`;
            }
        });

        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            databaseURL: "https://mesthri-app-default-rtdb.firebaseio.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.firebasestorage.app",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d35221d",
            measurementId: "G-J9Y5TW9D7T"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.showToast = (message, isSuccess = true) => {
            const toast = document.getElementById('customToast');
            toast.innerText = message;
            toast.className = `fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 px-8 py-4 rounded-3xl shadow-2xl font-black text-base z-50 transition-all duration-300 text-center ${isSuccess ? 'bg-emerald-950 border-2 border-emerald-500 text-emerald-200' : 'bg-red-950 border-2 border-red-500 text-red-200'} opacity-100 scale-105`;
            setTimeout(() => {
                toast.className = "fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-900 border-2 border-amber-400 text-amber-300 px-8 py-4 rounded-3xl shadow-2xl font-black text-base z-50 transition-all duration-300 opacity-0 pointer-events-none text-center scale-100";
            }, 2500);
        };

        window.pickContact = async () => {
            if ('contacts' in navigator && 'select' in navigator.contacts) {
                try {
                    const props = ['name', 'tel'];
                    const opts = { multiple: false };
                    const contacts = await navigator.contacts.select(props, opts);
                    if (contacts && contacts.length > 0) {
                        const contact = contacts[0];
                        if (contact.tel && contact.tel.length > 0) {
                            document.getElementById('shopPhone').value = contact.tel[0];
                            if (contact.name && contact.name.length > 0 && !document.getElementById('shopName').value) {
                                document.getElementById('shopName').value = contact.name[0];
                            }
                            window.showToast("📇 കോൺടാക്റ്റ് എടുത്തു!");
                        }
                    }
                } catch (ex) {
                    console.log(ex);
                    window.showToast("കോൺടാക്റ്റ് എടുക്കാൻ കഴിഞ്ഞില്ല", false);
                }
            } else {
                alert("നിങ്ങളുടെ ബ്രൗസർ കോൺടാക്റ്റ് പിക്കർ പിന്തുണയ്ക്കുന്നില്ല.");
            }
        };

        window.startVoiceInputFor = (fieldId) => {
            const target = document.getElementById(fieldId);
            if (!target) return;

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("നിങ്ങളുടെ ബ്രൗസർ വോയിസ് ഇൻപുട്ട് പിന്തുണയ്ക്കുന്നില്ല.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'ml-IN';
            target.style.borderColor = "#fbbf24"; 
            window.showToast("🎙️ സംസാരിക്കൂ...");

            try { recognition.start(); } catch (err) { console.log(err); }

            recognition.onresult = (e) => {
                target.value = e.results[0][0].transcript;
                target.dispatchEvent(new Event('input'));
                window.showToast("✓ കേട്ടെടുത്തു!");
            };
            recognition.onerror = () => { window.showToast("ശബ്ദം വ്യക്തമല്ല, വീണ്ടും ശ്രമിക്കുക", false); };
            recognition.onend = () => { target.style.borderColor = ""; };
        };

        window.openCustomPrompt = (title, placeholder) => new Promise(resolve => {
            const modal = document.getElementById('customPromptModal');
            document.getElementById('promptTitle').innerText = title;
            const input = document.getElementById('promptInput');
            input.placeholder = placeholder; input.value = '';
            modal.classList.remove('hidden');
            input.focus();
            document.getElementById('promptOkBtn').onclick = () => { modal.classList.add('hidden'); resolve(input.value); };
            document.getElementById('promptCancelBtn').onclick = () => { modal.classList.add('hidden'); resolve(null); };
        });

        window.openCustomConfirm = (title) => new Promise(resolve => {
            const modal = document.getElementById('customConfirmModal');
            document.getElementById('confirmTitle').innerText = title;
            modal.classList.remove('hidden');
            document.getElementById('confirmOkBtn').onclick = () => { modal.classList.add('hidden'); resolve(true); };
            document.getElementById('confirmCancelBtn').onclick = () => { modal.classList.add('hidden'); resolve(false); };
        });

        let currentFilter = 'active';
        window.setFilter = (filter) => {
            currentFilter = filter;
            document.getElementById('filter_active').className = `lang flex-1 py-3 rounded-2xl text-[11px] font-black transition-all ${filter === 'active' ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-400 border border-slate-700'}`;
            document.getElementById('filter_returned').className = `lang flex-1 py-3 rounded-2xl text-[11px] font-black transition-all ${filter === 'returned' ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-400 border border-slate-700'}`;
            loadData();
        };

        window.toggleShopList = () => {
            const container = document.getElementById('shopDirectoryContainer');
            const icon = document.getElementById('shopToggleIcon');
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                icon.innerText = "▲ മറയ്ക്കുക";
            } else {
                container.classList.add('hidden');
                icon.innerText = "▼ കാണുക";
            }
        };

        function calculateTotal() {
            const start = new Date(document.getElementById('startDate').value);
            const end = new Date(document.getElementById('endDate').value);
            const unitRent = parseFloat(document.getElementById('unitRent').value) || 0;
            const qty = parseFloat(document.getElementById('itemQty').value) || 1;
            
            if (start && end && end >= start) {
                const diffDays = Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1;
                document.getElementById('totalRent').value = diffDays * unitRent * qty;
            }
        }
        document.querySelectorAll('input').forEach(input => input.addEventListener('input', calculateTotal));

        window.editShopNameGlobally = async (oldShopName) => {
            const newName = await window.openCustomPrompt("കടയുടെ പുതിയ പേര് നൽകുക:", oldShopName);
            if (!newName || newName === oldShopName) return;
            
            if (cachedSnapshot) {
                let batchUpdates = [];
                cachedSnapshot.forEach((d) => {
                    const r = d.data();
                    if (r.shop === oldShopName && r.meshtriOwner === currentMeshtri) {
                        batchUpdates.push(updateDoc(doc(db, "rentals", d.id), { shop: newName }));
                    }
                });
                await Promise.all(batchUpdates);
                window.showToast("✏️ കടയുടെ പേര് വിജയകരമായി മാറ്റി!");
            }
        };

        window.deleteShopGlobally = async (shopName) => {
            if (await window.openCustomConfirm(`"${shopName}" എന്ന കടയും അതിലെ കണക്കുകളും ഡിലീറ്റ് ചെയ്യണോ?`)) {
                if (cachedSnapshot) {
                    let batchDeletes = [];
                    cachedSnapshot.forEach((d) => {
                        const r = d.data();
                        if (r.shop === shopName && r.meshtriOwner === currentMeshtri) {
                            batchDeletes.push(deleteDoc(doc(db, "rentals", d.id)));
                        }
                    });
                    await Promise.all(batchDeletes);
                    window.showToast("🗑️ കടയും ഡാറ്റയും നീക്കം ചെയ്തു!", false);
                }
            }
        };

        window.editItemDetails = async (id, currentItem, currentQty, currentShop, currentClient, currentSite, currentBedroom) => {
            const newName = await window.openCustomPrompt("ഉപകരണത്തിന്റെ പുതിയ പേര്:", currentItem);
            if (newName === null) return;
            const newBedroom = await window.openCustomPrompt("ബെഡ്റൂം പേര്/നമ്പർ:", currentBedroom || '');
            if (newBedroom === null) return;
            const newQty = await window.openCustomPrompt("പുതിയ എണ്ണം:", currentQty);
            if (newQty === null) return;
            const newSite = await window.openCustomPrompt("സൈറ്റിന്റെ പേര്:", currentSite);
            if (newSite === null) return;
            const newShop = await window.openCustomPrompt("കടയുടെ പേര്:", currentShop);
            if (newShop === null) return;
            const newClient = await window.openCustomPrompt("നൽകിയ ആളിന്റെ പേര്:", currentClient);
            if (newClient === null) return;

            if(newName && newShop) {
                await updateDoc(doc(db, "rentals", id), { 
                    item: newName, bedroom: newBedroom, qty: newQty, site: newSite || '', shop: newShop, client: newClient || '' 
                });
                window.showToast("✏️ വിവരങ്ങൾ വിജയകരമായി മാറ്റം വരുത്തി!");
            }
        };

        window.updateReturnedQty = async (id, currentQty, currentReturned) => {
            const input = await window.openCustomPrompt(`എത്ര എണ്ണമാണ് തിരികെ നൽകിയത്? (ആകെ: ${currentQty})`, currentReturned);
            if (input !== null) {
                let retQty = parseFloat(input) || 0;
                if (retQty > currentQty) {
                    window.showToast("ആകെ എണ്ണത്തേക്കാൾ കൂടുതൽ കൊടുക്കാൻ പറ്റില്ല!", false);
                    return;
                }
                await updateDoc(doc(db, "rentals", id), { 
                    returnedQty: retQty,
                    isReturned: retQty >= currentQty 
                });
                window.showToast("📦 തിരികെ കൊടുത്ത എണ്ണം അപ്ഡേറ്റ് ചെയ്തു!");
            }
        };

        window.editRent = async (id, currentPaid) => {
            const extraPaid = await window.openCustomPrompt("ഇപ്പോൾ നൽകിയ തുക എത്രയാണ്?", "തുക (₹)");
            if(extraPaid) {
                await updateDoc(doc(db, "rentals", id), { paid: parseFloat(currentPaid) + parseFloat(extraPaid) });
                window.showToast("✨ പെയ്മെന്റ് വിജയകരമായി അപ്ഡേറ്റ് ചെയ്തു! 👍");
            }
        };

        window.settleFull = async (id, total) => {
            if(await window.openCustomConfirm("ബാക്കി തുക മുഴുവൻ അടച്ചു തീർത്ത് അക്കൗണ്ട് ക്ലിയർ ചെയ്യണോ?")) {
                await updateDoc(doc(db, "rentals", id), { paid: total });
                window.showToast("🎉 അക്കൗണ്ട് സെറ്റിൽ ചെയ്തു!");
            }
        };

        window.toggleReturn = async (id, currentStatus, currentQty) => {
            const newStatus = !currentStatus;
            await updateDoc(doc(db, "rentals", id), { 
                isReturned: newStatus,
                returnedQty: newStatus ? currentQty : 0 
            });
            window.showToast(newStatus ? "📦 മുഴുവൻ ഉപകരണവും തിരികെ നൽകി!" : "🔄 സ്റ്റാറ്റസ് മാറ്റി!");
        };

        window.deleteRent = async (id) => {
            if(await window.openCustomConfirm("ഈ ഡാറ്റ ഡിലീറ്റ് ചെയ്യണോ?")) {
                await deleteDoc(doc(db, "rentals", id));
                window.showToast("🗑️ ഡാറ്റ വിജയകരമായി നീക്കം ചെയ്തു!", false);
            }
        };

        window.shareWhatsApp = (item, bedroom, qty, returnedQty, site, shop, client, total, paid, bal, totalDays) => {
            const msg = `*വാടക ഉപകരണ കണക്ക് (മേസ്തിരി പ്രോ)*\n\nഉപകരണം: ${item} ${bedroom ? `(ബെഡ്റൂം: ${bedroom})` : ''} \nആകെ എണ്ണം: ${qty} ${returnedQty > 0 ? `| തിരികെ നൽകിയത്: ${returnedQty}` : ''}\nസൈറ്റ്: ${site || 'പറഞ്ഞിട്ടില്ല'}\nകട: ${shop}\nആർക്ക് നൽകി: ${client || 'നൽകിയിട്ടില്ല'}\nആകെ ദിവസങ്ങൾ: ${totalDays}\nവാടക നൽകേണ്ടത്: ₹${total}\nനൽകിയത്: ₹${paid}\nബാലൻസ് തുക: ₹${bal}\n\nദയവായി കണക്ക് തീർക്കുക.`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
        };

        document.getElementById('saveRentBtn').addEventListener('click', async () => {
            const itemName = document.getElementById('itemName').value;
            if (!itemName) return alert("ഉപകരണത്തിന്റെ പേര് നൽകുക!");

            await addDoc(collection(db, "rentals"), {
                meshtriOwner: currentMeshtri,
                item: itemName,
                bedroom: document.getElementById('bedroomName').value || '',
                qty: parseFloat(document.getElementById('itemQty').value) || 1,
                returnedQty: 0,
                site: document.getElementById('siteName').value || '',
                shop: document.getElementById('shopName').value || 'കട',
                client: document.getElementById('clientName').value || '',
                phone: document.getElementById('shopPhone').value || '',
                start: document.getElementById('startDate').value,
                end: document.getElementById('endDate').value,
                unitRent: parseFloat(document.getElementById('unitRent').value) || 0,
                total: parseFloat(document.getElementById('totalRent').value) || 0,
                paid: parseFloat(document.getElementById('paidRent').value) || 0,
                isReturned: false
            });
            window.showToast("🚀 വിജയകരമായി ചേർത്തു!");
            
            document.getElementById('itemName').value = '';
            document.getElementById('bedroomName').value = '';
            document.getElementById('itemQty').value = '';
            document.getElementById('siteName').value = '';
            document.getElementById('shopName').value = '';
            document.getElementById('clientName').value = '';
            document.getElementById('shopPhone').value = '';
            document.getElementById('unitRent').value = '';
            document.getElementById('totalRent').value = '';
            document.getElementById('paidRent').value = '';
        });

        document.getElementById('searchInput').addEventListener('input', () => loadData());

        let cachedSnapshot = null;
        function loadData() {
            if (!cachedSnapshot) return;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const list = document.getElementById('rentList');
            list.innerHTML = `<h2 class="font-black text-white mb-2 text-sm">${currentFilter === 'active' ? 'നടന്നുകൊണ്ടിരിക്കുന്ന ഉപകരണങ്ങൾ' : 'തിരികെ നൽകിയ ഉപകരണങ്ങൾ'}</h2>`;
            
            let grandTotalRent = 0, grandTotalPaid = 0;
            let reminders = [];
            let shopsMap = new Map();
            let clientsSet = new Set();
            const today = new Date();

            cachedSnapshot.forEach((d) => {
                const r = d.data();
                if (r.meshtriOwner === currentMeshtri) {
                    if (r.shop) { shopsMap.set(r.shop, r.phone || 'നമ്പർ ഇല്ല'); }
                    if (r.client) { clientsSet.add(r.client); }

                    const isRet = r.isReturned === true;
                    const totalQty = parseFloat(r.qty) || 1;
                    const returnedQty = parseFloat(r.returnedQty) || 0;
                    const effectiveQty = Math.max(totalQty - returnedQty, 0);

                    const startDate = new Date(r.start);
                    const endDate = new Date(r.end);
                    const unitPerDay = (parseFloat(r.unitRent) || 0) * effectiveQty;
                    let totalDays = Math.ceil((endDate - startDate) / (1000 * 60 * 60 * 24)) + 1;

                    let calculatedTotal = effectiveQty * (parseFloat(r.unitRent) || 0) * totalDays;

                    if (!isRet && today > endDate) {
                        const extraDays = Math.ceil((today - endDate) / (1000 * 60 * 60 * 24));
                        totalDays += extraDays;
                        calculatedTotal = (effectiveQty * (parseFloat(r.unitRent) || 0) * (totalDays - extraDays)) + (extraDays * unitPerDay);
                        reminders.push(`${r.item} (${r.shop}) - കാലാവധി കഴിഞ്ഞിരിക്കുന്നു!`);
                    }

                    if (!isRet) {
                        grandTotalRent += calculatedTotal;
                        grandTotalPaid += (parseFloat(r.paid) || 0);
                    }

                    const matchesSearch = r.item.toLowerCase().includes(searchTerm) || r.shop.toLowerCase().includes(searchTerm) || (r.site && r.site.toLowerCase().includes(searchTerm)) || (r.bedroom && r.bedroom.toLowerCase().includes(searchTerm));
                    
                    if (matchesSearch && ((currentFilter === 'active' && !isRet) || (currentFilter === 'returned' && isRet))) {
                        const bal = calculatedTotal - (parseFloat(r.paid) || 0);

                        const div = document.createElement('div');
                        div.className = `bg-slate-900/90 border border-slate-800 p-5 rounded-2xl border-l-4 ${bal > 0 ? 'border-red-500' : 'border-green-500'} shadow-xl mb-4 text-white backdrop-blur-sm`;
                        div.innerHTML = `
                            <div class="flex justify-between items-start mb-1">
                                <div>
                                    <p class="font-black text-white text-base">${r.item}</p>
                                    <p class="text-xs text-slate-400">ആകെ: <strong class="text-white">${totalQty}</strong> | തിരികെ നൽകിയത്: <strong class="text-amber-300">${returnedQty}</strong></p>
                                </div>
                                <div class="flex gap-1 flex-wrap justify-end">
                                    <button onclick="updateReturnedQty('${d.id}', ${totalQty}, ${returnedQty})" class="bg-amber-900/60 text-amber-200 border border-amber-700/50 px-2.5 py-1 rounded-lg text-[10px] font-black">റിട്ടേൺ എണ്ണം</button>
                                    <button onclick="editItemDetails('${d.id}', '${r.item}', '${totalQty}', '${r.shop}', '${r.client || ''}', '${r.site || ''}', '${r.bedroom || ''}')" class="bg-cyan-900/50 text-cyan-300 border border-cyan-700/50 px-2.5 py-1 rounded-lg text-[10px] font-black">എഡിറ്റ്</button>
                                    <button onclick="toggleReturn('${d.id}', ${isRet}, ${totalQty})" class="text-[10px] font-black px-2.5 py-1 rounded-lg border ${isRet ? 'bg-emerald-900/50 text-emerald-300 border-emerald-700/50' : 'bg-slate-800 text-slate-300 border-slate-700'}">
                                        ${isRet ? '✓ മുഴുവൻ നൽകി' : 'മുഴുവൻ റിട്ടേൺ'}
                                    </button>
                                </div>
                            </div>
                            ${r.bedroom ? `<p class="text-xs text-amber-300 font-bold mb-1">🚪 ബെഡ്റൂം: ${r.bedroom}</p>` : ''}
                            ${r.site ? `<p class="text-xs text-cyan-400 font-bold mb-1">🏗️ സൈറ്റ്: ${r.site}</p>` : ''}
                            <p class="text-xs text-slate-300 font-bold mb-1">കട: <span class="text-amber-400">${r.shop}</span> ${r.client ? `| ആർക്ക്: <span class="text-cyan-300">${r.client}</span>` : ''} | 📞 ${r.phone}</p>
                            <p class="text-[11px] text-slate-400 mb-2">തീയതി: ${r.start} മുതൽ ${r.end} വരെ | <strong class="text-amber-300">${totalDays} ദിവസങ്ങൾ</strong></p>
                            
                            <div class="border-t border-slate-800 pt-2 flex flex-col gap-2">
                                <div class="flex justify-between items-center text-xs font-black text-slate-200">
                                    <span>വാടകയ്ക്ക് ബാക്കി: ${effectiveQty} എണ്ണം | ആകെ: ₹${calculatedTotal}</span>
                                    <span class="${bal > 0 ? 'text-red-400' : 'text-emerald-400'}">ബാലൻസ്: ₹${bal}</span>
                                </div>
                                
                                <div class="flex items-center justify-between pt-2 gap-1">
                                    <button onclick="shareWhatsApp('${r.item}', '${r.bedroom || ''}', ${totalQty}, ${returnedQty}, '${r.site || ''}', '${r.shop}', '${r.client || ''}', ${calculatedTotal}, ${r.paid}, ${bal}, ${totalDays})" class="bg-emerald-700 hover:bg-emerald-600 text-white px-2.5 py-1.5 rounded-xl text-[10px] font-black flex items-center gap-1 shadow-md">
                                        💬 വാട്സാപ്പ്
                                    </button>
                                    
                                    <div class="flex items-center gap-1">
                                        ${bal > 0 ? `<button onclick="settleFull('${d.id}', ${calculatedTotal})" class="bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1.5 rounded-xl text-[10px] font-black">സെറ്റിൽ</button>` : ''}
                                        <button onclick="editRent('${d.id}', ${r.paid})" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-2.5 py-1.5 rounded-xl text-[10px] font-black">പെയ്മെന്റ്</button>
                                        <button onclick="deleteRent('${d.id}')" class="bg-red-600 hover:bg-red-500 text-white px-2.5 py-1.5 rounded-xl text-[10px] font-black shadow-md">ഡിലീറ്റ്</button>
                                    </div>
                                </div>
                            </div>
                        `;
                        list.appendChild(div);
                    }
                }
            });

            const shopContainer = document.getElementById('shopDirectoryContainer');
            const shopSuggestions = document.getElementById('shopSuggestions');
            shopSuggestions.innerHTML = '';
            
            if (shopsMap.size > 0) {
                let shopHtml = '';
                shopsMap.forEach((phone, shopName) => {
                    shopSuggestions.innerHTML += `<option value="${shopName}">`;
                    shopHtml += `
                        <div class="flex justify-between items-center bg-slate-900/80 p-2.5 rounded-xl text-xs">
                            <div>
                                <span class="font-bold text-white block">${shopName}</span>
                                <a href="tel:${phone}" class="text-cyan-400 font-bold text-[11px]">📞 ${phone}</a>
                            </div>
                            <div class="flex gap-1">
                                <button onclick="editShopNameGlobally('${shopName}')" class="bg-cyan-900/60 text-cyan-200 px-2 py-1 rounded-lg text-[10px] font-black">മാറ്റുക</button>
                                <button onclick="deleteShopGlobally('${shopName}')" class="bg-red-900/60 text-red-200 px-2 py-1 rounded-lg text-[10px] font-black">ഡിലീറ്റ്</button>
                            </div>
                        </div>`;
                });
                shopContainer.innerHTML = shopHtml;
            } else {
                shopContainer.innerHTML = `<p class="text-[11px] text-slate-400 text-center py-1">കടകൾ ഒന്നും ചേർത്തിട്ടില്ല</p>`;
            }

            const clientSuggestions = document.getElementById('clientSuggestions');
            clientSuggestions.innerHTML = '';
            clientsSet.forEach(clientName => {
                clientSuggestions.innerHTML += `<option value="${clientName}">`;
            });

            const totalBal = grandTotalRent - grandTotalPaid;
            document.getElementById('statTotalRent').innerText = `₹${grandTotalRent}`;
            document.getElementById('statTotalBal').innerText = `₹${totalBal}`;
            
            const paidPercentage = grandTotalRent > 0 ? (grandTotalPaid / grandTotalRent) * 100 : 0;
            document.getElementById('barPaid').style.width = `${Math.min(paidPercentage, 100)}%`;
            document.getElementById('barBal').style.width = `${Math.max(100 - paidPercentage, 0)}%`;

            const reminderBox = document.getElementById('reminderBox');
            const reminderList = document.getElementById('reminderList');
            if (reminders.length > 0) {
                reminderBox.classList.remove('hidden');
                reminderList.innerHTML = reminders.map(rem => `<p>• ${rem}</p>`).join('');
            } else {
                reminderBox.classList.add('hidden');
            }
        }

        onSnapshot(collection(db, "rentals"), (snapshot) => {
            cachedSnapshot = snapshot;
            loadData();
        });
    </script>
</body>
</html>
