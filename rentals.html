<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Manjari', sans-serif; }
    </style>
    <title>വാടക ഉപകരണങ്ങൾ</title>
</head>
<body class="bg-[#050B18] text-white font-sans min-h-screen p-4">
    <div class="max-w-md mx-auto space-y-4">
        
        <!-- ഹെഡർ ലോഗോയും സ്വാഗതം പേരും ഒന്നിച്ചുള്ള ഭാഗം -->
        <div class="flex flex-col items-center pt-2 pb-2">
            <div class="inline-flex items-center gap-3 px-5 py-2.5 rounded-full bg-slate-900/90 border border-amber-400/50 shadow-lg shadow-amber-500/20 backdrop-blur-md">
                <div class="w-9 h-9 rounded-full overflow-hidden border border-amber-400 flex-shrink-0 bg-amber-400/10 flex items-center justify-center">
                    <img src="icon.png" alt="Logo" class="w-full h-full object-cover">
                </div>
                <div class="flex flex-col text-left">
                    <span class="text-amber-400 font-black text-sm tracking-wide leading-tight">മേസ്തിരി പ്രോ</span>
                    <span class="text-[10px] font-bold text-blue-200 tracking-wider uppercase">SMART SITE MANAGER</span>
                </div>
            </div>
            <div class="mt-3 text-center">
                <span id="loggedInMeshtri" class="text-sm font-black tracking-wide text-cyan-300 bg-cyan-500/15 px-4 py-1.5 rounded-full border border-cyan-400/40 shadow-lg">
                    സ്വാഗതം, ലോഡിങ്...
                </span>
            </div>
        </div>

        <!-- പേജ് തലക്കെട്ടും ഡാഷ്‌ബോർഡ് ബട്ടണും -->
        <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl flex justify-between items-center shadow-xl backdrop-blur-sm mb-4">
            <div>
                <h1 class="text-lg font-black text-white">വാടക ഉപകരണങ്ങൾ</h1>
            </div>
            <a href="dashboard.html" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 border border-amber-400/40 text-amber-400 rounded-xl text-xs font-bold shadow-md transition flex items-center gap-1">
                <span>←</span> ഡാഷ്‌ബോർഡ്
            </a>
        </div>
        
        <!-- ഫോം ഭാഗം -->
        <div class="bg-slate-900/90 text-white p-6 rounded-3xl shadow-xl border border-slate-800 mb-8 space-y-4 backdrop-blur-sm">
            <h2 class="font-black text-amber-400 mb-2 text-sm">പുതിയ ഉപകരണം ചേർക്കുക</h2>
            <input type="text" id="itemName" placeholder="ഉപകരണത്തിന്റെ പേര്" class="w-full p-4 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400">
            <input type="number" id="itemQty" placeholder="എത്ര എണ്ണം?" class="w-full p-4 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400">
            <input type="text" id="shopName" placeholder="കടയുടെ പേര്" class="w-full p-4 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400">
            <input type="tel" id="shopPhone" placeholder="ഫോൺ നമ്പർ" class="w-full p-4 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400">
            
            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 ml-1">എടുത്ത തീയതി</label>
                    <input type="date" id="startDate" class="w-full p-4 bg-slate-800/80 text-white rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 ml-1">തിരികെ നൽകേണ്ടത്</label>
                    <input type="date" id="endDate" class="w-full p-4 bg-slate-800/80 text-white rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400">
                </div>
            </div>
            
            <input type="number" id="unitRent" placeholder="ഒരെണ്ണത്തിന്റെ വാടക (₹)" class="w-full p-4 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400">
            <input type="number" id="totalRent" placeholder="ആകെ വാടക (₹)" class="w-full p-4 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400">
            <input type="number" id="paidRent" placeholder="നൽകിയ തുക (₹)" class="w-full p-4 bg-slate-800/80 text-white placeholder-slate-400 rounded-2xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400">
            
            <button id="saveRentBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 p-4 rounded-2xl font-black shadow-lg transition">വാടകയ്ക്ക് എടുത്തു ചേർക്കുക</button>
        </div>

        <!-- ഫിൽട്ടർ ബട്ടണുകൾ -->
        <div class="flex gap-2 mb-4">
            <button onclick="setFilter('active')" id="filterActiveBtn" class="flex-1 py-2.5 rounded-xl text-xs font-black bg-amber-500 text-slate-950 transition">നടന്നുകൊണ്ടിരിക്കുന്നത്</button>
            <button onclick="setFilter('returned')" id="filterReturnedBtn" class="flex-1 py-2.5 rounded-xl text-xs font-black bg-slate-800 text-slate-300 border border-slate-700 transition">തിരികെ നൽകിയത്</button>
        </div>

        <section id="rentList" class="space-y-4 pb-12">
            <h2 class="font-black text-white mb-2">എടുത്ത ഉപകരണങ്ങളുടെ ഹിസ്റ്ററി</h2>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyAJw47JuihhalCFvFAyrX_beM0iZZ0XltA",
            authDomain: "mesthri-app.firebaseapp.com",
            projectId: "mesthri-app",
            storageBucket: "mesthri-app.appspot.com",
            messagingSenderId: "1060617901864",
            appId: "1:1060617901864:web:5ffb9378cf36bd6d352218"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const currentMeshtri = localStorage.getItem('userName') || "പൊതുമേസ്തിരി";
        document.getElementById('loggedInMeshtri').innerText = "സ്വാഗതം, " + currentMeshtri;

        let currentFilter = 'active';
        window.setFilter = (filter) => {
            currentFilter = filter;
            document.getElementById('filterActiveBtn').className = `flex-1 py-2.5 rounded-xl text-xs font-black transition ${filter === 'active' ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300 border border-slate-700'}`;
            document.getElementById('filterReturnedBtn').className = `flex-1 py-2.5 rounded-xl text-xs font-black transition ${filter === 'returned' ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300 border border-slate-700'}`;
            loadData();
        };

        function calculateTotal() {
            const start = new Date(document.getElementById('startDate').value);
            const end = new Date(document.getElementById('endDate').value);
            const unitRent = parseFloat(document.getElementById('unitRent').value) || 0;
            const qty = parseFloat(document.getElementById('itemQty').value) || 1;
            if (start && end && end >= start) {
                const diffDays = Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1;
                document.getElementById('totalRent').value = diffDays * unitRent * qty;
            }
        }
        document.querySelectorAll('input').forEach(input => input.addEventListener('input', calculateTotal));

        window.editDetails = async (id, r) => {
            const newName = prompt("പുതിയ പേര്:", r.item);
            const newQty = prompt("പുതിയ എണ്ണം:", r.qty);
            if(newName) {
                await updateDoc(doc(db, "rentals", id), { item: newName, qty: newQty });
            }
        };

        window.editRent = async (id, currentPaid) => {
            const extraPaid = prompt("ഇപ്പോൾ നൽകിയ തുക എത്രയാണ്?");
            if(extraPaid) await updateDoc(doc(db, "rentals", id), { paid: parseFloat(currentPaid) + parseFloat(extraPaid) });
        };

        // മുഴുവൻ തുകയും തീർക്കാനുള്ള സെറ്റിൽമെന്റ് ഫീച്ചർ
        window.settleFull = async (id, total) => {
            if(confirm("ബാക്കി തുക മുഴുവൻ അടച്ചു തീർത്ത് അക്കൗണ്ട് ക്ലിയർ ചെയ്യണോ?")) {
                await updateDoc(doc(db, "rentals", id), { paid: total });
                alert("അക്കൗണ്ട് സെറ്റിൽ ചെയ്തു!");
            }
        };

        // റിട്ടേൺ സ്റ്റാറ്റസ് മാറ്റാൻ
        window.toggleReturn = async (id, currentStatus) => {
            const newStatus = !currentStatus;
            await updateDoc(doc(db, "rentals", id), { isReturned: newStatus });
        };

        window.deleteRent = async (id) => {
            if(confirm("ഡിലീറ്റ് ചെയ്യണോ?")) await deleteDoc(doc(db, "rentals", id));
        };

        document.getElementById('saveRentBtn').addEventListener('click', async () => {
            const itemName = document.getElementById('itemName').value;
            if (!itemName) return alert("ഉപകരണത്തിന്റെ പേര് നൽകുക!");

            await addDoc(collection(db, "rentals"), {
                meshtriOwner: currentMeshtri,
                item: itemName,
                qty: document.getElementById('itemQty').value,
                shop: document.getElementById('shopName').value,
                phone: document.getElementById('shopPhone').value,
                start: document.getElementById('startDate').value,
                end: document.getElementById('endDate').value,
                unitRent: document.getElementById('unitRent').value,
                total: parseFloat(document.getElementById('totalRent').value) || 0,
                paid: parseFloat(document.getElementById('paidRent').value) || 0,
                isReturned: false
            });
            alert("സേവ് ആയി!");
        });

        let cachedSnapshot = null;
        function loadData() {
            if (!cachedSnapshot) return;
            const list = document.getElementById('rentList');
            list.innerHTML = `<h2 class="font-black text-white mb-2">${currentFilter === 'active' ? 'നടന്നുകൊണ്ടിരിക്കുന്ന ഉപകരണങ്ങൾ' : 'തിരികെ നൽകിയ ഉപകരണങ്ങൾ'}</h2>`;
            
            cachedSnapshot.forEach((d) => {
                const r = d.data();
                if (r.meshtriOwner === currentMeshtri) {
                    const isRet = r.isReturned === true;
                    if ((currentFilter === 'active' && !isRet) || (currentFilter === 'returned' && isRet)) {
                        const bal = r.total - r.paid;
                        const div = document.createElement('div');
                        div.className = `bg-slate-900/90 border border-slate-800 p-5 rounded-2xl border-l-4 ${bal > 0 ? 'border-red-500' : 'border-green-500'} shadow-xl mb-4 text-white backdrop-blur-sm`;
                        div.innerHTML = `
                            <div class="flex justify-between items-start mb-1">
                                <p class="font-black text-white text-lg">${r.item} <span class="text-xs font-normal text-slate-400">(${r.qty} എണ്ണം)</span></p>
                                <button onclick="toggleReturn('${d.id}', ${isRet})" class="text-[10px] font-black px-2.5 py-1 rounded-lg border ${isRet ? 'bg-emerald-900/50 text-emerald-300 border-emerald-700/50' : 'bg-slate-800 text-slate-300 border-slate-700'}">
                                    ${isRet ? '✓ തിരികെ നൽകി' : 'റിട്ടേൺ ചെയ്യുക'}
                                </button>
                            </div>
                            <p class="text-xs text-slate-400 font-bold mb-2">കട: ${r.shop} | 📞 ${r.phone}</p>
                            <div class="border-t border-slate-800 pt-2 flex justify-between items-center">
                                <p class="text-xs font-black text-slate-300">നൽകിയത്: ₹${r.paid} | ബാലൻസ്: ₹${bal}</p>
                                <div class="flex gap-1">
                                    ${bal > 0 ? `<button onclick="settleFull('${d.id}', ${r.total})" class="bg-emerald-600 text-white px-2 py-1 rounded-lg text-[10px] font-black">സെറ്റിൽ</button>` : ''}
                                    <button onclick="editRent('${d.id}', ${r.paid})" class="bg-amber-500 text-slate-950 px-2 py-1 rounded-lg text-[10px] font-black">പെയ്മെന്റ്</button>
                                    <button onclick="deleteRent('${d.id}')" class="bg-red-900/50 text-red-300 border border-red-700/50 px-2 py-1 rounded-lg text-[10px] font-black">ഡിലീറ്റ്</button>
                                </div>
                            </div>
                        `;
                        list.appendChild(div);
                    }
                }
            });
        }

        onSnapshot(collection(db, "rentals"), (snapshot) => {
            cachedSnapshot = snapshot;
            loadData();
        });
    </script>
</body>
</html>
